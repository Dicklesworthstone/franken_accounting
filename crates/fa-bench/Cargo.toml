[package]
name = "fa-bench"
version = "0.0.1"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Criterion-free in-house deterministic benchmark harness, §17 baseline manifest verifier, and Appendix G operation-cost witness counter (plan §17, §18.1, Appendix G; beads fa-tu58, fa-i5s). Verification layer only — never linked into shipped postures."
publish = false

[lints]
workspace = true

[[bin]]
name = "fa-bench"
path = "src/main.rs"

[dependencies]
asupersync = { workspace = true }
fa = { path = "../fa", version = "=0.0.1" }

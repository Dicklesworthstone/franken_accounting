[package]
name = "fa-policy"
version = "0.0.1"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Steward's laws (plan §14, FA-INV-10): the closed capability-op vocabulary, the typed Capability (holder, profile, ops, per-unit amount ceilings, a declared CommitSeq expiry, issuer) with its canonical bytes and commitment, the Approval object, pre-observation admission, expiry at the admission point, and segregation of duties over registries/sod_policy.toml. Pure laws layer: no substrate engine, no runtime, no Cx — the kernel calls down into it. Bead fa-llx."
publish = false

[lints]
workspace = true

[dependencies]
fa-money = { path = "../fa-money", version = "=0.0.1" }
fa-time = { path = "../fa-time", version = "=0.0.1" }
fa-registry = { path = "../fa-registry", version = "=0.0.1" }
fa-model = { path = "../fa-model", version = "=0.0.1" }
fgdb-types = { workspace = true }

[dev-dependencies]
fa-reference = { path = "../fa-reference", version = "=0.0.1" }

[package]
name = "fa-fuzz"
version = "0.0.1"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Fuzz targets, deterministic PRNG mutators, checked-in seed corpora, and smoke runner for every byte decoder and syntax parser in FrankenAccounting (plan §16.8, bead fa-tre)."
publish = false

[lints]
workspace = true

[[bin]]
name = "fa-fuzz-smoke"
path = "src/main.rs"

[dependencies]
fa = { path = "../fa", version = "=0.0.1" }
fa-cli = { path = "../fa-cli", version = "=0.0.1" }
fa-formats = { path = "../fa-formats", version = "=0.0.1" }
fa-intents = { path = "../fa-intents", version = "=0.0.1" }
fa-journal = { path = "../fa-journal", version = "=0.0.1" }
fa-model = { path = "../fa-model", version = "=0.0.1" }
fa-money = { path = "../fa-money", version = "=0.0.1" }
fa-notary = { path = "../fa-notary", version = "=0.0.1" }
fa-registry = { path = "../fa-registry", version = "=0.0.1" }
fa-time = { path = "../fa-time", version = "=0.0.1" }
fa-verbs = { path = "../fa-verbs", version = "=0.0.1" }
fa-verify = { path = "../fa-verify", version = "=0.0.1" }
fgdb-types = { workspace = true }

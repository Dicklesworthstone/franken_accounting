[package]
name = "fa-lantern"
version = "0.0.1"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Lantern: forensic and audit analytics (plan §11, bet A4). Registered, deterministic procedures over a pinned journal snapshot — journal-entry testing, duplicates, sequence gaps, cutoff, aging and digit tests — plus the money-flow, preparer and document projections as verified folds, with typed citations and determinism witnesses. Findings are statistical evidence, never accusations. Bead fa-nlu."
publish = false

[lints]
workspace = true


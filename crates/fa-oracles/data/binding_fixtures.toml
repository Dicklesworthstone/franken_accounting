# =============================================================================
# crates/fa-oracles/data/binding_fixtures.toml: shared binding fixtures
# (docs/FORENSIC_CASE_STUDIES_PLAN.md §4.4; bead fa-yugf.3, A1a)
#
# Consumer: fa-oracles' values_canonical, normalize, sentence and scope tests
# (Rust; A1a and A3a) and tools/case-fetch/test_case_fetch.py (Python, A9): both
# implementations must produce these exact results.
# Gate: `cargo test -p fa-oracles` (values_canonical_matches_the_shared_fixture_rows,
# and case_fetch_unittests_pass, which runs the Python suite over every section).
# Retire: never while receipts carry values_sha256 or verify binds quotes.
# Each [[values]] row: the fact's about_scope, its value lines (TAB-joined
# ordinal, literal, rule, param, value, unit, precision, in ordinal order),
# the canonical bytes in lower-case hex, and their SHA-256.
# Each [[normalize]] row: an input and its normalized form, both UTF-8 in hex,
# and the normalized bytes' SHA-256 (quote_sha256).
# Each [[sentence]] row: a raw text, a quote, how often the normalized quote
# occurs in the normalized text (count, overlaps included), and whether its
# first occurrence is sentence-aligned.
# Each [[scope]] row: a quote, a fact's about_scope and granularity, the
# entry's period an entry: scope resolves to (entry_period, when set), the
# account ids the case's account: scopes name (case_accounts, when set), and
# the case-fetch-scope-v2 verdict: scope_ok, and reason, the exact message
# (the conflict, or "range=none" for a rangeless scheme, else empty).
# =============================================================================


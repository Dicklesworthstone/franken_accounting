# the canonical bytes in lower-case hex, and their SHA-256.
# Each [[normalize]] row: an input and its normalized form, both UTF-8 in hex.
# Each [[sentence]] row: a raw text, a quote occurring in it once after
# normalization, and whether that occurrence is sentence-aligned.
# Each [[scope]] row: a quote, a fact's about_scope and granularity, and the
# case-fetch-scope-v1 verdict.
# =============================================================================


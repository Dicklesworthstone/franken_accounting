# =============================================================================
# crates/fa-oracles/data/case_procedure_tiers.toml: two-reader procedure tiers
# (docs/FORENSIC_CASE_STUDIES_PLAN.md §2.5; bead fa-yugf.10, A4)
#
# Consumer: K-TIER (src/cases/check/tier.rs); K-EVID reads reads_evidence (A3c);
# A5a's reader rows, A6's discipline, A11a's extremal variants.
# Gate: `cargo test -p fa-oracles` (every_seeded_row_matches_procedures_toml, and
# K-TIER over every case's claimed procedures).
# Retire: with the case-study program.
# One [[tier]] per claimed procedure. Each reader classified it independently from
# code with §2.5's definitions in hand; the second reader classified before seeing
# the first's answers. tier and reads_evidence are the conservative choice of the
# two readings (tier order L < C < S-rel < S-acct < S-party < G < O < P < A);
# disagreement records whether the tiers differ. row_digest is the SHA-256 of the
# canonical bytes of the procedure's [[procedure]], [[parameter]] and [[input]] rows
# in registries/procedures.toml, so any semantic edit there invalidates the row
# until it is read again; comments and whitespace do not.
# code_location is the run() at the commit the readers read.
#
# Run-level refusals are no tier (second reader's notes): a refusal of the whole
# run lets filler anywhere remove a target's finding, so a case's filler avoids
# them. live_postings refuses on an entry reversed twice; any run refuses on work
# budget exhaustion; recon.assertion_drift refuses on an unknown entity or more
# than MAX_CITES later entries in one cell; jet.round_amounts refuses on an
# unregistered unit; jet.self_sourced_evidence refuses on a missing document.
# =============================================================================


notes = "Accession 0001104659-08-045115, the 10-Q for the fiscal quarter ended May 31, 2008; Filing Date 2008-07-10 on its EDGAR filing index (Internet Archive capture of 2013-08-05). 4,390,268 bytes as captured 2012-01-28. The condensed consolidated statement of financial condition is printed on pp.5-6, marked (Unaudited); the independent accountants' review report (p.53) states the review of the statement as of May 31, 2008 (Q208-LEGEND, the row's assurance) and, in its next sentences, that the statement as of November 30, 2007 was previously audited. A row has one assurance, so the November 30, 2007 comparative column is cited at the row's reviewed status here, never assumed audited."


notes = "Volume 3 of the examiner's report, dated March 11, 2010 on its cover (filed_on). 2,590,569 bytes as captured 2012-07-23; the PDF records a modification on 2010-04-13, so the capture is that revision. p.889 prints the table Gross and Net Balance Sheet Ratios at seven quarter ends: total assets, the deductions and net assets, equity and tangible equity, (e) Repo 105/108 usage, and the leverage ratios with and without (e). Its sources line attributes the asset and equity data to the 10-K and 10-Q filings and the Repo 105/108 usage to internal documents, so (e) rests on this report alone: the 10-Q (SRC-LEH-002) never mentions Repo 105."

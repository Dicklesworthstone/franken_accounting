# Lehman Brothers roles (plan §2.8). Every label is a harness role. The examiner's report
# (SRC-LEH-001) names people: the deny list holds the `fa:case-name-token:v1` hashes of the
# examiner's name tokens and of the name p.889 prints beside the cited table, never the names
# (K-NAMES), so no rendered or journaled text can carry them.

[[role]]
label = "case-author-1"
kind = "harness"
description = "authors the case's interpretations"

[[role]]
label = "case-second-reader"
kind = "harness"
description = "independently reads every interpretation and reviews the citation stubs"

[[role]]
label = "case-closer-1"
kind = "harness"
description = "runs the book's period transitions"

[[role]]
label = "case-approver-1"
kind = "harness"
description = "approves period locks"

[[role]]
label = "case-filer-1"
kind = "harness"
description = "posts a statement book's figures as the filing printed them"

[[role]]
label = "examiner-1"
kind = "harness"
description = "records the case's findings and checkpoints"

[[role]]
label = "examiner-witness"
kind = "harness"
description = "witnesses the case's checkpoints (plan §12.7)"


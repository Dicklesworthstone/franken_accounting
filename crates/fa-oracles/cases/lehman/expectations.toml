# Lehman Brothers expectations (plan §8.3; §15 L2). L-T-01 (May 31, 2008, on `statement`) and
# L-T-02 (the November 30, 2007 comparative, on `statement-fy2007`) are statement footings: every
# printed line of the 10-Q's condensed consolidated statement of financial condition is posted
# to its own account, and franken_accounting's certified balance-sheet lines must equal the
# printed totals, which are never posted. L-R-01 reads back the posted lines the examiner's
# net-leverage arithmetic deducts (the examiner's report, p.889), as posted from the 10-Q. L-R-02
# reads the certified diff of the Repo 105 scenario: it moves exactly two accounts, financial
# instruments owned and securities sold under agreements to repurchase, each by exactly (e), so
# total assets and total liabilities each move by (e). The scenario's own entry posts (e), so this
# is a read-back (K-TAUT), never a T.

[[expectation]]
id = "L-T-01"
type = "T"
book_variant = "statement"
statement_template = "T.footing"
basis = ["Q208.sfc.2008-05-31"]
kind = "footing"
vintages = ["exhibit:SRC-LEH-002"]

[[target]]
expectation = "L-T-01"
fact = "Q208.total_assets.2008-05-31"
basis = ["Q208.sfc.2008-05-31"]
read_verb = "balance-sheet"
read_target = "assets"
read_coordinate = "FY2008Q2"
read_selector = "currently_stated"
published = "Q208.total_assets.2008-05-31"

[[target]]
expectation = "L-T-01"
fact = "Q208.total_liabilities.2008-05-31"

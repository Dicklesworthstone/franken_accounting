# Booking dates (§6.2: the date fixes commit order relative to period transitions, releases and
# filings). The sentences give the day without its year, so each date is derived (K-DERIVE
# recomputes it): `day_in_period` takes the year from the reporting period the entry adjusts, and
# a written weekday ("Friday, April 20") must agree. F4's day is p.26's literal; F10's is p.114's.
# F2's "Over the course of April 23 and 24" is a year-less range: F2-date is its two days. F3 has
# no day.

[[fact]]
id = "F2-date"
provenance = "derived"
from = ["F2-period", "F2"]
rule = "day_in_period"
params = ["day=from:F2#2"]


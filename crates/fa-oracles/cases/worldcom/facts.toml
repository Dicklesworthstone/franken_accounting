# WorldCom facts (plan §6, §15 W1/W2). Hash-first (§1.3, §4.4): each sourced fact carries its
# anchor and the SHA-256 of its sentence-aligned normalized quote, never the quote text, until
# owner decision 2a. `case_fetch.py verify worldcom` re-finds every quote and writes receipts.toml.
#
# W1's pilot slice: the Beresford (SRC-WC-001) sentences stating F2, F4 (p.108), F9 and F12, and
# the sentence naming each pilot entry's reporting period. W2 adds F1-F13 and keeps these ids and
# values; A8 adds the interpretations (F4 joins F4F5-p108 with p.26's exact amount, which lands
# with it, since its `entry:F4` scope needs that interpretation).
#
# One fact per sentence (§6.2). p.108 l.7 states both of the 2001-07-17 entries (F4's $560M to
# Construction in Progress and F5's $50M to SG&A) in one sentence, and p.116 l.3 both 1Q02 entries
# (F12 $718M, F13 $100M), so each is one sourced fact over its quarter; F4/F5 and F12/F13 are
# interpretations of it. A period fact serves every entry of its quarter: W2 cites F2-period for
# F1 and F3, F9-period for F6-F8.
#
# The entry sentences on pp.106, 108, 113 and 116 give their booking days without a year
# ("April 23 and 24", "July 17", "October 19", "April 12"), which date_literal and
# date_range_literal refuse, so no booking-date [[value]] rests on them; the year comes from the
# reporting period (W2 decides the derivation).


kind = "report"
description = "the property accounting director, who entered the 3Q01 transfer of the 1Q01 adjustment"
described_by = "F6"

[[role]]
label = "gen-acct-director-1"
kind = "report"
description = "the general accounting director who instructed the 1Q01 entries and supplied the 4Q01 figure"
described_by = "F1"

[[role]]
label = "gen-acct-manager-2"
kind = "report"
description = "the general accounting manager who booked the 1Q01 entries"
described_by = "F1"

[[role]]
label = "property-accounting-specialist-1"
kind = "report"
description = "the property accounting staff specialist who made the 3Q01 asset transfers after the director's"
described_by = "F7"

[[role]]
label = "property-accounting-staff-1"
kind = "report"
description = "the property accounting staff member who prepared the 4Q01 draft journal entry"
described_by = "F10"

[[role]]
label = "case-author-1"
kind = "harness"
description = "authors the case's interpretations"

[[role]]
label = "case-second-reader"
kind = "harness"
description = "independently reads every interpretation and reviews placeholders"

[[role]]
label = "case-closer-1"
kind = "harness"
description = "runs the book's period transitions and issuances"

[[role]]
label = "case-approver-1"
kind = "harness"
description = "approves period locks and the restatement case's effect manifest"

[[role]]
label = "case-approver-2"
kind = "harness"
description = "the second approver, with no session lineage shared with the first"

[[role]]
label = "case-poster-1"
kind = "harness"
description = "opens, rehearses and posts the restatement case; approves none of it"

[[role]]
label = "examiner-1"
kind = "harness"
description = "records the case's findings and checkpoints"

[[role]]
label = "examiner-witness"
kind = "harness"
description = "witnesses the case's checkpoints (plan §12.7)"


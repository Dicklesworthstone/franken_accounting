# WorldCom's migration book (plan §6.3 `migration`, §6.4 W-D-02, §15 A8b; beads fa-yugf.18, .21):
# F6, the record's one documented approval, replayed as legacy history so jet.self_approved can read
# who entered and who approved it. F6a (CIP to the asset clearing account, $544 million) and F6b (the
# clearing account to the ten Fiber Optic Cable items at the sourced $54.4 million each, one legacy
# entry: the subledger_to_gl_legs reading) are Migration chunks. Their legacy entered-by is the
# property-accounting director; their approved-by is the W-D-02 branch `approvals_recorded`, the
# director too on F6-approval's natural reading. The fiscal year starts with F6's quarter, so both
# 2001 quarters precede the opening date and are born Historical and Locked, and each has a non-zero
# cumulative legacy trial balance. The run is a sole-source FullDetail run finalized with two
# approvals; the declared legacy trial balance is derived from these chunks (legacy_tb_from_chunks),
# so its tie-out supports no claim.


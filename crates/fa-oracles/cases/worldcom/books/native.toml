[[default]]
attribute = "effective_date"
rule = "reporting_period_last_day"
rationale = "the record dates bookings, not effective dates; each entry's sourced reporting period ends on its effective date (plan §6.2)"

[[default]]
attribute = "evidence_attached"
rule = "placeholder_reviewed"
rationale = "the record describes the entries' documents without publishing them; a placeholder reviewed by case-second-reader stands in (plan §2.6)"

[[default]]
attribute = "approval_encoding"
rule = "none"
rationale = "the book posts each entry with no approval attached: an entry approval needs A0, and a draft promoted by its owner is W-P-01's own branch (plan §6.4)"

[[default]]
attribute = "acting_principal"
rule = "role_of_record"
rationale = "the role the record names booked the entry (F1, F2: the 1Q01 manager; F4, F5, F10, F12, F13: the 2Q01 manager; F8: the property accounting specialist); where it names none (F3, F9, F11), the property accounting director, who directed the transfers"

[[default]]
attribute = "case_determination_date"
rule = "restating_filing_date"
rationale = "the restating filing's date is public, fixed and never precedes the restated figures (plan §2.6); the June 2002 announcement (SRC-WC-8K-20020626) becomes the sourced date once its fact lands (W2/W3)"

[[default]]
attribute = "leg_split"
rule = "one_leg_per_named_account"
rationale = "the record names one account per side of each transfer; one leg per named (account, side) is the encoding (plan §2.6 rule 2, §6.4 W-D-01)"

[[default]]
attribute = "entry_class"
rule = "Original"
rationale = "the record describes ordinary journal entries; Original is the class such an entry posts under (plan §2.6 rule 2)"

[[default]]
attribute = "period_state_at_commit"
rule = "Open"
rationale = "the record dates each entry inside its quarter, before that quarter's close: the book posts it while its period is Open (plan §2.6 rule 2)"

[[default]]
attribute = "reason"
rule = "WrongAccount"
rationale = "the entries moved line costs into asset accounts; the correction's reason is the account, never Fraud (K-REASON)"


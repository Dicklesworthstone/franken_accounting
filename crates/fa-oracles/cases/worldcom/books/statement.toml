# WorldCom's statement book (plan §6.3, §6.4 W-T-02; §15 W3, W6): the restating filing's FY2000
# total-assets bridge on a one-line statement. The native calendar starts at 2001Q1 and a
# Historical period admits only Migration, so the bridge needs its own book. A is the restater's
# "previously reported" total (98,727), the two deltas its Embratel/Avantel (745) and other
# restatement adjustments (53,794), each posted through a Restatement case into the locked
# quarter; B (44,188) is never posted, only read back. SRC-WC-401's filed 98,903 is the other
# vintage of the cell and is never posted either.

[book]
variant = "statement"
opening_date = "2000-10-01"
calendar = "custom"
base_unit = "USD"
posture = "embedded-owner"

[[period]]
code = "2000Q4"
start = "2000-10-01"
end = "2000-12-31"
fiscal_year = 2000
kind = "Normal"

[[principal]]
label = "case-filer-1"
profile = "Human"
grants = ["read", "post"]

[[principal]]
label = "case-closer-1"
profile = "Human"
grants = ["read", "close"]

[[principal]]
label = "case-approver-1"
profile = "Human"
grants = ["read", "approve"]

[[principal]]
label = "case-approver-2"
profile = "Human"
grants = ["read", "approve"]

[[principal]]
label = "case-poster-1"
profile = "Human"
grants = ["read", "post", "restate", "produce"]

[[principal]]
label = "case-second-reader"
profile = "Human"
grants = ["read", "approve"]

[[principal]]
label = "case-reconciler-1"
profile = "Human"
grants = ["read", "reconcile"]

[[principal]]
label = "examiner-1"
profile = "Human"
grants = ["read", "produce", "verify"]

[[principal]]
label = "examiner-witness"
profile = "Human"
grants = ["read", "witness"]

# The one cell the bridge asserts is one leaf, so A and both deltas sit on one account in one
# period. The filing gives no liabilities-and-equity split for the line, so the balancing side is
# one remainder account (a declared default below).
[[account]]
code = "1000"
name_fact = "W-ST-ta2000-prev"
type = "Asset"
role = ""
opened = "2000-09-30"
role_map_rule = "role_map"

[[account]]
code = "3900"
name_fact = "W-ST-ta2000-prev"
type = "Equity"
role = ""
opened = "2000-09-30"
role_map_rule = "role_map"

[[document]]
id = "DOC-406"
stub_of = "SRC-WC-406"
grade = "AgentUpload"
reviewed_by = "case-second-reader"

[[intent]]
id = "W-ST-ta2000-prev"
fact = "W-ST-ta2000-prev"
class = "Original"
principal = "case-filer-1"
effective_date = "2000-12-31"
memo = "total assets at 2000-12-31 as previously reported"
evidence = "DOC-406"
idempotency_key = "wc-st-ta2000"

[[leg]]
intent = "W-ST-ta2000-prev"
ordinal = 0
account = "1000"
side = "Dr"
amount_literal = "98727000000.00"
amount_rule = "value:W-ST-ta2000-prev#1"
unit = "USD"

[[leg]]
intent = "W-ST-ta2000-prev"
ordinal = 1
account = "3900"
side = "Cr"
amount_literal = "98727000000.00"
amount_rule = "value:W-ST-ta2000-prev#1"
unit = "USD"

# The deltas print in parentheses (decreases of total assets): each leg carries the figure's
# magnitude, and the credit to the total-assets leaf carries its sign.
[[intent]]
id = "delta-W-ST-ta2000-prev-1"
fact = "W-ST-ta2000-adj1"
class = "Restatement"
principal = "case-poster-1"
effective_date = "2000-12-31"
evidence = "DOC-406"
idempotency_key = "wc-st-delta-ta2000-1"
target = "W-ST-ta2000-prev"
target_kind = "restates"
reason = "WrongAmount"
scenario = "restate-2000"

[[leg]]
intent = "delta-W-ST-ta2000-prev-1"
ordinal = 0
account = "3900"
side = "Dr"
amount_literal = "745000000.00"
amount_rule = "value:W-ST-ta2000-adj1#1"
unit = "USD"

[[leg]]
intent = "delta-W-ST-ta2000-prev-1"
ordinal = 1
account = "1000"
side = "Cr"
amount_literal = "745000000.00"
amount_rule = "value:W-ST-ta2000-adj1#1"
unit = "USD"

[[intent]]
id = "delta-W-ST-ta2000-prev-2"
fact = "W-ST-ta2000-adj2"
class = "Restatement"
principal = "case-poster-1"
effective_date = "2000-12-31"
evidence = "DOC-406"
idempotency_key = "wc-st-delta-ta2000-2"
target = "W-ST-ta2000-prev"
target_kind = "restates"
reason = "WrongAmount"
scenario = "restate-2000"

[[leg]]
intent = "delta-W-ST-ta2000-prev-2"
ordinal = 0
account = "3900"
side = "Dr"
amount_literal = "53794000000.00"
amount_rule = "value:W-ST-ta2000-adj2#1"
unit = "USD"

[[leg]]
intent = "delta-W-ST-ta2000-prev-2"
ordinal = 1
account = "1000"
side = "Cr"
amount_literal = "53794000000.00"
amount_rule = "value:W-ST-ta2000-adj2#1"
unit = "USD"

[[case]]
id = "wc-statement-restatement"
kind = "Restatement"
periods = ["2000Q4"]
determined_on = "default"
authority = "DOC-406"
disclosure = "DOC-406"
approvers = ["case-approver-1", "case-approver-2"]
poster = "case-poster-1"

[[branch_class]]
id = "bc-evidence"
attribute = "evidence_attached"
rule = "evidence_minimum"
values = ["none", "placeholder_unreviewed", "placeholder_reviewed"]

[[default]]
attribute = "evidence_attached"
rule = "placeholder_reviewed"
rationale = "the restating filing is cited through its stub, reviewed by case-second-reader (plan §2.7)"

[[default]]
attribute = "leg_split"
rule = "statement_remainder"
rationale = "the filing prints total assets alone, with no split of the other side: each figure posts against one remainder account of type Equity (plan §3.8, a one-line statement)"

[[default]]
attribute = "effective_date"
rule = "reporting_period_last_day"
rationale = "the figures are as of December 31, 2000, the 2000Q4 period's last day"

[[default]]
attribute = "case_determination_date"
rule = "restating_filing_date"
rationale = "the restating filing's date is public, fixed and never precedes the restated figures (plan §2.6)"

[[default]]
attribute = "reason"
rule = "WrongAmount"
rationale = "a statement-level delta corrects a published total and the book holds no account-level cause; never Fraud (K-REASON)"

[[step]]
seq = 1
kind = "period_open"
ref = "2000Q4"
principal = "case-closer-1"

[[step]]
seq = 2
kind = "intent"
ref = "W-ST-ta2000-prev"

[[step]]
seq = 3
kind = "period_close"
ref = "2000Q4"
principal = "case-closer-1"

[[step]]
seq = 4
kind = "period_lock"
ref = "2000Q4"
principal = "case-closer-1"
approvers = ["case-approver-1"]

# A12 (plan §12.7): the examiner witness cosigns the as-filed checkpoint before the case; after it
# the runner cosigns the restated book with --previous, which must prove it extends this one.
[[step]]
seq = 5
kind = "checkpoint"
ref = "as-filed"
principal = "examiner-witness"

[[step]]
seq = 6
kind = "checkpoint_witness"
ref = "as-filed"

# Plan §5.3: A as filed, asserted on the total-assets leaf before the case (the as-filed
# read-back), citing the restating filing's stub (its "previously reported" column).
[[step]]
seq = 7
kind = "assert_balance"
ref = "W-R-01"
principal = "case-reconciler-1"
evidence = "DOC-406"
asserts = "W-ST-ta2000-prev"

[[step]]
seq = 10
kind = "case_open"
ref = "wc-statement-restatement"
principal = "case-poster-1"

[[step]]
seq = 11
kind = "case_determine"
ref = "wc-statement-restatement"
principal = "case-poster-1"

[[step]]
seq = 12
kind = "scenario_fork"
ref = "restate-2000"
principal = "case-poster-1"

[[step]]
seq = 13
kind = "scenario_run"
ref = "restate-2000"
principal = "case-poster-1"

[[step]]
seq = 14
kind = "scenario_diff"
ref = "restate-2000"
principal = "case-poster-1"

[[step]]
seq = 15
kind = "case_rehearse"
ref = "wc-statement-restatement"
principal = "case-poster-1"

[[step]]
seq = 16
kind = "case_approve"
ref = "wc-statement-restatement"

[[step]]
seq = 17
kind = "case_post"
ref = "wc-statement-restatement"

[[step]]
seq = 18
kind = "case_disclose"
ref = "wc-statement-restatement"
principal = "case-poster-1"

[[step]]
seq = 19
kind = "case_close"
ref = "wc-statement-restatement"
principal = "case-poster-1"

# The kernel-attested B (plan §5.3): the restated 44,188,000,000.00 recorded as a RegisterEquals
# attestation on the leaf, and its twins one cent above and below refused FA-REF-140.
[[step]]
seq = 20
kind = "assert_balance"
ref = "W-T-02"
principal = "case-reconciler-1"
evidence = "DOC-406"

[[step]]
seq = 21
kind = "checkpoint"
ref = "restated"
principal = "examiner-witness"

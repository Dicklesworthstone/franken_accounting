# SunPower's income-statement book (plan §10.1; §15 X3, slice 1): us-gaap:NetIncomeLoss for
# the eight fiscal quarters of FY2021 and FY2022. One leaf account per quarter carries that
# quarter's A, posted as filed into a period then closed and locked, and its delta, posted
# through the Restatement case `spwr-is-restatement`; each balances against the one
# Equity-typed is-offset account 3900. Because each leaf carries one quarter, its stock at
# the quarter's end is that quarter's net income, so every X-T-01 row is a one-leaf bridge
# (kernel-attested). B is never posted, only read back and asserted.
#
# NetIncomeLoss is a credit-balance concept (its XBRL balance attribute; X2's
# us-gaap-xbrl-v1 row types it Revenue): a profit credits the leaf, a loss debits it, and
# each leg carries the figure's magnitude.


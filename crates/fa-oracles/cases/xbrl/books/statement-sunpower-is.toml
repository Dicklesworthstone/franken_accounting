attribute = "evidence_attached"
rule = "evidence_minimum"
values = ["none", "placeholder_unreviewed", "placeholder_reviewed"]

[[default]]
attribute = "evidence_attached"
rule = "placeholder_reviewed"
rationale = "the 10-K/A is cited through its stub, reviewed by case-second-reader (plan §2.7)"

[[default]]
attribute = "leg_split"
rule = "statement_remainder"
rationale = "the filing states net income (loss) as one line with no split of the other side: each figure posts against the one is-offset account of type Equity (plan §3.8, §15 X3)"

[[default]]
attribute = "effective_date"
rule = "reporting_period_last_day"
rationale = "an income-statement figure is the activity of its fiscal quarter, dated the quarter's last day"

[[default]]
attribute = "case_determination_date"
rule = "restating_filing_date"
rationale = "the 10-K/A's filing date is public, fixed and never precedes the restated figures (plan §2.6); X7 replaces it with the Item 4.02 8-K's determination date"

[[default]]
attribute = "reason"
rule = "WrongAmount"
rationale = "the 10-K/A corrects amounts previously reported, and the book holds no account-level cause; never Fraud (K-REASON)"


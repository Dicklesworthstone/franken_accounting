[[default]]
attribute = "leg_split"
rule = "statement_remainder"
rationale = "the tagged totals partition exactly (Assets = Liabilities + StockholdersEquity + MinorityInterest), so each liability or equity figure posts against the Assets leaf and no remainder account is needed (plan §3.8, §15 X3)"

[[default]]
attribute = "effective_date"
rule = "reporting_period_last_day"
rationale = "a balance-sheet figure is as of its fiscal year-end, the period's last day"

[[default]]
attribute = "reason"
rule = "WrongAmount"
rationale = "the 10-K/A corrects amounts previously reported, and the book holds no account-level cause; never Fraud (K-REASON)"


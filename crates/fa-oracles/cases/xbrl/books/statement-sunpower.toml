# SunPower's balance sheet at its fiscal 2022 year-end, 2023-01-01 (plan §10.1; §15 X3, slice 2).
# The tagged totals partition exactly, in A, in the adjustment and in B: Assets =
# Liabilities + StockholdersEquity + MinorityInterest. So each of the three posts its
# year-end figure against the Assets leaf, no remainder is needed, and the certified Assets
# cross-checks the separately tagged Assets B. The adjustments post through the
# Restatement case `spwr-bs2022-restatement`. LiabilitiesAndStockholdersEquity and the equity total
# including the noncontrolling interest are statement lines, read and never posted. The
# book has one period, because the kernel attests one period's cell (RegisterEquals).

[book]
variant = "statement-sunpower"
opening_date = "2022-01-03"
calendar = "custom"
base_unit = "USD"
posture = "embedded-owner"


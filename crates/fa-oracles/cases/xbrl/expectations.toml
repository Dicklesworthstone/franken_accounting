# SunPower 10-K/A FY2022 expectations (plan §10.1; §15 X3 slice 1). X-T-01 bridges
# us-gaap:NetIncomeLoss in each fiscal quarter of FY2021 and FY2022: the book posts the
# 10-K/A's as-previously-reported A, its restatement adjustment through the Restatement case,
# and the certified balance of the quarter's leaf must equal the tagged as-restated B
# exactly. X-R-01 reads each leaf as originally reported and must return A. The quarterly
# figures are the filing's unaudited quarterly data, so X-T-01 states filer_unaudited.

[[expectation]]
id = "X-T-01"
type = "T"
book_variant = "statement-sunpower-is"
statement_template = "T.bridge"
basis = ["spwr.NetIncomeLoss.c-462", "spwr.NetIncomeLoss.c-463", "spwr.NetIncomeLoss.c-459", "spwr.NetIncomeLoss.c-460", "spwr.NetIncomeLoss.c-456", "spwr.NetIncomeLoss.c-457", "spwr.NetIncomeLoss.c-453", "spwr.NetIncomeLoss.c-454", "spwr.NetIncomeLoss.c-450", "spwr.NetIncomeLoss.c-451", "spwr.NetIncomeLoss.c-447", "spwr.NetIncomeLoss.c-448", "spwr.NetIncomeLoss.c-444", "spwr.NetIncomeLoss.c-445", "spwr.NetIncomeLoss.c-441", "spwr.NetIncomeLoss.c-442"]

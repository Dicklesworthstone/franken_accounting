type = "R"
book_variant = "statement-sunpower-is"
statement_template = "R.read_back"
basis = ["spwr.NetIncomeLoss.c-462", "spwr.NetIncomeLoss.c-459", "spwr.NetIncomeLoss.c-456", "spwr.NetIncomeLoss.c-453", "spwr.NetIncomeLoss.c-450", "spwr.NetIncomeLoss.c-447", "spwr.NetIncomeLoss.c-444", "spwr.NetIncomeLoss.c-441"]


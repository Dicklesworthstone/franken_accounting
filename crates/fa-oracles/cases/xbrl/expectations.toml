# X3 slice 2: SunPower's fiscal year-end balance sheets, one book per year-end (the kernel
# attests one period's cell, so each year-end's stock sits in its book's one period). X-T-05
# (2023-01-01) and X-T-06 (2022-01-02) are X-T-01's balance-sheet half: the restated
# Liabilities, StockholdersEquity and MinorityInterest leaves, the Assets leaf they post
# against (a cross-check of the separately tagged Assets B), and the statement's
# liabilities_and_equity and equity lines. MinorityInterest, which the 10-K/A does not adjust,
# is no bridge (its one posting would carry B); it is read back and feeds the totals.
# Year-end figures are inside the audit opinion, so
# the source's filer_audited stands. X-R-03 and X-R-04 read each posted leaf as originally
# reported.

[[expectation]]
id = "X-T-05"
type = "T"
book_variant = "statement-sunpower"
statement_template = "T.bridge"
basis = ["spwr.Liabilities.c-113", "spwr.Liabilities.c-114", "spwr.StockholdersEquity.c-113", "spwr.StockholdersEquity.c-114", "spwr.MinorityInterest.c-113", "spwr.MinorityInterest.c-114"]
kind = "bridge"
vintages = ["A:SRC-SPWR-10KA-2022", "D:SRC-SPWR-10KA-2022", "B:SRC-SPWR-10KA-2022"]

[[expectation]]
id = "X-R-03"
type = "R"
book_variant = "statement-sunpower"
statement_template = "R.read_back"
basis = ["spwr.Liabilities.c-113", "spwr.StockholdersEquity.c-113", "spwr.MinorityInterest.c-113"]

[[target]]

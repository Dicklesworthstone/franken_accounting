notes = "Accession 0000867773-23-000089, the Item 4.02 8-K filed 2023-10-24 per its EDGAR filing index; the document is the inline XBRL 8-K spwr-20231018.htm, 39,236 bytes as captured 2023-10-30 (the capture replays EDGAR's gzip Content-Encoding; the sha256 is of the document). Its Item 4.02 sentence states the day the Audit Committee determined that the fiscal 2022 10-K and the first two 2023 10-Qs should no longer be relied upon, 2023-10-19, which is neither the filing date nor the date in the document's name. It is the filer's own unaudited statement of a determination, with no audit or review report of its own, so it carries no assurance sentence."

notes = "Accession 0000867773-23-000117, the 10-K/A (dei:AmendmentFlag true) that restates SunPower's fiscal 2022 and 2021 statements; Filing Date 2023-12-18 on its EDGAR filing index (Internet Archive capture of 2023-12-19). This is the instance EDGAR extracts from the inline XBRL document spwr-20230101.htm, 5,332,240 bytes as captured 2023-12-24. Its quarterly figures are the filing's selected unaudited quarterly financial data, so a quarterly line states filer_unaudited; the instance tags the auditor of the annual statements (dei:AuditorName, the row's assurance fact) and introduces the quarterly data as unaudited (us-gaap:QuarterlyFinancialInformationTextBlock, each quarterly fact's assurance). The originally filed fiscal 2022 10-K, which this filing restates, is not yet a row either, so restates is empty until it is."


# Harness self-test native book: two quarters, one opened. N-1 (legs 1,234.56) and a round-amount
# Original entry S-1 post; an Original entry dated in the never-opened quarter is refused by the
# period law; jet.round_amounts finds S-1 and not N-1. P-1's evidence cells are swept by dry run.
# Then the bridge: A-1 (1,000.00 on 1100) posts, the quarter is closed and locked, the as-filed
# checkpoint is cosigned by the examiner witness, and case selftest-restatement restates A by
# -100.00 (B = 900.00), disclosed and closed; then the book's signed checkpoint, which the outsider
# stage bundles, replays and verifies against, and the witness's cosignature of the restated book,
# which must extend the as-filed one. Synthetic; amounts are fixture values.


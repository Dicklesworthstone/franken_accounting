# Enron expectations (plan §7.2; §15 E4). E-T-02 is the 2000-12-31 balance-sheet footing in both
# vintages: every printed line posted to its own account on its own statement book, and the
# certified type-level totals compared with the printed totals, which are never posted. The
# loader binds an expectation to one book variant, so the plan's one E-T-02 is two rows: E-T-02 on
# the FY2000 10-K's book (filer_audited), read as reported in its issuance because the 10-Q
# restates those figures (K-VINTAGE), and E-T-05 on the Q3-2001 10-Q's restated column
# (filer_unaudited), the latest vintage.
#
# E-T-04 and E-T-01 are the restatement bridges (§7.2): A, the FY2000 10-K's as-filed figure, plus
# each restating vintage's adjustments, equals that vintage's restated figure, on one book per
# vintage (case.toml's decision E4-bridge-books). The 8-K's (E-T-04: FY1999 net income, total assets
# and equity) is superseded by the 10-Q eleven days later (same cells, other values), so it reads
# the 8-K's issuance. The 10-Q's (E-T-01) is the latest vintage: net income FY1998-FY2000 (the
# FY2000 10-K prints no FY1997 net income, only income before cumulative effect) and total assets,
# debt and equity FY1997-FY2000. A later year's stock folds every year through it, so only FY1997's
# stocks and each year's net income are kernel-attested (§5.3). E-R-02 and E-R-01 read each book as
# originally reported: the as-filed figures.


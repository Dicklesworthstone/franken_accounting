# Enron (plan §7). E1 lands the case's sources ledger: the superseding indictment, the 8-K of
# 2001-11-08 with its restatement Table 1, the Q3-2001 10-Q with its restated 2000 balance sheet,
# the special investigative committee's report, and the FY2000 and FY1999 10-Ks, each with the
# sentence (or table heading) that establishes its assurance. E2d's first slice adds every printed
# line and total of the 2000-12-31 balance sheet in both vintages (the FY2000 10-K, audited, and the
# Q3-2001 10-Q's restated column, unaudited), and E4's E-T-02 foots each on its own statement book
# (E-T-02 on the 10-K's, read as reported in its issuance; E-T-05 on the 10-Q's). E2d/E4's second
# slice bridges FY1999 net income, total assets and equity from the as-filed figures through the
# 8-K's adjustments (E-T-04, read as reported in its issuance, superseded eleven days later), and
# its third bridges every year Note 3 restates against an as-filed figure through the 10-Q's
# (E-T-01: net income FY1998-FY2000, total assets, debt and equity FY1997-FY2000), each with its
# as-originally-reported read-backs (E-R-02, E-R-01). E2d's fourth slice adds the FY1999 10-K's
# EX-27 cells, the earliest vintage of the FY1999 figures (its BONDS, a different concept from the
# restatements' debt, in no basis), and the Raptor equity adjustment line's cells in both restating
# vintages, E-T-03's published delta for when E3's native book exists. E2b adds the special
# committee's sentences E3 builds on: the Raptor restructuring documents' dates and the
# notes-for-stock entries ($172 million in April 2000, $828 million in March 2001, and the $1
# billion correction), each bound to its sentence by hash, with the interpretations that turn
# their scheme-level wording into entries. The native book (E3's first slice) books the two
# notes-for-stock entries as Enron did and reverses them through a Restatement case, whose certified
# statement diff reproduces the published Raptor equity adjustment line (E-T-03). The case's reader
# is the investigator (§12.3).
id = "enron"
letter = "E"
title = "Enron, the 1997-2001 restatements and the special purpose entities"
version = 1
kind = "case"
scope = "the sources ledger of the Enron case (six public-record sources and the assurance each filer row carries); the consolidated balance sheet at December 31, 2000 as the FY2000 10-K prints it and as the Q3-2001 10-Q restates it, every line and the printed totals they foot to; and the restatement bridges from the as-filed figures to the 8-K's restated FY1999 net income, total assets and equity, and to the 10-Q's restated net income (FY1998-FY2000) and total assets, debt and equity (FY1997-FY2000)"
claims = ["E-R-01", "E-R-02", "E-T-01", "E-T-02", "E-T-03", "E-T-04", "E-T-05"]
capabilities = ["case_kind:Restatement", "verb:assert-balance", "verb:case", "verb:post", "verb:scenario", "verb:statement"]
pinned_commit = "d0673641d"
variants = ["statement-10k2000", "statement-10q2001q3", "statement-bridge-8k-fy1999", "statement-bridge-10q", "native"]

[[decision]]
id = "E4-bridge-books"
outcome = "one_book_per_restating_vintage"
facts = ["8K-TA-B-FY1999", "N3-TA-B-FY1999"]
sources = ["SRC-ENR-002", "SRC-ENR-003"]
reason = "Each restating vintage restates the as-filed FY1999 figures and neither restates the other: the 8-K and the 10-Q each print their adjustments against the same as-reported column, and sources.toml has each restating SRC-ENR-008 and SRC-ENR-402 only. So each vintage's adjustments post through one Restatement case on its own book (the 8-K's FY1999 book; the 10-Q's four-period book, FY1997-FY2000), rather than a second case reversing the first on one book; the 8-K's book issues its restated statement citing the 8-K's stub so that E-T-04 reads it as reported in that issuance."

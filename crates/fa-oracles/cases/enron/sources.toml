notes = "Accession 0001024401-01-500010, filed 2001-04-02 (FILED AS OF DATE in its submission header). The full submission (the 10-K and its exhibits), 712,171 bytes as captured 2016-01-09. The audited consolidated balance sheet prints every December 31, 2000 line: 35 lines (17 assets, 11 liabilities, 7 shareholders' equity) and the totals Total current assets 30,381, Total investments and other assets 23,379, Property, plant and equipment, net 11,743 (gross 15,459), Total Assets 65,503, Total current liabilities 28,406, Total deferred credits and other liabilities 13,759, Total shareholders' equity 11,470 and Total Liabilities and Shareholders' Equity 65,503. No total liabilities line is printed. The column foots (checked at authoring). ASSUR-ENR-008 is the auditors' opinion sentence covering the balance sheets at December 31, 2000 and 1999 and the three years ended December 31, 2000. It restates SRC-ENR-402: the notes state that certain reclassifications have been made to the consolidated financial statements for prior years to conform with the current presentation, and the December 31, 1999 column regroups lines of the FY1999 10-K's balance sheet with the same totals (deposits and customers' deposits split out of other)."


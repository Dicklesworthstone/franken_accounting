[[default]]
attribute = "leg_split"
rule = "statement_lines"
rationale = "every printed line of the balance sheet posts to its own account in one entry; the lines balance on their own, so no remainder account is needed (plan §7.2, E-T-02)"

[[default]]
attribute = "effective_date"
rule = "reporting_period_last_day"
rationale = "a balance sheet is as of its date, the fiscal year's last day"


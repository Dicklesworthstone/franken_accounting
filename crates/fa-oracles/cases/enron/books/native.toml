# Enron's native book (plan §7.2a; E3's first slice, carrying E4's E-T-03). The notes-for-stock
# entries the special committee documents, booked as Enron booked them: the Talon note (NFS1,
# $172 million, April 2000) and the March 2001 notes (NFS2e, $828 million), each an increase to
# notes receivable and to shareholders' equity. The Restatement case reverses both, as the
# committee's "proper accounting" sentence (NFS-PROPER) says they should have been booked: no
# asset, no equity. Its certified statement diff is E-T-03's read. Quarters 2000Q1-2001Q3; every
# quarter through 2001Q2 is locked before the case.
# E3's second slice adds the reserve-release override the indictment charges (RR1e, its amount
# the synthetic RR-AMT) and E-P-01, its first refusals by entry class and period state at commit.


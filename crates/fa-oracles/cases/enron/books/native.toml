[[default]]
attribute = "evidence_attached"
rule = "placeholder_reviewed"
rationale = "the notes the committee describes are not public; each entry cites a reconstruction placeholder of its fact, reviewed by case-second-reader, and the case cites the 10-Q's stub (plan §2.7)"

[[default]]
attribute = "effective_date"
rule = "reporting_period_last_day"
rationale = "the committee gives the months (April 2000, March 2001), not the days: each entry is effective on its quarter's last day, which every day of the month shares a quarter with"

[[default]]
attribute = "case_determination_date"
rule = "restating_filing_date"
rationale = "the 10-Q (filed 2001-11-19) is the later restating filing that prints the Raptor equity adjustment line E-T-03 compares (plan §2.6); §7.1 has no Item 4.02 8-K row"

[[default]]
attribute = "reason"
rule = "WrongAccount"
rationale = "the committee: the proper accounting would have been to show the notes receivable as a reduction to shareholders' equity (NFS-PROPER); the amounts were right and the accounts wrong, and a restatement is never Fraud (K-REASON)"

[[default]]
attribute = "entry_class"
rule = "Original"
rationale = "the indictment charges entries made in Enron's books and records; Original is the class such an entry posts under (plan §2.6 rule 2)"

[[default]]
attribute = "period_state_at_commit"
rule = "Open"
rationale = "the indictment dates the entries after the second quarter ended and gives no close or report date for it: the book posts the entry while 2000Q2 is Open (plan §2.6 rule 2)"

[[default]]
attribute = "acting_principal"
rule = "role_of_record"
rationale = "RR2 says a senior Enron executive released the reserve into earnings; that role (senior-executive-1, grants read and post) books RR1e"

[[default]]
attribute = "approval_encoding"
rule = "none"
rationale = "the indictment states no approval of the entries; the Adjusting-in-Closed cell with a second principal's approval is E3b's"


# Enron's consolidated balance sheet at 2000-12-31 as the FY2000 10-K prints it (plan §7.2,
# E-T-02; §7.2a). One period, FY2000. Every printed line posts to its own account in one
# entry; the printed subtotals and totals are read from the balance sheet and never posted.
# The 10-Q restates these figures (SRC-ENR-003 restates SRC-ENR-008), so the statement is
# issued citing the 10-K's stub and the footing reads it as reported in that issuance
# (K-VINTAGE).


# Enron's FY1999 net income, total assets and equity as the FY2000 10-K reported them (A), restated
# by the 8-K (plan §7.2, §7.2a; E4). One period, FY1999: the kernel attests one period's cell.
# The adjustments post through one Restatement case. Each restating vintage restates the
# as-filed figures, and neither restates the other (sources.toml), so each has its own book
# (case.toml's decision row E4-bridge-books).
# The 10-Q restates the 8-K's figures eleven days later, so the restated statement is issued
# (the period's second issuance) citing the 8-K's stub and E-T-04 reads it as reported in that
# issuance (K-VINTAGE).


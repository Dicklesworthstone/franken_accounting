[[case]]
id = "enr-8k-fy1999"
kind = "Restatement"
periods = ["FY1999"]
determined_on = "default"
authority = "DOC-ENR-8K"
disclosure = "DOC-ENR-8K"
approvers = ["case-approver-1", "case-approver-2"]
poster = "case-poster-1"

[[branch_class]]
id = "bc-evidence"
attribute = "evidence_attached"
rule = "evidence_minimum"
values = ["none", "placeholder_unreviewed", "placeholder_reviewed"]

[[default]]
attribute = "evidence_attached"
rule = "placeholder_reviewed"
rationale = "the FY2000 10-K and the 8-K are cited through their stubs, reviewed by case-second-reader (plan §2.7)"

[[default]]
attribute = "leg_split"
rule = "statement_remainder"
rationale = "each bridged figure posts against one balancing account the bridge never reads (ENR-BRIDGE-FY1999), so every entry balances on the figure alone (plan §3.8)"

[[default]]
attribute = "effective_date"
rule = "reporting_period_last_day"
rationale = "a FY1999 figure is as of the fiscal year-end, the period's last day"

[[default]]
attribute = "case_determination_date"
rule = "restating_filing_date"
rationale = "the restating filing's date (the 8-K's filing date, 2001-11-08) is public, fixed and never precedes the restated figures (plan §2.6); §7.1 has no Item 4.02 8-K row"

[[default]]
attribute = "reason"
rule = "WrongAmount"
rationale = "the restating filing corrects amounts previously reported; the book holds no account-level cause, and a restatement is never Fraud (K-REASON)"


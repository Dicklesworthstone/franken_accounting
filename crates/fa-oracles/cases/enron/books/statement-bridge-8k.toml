rule = "reporting_period_last_day"
rationale = "a fiscal year's figure, or its change, is as of the fiscal year-end, the period's last day"

[[default]]
attribute = "case_determination_date"
rule = "restating_filing_date"
rationale = "the restating filing's date (the 8-K's filing date, 2001-11-08) is public, fixed and never precedes the restated figures (plan §2.6); §7.1 has no Item 4.02 8-K row"

[[default]]
attribute = "reason"
rule = "WrongAmount"
rationale = "the restating filing corrects amounts previously reported; the book holds no account-level cause, and a restatement is never Fraud (K-REASON)"


# Enron's total assets, debt and equity (FY1997-FY2000) and net income (FY1998-FY2000) as the
# FY2000 10-K reported them (A), restated by the 8-K's Table 1 (plan §7.2, §7.2a; E4). The shape
# is the 10-Q bridge's (books/statement-bridge-10q.toml; ENR-BRIDGE-8K): a stock posts in FY1997
# and in each later year as its change, and its adjustments likewise; net income and its
# adjustments post in their year. The adjustments post through one Restatement case. Each
# restating vintage restates the as-filed figures and neither restates the other, so each has its
# own book (case.toml's decision row E4-bridge-books).
# The 10-Q restates the 8-K's figures eleven days later, so each year's restated statement is
# issued (the period's second issuance) citing the 8-K's stub, and E-T-04 reads it as reported in
# that issuance (K-VINTAGE).


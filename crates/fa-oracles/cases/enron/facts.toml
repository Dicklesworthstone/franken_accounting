[[fact]]
id = "ENR-BRIDGE-FY1999"
provenance = "interpretation"
from = ["10K-NI-A-FY1999", "10K-TA-A-FY1999", "10K-EQ-A-FY1999"]
reader = "case-author-1"
second_reader = "case-second-reader"
rationale = "A FY1999 bridge book holds three of the figures the restatements bridge, each on its own account: total assets on an asset account, equity on an equity account, and net income on a revenue account. Debt is not bridged here. A book needs balanced entries, so total assets and equity each post against one liability account that holds what the two leave (total assets less equity), and net income posts against an equity account that holds its closing. Neither balancing account is read, published or compared. Each adjustment posts against the same balancing account as the figure it adjusts."


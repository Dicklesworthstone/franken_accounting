# Enron facts (plan §7.2; §15 E1). E1's own facts are the four filer rows' assurance facts (§2.2),
# each bound hash-first by its line range in the receipted extraction (§1.3, §4.4); E2a-E2d add the
# rest. An assurance sentence is no statement line, but none of the §2.3 granularities describes a
# legend, so these take `statement_line`, as WorldCom's and Lehman's assurance facts do (the bead
# records the gap). Each scope is a scheme whose range covers every period its sentence names.
#
# E2d slice 1: the 2000-12-31 consolidated balance sheet in both vintages, every printed line
# (`BS10K-*`, SRC-ENR-008; `BS10Q-*`, SRC-ENR-003's restated column) and its printed totals, in
# millions (`scale` param 6), each bound by its table cell. Each statement prints its balance sheet
# as two tables under one title (assets, then liabilities and equity), so an anchor names the table
# by its occurrence (`#1`, `#2`), and a label the table repeats ("Other") by its own; a label printed
# over several lines is anchored by its first line. Two interpretation facts read each vintage's
# lines as one posted entry.


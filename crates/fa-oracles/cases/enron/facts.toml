[[fact]]
id = "BS10K-SFC"
provenance = "interpretation"
from = ["BS10K-CASH", "BS10K-TRADE-RECEIVABLES", "BS10K-OTHER-RECEIVABLES", "BS10K-PRICE-RISK-ASSETS-CURRENT", "BS10K-INVENTORIES", "BS10K-DEPOSITS", "BS10K-OTHER-CURRENT-ASSETS", "BS10K-EQUITY-AFFILIATES", "BS10K-PRICE-RISK-ASSETS-NONCURRENT", "BS10K-GOODWILL", "BS10K-OTHER-INVESTMENTS", "BS10K-NATURAL-GAS-TRANSMISSION", "BS10K-ELECTRIC-GENERATION", "BS10K-FIBER-OPTIC", "BS10K-CONSTRUCTION-IN-PROGRESS", "BS10K-OTHER-PROPERTY", "BS10K-ACCUMULATED-DEPRECIATION", "BS10K-ACCOUNTS-PAYABLE", "BS10K-PRICE-RISK-LIABILITIES-CURRENT", "BS10K-SHORT-TERM-DEBT", "BS10K-CUSTOMERS-DEPOSITS", "BS10K-OTHER-CURRENT-LIABILITIES", "BS10K-LONG-TERM-DEBT", "BS10K-DEFERRED-INCOME-TAXES", "BS10K-PRICE-RISK-LIABILITIES-NONCURRENT", "BS10K-OTHER-DEFERRED-CREDITS", "BS10K-MINORITY-INTERESTS", "BS10K-PREFERRED-SECURITIES-OF-SUBSIDIARIES", "BS10K-SECOND-PREFERRED-STOCK", "BS10K-JUNIOR-PREFERRED-STOCK", "BS10K-COMMON-STOCK", "BS10K-RETAINED-EARNINGS", "BS10K-ACCUMULATED-OTHER-COMPREHENSIVE-INCOME", "BS10K-TREASURY-STOCK", "BS10K-RESTRICTED-STOCK"]
reader = "case-author-1"
second_reader = "case-second-reader"
rationale = "The 2000-12-31 consolidated balance sheet the FY2000 10-K prints, posted as one entry: each printed line on its own account, assets debited and liabilities and equity credited, a line the filing prints in parentheses (accumulated depreciation, accumulated other comprehensive loss, treasury and restricted stock) on the other side. Minority interests and the company-obligated preferred securities of subsidiaries are printed outside shareholders' equity, so they are liabilities here. Subtotals and totals are never posted. The printed lines balance on their own (total assets equals total liabilities and shareholders' equity), so no remainder account is needed."


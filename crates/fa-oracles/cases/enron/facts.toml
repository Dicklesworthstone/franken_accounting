[[fact]]
id = "ENR-BRIDGE-10Q"
provenance = "interpretation"
from = ["10K-TA-A-FY1997", "10K-DEBT-A-FY1997", "10K-EQ-A-FY1997", "10K-NI-A-FY1998"]
reader = "case-author-1"
second_reader = "case-second-reader"
rationale = "The 10-Q bridge book holds four of the figures Note 3 bridges, each on its own account: total assets on an asset account, debt on a liability account, equity on an equity account, and net income on a revenue account. A book needs balanced entries, so total assets, debt and equity each post against one liability account that holds what they leave, and net income posts against an equity account that holds its closing. Neither balancing account is read, published or compared. A stock figure posts in its first year, FY1997, and in each later year as its change from the year before, so the certified balance at each year-end is the printed figure; a stock line's adjustments post per printed column in FY1997, and in each later year as the change in the line's total adjustment, the sum of its printed columns. Net income is a flow: each year's figure and each of its adjustments post in that year. Each adjustment posts against the same balancing account as the figure it adjusts."


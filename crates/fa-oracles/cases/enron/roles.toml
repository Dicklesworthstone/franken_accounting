# Enron roles (plan §2.8). Every label is a harness role. The indictment and the committee's report
# name people: the deny list holds the `fa:case-name-token:v1` hashes of the name tokens of the two
# defendants and of people the report names, never the names (K-NAMES), so no rendered or journaled
# text can carry them. E2a-E2c add their tokens before citing those sources.

[[role]]
label = "case-author-1"
kind = "harness"
description = "authors the case's interpretations"

[[role]]
label = "case-second-reader"
kind = "harness"
description = "independently reads every interpretation and reviews the citation stubs"

[[role]]
label = "case-closer-1"
kind = "harness"
description = "runs the book's period transitions and issues its statements"

[[role]]
label = "case-approver-1"
kind = "harness"
description = "approves period locks"

[[role]]
label = "case-filer-1"
kind = "harness"
description = "posts a statement book's figures as the filing printed them"

[[role]]
label = "examiner-1"
kind = "harness"
description = "records the case's findings and checkpoints"

[[role]]
label = "examiner-witness"
kind = "harness"
description = "witnesses the case's checkpoints (plan §12.7)"

[[role]]
label = "case-approver-2"
kind = "harness"
description = "the second approver of a restatement case"

[[role]]
label = "case-poster-1"
kind = "harness"
description = "opens, rehearses, posts, discloses and closes a restatement case"

[[role]]
label = "case-reconciler-1"
kind = "harness"
description = "asserts a restated balance as a RegisterEquals attestation"

[[role]]
label = "defendant-1"
kind = "report"
description = "a defendant the superseding indictment charges, which describes the office held as Enron's President and Chief Operating Officer from January 1997 and its President and CEO from February to August 2001"
described_by = "RR1"

[[role]]
label = "defendant-2"
kind = "report"
description = "a defendant the superseding indictment charges, which describes the office held as Enron's Chief Accounting Officer and an Executive Vice President from 1998"
described_by = "RR1"

[[role]]
label = "senior-executive-1"
kind = "report"
description = "the senior Enron executive who, the indictment charges, released millions of dollars from a prudency reserve into earnings"
described_by = "RR2"


# Rel fixture native book: one opened quarter and one entry (R-1) debiting two fixed-asset accounts
# (1500: 300.00, 1510: 200.00) against a line-cost expense (6100: 500.00), then an
# expense.capitalization run. Which fixed-asset account the finding cites, and whose amount it
# capitalizes, follows the accounts' VId order, so it changes with the book id. Synthetic; amounts
# are fixture values.

[book]
variant = "native"
opening_date = "2026-01-01"
calendar = "custom"
base_unit = "USD"
posture = "embedded-owner"

[[period]]

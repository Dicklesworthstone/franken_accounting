fiscal_year = 2026
kind = "Normal"

[[principal]]
label = "selftest-preparer-1"
profile = "Human"
grants = ["read", "post"]

[[principal]]
label = "case-closer-1"
profile = "Human"
grants = ["read", "close"]

[[principal]]
label = "case-second-reader"
profile = "Human"
grants = ["read", "approve"]

[[principal]]
label = "examiner-1"
profile = "Human"
grants = ["read", "produce"]

[[account]]

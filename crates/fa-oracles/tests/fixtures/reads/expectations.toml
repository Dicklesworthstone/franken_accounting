# Reads fixture expectations: a per_account T reading 1100 certified at 2026Q1 against the published
# 1,250.00 (kernel-attested: its assert_balance step records B and its twins are refused FA-REF-140),
# and four read-backs of the same cell: as originally reported and as reported in the first issuance
# (1,000.00, before R-2), as reported in the second issuance and as currently stated (1,250.00). Then
# the same quarter read off the certified statements and trial balance: the balance sheet's assets
# line as currently stated, the income statement's revenue line as originally reported, and the
# trial balance's 1100 row.

[[expectation]]
id = "reads-T-01"
type = "T"
book_variant = "native"
statement_template = "T.per_account"
basis = ["R-1", "R-2", "P-1"]
kind = "per_account"
vintages = []
read_verb = "balance"
read_target = "1100"
read_coordinate = "2026Q1"
published = "P-1"

[[expectation]]

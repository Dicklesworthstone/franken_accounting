# Reads fixture native book: one quarter. R-1 (Dr 1100 / Cr 4000 1,000.00) is posted and the
# quarter issued to the SEC; R-2 (250.00) is posted after it; the 1100 balance of 1,250.00 is
# asserted; the quarter is issued again, then closed and locked. So the first issuance reads
# 1,000.00 and the second and the head 1,250.00. Synthetic; amounts are fixture values.

[book]
variant = "native"
opening_date = "2026-01-01"
calendar = "custom"
base_unit = "USD"
posture = "embedded-owner"

[[period]]
code = "2026Q1"
start = "2026-01-01"
end = "2026-03-31"
fiscal_year = 2026
kind = "Normal"

[[principal]]
label = "selftest-preparer-1"
profile = "Human"
grants = ["read", "post"]

[[principal]]
label = "case-closer-1"
profile = "Human"
grants = ["read", "close"]

[[principal]]
label = "case-second-reader"
profile = "Human"
grants = ["read", "approve"]

[[principal]]
label = "case-reconciler-1"
profile = "Human"
grants = ["read", "reconcile"]

[[account]]
code = "1100"
name_fact = "R-1"
type = "Asset"
role = ""
opened = "2026-01-01"
role_map_rule = "role_map"

[[account]]
code = "4000"
name_fact = "R-1"
type = "Revenue"
role = ""
opened = "2026-01-01"
role_map_rule = "role_map"

[[document]]

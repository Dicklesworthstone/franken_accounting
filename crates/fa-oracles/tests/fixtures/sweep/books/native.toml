# Sweep fixture native book: one quarter, one entry (S-1, 100.00), the quarter opened before it
# and closed and locked after it. The P table branches S-1's class and its period's state at
# commit; the sweep supplies the soft-close this history lacks and reuses its close and lock
# principals. Synthetic; amounts are fixture values.

[book]
variant = "native"
opening_date = "2026-01-01"
calendar = "custom"
base_unit = "USD"
posture = "embedded-owner"

[[period]]
code = "2026Q1"
start = "2026-01-01"
end = "2026-03-31"
fiscal_year = 2026
kind = "Normal"

[[principal]]
label = "selftest-preparer-1"
profile = "Human"
grants = ["read", "post"]

[[principal]]
label = "case-closer-1"
profile = "Human"
grants = ["read", "close"]

[[principal]]
label = "case-approver-1"
profile = "Human"
grants = ["read", "approve"]

[[principal]]
label = "case-second-reader"
profile = "Human"
grants = ["read", "approve"]

[[principal]]
label = "examiner-1"
profile = "Human"
grants = ["read", "produce"]

[[account]]
code = "1000"
name_fact = "S-1"
type = "Asset"
role = ""
opened = "2026-01-01"
role_map_rule = "role_map"

[[account]]
code = "6000"
name_fact = "S-1"
type = "Expense"
role = ""
opened = "2026-01-01"
role_map_rule = "role_map"

[[document]]
id = "DOC-PH-S-1"
stub_of = "placeholder:S-1"
grade = "AgentUpload"
reviewed_by = "case-second-reader"

[[intent]]
id = "S-1"
fact = "S-1"
class = "Original"
principal = "selftest-preparer-1"
effective_date = "2026-02-10"
memo = "supplies (sweep fixture)"
evidence = "DOC-PH-S-1"
idempotency_key = "sweep-S-1"

[[leg]]
intent = "S-1"
ordinal = 0
account = "6000"
side = "Dr"
amount_literal = "100.00"
amount_rule = "synthetic"
unit = "USD"

[[leg]]
intent = "S-1"
ordinal = 1
account = "1000"
side = "Cr"
amount_literal = "100.00"
amount_rule = "synthetic"
unit = "USD"

[[branch_class]]
id = "bc-entry-class"
attribute = "entry_class"
rule = "entry_class_admission"
values = ["Original", "Adjusting"]

[[branch_class]]
id = "bc-period-state"
attribute = "period_state_at_commit"
rule = "period_state_admission"
values = ["Future", "Open", "SoftClosed", "Closed", "Locked"]

[[step]]
seq = 1
kind = "period_open"
ref = "2026Q1"
principal = "case-closer-1"

[[step]]
seq = 2
kind = "intent"
ref = "S-1"

[[step]]
seq = 3
kind = "period_close"
ref = "2026Q1"
principal = "case-closer-1"

[[step]]
seq = 4
kind = "period_lock"
ref = "2026Q1"
principal = "case-closer-1"
approvers = ["case-approver-1"]

[[default]]
attribute = "evidence_attached"
rule = "placeholder_reviewed"
rationale = "the fixture's document is a placeholder reviewed by case-second-reader (plan §2.6)"

[[default]]
attribute = "approval_encoding"
rule = "none"
rationale = "the fixture posts its entry with no approval attached (plan §6.4 W-P-01)"

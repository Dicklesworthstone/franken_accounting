# Lifecycle fixture native book: A (Dr 6100 / Cr 1000 1,000.00) is posted, the quarter closed,
# issued to the SEC and locked; then case rc restates A by 200.00 (planned into scenario restate by
# case-poster-1, approved by two approvers who planned none of it, posted by case-poster-1),
# disclosed under the restating filing and closed. Synthetic; amounts are fixture values.

[book]
variant = "native"
opening_date = "2026-01-01"
calendar = "custom"
base_unit = "USD"
posture = "embedded-owner"

[[period]]
code = "2026Q1"
start = "2026-01-01"
end = "2026-03-31"
fiscal_year = 2026
kind = "Normal"

[[principal]]
label = "selftest-preparer-1"
profile = "Human"
grants = ["read", "post"]

[[principal]]
label = "case-closer-1"
profile = "Human"
grants = ["read", "close"]

[[principal]]
label = "case-second-reader"
profile = "Human"
grants = ["read", "approve"]

[[principal]]
label = "case-approver-1"
profile = "Human"
grants = ["read", "approve"]

[[principal]]
label = "case-approver-2"
profile = "Human"
grants = ["read", "approve"]

[[principal]]
label = "case-poster-1"
profile = "Human"
grants = ["read", "post", "restate"]

[[account]]
code = "1000"
name_fact = "A-1"
type = "Asset"
role = ""
opened = "2026-01-01"
role_map_rule = "role_map"

[[account]]
code = "6100"
name_fact = "A-1"
type = "Expense"
role = ""
opened = "2026-01-01"
role_map_rule = "role_map"

[[document]]
id = "DOC-PH-A-1"
stub_of = "placeholder:A-1"
grade = "AgentUpload"
reviewed_by = "case-second-reader"

[[document]]
id = "DOC-LC-0"
stub_of = "SRC-LC-0"
grade = "AgentUpload"
reviewed_by = "case-second-reader"

[[document]]
id = "DOC-LC-1"
stub_of = "SRC-LC-1"
grade = "AgentUpload"
reviewed_by = "case-second-reader"

[[intent]]
id = "A-1"
fact = "A-1"
class = "Original"
principal = "selftest-preparer-1"
effective_date = "2026-03-16"
memo = "an expense (lifecycle fixture)"
evidence = "DOC-PH-A-1"
idempotency_key = "lifecycle-A-1"

[[leg]]
intent = "A-1"
ordinal = 0
account = "6100"
side = "Dr"
amount_literal = "1000.00"
amount_rule = "value:A-1#1"
unit = "USD"

[[leg]]
intent = "A-1"
ordinal = 1
account = "1000"
side = "Cr"
amount_literal = "1000.00"
amount_rule = "value:A-1#1"
unit = "USD"

[[intent]]
id = "delta-A-1"
fact = "D-1"
class = "Restatement"
principal = "case-poster-1"
effective_date = "2026-03-16"
evidence = "DOC-LC-1"
idempotency_key = "lifecycle-delta-A-1"
target = "A-1"
target_kind = "restates"
reason = "WrongAmount"
scenario = "restate"

[[leg]]
intent = "delta-A-1"
ordinal = 0
account = "6100"
side = "Dr"
amount_literal = "200.00"
amount_rule = "value:D-1#1"
unit = "USD"

[[leg]]
intent = "delta-A-1"
ordinal = 1
account = "1000"
side = "Cr"
amount_literal = "200.00"
amount_rule = "value:D-1#1"
unit = "USD"

[[case]]
id = "rc"
kind = "Restatement"
periods = ["2026Q1"]
determined_on = "default"
authority = "DOC-LC-1"
disclosure = "DOC-LC-1"
approvers = ["case-approver-1", "case-approver-2"]
poster = "case-poster-1"

[[step]]
seq = 1
kind = "period_open"
ref = "2026Q1"
principal = "case-closer-1"

[[step]]
seq = 2
kind = "intent"
ref = "A-1"

[[step]]
seq = 3
kind = "period_close"
ref = "2026Q1"
principal = "case-closer-1"

[[step]]
seq = 4
kind = "issue"
ref = "2026Q1"
principal = "case-closer-1"
approvers = ["case-second-reader"]
document = "DOC-LC-0"

[[step]]
seq = 5
kind = "period_lock"
ref = "2026Q1"
principal = "case-closer-1"
approvers = ["case-second-reader"]

[[step]]
seq = 10
kind = "case_open"
ref = "rc"
principal = "case-poster-1"

[[step]]
seq = 11
kind = "scenario_fork"
ref = "restate"
principal = "case-poster-1"

[[step]]
seq = 12
kind = "scenario_run"
ref = "restate"
principal = "case-poster-1"

[[step]]
seq = 13
kind = "scenario_diff"
ref = "restate"
principal = "case-poster-1"

[[step]]
seq = 14
kind = "case_rehearse"
ref = "rc"
principal = "case-poster-1"

[[step]]
seq = 15
kind = "case_approve"
ref = "rc"

[[step]]
seq = 16
kind = "case_post"
ref = "rc"

[[step]]
seq = 17
kind = "case_disclose"
ref = "rc"
principal = "case-poster-1"

[[step]]
seq = 18
kind = "case_close"
ref = "rc"
principal = "case-poster-1"

[[default]]
attribute = "evidence_attached"
rule = "placeholder_reviewed"
rationale = "the fixture's documents are placeholders reviewed by case-second-reader (plan §2.6)"

[[default]]
attribute = "reason"
rule = "WrongAmount"
rationale = "the delta corrects A's amount; the correction's reason is the amount, never Fraud (K-REASON)"

[[default]]
attribute = "case_determination_date"
rule = "restating_filing_date"
rationale = "the fixture has no non-reliance 8-K; the restating filing's date is fixed and never precedes the restated figures (plan §2.6)"

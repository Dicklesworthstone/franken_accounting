# Consolidation fixture native book: one quarter, two legal entities, P owning all of S. P raises
# 5,000.00 of capital in cash (C-1) and invests 1,000.00 of it in S (C-2); S receives that 1,000.00 as
# its capital (C-3). Consolidated, the investment is eliminated against S's capital: assets are P's
# 4,000.00 of cash and S's 1,000.00, 5,000.00 in all (G-1). Synthetic; amounts are fixture values.


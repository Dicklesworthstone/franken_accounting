# Twin gap fixture expectations: v5 now counts the direct B-to-A transfer, so
# the original 300.00 gap claim below must FAIL on the unmodified native book.
# The exact-gap harness selftests deliberately misattribute the recipient to B
# to recover a 300.00 gap against A's declared 1,300.00 source principal. C's
# unchanged 500.00 is the zero-gap twin. All values are synthetic fixture inputs.

[[expectation]]
id = "twins_gap-N-01"
type = "N"
book_variant = "native"
statement_template = "N.exact_gap"
basis = ["G-A", "G-C", "G-T"]
kind = "exact_gap"
target = "G-A"
procedure = "ponzi.net_investment"
version = 5
mechanism = "crates/fa-lantern/src/cutoff/investor_transfers.rs:40"
twin_kind = "mutation"
twin_expect = "gap_zero"
gap_amount = "300.00"
gap_unit = "USD"
twin_target = "G-C"

[[target]]
expectation = "twins_gap-N-01"
fact = "G-A"
statistic_name = "net_equity_claim"
statistic_value = "130000"
statistic_scale = 2

[[target]]
expectation = "twins_gap-N-01"
fact = "G-C"
statistic_name = "net_equity_claim"
statistic_value = "50000"
statistic_scale = 2

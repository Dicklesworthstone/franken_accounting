# Evidence sweep fixture native book: one quarter, one entry (S-1, 100.00) posted while the quarter
# is Open. The P table branches what S-1 cites: nothing, an unreviewed placeholder, the reviewed
# placeholder, or a preparer's ManualAssertion (InternalTransfer). Synthetic; amounts are fixture
# values.

[book]
variant = "native"
opening_date = "2026-01-01"
calendar = "custom"
base_unit = "USD"
posture = "embedded-owner"

[[period]]
code = "2026Q1"
start = "2026-01-01"
end = "2026-03-31"
fiscal_year = 2026
kind = "Normal"

[[principal]]
label = "selftest-preparer-1"
profile = "Human"
grants = ["read", "post"]

[[principal]]
label = "case-closer-1"
profile = "Human"
grants = ["read", "close"]

[[principal]]
label = "case-approver-1"
profile = "Human"
grants = ["read", "approve"]

[[principal]]
label = "case-second-reader"
profile = "Human"
grants = ["read", "approve"]

[[principal]]
label = "examiner-1"
profile = "Human"
grants = ["read", "produce"]

[[account]]
code = "1000"
name_fact = "S-1"
type = "Asset"
role = ""
opened = "2026-01-01"
role_map_rule = "role_map"

[[account]]
code = "6000"
name_fact = "S-1"
type = "Expense"
role = ""
opened = "2026-01-01"
role_map_rule = "role_map"

[[document]]
id = "DOC-PH-S-1"
stub_of = "placeholder:S-1"
grade = "AgentUpload"
reviewed_by = "case-second-reader"

[[intent]]
id = "S-1"
fact = "S-1"
class = "Original"
principal = "selftest-preparer-1"
effective_date = "2026-02-10"
memo = "supplies (evidence sweep fixture)"
evidence = "DOC-PH-S-1"
idempotency_key = "sweep-evidence-S-1"

[[leg]]
intent = "S-1"
ordinal = 0
account = "6000"
side = "Dr"
amount_literal = "100.00"
amount_rule = "synthetic"
unit = "USD"

[[leg]]
intent = "S-1"
ordinal = 1
account = "1000"
side = "Cr"
amount_literal = "100.00"
amount_rule = "synthetic"
unit = "USD"

[[branch_class]]
id = "bc-evidence"
attribute = "evidence_attached"
rule = "evidence_minimum"
values = ["none", "placeholder_unreviewed", "placeholder_reviewed", "manual_assertion(InternalTransfer)"]

[[step]]
seq = 1
kind = "period_open"
ref = "2026Q1"
principal = "case-closer-1"

[[step]]
seq = 2
kind = "intent"
ref = "S-1"

[[step]]
seq = 3
kind = "period_close"
ref = "2026Q1"
principal = "case-closer-1"

[[step]]
seq = 4
kind = "period_lock"
ref = "2026Q1"
principal = "case-closer-1"
approvers = ["case-approver-1"]

[[default]]
attribute = "evidence_attached"
rule = "placeholder_reviewed"
rationale = "the fixture's document is a placeholder reviewed by case-second-reader (plan §2.6)"

# Migration run fixture book: FY2001's two quarters precede the opening date, so they are born
# Historical and Locked. One legacy entry MR-1 (Dr 1530 / Cr 2110 544,000,000.00), entered and
# approved in the legacy system by legacy-director-1, is staged into a sole-source FullDetail run
# with two approvals and finalized with two more; jet.self_approved then reads it. The declared
# legacy trial balance is derived from the book's own Migration intents (legacy_tb_from_chunks), so
# its tie-out supports no claim. Synthetic; amounts are fixture values.

[book]
variant = "migration"
opening_date = "2002-01-01"
calendar = "custom"
base_unit = "USD"
posture = "embedded-owner"

[[period]]
code = "2001Q3"
start = "2001-07-01"
end = "2001-09-30"
fiscal_year = 2001
kind = "Historical"

[[period]]
code = "2001Q4"
start = "2001-10-01"
end = "2001-12-31"
fiscal_year = 2001
kind = "Historical"

[[period]]
code = "2002Q1"
start = "2002-01-01"
end = "2002-03-31"
fiscal_year = 2002
kind = "Normal"

[[principal]]

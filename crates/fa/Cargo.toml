fa-notary = { path = "../fa-notary", version = "=0.0.1" }
fa-policy = { path = "../fa-policy", version = "=0.0.1" }
fa-registers = { path = "../fa-registers", version = "=0.0.1" }
fa-registry = { path = "../fa-registry", version = "=0.0.1" }
fa-time = { path = "../fa-time", version = "=0.0.1" }
asupersync = { workspace = true }
fgdb = { workspace = true }
fgdb-gql = { workspace = true }
fgdb-crypto = { workspace = true }
fgdb-types = { workspace = true }

[dev-dependencies]
fgdb-sim = { workspace = true }

[[example]]
name = "open_book"

[package]
name = "fa-gen"
version = "0.0.1"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Seeded, deterministic synthetic-book and labeled forensic scenario generator (plan §11.10, §15.8, §18.1; bead fa-8mae). Test and verification layer only — never linked into production postures."
publish = false

[lints]
workspace = true

[[bin]]
name = "fa-gen"
path = "src/main.rs"

[dependencies]
fa-money = { path = "../fa-money", version = "=0.0.1" }
fa-time = { path = "../fa-time", version = "=0.0.1" }
fa-registry = { path = "../fa-registry", version = "=0.0.1" }
fa-model = { path = "../fa-model", version = "=0.0.1" }
fgdb-crypto = { workspace = true }
fgdb-types = { workspace = true }

[dev-dependencies]
asupersync = { workspace = true }
fa = { path = "../fa", version = "=0.0.1" }
fa-journal = { path = "../fa-journal", version = "=0.0.1" }
fa-lantern = { path = "../fa-lantern", version = "=0.0.1" }
fgdb = { workspace = true }

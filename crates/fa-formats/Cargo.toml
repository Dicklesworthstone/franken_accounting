[package]
name = "fa-formats"
version = "0.0.1"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Interop formats (plan §9.5, §16.3, §18.1): Beancount v3 and hledger journal writers/readers checked by self round-trip (the external differential with bean-check and hledger is fa-sa4w), a TigerBeetle-semantics simulator corpus, ADS- and SAF-T-shaped writers/readers with export-import identity and coordinate certificates, XBRL instance export with summation checks, CSV/NDJSON GL extracts, and bank statement parsers. Bead fa-npi."
publish = false

[lints]
workspace = true

[dependencies]
fa-money = { path = "../fa-money", version = "=0.0.1" }
fa-time = { path = "../fa-time", version = "=0.0.1" }
fa-registry = { path = "../fa-registry", version = "=0.0.1" }
fa-model = { path = "../fa-model", version = "=0.0.1" }
fa-journal = { path = "../fa-journal", version = "=0.0.1" }
fa-registers = { path = "../fa-registers", version = "=0.0.1" }
asupersync = { workspace = true }
fgdb-types = { workspace = true }
fgdb-crypto = { workspace = true }

[dev-dependencies]
fa-reference = { path = "../fa-reference", version = "=0.0.1" }
fgdb = { workspace = true }

[package]
name = "fa-cli"
version = "0.0.1"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "The `fa` command line (plan §15.3, Appendix D): robot mode with the event-discriminated envelope, the exit-code dictionary 0/2/3/4/5/6/7/8 (never 1), refusal objects that name the law and the fix, Levenshtein-1 verb and flag correction, no TUI. Bead fa-9xt."
publish = false

[lints]
workspace = true

[lib]
name = "fa_cli"
path = "src/lib.rs"

[[bin]]
name = "fa"
path = "src/main.rs"

[dependencies]
asupersync = { workspace = true }
fa = { path = "../fa", version = "=0.0.1" }
fa-demo = { path = "../fa-demo", version = "=0.0.1" }
fa-formats = { path = "../fa-formats", version = "=0.0.1" }
fa-journal = { path = "../fa-journal", version = "=0.0.1" }
fa-lantern = { path = "../fa-lantern", version = "=0.0.1" }
fa-model = { path = "../fa-model", version = "=0.0.1" }
fa-policy = { path = "../fa-policy", version = "=0.0.1" }
fa-money = { path = "../fa-money", version = "=0.0.1" }
fa-registry = { path = "../fa-registry", version = "=0.0.1" }
fa-registers = { path = "../fa-registers", version = "=0.0.1" }
fa-time = { path = "../fa-time", version = "=0.0.1" }
fa-verbs = { path = "../fa-verbs", version = "=0.0.1" }
fgdb-types = { workspace = true }

[dev-dependencies]
# The CLI corruption regression plants a false state in a real persisted book.
asupersync = { workspace = true }
fgdb = { workspace = true }
fa-notary = { path = "../fa-notary", version = "=0.0.1" }
fa-verify = { path = "../fa-verify", version = "=0.0.1" }

[package]
name = "fa-registers"
version = "0.0.1"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Registers as projections (plan §5.3, FA-INV-04): a deterministic fold over the entry payloads of a period with a watermark and a fold digest, materialized Register vertices, verify-by-refold that reports drift, the stock/flow balance rule, and the trial balance. Never more authoritative than the journal. Bead fa-1kd."
publish = false

[lints]
workspace = true

[dependencies]
fa-money = { path = "../fa-money", version = "=0.0.1" }
fa-time = { path = "../fa-time", version = "=0.0.1" }
fa-model = { path = "../fa-model", version = "=0.0.1" }
fa-journal = { path = "../fa-journal", version = "=0.0.1" }
asupersync = { workspace = true }
fgdb = { workspace = true }
fgdb-types = { workspace = true }
fgdb-crypto = { workspace = true }
fgdb-delta-types = { workspace = true }

[dev-dependencies]
fa-reference = { path = "../fa-reference", version = "=0.0.1" }
fa-registry = { path = "../fa-registry", version = "=0.0.1" }

[package]
name = "fad"
version = "0.0.1"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "The FrankenAccounting daemon: one leased book writer, canonical framed CLI requests, and explicitly bootstrapped clock evidence with bounded expiry/reversal effect batches under its owned runtime region."
publish = false

[lints]
workspace = true

[lib]
name = "fad"
path = "src/lib.rs"

[[bin]]
name = "fad"
path = "src/main.rs"

[dependencies]
asupersync = { workspace = true }
fa = { path = "../fa", version = "=0.0.1" }
fa-cli = { path = "../fa-cli", version = "=0.0.1" }
fa-journal = { path = "../fa-journal", version = "=0.0.1" }
fa-model = { path = "../fa-model", version = "=0.0.1" }
fa-time = { path = "../fa-time", version = "=0.0.1" }
fgdb-types = { workspace = true }

[dev-dependencies]
fgdb = { workspace = true }
fa-money = { path = "../fa-money", version = "=0.0.1" }

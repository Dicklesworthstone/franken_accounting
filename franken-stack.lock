# franken-stack.lock — source provenance of every foundation this workspace links
# (plan §18.4; the eidetic_engine_cli / frankengit convention). Cargo.lock holds
# the resolution; this file holds the *why*: which upstream commit each pin is,
# when it was taken, and what re-verification a bump owes.
#
# A bump of one is a bump of all (asupersync is pinned transitively through
# frankengraphdb, and franken_networkx through fgdb-prism). Bumping re-runs the
# substrate behavior suite (plan §16.3) before the new lock lands.

schema_version = 1
taken_on = "2026-10-10"

[[foundation]]
name = "asupersync"
source = "git+https://github.com/Dicklesworthstone/asupersync"
rev = "78b64636e99fea4ea2d868096576021dd3b8e519"
version = "0.5.0"
features = "default-features = false"
role = "runtime: Cx, regions, lab runtime, RaptorQ, macaroons"
pinned_by = "frankengraphdb crates/fgdb/Cargo.toml (same rev)"

[[foundation]]
name = "frankengraphdb"
source = "git+https://github.com/Dicklesworthstone/frankengraphdb"
rev = "b323bd17ceaf81e97ce89e43d8d9f6d5151695cf"
version = "0.0.1 (unpublished, publish = false)"
crates = ["fgdb", "fgdb-types", "fgdb-delta-types", "fgdb-gql", "fgdb-crypto", "fgdb-bigint", "fgdb-sim"]
role = "substrate: Chronicle commit stream, bounded WriteTxn with point-read witnesses, native GQL, certified reads"
status_checked = "2026-10-09 (plan Appendix H rows)"

[[foundation]]
name = "franken_networkx"
source = "git+https://github.com/Dicklesworthstone/franken_networkx"
rev = "9d710b1c33e99412c94de7fa4de2f7ce4954110f"
version = "0.2.0 at that rev"
crates = ["fnx-classes", "fnx-algorithms"]
role = "graph algorithms linked transitively through fgdb -> fgdb-prism; direct forensic use in Lantern is planned"
pinned_by = "frankengraphdb crates/fgdb-prism/Cargo.toml (same rev)"

[[foundation]]
name = "fastmcp-rust"
source = "registry+https://github.com/rust-lang/crates.io-index"
version = "=0.12.0"
checksum = "f87848d809e71ed158b932460660079f91fb2a358a4204c77f5d8b10307cba2f"
crates = ["fastmcp-rust", "fastmcp-core", "fastmcp-protocol", "fastmcp-transport", "fastmcp-server", "fastmcp-client", "fastmcp-derive", "fastmcp-console"]
role = "MCP framework; linked by fa-mcp (fa-xex) only, together with [patch.crates-io] asupersync to the rev above so the graph holds one asupersync package id"
transitive_confined = ["serde", "serde_json", "chrono (fastmcp-server)", "time (fastmcp-console -> rich_rust; asupersync tls -> x509-parser, asn1-rs)", "ring (fastmcp-protocol jose; rustls)", "cap-std, cap-fs-ext (fastmcp-server)", "num-rational, num-bigint (rich_rust; der-parser)"]
verification = "fa-mcp parity test (every verb a tool or a registered exclusion), the stdio end-to-end test against the CLI's data, cargo deny bans/licenses with the wrapper rows; rerun all on pin changes"

[[foundation]]
name = "frankensympy"
source = "git+https://github.com/Dicklesworthstone/frankensympy"
rev = "bd1ad68a3a06e0a0ed6ee4a9bc76d85dc9e67e2e"
version = "0.1.0 (unpublished)"
crates = ["fsym-bigint", "fsym-rational", "fsym-budget"]
transitive_suite_crates = ["fsym-modular"]
transitive_arithmetic = ["num-bigint 0.4.8", "num-integer 0.1.47", "num-rational 0.4.2", "num-traits", "serde"]
role = "fa-money arbitrary-size nonnegative Rate, exact conversion intermediates, cancellation-first work metering; no CAS runtime"
verification = "independent fgdb-bigint rounding differential, canonical rate bytes, resource and cancellation refusals; rerun all on pin changes"

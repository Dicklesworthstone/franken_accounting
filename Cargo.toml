# FrankenAccounting workspace root.
#
# Constitutional context (AGENTS.md doctrine, plan §18):
#   - `fa-*` crates appear only with their first real slice of a final
#     abstraction. No empty prototype crates.
#   - Workspace-level `unsafe_code = "forbid"`. There are no unsafe islands in
#     this repository and there will be none; a raw-pointer need is routed
#     upstream to the substrate's ledgered boundary crates.
#   - Reuse the owner's projects at exact revisions, recording their actual
#     dependency paths. Unrelated third-party direct dependencies stay closed.

[workspace]
resolver = "3"
members = [
    "crates/fa",
    "crates/fa-money",
    "crates/fa-time",
    "crates/fa-registry",
    "crates/fa-model",
    "crates/fa-journal",
    "crates/fa-lantern",
    "crates/fa-registers",
    "crates/fa-statements",
    "crates/fa-reference",
    "crates/fa-cli",
    "crates/fa-verify",
    "crates/fa-notary",
    "crates/fa-policy",
    "crates/fa-intents",
    "crates/fad",
    "crates/fa-mcp",
]

[workspace.package]
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/Dicklesworthstone/franken_accounting"

[workspace.lints.rust]
unsafe_code = "forbid"
# Every public type a caller can receive, it can also name and document.
unnameable_types = "deny"

[workspace.dependencies]
# asupersync at exactly the revision frankengraphdb pins (plan §18.4). With
# default features off the embedded posture pulls no TLS/network stack.
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "78b64636e99fea4ea2d868096576021dd3b8e519", version = "=0.5.0", default-features = false }

# The substrate (unpublished; git rev recorded in franken-stack.lock). Bumping
# this rev is a deliberate, single-commit event that re-runs the substrate
# behavior suite (plan §16.3).
fgdb = { git = "https://github.com/Dicklesworthstone/frankengraphdb", rev = "b323bd17ceaf81e97ce89e43d8d9f6d5151695cf", version = "=0.0.1" }
fgdb-types = { git = "https://github.com/Dicklesworthstone/frankengraphdb", rev = "b323bd17ceaf81e97ce89e43d8d9f6d5151695cf", version = "=0.0.1" }
fgdb-delta-types = { git = "https://github.com/Dicklesworthstone/frankengraphdb", rev = "b323bd17ceaf81e97ce89e43d8d9f6d5151695cf", version = "=0.0.1" }
fgdb-gql = { git = "https://github.com/Dicklesworthstone/frankengraphdb", rev = "b323bd17ceaf81e97ce89e43d8d9f6d5151695cf", version = "=0.0.1" }
fgdb-crypto = { git = "https://github.com/Dicklesworthstone/frankengraphdb", rev = "b323bd17ceaf81e97ce89e43d8d9f6d5151695cf", version = "=0.0.1" }
fgdb-bigint = { git = "https://github.com/Dicklesworthstone/frankengraphdb", rev = "b323bd17ceaf81e97ce89e43d8d9f6d5151695cf", version = "=0.0.1" }
# The substrate's lab VFS (fault injection, crash simulation), at the same
# rev: a dev-only edge of fa-journal's tests, never in a shipped closure
# (fa-txf B, CobaltGull 3452/3462; fa-0fl reuses it).
fgdb-sim = { git = "https://github.com/Dicklesworthstone/frankengraphdb", rev = "b323bd17ceaf81e97ce89e43d8d9f6d5151695cf", version = "=0.0.1" }

# The MCP framework (plan §2.4, §18.4): crates.io, exact version, consumed by
# the fa-mcp posture only. Its registry pin of asupersync `=0.5.0` resolves
# to the git revision above through [patch.crates-io] below, so fastmcp and
# the substrate link one `Cx` (§0.4 decision 9); `cargo metadata` shows one
# asupersync package id.
fastmcp-rust = { version = "=0.12.0" }

# Exact rate coefficients and cooperatively metered arithmetic (fa-pri).
fsym-bigint = { git = "https://github.com/Dicklesworthstone/frankensympy", rev = "bd1ad68a3a06e0a0ed6ee4a9bc76d85dc9e67e2e", version = "=0.1.0" }
fsym-rational = { git = "https://github.com/Dicklesworthstone/frankensympy", rev = "bd1ad68a3a06e0a0ed6ee4a9bc76d85dc9e67e2e", version = "=0.1.0" }
fsym-budget = { git = "https://github.com/Dicklesworthstone/frankensympy", rev = "bd1ad68a3a06e0a0ed6ee4a9bc76d85dc9e67e2e", version = "=0.1.0" }

# Disk-frugal profiles (the substrate's precedent: full DWARF on its test
# build filled a 300G worker). Backtraces keep file:line.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# fastmcp-rust pins `asupersync = "=0.5.0"` from the registry; the substrate
# pins the git revision. Without this patch two `asupersync` crates — two `Cx`
# types — would link (plan §2.4, §18.4). The git revision is 0.5.0.
[patch.crates-io]
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "78b64636e99fea4ea2d868096576021dd3b8e519" }

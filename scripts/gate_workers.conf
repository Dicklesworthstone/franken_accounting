# =============================================================================
# scripts/gate_workers.conf — Canonical warm gate worktree & designated workers
# (beads fa-aj8, fa-qu8v)
#
# WHY: rch target pools are keyed by (worker, project_path). Creating a new
# worktree path per landing forces a cold compile (60-70 min vs ~6 min warm).
# By checking every gate candidate into one permanent worktree path and pinning
# two designated gate workers, the remote cargo target cache stays warm across
# all landings.
#
# Worker Selection Rationale:
# - Primary:  hz2        (ubuntu@178.104.77.29) — highest speed score (52.5),
#                        clippy component installed, large NVMe free disk ratio
#                        and 64 GiB+ RAM headroom.
# - Fallback: vmi1152480 (root@109.205.181.92)  — second highest speed score
#                        (51.2), clippy component installed, independent host
#                        for failover when hz2 is busy or unreachable.
# =============================================================================

FA_GATE_WORKTREE="${FA_GATE_WORKTREE:-/data/projects/franken_accounting-gate}"
FA_WATCH_WORKTREE="${FA_WATCH_WORKTREE:-/data/projects/franken_accounting-watch}"
FA_GATE_PRIMARY_WORKER="${FA_GATE_PRIMARY_WORKER:-hz2}"
FA_GATE_FALLBACK_WORKER="${FA_GATE_FALLBACK_WORKER:-vmi1152480}"
FA_GATE_WORKERS="${FA_GATE_WORKERS:-hz2,vmi1152480}"

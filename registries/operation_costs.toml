notes = "One native publication includes the successful common-key claim. Reversal, resolution and replacement identities retain their target-derived Entry VIds while reserving the same (book, principal, key) namespace as ordinary posts and batches. PeriodControl transitions, TimeControl ticks, normal-key security/retention policy activations, account lifecycle controls, dimension value creation and native subledger registration also reserve this namespace; other dedicated writers, including target-derived capability issuance/revocation, and Migration run keys remain outside it. Durable refusals remain unimplemented. Automatic scheduled reversals require one capacity prefix scan per candidate, including when composed into period Open; a sweep blocks refused candidates before staging, while Open refuses atomically. This is a conservative interim cost, not a measured SLO. A limited account's LimitCell (the registered §5.5 exception) is compare-and-set when the entry moves that account; no other shared cell is registered. A settling leg also moves each target leg's `applied` mirror by compare-and-set (plan §5.7), for which Appendix G registers no exception (recorded on fa-vz7e for an owner ruling)."


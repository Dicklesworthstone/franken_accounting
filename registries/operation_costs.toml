[[operation_class]]
id = "bank_statement_import"
name = "Bank statement import with source-linked line documents"
substrate_class = "Bounded import preparation and one atomic ImportControl transaction"
substrate_transactions = "1 for a new statement; 0 for an exact retry"
today_posture = "Original source, versioned account-bound manifest, line documents and custody publish together"
today_transactions = 1
barrier_count = 2
today_barrier_count = 2
derived_objects = "1 BankImportManifest workpaper + N canonical BankLine documents and their custody, beside the original BankStatement and ImportRun receipt; (2N+1) immutable DERIVED_FROM edges: each line to its statement, and the manifest to the statement and all lines"
hot_object_exceptions = []
external_authorities = "none; bank files are caller-supplied evidence, never a synchronous network call"
complexity_witness = "O(input bytes + lines) parse, canonical projection and bounded document admission; one witnessed account read; at most 1022 lines and 16 MiB of original input; bounded source-list/DAG validation and source-edge projection in the same import transaction; held-child lineage is checked at the original transaction basis"
notes = "No monetary entries or match decisions. Re-reading reparses retained source and verifies complete projected bytes. Source custody uses the actual intake profile; derived evidence is conservatively self-sourced. DERIVED_FROM adds no publication or shared mutable object. The two-line all-fresh inline fixture writes 9 vertices and 13 edges in one publication; exact retries write nothing. External blobs are durable before graph publication; the two-barrier floor describes the inline fixture. Existing derived documents retain their original lineage. Explicit predecessor links also stage one immutable BankStatementLink keyed by book/account/current statement OID with exactly four DERIVED_FROM edges to the current/prior ImportRuns and current/prior manifest Documents in the same publication. The two-line all-fresh linked fixture writes 10 vertices and 17 edges in one publication; unlinked remains 9 vertices and 13 edges. Its absent/equal point witness prevents conflicting linked imports without a shared mutable hot object. Linked retries return the original receipt. Continuity replay costs O(total retained source bytes + lines + predecessor links), bounded by 4096 links; the 16 MiB input bound applies to each source. Every predecessor receipt and source document remains witnessed from validation through publication."

[[operation_class]]
id = "bank_match_confirmation"
name = "Immutable exact bank-line to cash-leg confirmation"
substrate_class = "Current admission, native source verification and one witnessed confirmation transaction"
substrate_transactions = "1 for a new exact confirmation; 0 for an identical retry or historical read"
today_posture = "One immutable source-line confirmation and one unique actual cash-leg claim publish atomically; no monetary Entry or reconciliation register is written"
today_transactions = 1
barrier_count = 2
today_barrier_count = 2
derived_objects = "2 immutable vertices (BankMatch and BankMatchedLeg), 1 MATCHES edge, 6 CITES edges and 2 IN_BOOK edges; later claim generations also cite up to 2 distinct prior BankUnmatch releases; source documents, cash Entry and cash Leg remain unchanged"
hot_object_exceptions = []
external_authorities = "none; retained governed evidence is reauthorized locally under current Human Read, Reconcile and Privileged authority"
complexity_witness = "Fresh confirmation replays native Entry history through the selected source prefix and scans the complete H-row claim prefix. Each of M retained confirmations and releases verifies immutable births, its complete strong-edge census, exact target bindings and independent resource generations; fresh full-source admission also verifies the cash Entry/leg and migration visibility; repeated native-history lookups may cost O(M*H). Historical Entry sorting precedes O((cash legs + statement lines) log M) occupied-pair filtering and linear bidirectional eligibility checks. Claim/source and release indices require O(M) memory. Current authority, source closure, actual Entry/Leg, migration, reversal absence and exclusive identities remain point-witnessed. Facade additionally replays relevant original manifests, full sources and predecessors; each statement is bounded to 1022 lines and each chain to 4096 links. Exact recorded retries precede the complete claim scan and retain their original native checks."
notes = "No shared mutable hot object. Same-transaction first-committer-wins claims prevent line/leg double use; native identities cannot be reset by deletion or relabelling. Explicit immutable BankUnmatch releases permit new independent line and cash-leg generations. A new confirmation cites its retained releases and preserves candidate ordinals and uniqueness before greedy proposal consumption. Exact retries return the original generation, including after its release, and never reactivate it. Status and metadata history publish nothing. Cold history hydration and original-source blob reads are read costs, not extra publications. Native creation-history validation is a complete-prefix cost, not a constant-time claim. Compact confirmation payloads reference the original manifest; external manifest bytes are supplied and checked against their retained commitment before full-source receipt replay. Counted witness: fa-journal/tests/bank_matches.rs."


notes = "Prior Closing legs participate in the fold so reclose transfers only residual activity. Zero residual publishes nothing. Full-year base-unit and undimensioned/legal-entity-only scope is enforced. Review bytes use the existing PostIntent wire and publish nothing; approval-only commits preserve its source basis. Closing uses ordinary period, evidence, authority, approval, idempotency and balance laws. Atomic batch/draft promotion cannot bypass the required complete source basis. This is the intrinsic closing operation, not the full CloseTask DAG or Locked case-bound reclose."

# =============================================================================
# registries/operation_costs.toml — Appendix G Operation Cost Registry
# (plan §1.12, §17, §18.2, Appendix G; beads fa-tu58, fa-i5s)
# =============================================================================
#
# Laws enforced by `fa-registry` and `tools/registry-check`:
# 1. Derivability: every `slo.toml` gate names its `operation_class` and
#    `counting_unit` and is consistent with the class's `barrier_count` floor
#    (`target_p50_us >= barrier_count * pinned_fsync_p50_us`).
# 2. Same-change update: any change adding a substrate transaction, synchronous
#    external authority, or per-entry derived object updates this registry and
#    the counted lab witness test in the same commit.
# 3. No hot object on the write path: only the two registered exceptions below
#    (`LimitCell` and `UsageCell`) may appear in `hot_object_exceptions`, each
#    scoped to its specific operation class and carrying its retirement rule.

schema_version = 1

# ---- Registered Hot-Object Exceptions (Appendix G Law 3) --------------------

[[hot_object_exception]]
name = "LimitCell"
plan_ref = "§5.5, §0.4 decision 7, Appendix H R-ESC"
allowed_classes = ["release_only_resolution", "expiry_sweep_tick"]
allowed_kernel_ops = ["reserve", "resolve"]
retirement_condition = "Retire when substrate Escrow domains (Appendix H R-ESC) land and replace per-limited-account CAS cells."

[[hot_object_exception]]
name = "UsageCell"
plan_ref = "§14.2, Appendix H R-WARDEN"
allowed_classes = ["ceiling_bearing_post"]
allowed_kernel_ops = ["post"]
retirement_condition = "Retire when substrate compiled capability caveats and escrow ceilings (Appendix H R-WARDEN / R-ESC) land."


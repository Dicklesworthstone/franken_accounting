complexity_witness = "Complete retained-prefix scans discover attestation births and reject later row/edge mutation. Each prior close independently refolds its original cash prefix, bank-decision history, source receipts and complete predecessor closure; nested source/birth verification may revisit history. Status additionally refolds current cash/matches and authenticates late CITES history. Work is proportional to retained history and nested prior-claim/source populations, not constant time or one account-index lookup. New close preparation witnesses the complete vertex population; ordinary posting witnesses affected accounts and attestations so the account ATTESTS anchor detects concurrent new closes without a shared mutable head."
notes = "No changed monetary amount, independent balance store, mutable reconciliation head or extra posting transaction. New closes require the reviewed current prefix at preparation and publication; exact retries preserve the original claim without writing. The full attestation is bounded by max_entry_bytes and predecessor/line lists by existing import bounds; excess scope refuses rather than truncating. Counted native witnesses and historical/mutation negatives live under fa-journal/tests/bank_matches/reconciliation.rs and reconciliation_guard.rs."


decision = "admit"
[[cell]]
class = "Resolution"
state = "Closed"
decision = "with:post_closed"
note = "posts_only_with: Voids/Expires admit (the sweep's intrinsic post_closed)"
[[cell]]
class = "Resolution"
state = "Locked"
decision = "admit"
note = "voids_expires: Posts refused"

# ---- Resolution(Expires): the expiry sweep's release -----------------------
# Plan §5.4 and Appendix C (Resolution row: "Voids/Expires Admit (the sweep's
# intrinsic post_closed)" in Closed, "Voids/Expires Admit; Posts Refuse" in
# Locked): the sweep expires a due hold dated in the hold's own period, so a
# hold never becomes unreleasable because its period closed or locked. The
# kernel's sweep and the oracle decide Expires from these rows alone: a row
# that refuses refuses the sweep, and a missing row fails the registry.
[[cell]]
class = "Resolution"
disposition = "Expires"
state = "Future"
decision = "refuse"
[[cell]]
class = "Resolution"
disposition = "Expires"
state = "Open"
decision = "admit"
[[cell]]
class = "Resolution"
disposition = "Expires"
state = "SoftClosed"
decision = "admit"
[[cell]]
class = "Resolution"
disposition = "Expires"
state = "Closed"
decision = "admit"
note = "the sweep's intrinsic post_closed (plan §5.4)"
[[cell]]
class = "Resolution"
disposition = "Expires"
state = "Locked"
decision = "admit"
note = "a reservation release (plan §7.3: Locked admits Voids/Expires)"


# ---- Period kinds (plan §7.2, Appendix C; ruling 3654) --------------------
# A Historical period precedes the book's opening date and is born Locked:
# it admits only Migration (inside an open MigrationRun, by the Migration
# cells above) and never transitions.
[[kind]]
name = "Historical"
admits = ["Migration"]
refusal = "FA-REF-010"
transition_refusal = "FA-REF-040"

# ---- Pre-opening special periods (plan §7.2; ruling 3685) -----------------
# An Opening, Adjustment or Closing period ending on or before the book's
# opening date is born Locked, keeps its kind, admits only Migration and
# never transitions: legacy closing entries land where the legacy books put
# them, never re-dated.
[[pre_opening]]
kinds = ["Opening", "Adjustment", "Closing"]
born = "Locked"
admits = ["Migration"]
refusal = "FA-REF-010"
transition_refusal = "FA-REF-040"
cite = "plan §7.2 (periods before the book's opening date)"

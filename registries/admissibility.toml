# admissibility.toml — the entry-class × period-state matrix (plan Appendix C).
# One row per (class, state). Decision is one of:
#   "admit"                      any principal holding `post`
#   "with:<op>[,<approvals>]"    the named capability op and approval count
#   "refuse"                     never
# Qualifiers ("case" = inside an approved RestatementCase; "run" = inside an
# open MigrationRun; "voids_expires" = only Voids/Expires dispositions;
# "posts_only_with" = Posts needs the op, Voids/Expires admit) are recorded in
# `note` and enforced by the kernel's class-specific checks. A Resolution
# row may name `disposition = "Expires"`: the expiry sweep's release is
# decided by those rows (one per state), not by the class cell.
#
# A `[[kind]]` row narrows the matrix by the period's kind before its state
# decides (plan §7.2, Appendix C "Period kinds"): it names the classes the
# kind admits (`admits`) — every other class is refused with `refusal`,
# whatever the period's state — and the code every transition of such a
# period is refused with (`transition_refusal`). A kind without a row
# (Normal, Adjustment, Opening, Closing) is decided by the cells alone.
#
# Consumer: fa-journal laws step and period transitions, fa-reference; the
# exhaustive generated test in fa-registry (every posting class × every
# state decided exactly once; every posting class × every kind row decided).
# A `[[pre_opening]]` table (exactly one) governs the special periods that
# end on or before the book's opening date: born in `born`, kind kept,
# admitting only `admits` (others refused with `refusal`), never
# transitioning (`transition_refusal`); legacy closing entries land there.
# Gate: an undecided cell fails CI; the Historical kind must have a row; the
# pre_opening table must exist exactly once.
# Control classes are not period-scoped.

schema_version = 1

# ---- Original -------------------------------------------------------------
[[cell]]
class = "Original"
state = "Future"
decision = "refuse"
[[cell]]
class = "Original"
state = "Open"
decision = "admit"
[[cell]]
class = "Original"
state = "SoftClosed"
decision = "with:post_softclosed"
[[cell]]
class = "Original"
state = "Closed"
decision = "refuse"
[[cell]]
class = "Original"
state = "Locked"
decision = "refuse"


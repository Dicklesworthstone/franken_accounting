why = "recompute every checkpoint from the journal"

[[next_action]]
after = "demo_initialized"
command = "fa tb --period <code> --json"
why = "inspect the initialized demo book's trial balance"

[[next_action]]
after = "demo_initialized"
command = "fa verify registers --period <code> --json"
why = "verify that every materialized register cell equals the journal's refold"

# ---------------------------------------------------------------------------
# Events: every `event` a --json line can carry, with exactly its fields.
# ---------------------------------------------------------------------------

[[event]]
name = "document"
book = true
doc = "A document the book holds. `oid` locates it; `doc_commit` = BLAKE3(\"fa:doc:v1\" ‖ kind ‖ length ‖ 4 KiB-chunk Merkle root) is its public commitment; `evidence` is the citation for an intent's `evidence` list (or pass --evidence <oid>). On a repeat intake `already_recorded` is true and kind/grade are the book's. `self_sourced` (AgentUpload) will need a reviewer's attestation before promotion; not yet enforced."
fields = ["oid:hex", "doc_commit:hex", "kind:string", "grade:string", "self_sourced:bool", "size:int", "recorded_at:seq", "already_recorded:bool", "evidence:evidence_ref"]

[[event]]
name = "findings_recorded"
book = true
doc = "The complete immutable finding set from one retained procedure certificate, atomically published with stable run and finding identities. retry_command names the exact idempotent certificate retry; repeating a fresh HEAD run may select a different source prefix."
fields = ["certificate:hex", "run_vid:hex", "recorded_at:seq", "producer:hex", "procedure:string", "version:int", "source_known_at:seq", "effective_through:date?", "claim:string", "finding_count:int", "findings_digest:hex", "finding_ids:[hex]", "already_recorded:bool", "retry_command:string"]

[[event]]
name = "finding_runs"
book = true
doc = "A bounded page of recorded forensic runs in ascending publication order at one known_at inventory. scope is recorded-runs: the full inventory is structurally checked, while only returned summaries undergo full native certificate and computation replay. checked_through is the current validation frontier. A null next_cursor ends this recorded inventory; it establishes neither current review status nor complete detector coverage."
fields = ["scope:string", "known_at:seq", "checked_through:seq", "inventory_digest:hex", "total_recorded_runs:int", "page_count:int", "runs:[recorded_finding_run]", "next_cursor:string?"]

[[event]]
name = "finding_list"
book = true
doc = "Every recorded observation in the explicitly selected certified run, with its independently verified review history through known_at. checked_through records the current native frontier used to verify the complete chain; source_known_at remains the original observation coordinate. scope is certified-run, never a global inventory."
fields = ["certificate:hex", "run_vid:hex", "procedure:string", "version:int", "claim:string", "known_at:seq", "checked_through:seq", "source_known_at:seq", "scope:string", "finding_count:int", "findings:[recorded_finding]"]

[[event]]
name = "finding_shown"
book = true
doc = "One immutable finding and its complete selected human decision history, after verifying the original source run and the current native chain."
fields = ["certificate:hex", "known_at:seq", "checked_through:seq", "row:recorded_finding"]

[[event]]
name = "finding_reviewed"
book = true
doc = "An append-only independent Human acknowledgment, evidence-backed dismissal, or reopening. The original finding is unchanged. An exact retry returns the existing review; a stale predecessor refuses."
fields = ["review:finding_review", "already_recorded:bool"]

[[event]]
name = "finding_exported"
book = true
doc = "A deterministic numbered original workpaper, optionally accompanied by a separate fixed-cutoff review appendix. content is the complete Markdown/JSONL presentation; bytes_hex is the complete canonical replay package. With out, the new file contains all bytes and both inline content fields are null. Later review decisions never rewrite the original workpaper."
fields = ["certificate:hex", "workpaper:string", "workpaper_digest:hex", "recorded_at:seq", "source_known_at:seq", "review_known_at:seq?", "format:string", "includes_reviews:bool", "bytes:int", "content_digest:hex", "content:string?", "bytes_hex:hex?", "out:string?"]

[[event]]
name = "finding_replayed"
book = true
doc = "A complete canonical workpaper replayed against retained native observations and, when present, the selected review history. scope is recipient-bound only when an independently supplied certificate and exact review cutoff were verified; otherwise it is as-supplied. A valid public checksum alone cannot establish an observation or decision."
fields = ["certificate:hex", "workpaper:string", "workpaper_digest:hex", "recorded_at:seq", "source_known_at:seq", "review_known_at:seq?", "includes_reviews:bool", "finding_count:int", "checked_through:seq", "scope:string"]

[[event]]
name = "fx_rate_added"
book = true
doc = "One canonical typed Rate document retained through authenticated upload. The exact rational is functional-currency units per foreign-currency unit. Its source and retrieved_at_ns are uploader assertions, with no implied provider or clock authentication. Exact retries preserve the original grade, commitment and receipt."
fields = ["oid:hex", "doc_commit:hex", "kind:string", "grade:string", "size:int", "recorded_at:seq", "already_recorded:bool", "base_unit:string", "quote_unit:string", "rate_num:string", "rate_den:string", "rounding:string", "as_of:date", "retrieved_at_ns:int", "purpose:string"]

[[event]]
name = "fx_routes_recorded"
book = true
doc = "A complete additive FX route map retained as a native SchemaChange. Established source, dedicated valuation and unrealized destinations cannot be reassigned. Exact semantic retries retain the original control and publish nothing."
fields = ["effective_from:date", "routes:int", "control_entry:hex", "recorded_at:seq", "digest:hex", "already_recorded:bool"]

[[event]]
name = "fx_routes"
book = true
doc = "Applicable FX routing at one effective date and retained prefix under current whole-book authority. Account names and route identities come from the same selected prefix. found=false has null optional headers and empty routes."
fields = ["as_of:date", "known_at:seq", "found:bool", "effective_from:date?", "control_entry:hex?", "recorded_at:seq?", "digest:hex?", "routes:[fx_revaluation_route]"]

[[shape]]
name = "scheduled_reversal"
doc = "A scheduled reversal an open would mint: its ReversalSchedule, the Adjusting entry it reverses, and the reverse_on date."
fields = ["schedule:hex", "target:hex", "reverse_on:date"]

[[shape]]
name = "fx_revaluation_route"
doc = "One foreign Asset/Liability source and its exclusively assigned same-type functional-currency valuation leaf and Revenue/Expense unrealized destination."
fields = ["account:string", "account_vid:hex", "valuation_account:string", "valuation_vid:hex", "unrealized_account:string", "unrealized_vid:hex"]

[[event]]
name = "fx_revaluation_reviewed"
book = true
doc = "An unexecuted source-bound PeriodEndRevaluation PostIntent. Signed net amounts are debit less credit; target minus current carrying gives delta. Carrying includes original committed base valuations plus verified prior adjustments through closing_date. Rate, routing and complete exposure witnesses are reproduced by native admission. Review bytes preserve sealed fields across independent approval commits; review_digest authenticates these bytes and proposal_digest is the approval subject. This is neither a PostPlan nor posting permission."
fields = ["period:string", "closing_date:date", "known_at:seq", "account:string", "account_vid:hex", "entity:hex?", "rate_document:hex", "routes_entry:hex", "routes_digest:hex", "source_digest:hex", "source_native_net:amount", "source_base_net:amount", "prior_adjustment_net:amount", "current_carrying_net:amount", "target_base_net:amount", "delta:amount", "legs:[plan_leg]", "review_digest:hex", "proposal_digest:hex", "bytes:hex", "file:string?", "scope:string"]

[[event]]
name = "fx_revaluation_noop"
book = true
doc = "The source's committed functional carrying value already equals its retained closing-rate target. No monetary entry, review, plan, approval or metadata was published. Signed amounts remain debit less credit, including liabilities."
fields = ["period:string", "closing_date:date", "known_at:seq", "account:string", "account_vid:hex", "entity:hex?", "source_native_net:amount", "current_carrying_net:amount", "target_base_net:amount", "reason:string"]

[[event]]
name = "bank_imported"
book = true
doc = "A bank statement retained with its complete canonical line documents and a parser/account manifest, under one native import receipt. Repeating the same source, parser, account and declared layout returns the existing receipt without publication. Optional layout_name and layout_digest identify the canonical declaration; they are null for the fixed parser. continuity is unlinked or verified_predecessor; verified_predecessors counts replayed links ending at an unlinked root. predecessor binds the immediately preceding retained receipt and statement. This is not match confirmation."
fields = ["manifest_oid:hex","statement_oid:hex","statement_commit:hex","bank_format:string","parser_revision:int","layout_name:string?","layout_digest:hex?","account:string","account_ref:hex","unit:string","sequence_number:int","statement_date:date","opening_balance:amount","closing_balance:amount","line_count:int","line_oids:[hex]","receipt_hash:hex","recorded_at:seq","already_recorded:bool","continuity:string","verified_predecessors:int","predecessor:bank_import_predecessor?"]

[[event]]
name = "bank_matches_proposed"
book = true
doc = "Bank-line proposals and retained active confirmations after complete relevant source-closure verification at one known-at prefix. confirmed_count counts this manifest interpretation; occupied_count counts lines claimed under another interpretation; remaining_count counts every source line not confirmed under this manifest, including occupied lines. progress retains exact gross inflow and outflow in each category; remaining equals occupied plus proposed plus unmatched separately by direction. Native active claims exclude occupied resources before eligibility, without changing candidate ordinals. Outstanding rows and amounts cover remaining available cash-leg candidates inside the inclusive window, not a complete reconciliation inventory. Empty statements have null window bounds. Confirmation completeness and closing-balance equality are independent observations, neither an attestation nor a reconciled-through posting lock. This read publishes no confirmation or monetary entry. continuity and predecessor describe structural source links only."
fields = ["manifest_oid:hex","statement_oid:hex","account:string","account_ref:hex","unit:string","known_at:seq","statement_date:date","date_window:int","candidate_from:string?","candidate_through:string?","outstanding_scope:string","outstanding_complete:bool","decision_epoch:hex","method:string","confirmed:bool","line_count:int","proposed_count:int","confirmed_count:int","remaining_count:int","occupied_count:int","ambiguous_count:int","unmatched_count:int","outstanding_count:int","statement_closing_balance:amount","book_closing_balance:amount","closing_difference:amount","progress:bank_reconciliation_progress","proposals:[bank_match_proposal]","outstanding:[bank_outstanding_leg]","continuity:string","verified_predecessors:int","predecessor:bank_import_predecessor?"]

[[event]]
name = "bank_match_confirmed"
book = true
doc = "One immutable native confirmation of a replayed exact bank-line proposal. The source manifest, original line and actual EntryRef plus leg ordinal remain bound to the original native receipt. confirmed_by is the currently admitted Human confirmer; proposer is the principal selected in proposal bytes, not a separate authenticated preparation event. Repeating the exact selection returns its original receipt with already_recorded=true and no publication. Confirmation changes no monetary amount and creates no reconciliation lock."
fields = ["match_vid:hex","match_digest:hex","recorded_at:seq","manifest_oid:hex","statement_oid:hex","line_ordinal:int","line_document_oid:hex","bank_line_oid:hex","account_ref:hex","entry_ref:bank_entry_ref","leg_ordinal:int","proposer:hex","confirmed_by:hex","confirming_profile:string","capability_commitment:hex","source_known_at:seq","date_window:int","proposal_digest:hex","line_generation:int","leg_generation:int","previous_line_unmatch:bank_decision_ref?","previous_leg_unmatch:bank_decision_ref?","method:string","already_recorded:bool"]

[[event]]
name = "bank_match_unmatched"
book = true
doc = "An attributed immutable release of one exact bank confirmation. Its target VID and digest identify the original decision; the releasing Human and current capability commitment remain recorded. The target confirmation and cash-leg claim are preserved. Exact retries return this same release after later rematching and cannot affect a new generation. No monetary entry is posted."
fields = ["unmatch_vid:hex","unmatch_digest:hex","recorded_at:seq","target:bank_decision_ref","unmatched_by:hex","unmatching_profile:string","capability_commitment:hex","security_policy_epoch:int","already_recorded:bool"]

[[event]]
name = "bank_match_history"
book = true
doc = "Complete native decision metadata at a selected prefix under current Read and Reconcile authority. Confirmations, exact releases and active claims are authenticated from retained creation history without opening statement or manifest bytes. Optional account and manifest filters select confirmation coordinates and their releases. Counts describe these selected records; active state is a claim fold, not a closing-balance attestation or reconciled-through lock."
fields = ["known_at:seq", "scope:string", "account:string?", "account_ref:hex?", "manifest_oid:hex?", "confirmation_count:int", "unmatch_count:int", "active_count:int", "confirmations:[bank_confirmation]", "unmatches:[bank_unmatch]", "active:[bank_confirmation]"]

[[event]]
name = "bank_confirmation_status"
book = true
doc = "The complete immutable confirmation inventory for one retained bank statement at known_at, admitted under current full-source authority. confirmed_lines counts distinct source lines with any recorded generation; remaining_lines counts those never confirmed. Separate reconciliations verify original exact-close claims and report cash or match drift at this selected prefix. reconciled_through comes only from those verified attestations and remains protected after drift; confirmation counts alone never establish a cutoff."
fields = ["manifest_oid:hex", "statement_oid:hex", "account_ref:hex", "known_at:seq", "line_count:int", "confirmed_lines:int", "remaining_lines:int", "scope:string", "reconciled_through:date?", "confirmations:[bank_confirmation]", "drifted_reconciliations:int", "reconciliations:[bank_reconciliation_state]"]

[[event]]
name = "bank_reconciled"
book = true
doc = "An immutable capability-bound Human attestation of an exact statement close. Every retained line has an active native confirmation to a cash leg effective by the statement date, and the cumulative posted cash balance equals the statement closing. The original prefix, exact contribution digest and match references remain fixed. The account is protected through the statement date; later cash changes require reconcile authority and cite the attestation. This does not assert complete lifetime statement coverage or adjusted reconciliation with outstanding items."
fields = ["reconciliation:bank_reconciliation"]

[[event]]
name = "bank_reconciliation_status"
book = true
doc = "Native statement-close metadata under current Read and Reconcile authority, without opening governed statement text. Each original claim is independently verified at its original evaluated prefix; current cash and match state are compared at known_at. cash_drift detects changed contributions even when net amounts agree, balance_drift detects an amount difference, and match_drift detects a changed exact active match set. Durable late Entry and activation-control citations are retained. A historical claim never becomes false because later facts changed."
fields = ["manifest_oid:hex", "known_at:seq", "reconciled_through:date?", "reconciliation_count:int", "drifted_count:int", "reconciliations:[bank_reconciliation_state]"]

[[event]]
name = "fad_request"
doc = "A frame from a client to fad. op `run` executes `argv` (an `fa` command line, without --via) exactly as `fa` would, with relative paths resolved against `cwd` and `-` reading `stdin` (hex); op `status` and op `stop` take an empty argv. `token` (hex, optional) is a holder's issued capability token (fa-r3q): fad binds the request to the token's principal and journaled capability, refuses identity and authority flags in argv, and the kernel admits it only against its journaled issuance; without it the request runs in the embedded-owner posture of the same-uid peer."
fields = ["v:int", "op:string", "argv:[string]", "cwd:string?", "stdin:hex?", "token:hex?"]

[[event]]
name = "fad_response"
doc = "fad's answer to one fad_request: the command's exit code and its stdout and stderr, byte for byte as `fa` would have written them (the stdout lines are themselves robot-mode events when the request asked for --json). A protocol fault is answered with exit 2 and an `error` line (class usage), then the connection closes."
fields = ["v:int", "op:string", "exit:int", "stdout:text", "stderr:text"]

[[event]]
name = "fad_serving"
book = true
doc = "`fad serve`: the writer lease is held and the socket is listening. Timed work requires explicit trusted-local book-key bootstrap. Tick and drift intervals are nanoseconds; sweep_batch bounds each expiry/reversal batch's effects, not candidate scan work. Disabled timing fields are null and cycles is zero."
fields = ["book_id:hex", "dir:string", "socket:string", "pid:int", "protocol:int", "max_frame_bytes:int", "timed_work_enabled:bool", "timed_authority:string?", "tick_ns:int?", "sweep_batch:int?", "clock_drift_ns:int?", "timed_cycles:int", "last_tick_utc_ns:int?", "last_tick_monotonic_ok:bool?", "timed_work_error:string?", "register_maintenance:object?"]

[[event]]
name = "fad_status"
doc = "`fad status`: whether a fad serves the book; when one does, its pid, book, requests and timed-work progress. holder is the lease note when its holder is not answering. timed_work_error names a refused or failed cycle; uncorroborated ticks never authorize automatic accounting effects. Timing fields are null/false/zero when disabled or not serving."
fields = ["serving:bool", "dir:string", "socket:string", "pid:int?", "book_id:hex?", "requests:int?", "holder:string?", "timed_work_enabled:bool", "timed_authority:string?", "tick_ns:int?", "sweep_batch:int?", "clock_drift_ns:int?", "timed_cycles:int", "last_tick_utc_ns:int?", "last_tick_monotonic_ok:bool?", "timed_work_error:string?", "register_maintenance:object?"]

[[event]]
name = "fad_stopped"
doc = "`fad stop` (and the daemon itself, on its way out): the daemon released the lease after answering `requests` requests."
fields = ["dir:string", "requests:int"]

[[event]]
name = "version"
doc = "The build's version."
fields = ["version:string"]

[[event]]
name = "triage"
doc = "Bare `fa`: where to start, as text. It opens no book and takes no lease: `book` is the directory this invocation would use (--book, else FA_BOOK, else the working directory when it is a book), and `daemon` is serving, absent or not answering (a fad lease is held but its socket does not answer), from the lease file and one status call; both are null when there is no book. A book directory's text lists five commands to run against it."
fields = ["version:string", "text:text", "book:string?", "daemon:string?"]

[[event]]
name = "help"
doc = "`fa --help`, `fa help [<verb>]`, `fa <verb> --help`: usage as text; `verb` is null for the full list."
fields = ["verb:string?", "text:text"]

[[event]]
name = "error"
doc = "Every non-zero exit emits exactly one (plan Appendix D). `class` names the exit (exit_codes.toml): usage (2: a bad flag, verb, argument or intent document), refusal (3: an accounting-law refusal), environment (4: no book, a bad key file), foundation (5: a foundation or I-O failure), conflict (6), safety (7: period law, capability, SoD, an unconfirmed dangerous operation), verification (8: derived state differs from the journal's refold). `refusal_id` is the refusal catalog code (FA-REF-nnn) when the failure is a catalog refusal, else null; `cite` is the law, matrix cell or policy row it cites (null otherwise); `fix` is the exact next step (null when none applies): do it, and never invent a leg, a date, or an approval. FA-REF-007 means the operation cannot be undone in practice: `fix` names the safe alternative; rerun with --yes only when the operation is intended. `detail` is a verification failure's payload (the per-period checks for registers, the leg drift for open items); for a PostEntry, correction or batch plan that fa commit refuses as stale (FA-REF-034, exit 6) it is {changed, fresh_plan, replan_refusal}: the same intent rehearsed again at the current head and never committed, changed naming the refused plan's bindings that differ (basis, security_policy_epoch, period, capability, entry, effects; for a correction, in either member; a batch's effects digest also moves with its basis, so effects alone does not mean a batch's accounting changed), fresh_plan its plan_digest, certificate_digest, snapshot_seq, security_policy_epoch, period (a PostEntry plan's, null otherwise), effects_digest (a correction's as its replacement_plan event shows it) and bytes (hex, for fa commit --plan -), or, when the intent can no longer be planned, fresh_plan and changed null and replan_refusal that refusal's refusal_id, exit, message and fix; null otherwise. `refusal` is the Appendix D refusal object for a catalog refusal, null otherwise: its `id` (Appendix D's refusal_id; the flat `refusal_id` above stays the code) names this instance (the code, `:`, 16 hex digits binding message, location and coordinate; `fa explain refusal` accepts it), `where` the structured location the refusing site gives (leg, account, period, unit, member …; {} when none), `why` {law}, {policy}, {matrix: {state, class}} or the prose {cite}, `fix.command`/`fix.argv` the first `fa …` command the fix names that parses against this registry (null when none), `fix.or_field_change` the field to change and the values it admits, `fix.rerun_with` the arguments to add to the same command (null when none or launch-bound), `alternatives` the other such commands, `docs` the command that expands the code."
fields = ["class:string", "exit:int", "refusal_id:string?", "message:string", "cite:string?", "fix:string?", "detail:any", "refusal:refusal_object?"]

[[event]]
name = "capabilities"
doc = "What this build can do."
fields = ["version:string", "verbs:[string]", "aliases:[alias]", "exit_codes:[exit_code]", "entry_classes:[string]", "robot_mode:robot_mode", "stdout:string", "stderr:string", "tui:bool", "capability:capability_model", "dangerous:[dangerous_op]", "invariants:invariant_clauses", "slo_manifests:[string]", "procedures:[procedure_claim]"]

[[event]]
name = "robot_docs"
doc = "`fa robot-docs guide|exit-codes|examples --json`: the topic's text."
fields = ["topic:string", "text:text"]

[[event]]
name = "robot_schema"
doc = "`fa robot-docs schema [<name>] --json`: the envelope and the events (with every shape they reference), or the one named event or shape."
fields = ["envelope:envelope_doc", "events:[event_doc]", "shapes:[shape_doc]"]

[[event]]
name = "book_created"
book = true
doc = "A new book directory: the store and the key file (keep it; keys are never regenerated)."
fields = ["book_id:hex", "dir:string", "keys:string", "name:string", "base_unit:string", "calendar:string"]

[[event]]
name = "demo_initialized"
book = true
doc = "`fa demo init`: a deterministic demo book directory initialized with chart, periods, finalized OpeningOnly migration run, operating and planted forensic entries, materialized registers, and a signed transparency checkpoint."
fields = ["book_id:hex", "dir:string", "keys:string", "readme:string", "name:string", "scenario:string", "seed:int", "base_unit:string", "calendar:string", "chart_template:string", "accounts:int", "periods:int", "documents:int", "entries:int", "migration_run_vid:hex", "checkpoint_oid:hex", "journal_digest:hex", "head_seq:seq", "planted_facts:[planted_fact]"]

[[event]]
name = "book"
book = true
doc = "A book's identity and size. `base_unit` is the base unit journaled at genesis; `entities` lists the registered legal entity codes (empty when single-entity)."
fields = ["book_id:hex", "base_unit:string", "calendar:string", "periods:int", "periods_by_state:object", "accounts:int", "units_registered:int", "entities:[string]"]

[[event]]
name = "chart_installed"
book = true
doc = "A chart installed by one journaled control entry. `template` names the embedded template it came from, or is null for a chart file; either way the control entry's idempotency key is the chart text's content digest. `roles` lists the account roles the chart's accounts carry, each journaled after the install as its own role control (bead fa-kxc4)."
fields = ["accounts:int", "control_entry:hex", "recorded_at:seq", "template:string?", "roles:[account_role]"]

[[event]]
name = "laws"
book = false
doc = "Every registered law of this build (or of one family), in registry order: family, id, name, optional version, and every other field of its registry row as text."
fields = ["laws:[law_row]"]

[[event]]
name = "access_log"
book = true
doc = "The AccessEvents recorded after `since` (optionally only those of the principal named `reader`), in recording order. Each names the bound session's principal, its capability commitment and ops, the command, the digest of its bound arguments (positionals, flags and switches without host paths), the head it observed (`observed_at`) and the sequence it was recorded at, always after it."
fields = ["since:seq", "reader:string?", "count:int", "events:[access_event]"]

[[event]]
name = "law"
book = false
doc = "One registered law: its family, id, name, optional version, and every other field of its registry row as text."
fields = ["law:law_row"]

[[event]]
name = "units"
book = false
doc = "Every unit version this build embeds: id, code, version, immutable scale, kind, ISO 4217 number (null when none) and default rounding law."
fields = ["units:[unit_row]"]

[[event]]
name = "chart_templates"
book = false
doc = "The chart templates this build embeds (plan §4.3): each one's name, version, description, account and leaf counts, and `key`, the idempotency key `fa chart import --template <name>` journals (the template text's content digest)."
fields = ["templates:[chart_template]"]

[[event]]
name = "chart_account"
book = true
doc = "One account of the journaled chart at head: its chart row (shape account) with its normal side, parent and children codes (sorted), the opened, closed and promoted_on dates its lifecycle controls journaled (null when none) and created_at, the commit that created it."
fields = ["account:chart_account_detail"]

[[event]]
name = "accounts"
book = true
doc = "The chart, sorted by code."
fields = ["accounts:[account]"]

[[event]]
name = "periods_created"
book = true
doc = "A fiscal year's periods, all Future."
fields = ["fiscal_year:int", "periods:[string]", "recorded_at:seq"]

[[event]]
name = "calendar"
book = true
doc = "The book's fiscal calendar: its id, kind (monthly, weeks, thirteen-period, custom), the month a monthly fiscal year starts in (null otherwise), the week pattern and year-end rule of a week-based calendar (null otherwise), the number of adjustment periods per year, and a custom calendar's declared fiscal years (null for a generated calendar, which defines every year)."
fields = ["id:string", "kind:string", "year_start_month:int?", "week_pattern:string?", "year_end_rule:string?", "adjustment_periods:int", "fiscal_years:[int]?"]

[[event]]
name = "calendar_periods"
book = true
doc = "Every period the book's calendar generates for fiscal_year, in order, with its ordinal, kind and civil bounds as period list renders them, and created: whether fa period create has recorded it. start and end are the fiscal year's bounds."
fields = ["fiscal_year:int", "start:date", "end:date", "periods:[calendar_period]"]

[[event]]
name = "periods"
book = true
doc = "Every period in calendar order with its current state."
fields = ["periods:[period]"]

[[event]]
name = "period_transitioned"
book = true
doc = "A period moved along the state machine by a journaled control entry."
fields = ["period:string", "from:string", "to:string", "control_entry:hex", "recorded_at:seq"]

[[event]]
name = "period_planned"
book = true
doc = "A transition was planned and its sealed proposal written to a file; nothing was committed. Approvals bind proposal_digest."
fields = ["period:string", "from:string", "to:string", "proposal_digest:hex", "plan:string"]

[[event]]
name = "period_plan"
book = true
doc = "A period transition proposal prepared inline without writing files or journal data. bytes is the complete existing canonical TransitionPlan in hex; approvals bind proposal_digest and the sealed description is preserved. Scope is period-transition-proposal: this prepares the state-machine transition, while commit independently checks current authority, approvals and period state. It is not the authenticated PostEntry effects certificate. MCP dangerous commits remain unavailable; an operator must separately review and authorize the transition. For an open, scheduled_reversals lists what the commit mints (plan §7.6): every live schedule whose date the latest tick has reached and whose reversal falls in this period, dated by reversal_tick; both are empty and null when the latest tick is not corroborated, since an open then mints nothing. The commit rechecks applications and availability."
fields = ["period:string", "from:string", "to:string", "principal:hex", "proposal_digest:hex", "bytes:hex", "scope:string", "scheduled_reversals:[scheduled_reversal]", "reversal_tick:hex?"]

[[event]]
name = "approved"
book = true
doc = "An approval of a proposal digest was recorded (or already existed: then nothing was written and security_policy_epoch is null)."
fields = ["approval_vid:hex", "approved_digest:hex", "security_policy_epoch:int?", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "draft_opened"
book = true
doc = "A draft was opened by a journaled DraftControl Open record (or the identical draft was already open: then nothing was written). Nothing in a draft is a trunk entry."
fields = ["draft:hex", "name:string", "control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "draft_planned"
book = true
doc = "An intent was rehearsed under every posting law and journaled into the draft by a DraftControl Plan record (or the identical intent was already planned: then nothing was written and the plan digests are null). `entry` is the entry its promotion will create."
fields = ["draft:hex", "name:string", "control_entry:hex", "recorded_at:seq", "already_recorded:bool", "entry:hex", "plan_digest:hex?", "proposal_digest:hex?"]

[[event]]
name = "drafts"
book = true
doc = "Every draft of the book, by opening sequence."
fields = ["drafts:[draft_summary]"]

[[event]]
name = "draft_detail"
book = true
doc = "One draft: its summary, its planned intents in promotion order, and the entries its promotion created (null until promoted)."
fields = ["draft:draft_summary", "intents:[draft_intent]", "promoted_entries:[hex]?"]

[[event]]
name = "draft_promoted"
book = true
doc = "A draft's planned intents posted to trunk in one batch with its DraftControl Promote record (or the draft was already promoted: then nothing was written and periods is empty). The planner stays each entry's principal."
fields = ["draft:hex", "name:string", "control_entry:hex", "outcome:hex", "entries:[hex]", "periods:[string]", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "draft_discarded"
book = true
doc = "A draft was closed without promotion by a DraftControl Discard record (or was already discarded by this principal: then nothing was written). Nothing is deleted."
fields = ["draft:hex", "name:string", "control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "case_opened"
book = true
doc = "A restatement case was journaled by a CaseControl Open record (or the identical request was already recorded: then nothing was written). It is Proposed, or Determined when the determination was given at open."
fields = ["case:restatement_case", "control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "case_manifest"
book = true
doc = "A Rehearsed case's effect manifest, which its approvers approve: each entry the case will post (the scenario's Plan record, its intent's digest and its planner), the planners (who may not approve), and the digest fa approve --proposal binds."
fields = ["case:int", "digest:hex", "entries:[case_manifest_entry]", "preparers:[hex]"]

[[event]]
name = "case_approved"
book = true
doc = "A restatement case's effect manifest was approved by a CaseControl Approve record citing two Human approvals of its digest, moving it Rehearsed → Approved (or the identical request was already recorded)."
fields = ["case:restatement_case", "control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "case_posted"
book = true
doc = "A restatement case's entries were posted in one batch with its CaseControl Post record, moving it Approved → Posted (or the identical request was already recorded): case.posted names each entry and the Plan record it derives from."
fields = ["case:restatement_case", "control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "case_disclosed"
book = true
doc = "A restatement case was disclosed by a CaseControl Disclose record, moving it Posted → Disclosed (or the identical request was already recorded): case.disclosure names the reviewed Disclosure document and its Reviewed attestation."
fields = ["case:restatement_case", "control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "case_closed"
book = true
doc = "A restatement case was closed by its last CaseControl record, moving it Disclosed → Closed (or the identical request was already recorded)."
fields = ["case:restatement_case", "control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "case_rehearsed"
book = true
doc = "A restatement case was rehearsed by a CaseControl Rehearse record, moving it Determined → Rehearsed (or the identical request was already recorded): its rehearsal names the scenario, the retained diff certificate's digest, the fork and the periods the diff covers."
fields = ["case:restatement_case", "control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "case_determined"
book = true
doc = "A restatement case's determination (day and authority document) was journaled by a CaseControl Determine record, moving it Proposed → Determined (or the identical request was already recorded)."
fields = ["case:restatement_case", "control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "case"
book = true
doc = "One restatement case as its body, state and journaled transitions state it."
fields = ["case:restatement_case"]

[[event]]
name = "cases"
book = true
doc = "Every restatement case of the book, by case number."
fields = ["cases:[restatement_case]"]

[[event]]
name = "receivership_forked"
book = true
doc = "The receiver's fork (plan §15.6, `fa book fork receivership`): `hold_vid` is the book-scope legal hold over everything recorded through `appointment` on the order `authority` (recorded at `hold_recorded_at`), and `scenario` the `receivership` branch forked at `appointment`, its Open record `control_entry` recorded at `recorded_at`. `already_recorded` is true when an earlier fork recorded both. The estate posts with --scenario receivership; reads take --branch scenario:receivership."
fields = ["appointment:seq", "authority:hex", "hold_vid:hex", "hold_recorded_at:seq", "scenario:hex", "branch:string", "control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "scenario_forked"
book = true
doc = "A scenario forked (or the recorded fork on an exact retry): its trunk fork sequence, the date its counterfactual starts, and the assumption documents it rests on. Nothing in a scenario is a trunk entry."
fields = ["scenario:hex", "name:string", "control_entry:hex", "recorded_at:seq", "already_recorded:bool", "fork_at:seq", "from:date?", "assumptions:[hex]"]

[[event]]
name = "scenario_run"
book = true
doc = "An intent journaled into a scenario after its rehearsal on the scenario's materialization. ordinal is its position (from 1); entry is the identity the intent posts under in every materialization; rehearsed is false on a recorded retry, which rehearses nothing. Trunk receives the record, never the entry."
fields = ["scenario:hex", "name:string", "control_entry:hex", "recorded_at:seq", "already_recorded:bool", "ordinal:int", "entry:hex", "rehearsed:bool"]

[[event]]
name = "branches"
book = true
doc = "Every draft of the book by opening sequence and every scenario by forking sequence, in the shapes draft list and scenario list use. Both are empty on a trunk-only book."
fields = ["drafts:[draft_summary]", "scenarios:[scenario_summary]"]

[[event]]
name = "scenarios"
book = true
doc = "Every scenario of the book, by forking sequence."
fields = ["scenarios:[scenario_summary]"]

[[event]]
name = "scenario_detail"
book = true
doc = "One scenario: its fork, assumptions and intents in run order (each with the entry it posts in the scenario)."
fields = ["scenario:scenario_summary", "intents:[draft_intent]"]

[[event]]
name = "scenario_diff"
book = true
doc = "The ledger-level difference a scenario makes (plan §15.6.5): per account and unit, trunk as known at fork_at against the scenario's materialization over the same periods, exact; only changed rows. delta = (scenario debits - credits) - (trunk debits - credits). body_digest, intents_digest and seq_map_digest bind what was compared; scenario_known_at is the materialization's own sequence. With --certify, a report_certificate follows and the envelope names it; fa replay of that certificate emits this event again."
fields = ["scenario:hex", "name:string", "fork_at:seq", "from:date?", "assumptions:[hex]", "periods:[string]", "activity:bool", "intents:int", "body_digest:hex", "intents_digest:hex", "seq_map_digest:hex", "scenario_known_at:seq", "rows:[scenario_diff_row]"]

[[event]]
name = "scenario_discarded"
book = true
doc = "A scenario closed; its records and intents are kept."
fields = ["scenario:hex", "name:string", "control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "draft_diff"
book = true
doc = "The exact stock trial-balance effect of an existing draft at source_known_at. Every retained plan is rehearsed in one scratch batch under its original planner capability and approval references; real trunk and draft state remain unchanged. Only changed account/unit rows appear, preserving posted and pending debit/credit columns separately. source_digest binds the complete original draft controls; seq_map_digest and rehearsal_known_at bind preserved source coordinates and the single hypothetical publication. entries are hypothetical EntryRefs, not trunk membership. With certification, fa replay reproduces the complete pinned review after later draft changes or promotion. This is supplied-draft review, not a CloseTask DAG, financial-statement package or close authorization."
fields = ["draft:hex","name:string","owner:hex","period:string","source_known_at:seq","source_digest:hex","plans:int","seq_map_digest:hex","rehearsal_known_at:seq","batch_outcome:hex","entries:[draft_entry_ref]","rows:[draft_diff_row]"]

[[event]]
name = "capability_issued"
book = true
doc = "A holder-bound capability was issued by a journaled PolicyControl entry (or the identical capability was already issued: then nothing was written). The token file names the holder's 0600 token; the secret is never printed."
fields = ["commitment:hex", "control_entry:hex", "holder:hex", "recorded_at:seq", "already_recorded:bool", "token:string"]

[[event]]
name = "capabilities_issued"
book = true
doc = "Every capability this book issued, decoded from its journaled body, in issuance order, with its revocation state."
fields = ["capabilities:[issued_capability]"]

[[event]]
name = "capability_issued_detail"
book = true
doc = "One issued capability, decoded from its journaled body, with its revocation state."
fields = ["capability:issued_capability"]

[[event]]
name = "capability_revoked"
book = true
doc = "A capability commitment was revoked by a journaled PolicyControl entry (or was already revoked: then nothing was written)."
fields = ["control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "posted"
book = true
doc = "An entry committed; `recorded_at` is its CommitSeq, assigned by the journal. With --balancing, `requested` is the amount asked for and `moved` what the balancing leg's account admitted (the legs posted at `moved`); both null otherwise."
fields = ["class:string", "vid:hex", "entry_digest:hex", "recorded_at:seq", "period:string", "requested:amount?", "moved:amount?"]

[[event]]
name = "plan"
book = true
doc = "A successful rehearsal of the actual posting pipeline, with its staged transaction aborted and no journal or metadata writes. bytes is the complete canonical PostEntry plan as hex; file is an optional new external binary copy. The exact sealed proposal, original request and supplied approvals are retained. Leg amounts and lineage preview that proposal; a Reclassification's net_effect is its target plus this entry's delta per account and unit (earlier reclassifications of the target are netted only by fa explain lineage), null for every other class; effects_digest binds all staged native writes before the plan's own Certificate and CITES retention metadata is added. Book-key authentication binds the certificate, current caller capability, security epoch and snapshot. Any intervening publication requires a new plan. Scope is same-snapshot-post; authority names the actual embedded-owner or mcp-launch-config posture, with principal/profile/ops in the envelope. Agent profiles remain unable to plan trunk posts. Drafts, issued tokens, newly gathered approval quorums and saturating balancing remain unfinished. idempotency_key is exact key bytes in hex. The envelope certificate stays null: these public digests are not native object-store OIDs."
fields = ["intent_kind:string", "class:string", "effective_date:date", "period:string", "principal:hex", "idempotency_key:hex", "intent_digest:hex", "proposal_digest:hex", "effects_digest:hex", "snapshot_seq:seq", "security_policy_epoch:int", "expires_at:seq?", "capability_commitment:hex", "certificate_digest:hex", "plan_digest:hex", "legs:[plan_leg]", "valuation:plan_valuation?", "resolves:hex?", "disposition:string?", "supersedes:[lineage]", "net_effect:[lineage_net_cell]?", "evidence:[evidence_head]", "approvals:int", "bytes:hex", "file:string?", "scope:string", "authority:string"]

[[event]]
name = "plan_committed"
book = true
doc = "The authenticated exact plan committed after current authority and native effects revalidation, atomically retaining its artifact as a graph Certificate and CITES edge. A retry sets already_recorded=true and returns the original entry identity and sequence with period=null; nothing new is written. The public plan and certificate digests identify the reviewed artifact; envelope certificate is null because there is no native object-store OID."
fields = ["vid:hex", "entry_digest:hex", "recorded_at:seq", "period:string?", "already_recorded:bool", "plan_digest:hex", "certificate_digest:hex"]

[[event]]
name = "replacement_plan"
book = true
doc = "Zero-write rehearsal of one atomic Reversal and Replacement. The ordered members show both exact prepared entries. bytes carries one canonical joint-authenticated artifact; neither member authenticates as a standalone PostEntry plan. The certificate binds both requests, approvals, periods, capability, policy, basis and complete native effects. Agent-profile plans are rehearsal only; correction drafts remain unsupported. The joint Certificate and both CITES edges will be retained atomically on publication."
fields = ["intent_kind:string", "target:hex", "principal:hex", "effects_digest:hex", "snapshot_seq:seq", "security_policy_epoch:int", "expires_at:seq?", "capability_commitment:hex", "certificate_digest:hex", "plan_digest:hex", "members:[replacement_plan_member]", "bytes:hex", "file:string?", "scope:string", "authority:string"]

[[event]]
name = "replacement_plan_committed"
book = true
doc = "The reviewed correction's Reversal, Replacement and joint plan certificate committed in one publication. An exact retry returns both original identities and their shared recorded_at with already_recorded=true and null periods; it writes nothing."
fields = ["reversal:hex", "reversal_digest:hex", "replacement:hex", "replacement_digest:hex", "recorded_at:seq", "reversal_period:string?", "replacement_period:string?", "already_recorded:bool", "plan_digest:hex", "certificate_digest:hex"]

[[event]]
name = "reversed"
book = true
doc = "A typed reversal committed, negating the target's posted legs exactly and recording the preparer's registered reason. The original remains immutable; an exact retry emits recorded."
fields = ["vid:hex", "entry_digest:hex", "recorded_at:seq", "period:string", "target:hex", "reason_code:int", "reason:string"]

[[event]]
name = "corrected"
book = true
doc = "A correction pair committed at one sequence (plan §8.2, FA-INV-08.replacement-paired): the exact reversal of target and its Replacement, both citing it under one registered reason; or, with already_recorded, an identical retry found the recorded pair and wrote nothing (the periods are then null)."
fields = ["target:hex", "reason_code:int", "reason:string", "reversal:hex", "reversal_digest:hex", "replacement:hex", "replacement_digest:hex", "recorded_at:seq", "already_recorded:bool", "reversal_period:string?", "replacement_period:string?"]

[[event]]
name = "batch_posted"
book = true
doc = "A PostBatch committed every member in one transaction (plan §5.8), or, with already_recorded, an identical retry found the recorded IntentOutcome and wrote nothing. members lists the entries in member order; period is null on a recorded outcome."
fields = ["outcome:hex", "idempotency_key:string", "recorded_at:seq", "already_recorded:bool", "members:[batch_member]"]

[[event]]
name = "batch_plan"
book = true
doc = "Zero-write rehearsal of one complete ordered PostBatch in a carried native transaction. Later members see earlier staged entries and applications. Each member previews its exact prepared identity, legs, settlements, dimensions, lineage and approvals; bytes retains the complete bounded canonical artifact. Authentication binds the ordered request, prepared entries and periods, independently supplied capability, policy epoch, snapshot and complete staged native effects, including the batch outcome. The planner stages certificate retention before aborting so actual native capacity is checked. First commit requires the exact reviewed snapshot; Agent-profile artifacts remain rehearsal only and cannot publish to trunk. Atomic batch drafts and saturating balancing are unsupported."
fields = ["intent_kind:string", "idempotency_key:hex", "principal:hex", "intent_digest:hex", "prepared_digest:hex", "effects_digest:hex", "snapshot_seq:seq", "security_policy_epoch:int", "expires_at:seq?", "capability_commitment:hex", "certificate_digest:hex", "plan_digest:hex", "members:[batch_plan_member]", "bytes:hex", "file:string?", "scope:string", "authority:string"]

[[event]]
name = "batch_plan_committed"
book = true
doc = "The authenticated reviewed batch published every ordered member, its keyed outcome, retained certificate and all certificate links atomically after current authority and complete native effect revalidation. An exact retry verifies the original immutable identities, payloads and retaining links, returns their original recorded_at with already_recorded=true, and writes nothing. Members retain their reviewed periods on retries."
fields = ["outcome:hex", "recorded_at:seq", "already_recorded:bool", "members:[batch_member]", "plan_digest:hex", "certificate_digest:hex"]

[[event]]
name = "recorded"
book = true
doc = "The same idempotency key was already recorded with the same content; nothing new was written. For a balancing post the identity is the request (key, requested amount, leg): `requested`/`moved` are the recorded ones, whatever availability is now; null otherwise."
fields = ["vid:hex", "entry_digest:hex", "recorded_at:seq", "requested:amount?", "moved:amount?"]

[[event]]
name = "trial_balance"
book = true
doc = "Stock (through `effective_through`) or activity (the selected periods), at the `known_at` snapshot."
fields = ["periods:[string]", "known_at:seq", "effective_through:date?", "activity:bool", "mode:string", "rows:[tb_row]", "unit_totals:[unit_total]", "pending_unit_totals:[pending_unit_total]", "balanced:bool", "served:tb_served?"]

[[event]]
name = "functional_trial_balance"
book = true
doc = "Exact functional-currency activity for one posting period at one known-at prefix, folded from immutable committed base valuations. scope is period_activity; posted and outstanding pending holds are separate. Unvalued foreign legs refuse. Current authority, complete Entry history and the selected Book definition are checked before reporting. This does not recalculate entries at current rates, assert current access to their Rate source bytes, establish cumulative stock or issue a certificate."
fields = ["scope:string", "period:string", "base_unit:string", "known_at:seq", "watermark:seq?", "entries:int", "fold_digest:hex", "rows:[functional_tb_row]", "pending_rows:[functional_tb_row]", "totals:functional_tb_totals", "pending_totals:functional_tb_totals", "balanced:bool", "pending_balanced:bool"]


[[event]]
name = "functional_stock_balance"
book = true
doc = "Cumulative functional-currency stock from inception through effective_through, at one known-at prefix. scope is stock. Posted and outstanding pending columns are separate; visible resolutions release holds under the native two-phase law, and only finalized migration contributions are posted. Opening history crosses fiscal years without implicit closing. Values come from immutable committed base amounts, never today's rates. Current whole-book authority, complete Entry history and the selected Book definition are checked. Unvalued foreign contributions refuse. No report certificate or current Rate-source availability claim is made."
fields = ["scope:string", "effective_through:date", "base_unit:string", "known_at:seq", "watermark:seq?", "entries:int", "fold_digest:hex", "rows:[functional_tb_row]", "pending_rows:[functional_tb_row]", "totals:functional_tb_totals", "pending_totals:functional_tb_totals", "balanced:bool", "pending_balanced:bool"]

[[event]]
name = "statement"
book = true
doc = "A registered financial statement evaluated from exact journal folds. The definition digest commits its versioned mappings and formulas; mappings list the checked leaf-account partition. Each line contains amounts in column order. scope single-book-native-units keeps native units separate. scope single-book-functional-currency carries functional=true, base_unit and valuation_basis=retained-base-amounts; it sums committed base amounts after verifying their retained evidence and laws, without selecting current rates. All columns share known_at. Certification and replay use the same presentation; no GAAP conformity, consolidation, FX conversion or presentation rounding is implied."
fields = ["name:string", "definition_version:int", "definition_digest:hex", "known_at:seq", "columns:[statement_column]", "lines:[statement_line]", "mappings:[statement_mapping]", "scope:string", "functional:bool?", "base_unit:string?", "valuation_basis:string?"]

[[event]]
name = "rendered"
book = true
doc = "A report rendered as a document by --render (fa-cet), from its deterministic Markdown IR. ir_digest commits the IR (the report's rows, units, frontier and definition); digest is BLAKE3(\"fa:rendering-file:v1\" || bytes) of the exact document; out is the new file written (null when Markdown travels inline in markdown). created and tick name the latest corroborated TimeEvidence tick known at the report's frontier that dates HTML, SVG and PDF output (null for Markdown, which carries no date); the same report at the same frontier renders to the same bytes. pdfa_valid is true when a PDF/A-2b passed the built-in validator before it was written (null otherwise). No GAAP conformity or signature is implied."
fields = ["format:string", "ir_digest:hex", "digest:hex", "bytes:int", "out:string?", "created:string?", "tick:hex?", "pdfa_valid:bool?", "markdown:string?"]

[[event]]
name = "search_results"
book = true
doc = "A full-text search at known_at (fa search): records is how many entries carried searchable text, index_digest names the index rebuilt from that journal prefix (the same prefix rebuilds the same index), total counts every hit and hits holds the first --limit of them, best first. A hit's snippet is the matched text; its score is exact fixed-point BM25 (micro-units), a ranking and never a finding."
fields = ["query:string", "known_at:seq", "records:int", "index_digest:hex", "total:int", "hits:[search_hit]"]

[[event]]
name = "query_rows"
book = true
doc = "A profile query's result (fa query): the statement as written, the native statement it compiled to and ran, the recorded sequence it read (an omitted or HEAD known-at resolved before the read), the FOR PERIOD code when given, the column names and each row's values in the native read's order. A vertex or edge is its 32-hex id, a decimal (an amount mirror or an exact sum of them) is exact text without trailing zeros (1000, 0.5), an exact average is {numerator, denominator}, bytes are hex. result_digest is the substrate's digest of the native read's ordered result under its plan (for an amount aggregate, the rows the profile aggregated): the same statement at the same sequence gives the same digest. Under fa query --certify, or replayed by fa replay, the envelope's certificate is the query certificate's oid."
fields = ["statement:string", "native:string", "known_at:seq", "period:string?", "columns:[string]", "row_count:int", "rows:[any]", "result_digest:hex"]

[[event]]
name = "statement_issuance_plan"
book = true
doc = "A statement issuance was planned (plan §12.5, IssueStatements); nothing was written. The issuance names the retained statement certificate, the period it reports, its known-at (certified_at) and the audience, at the period's next ordinal. bytes is the complete canonical IssuancePlan in hex, with its description sealed once; approvals bind proposal_digest. Scope is statement-issuance-proposal: commit checks authority, approvals, the certificate and the ordinal again."
fields = ["issuance:statement_issuance", "principal:hex", "proposal_digest:hex", "bytes:hex", "scope:string"]

[[event]]
name = "statement_issued"
book = true
doc = "A StatementIssuance was journaled by an IssuanceControl record (or the same plan was already committed: then nothing was written). The period's first issuance (ordinal 1) is what AS ORIGINALLY REPORTED reads: its certificate's certified_at."
fields = ["issuance:statement_issuance", "already_recorded:bool"]

[[event]]
name = "statement_issuances"
book = true
doc = "Every journaled statement issuance of the period, by ordinal, or of the book, by period then ordinal."
fields = ["period:string?", "issuances:[statement_issuance]"]

[[event]]
name = "statement_presented"
book = true
doc = "The statement just emitted, presented per unit in whole units, thousands or millions (plan §12.1): each line's presented integers per column (exact mantissa / divisor under rounding_law), its exact rounding error, and residual: true on an explicit Presentation rounding line placed before a total whose rounded parts do not sum to its rounded value, so every presented total foots. digest is the presented statement's canonical digest per unit; the exact statement and any certificate are unchanged."
fields = ["definition:string", "present_in:string", "rounding_law:string", "columns:[string]", "units:[presented_unit]"]

[[event]]
name = "statement_lint"
book = true
doc = "The FA-INV-04 mapping partition of one statement definition over the chart at known_at: clean iff every covered leaf maps to exactly one line and no line names an unknown, summary or out-of-coverage code. empty_lines map no leaf. mappings resolve every singly mapped leaf; report_digest identifies these findings."
fields = ["definition:string", "version:int", "definition_digest:hex", "known_at:seq", "clean:bool", "covered_leaves:int", "mapped_leaves:int", "unmapped_leaves:[string]", "multiply_mapped_leaves:[statement_lint_overlap]", "unknown_codes:[string]", "summary_codes:[string]", "outside_coverage_codes:[string]", "empty_lines:[string]", "mappings:[statement_lint_mapping]", "report_digest:hex"]

[[event]]
name = "summary_trial_balance"
book = true
doc = "A summary-account trial balance (plan §4.3/§5.6): disjoint leaf subtrees folded under each selected root account at one known-at frontier. `complete` is true when no leaf account is uncovered; `balanced` is true only when `complete` is true and the whole-book leaf fold balances."
fields = ["periods:[string]", "known_at:seq", "effective_through:date?", "activity:bool", "mode:string", "complete:bool", "balanced:bool", "groups:[summary_group]", "uncovered_leaves:[string]", "unit_totals:[unit_total]", "pending_unit_totals:[pending_unit_total]"]

[[event]]
name = "statement_diff"
book = true
doc = "An exact statement bridge between two recorded frontiers (`before_known_at` and `after_known_at`) for the same definition and period columns (plan §8.3/§12.5). `mapping_changes` lists any chart mapping differences even when monetary deltas are zero."
fields = ["name:string", "definition_version:int", "definition_digest:hex", "before_known_at:seq", "after_known_at:seq", "amounts_changed:bool", "unchanged:bool", "columns:[statement_column]", "lines:[statement_line_change]", "mapping_changes:[statement_mapping_change]"]

[[event]]
name = "statement_trace"
book = true
doc = "Publication-by-publication attribution of a statement bridge over `(before_known_at, after_known_at]`. Each step refolds the statement at the adjacent recorded sequence and lists the entries published or made visible at that step."
fields = ["name:string", "definition_version:int", "definition_digest:hex", "before_known_at:seq", "after_known_at:seq", "had_changes:bool", "publication_count:int", "columns:[statement_column]", "lines:[statement_line_change]", "mapping_changes:[statement_mapping_change]", "publications:[statement_publication]"]

[[event]]
name = "general_ledger"
book = true
doc = "General-ledger detail at one recorded frontier over `[effective_from, effective_through]`: opening stock, ordered posted movements with running balances, and closing stock for each selected account and unit."
fields = ["label:string", "known_at:seq", "effective_from:date", "effective_through:date", "cells:[gl_cell]", "lines:[gl_line]"]

[[event]]
name = "roll_forward"
book = true
doc = "Account roll-forward lead schedule (plan §12.1) at one recorded frontier over `[effective_from, effective_through]`: opening stock plus activity partitioned by `(class, reason_code, rule_digest)` equals closing stock for each selected account and unit."
fields = ["label:string", "known_at:seq", "effective_from:date", "effective_through:date", "buckets:[roll_forward_bucket]", "rows:[roll_forward_row]", "movement_count:int"]

[[event]]
name = "equity_roll_forward"
book = true
doc = "The statement of changes in equity (plan §12.1, EquityRollForward) at one recorded frontier over `[effective_from, effective_through]`, from the roll-forward lead schedule of every equity, revenue and expense leaf: per unit, opening equity plus net income, issuances, distributions and other equity movements equals closing equity (tie_out_residual is zero), and the closing transfer nets to zero. Every classified equity leg it folded is listed; revenue and expense legs outside Closing entries are net income and are not."
fields = ["label:string", "known_at:seq", "effective_from:date", "effective_through:date", "units:[equity_roll_forward_unit]", "movement_count:int", "movements:[equity_movement]"]

[[event]]
name = "aging"
book = true
doc = "Effective-date open-item aging (plan §5.7/§7.5) through `effective_through` at `known_at`: open items bucketed by civil days since their effective date, with separate debit and credit totals per native unit."
fields = ["account:string?", "known_at:seq", "effective_through:date", "bands:[aging_band]", "items:[aged_open_item]", "cells:[aging_cell]", "totals:[aging_total]"]

[[event]]
name = "aging_reconciled"
book = true
doc = "Control reconciliation of one posting leaf's effective-date open-item fold against its trial-balance control net at `known_at` through `effective_through` (plan §5.6–§5.7)."
fields = ["account:string", "account_vid:hex", "name:string", "known_at:seq", "effective_through:date", "reconciled:bool", "rows:[aging_reconciliation_row]", "bands:[aging_band]", "item_count:int"]

[[event]]
name = "aging_portfolio_reconciled"
book = true
doc = "Control reconciliation of every posting leaf (`scope` all-posting) or of a selected list (`scope` selected) at ONE `known_at` through `effective_through`, from one chart, one whole-book open-item fold and one stock trial balance (plan §5.6–§5.7). `accounts` is in code order and includes selected zero-activity leaves; `uncovered` lists every unselected posting leaf instead of printing it as zero. `complete` (nothing uncovered) and `reconciled` (every selected row has zero difference) are separate verdicts; `pending_reservations` keeps pending holds visible. This is an internal consistency report, not a close permit or an external subledger attestation."
fields = ["scope:string", "known_at:seq", "effective_through:date", "reconciled:bool", "complete:bool", "pending_reservations:bool", "accounts:[aging_portfolio_account]", "uncovered:[aging_portfolio_uncovered]", "bands:[aging_band]"]

[[event]]
name = "cash_flow"
book = true
doc = "Direct cash-flow workpaper over the native general ledger at `known_at` for `[effective_from, effective_through]`, classified under `policy` into operating, investing, financing, exchange effects, and internal transfers."
fields = ["policy:string", "label:string", "known_at:seq", "effective_from:date", "effective_through:date", "cash_accounts:[string]", "units:[cash_flow_unit]"]

[[event]]
name = "policy_cash_flow"
book = true
doc = "Direct cash-flow workpaper whose cash-leg activities derive from a rule `policy` (plan §12.1, fa-i9yn) at `known_at` for `[effective_from, effective_through]`: account rules classify non-cash counterpart accounts, explicit overrides fix whole cash legs, and the original cash engine classifies the result. `decisions` gives every selected cash leg's activity and basis (account_rules, override or internal_transfer). No amount is split, netted or inferred; the policy is a professional input, not an approval."
fields = ["policy:string", "label:string", "known_at:seq", "effective_from:date", "effective_through:date", "cash_accounts:[string]", "units:[cash_flow_unit]", "decisions:[cash_flow_decision]"]

[[event]]
name = "indirect_cash_flow"
book = true
doc = "Indirect operating-cash reconciliation at `known_at` for `[effective_from, effective_through]`: net income from the registered income statement over `income_periods` plus explicit non-cash, working-capital, and non-operating leg adjustments reconciled to direct operating cash in each native unit."
fields = ["policy:string", "cash_policy:string", "label:string", "known_at:seq", "effective_from:date", "effective_through:date", "income_periods:[string]", "cash_accounts:[string]", "units:[indirect_cash_flow_unit]", "contributions:[indirect_cash_flow_contribution]"]

[[event]]
name = "split_cash_flow"
book = true
doc = "Direct cash-flow workpaper that partitions each original cash leg into explicit positive activity portions under a reviewed policy. Every portion declares its native unit and is checked against the cited original leg before its exact mantissa enters the calculation. Portions must total the original leg exactly, preserving its cash direction; operating, investing, financing and exchange movements reconcile opening to closing in each native unit. The certificate and independently supplied split-cash-flow replay expectation bind the exact policy, reasons, source legs and recorded coordinate."
fields = ["policy:string", "label:string", "known_at:seq", "effective_from:date", "effective_through:date", "cash_accounts:[string]", "units:[cash_flow_unit]", "splits:[cash_flow_leg_split]"]

[[event]]
name = "lots"
book = true
doc = "Cost-basis lot schedule (plan §6.5) for one `AnyUnit` account at `known_at` (and optionally through `effective_through`): each lot pairs an acquiring non-base quantity leg with its base-unit cost leg, tracks `RELIEVES` disposal applications (and `UNSETTLES` reversals where `live` is false), and optionally plans a deterministic disposal under `FIFO`, `LIFO`, `SpecificId`, or `WeightedAverage`."
fields = ["account:string", "account_vid:hex", "name:string", "base_unit:string", "known_at:seq", "effective_through:date?", "count:int", "lots:[lot_item]", "disposal_plan:lot_disposal_plan?"]

[[event]]
name = "report_certificate"
book = true
doc = "The complete native source or family certificate retained in this book for the preceding report. oid resolves through fa replay; selector freshness via certificate status is available only for supported report families. recorded_at is the immutable certificate object's sequence, distinct from the report's known_at. bytes is the complete canonical certificate in hex and file is an optional external copy. output_digest commits the exact binary result named by output_format. For a multi-source comparison or trace, journal_root, journal_leaves and native_inputs describe the final native source; the outer certificate retains every source and replay verifies all of them. Cash-flow and aging reconciliation replay_command includes the original producing request as --expect JSON, which recipients must retain and select independently of the delivered certificate. Retention advances the metadata frontier without posting accounting entries. The explicit replay_scope and authority limit the claim."
fields = ["oid:hex", "known_at:seq", "recorded_at:seq", "bytes:hex", "file:string?", "replay_command:string", "replay_scope:string", "authority:string", "output_format:string", "output_digest:hex", "native_inputs:int", "journal_root:hex", "journal_leaves:int"]

[[event]]
name = "report_replayed"
book = true
doc = "The complete report artifact replayed against its original history under current authority. output_bytes is the exact canonical output length; output_digest is BLAKE3 of fa:report-output:v1 followed by the canonical bytes. file names the new output file when requested. This is local historical replay, not a signature, freshness, accounting-truth or outsider-completeness assertion."
fields = ["family:string", "known_at:seq", "output_bytes:int", "output_digest:hex", "file:string?"]

[[event]]
name = "workpaper_exported"
book = true
doc = "A recipient-bound JSONL workpaper, produced after the certificate replayed, twice, against the independently supplied request, and either written to `file` (--workpaper-out) or returned inline as `text` (--workpaper; the other field is null): `family` is the certificate's report family, `bytes` the UTF-8 length and `lines` the JSONL record count. Amounts and counts inside are decimal strings; the statement-diff package (format fa:statement-diff-workpaper:v1) keeps amounts as decimal mantissa strings but writes unit ids, day numbers and counts as JSON integers. It is a readable deliverable, not an outsider proof, a signature or an approval, and it never contains the source certificates or protected entry and document text."
fields = ["family:string", "file:string?", "bytes:int", "lines:int", "text:string?"]

[[event]]
name = "certificate_status"
book = true
doc = "A verified certificate is Current when no later entry affects its selector, otherwise SupersededBy with the later entry identities. For a scenario diff those are the Plan records its scenario gained after the certified prefix, and known_at is the fork. A summary trial balance is Current when its root and effective selector reproduces the certified report exactly at checked_at (amounts, posted and pending columns, group membership, empty roots and uncovered leaves), otherwise Changed with empty later_entries: that law compares the report, not entries. A query is Current when its statement returns the certified columns and rows at checked_at, otherwise Changed with empty later_entries: a query reads more than entries. Its original known_at remains replayable in every case. checked_at is the frontier at which status was evaluated."
fields = ["oid:hex", "status:string", "known_at:seq", "checked_at:seq", "later_entries:[hex]", "replay_scope:string", "authority:string"]

[[event]]
name = "open_items"
book = true
doc = "Open items, optionally on one account, at the `known_at` snapshot, with historical account metadata and each item's applications and reversal lineage. An unknown account filter refuses. With --certify the envelope identifies the retained certificate emitted next."
fields = ["account:string?", "count:int", "items:[open_item]"]

[[event]]
name = "checkpoints"
book = true
doc = "Every journaled accumulator state, newest first, following prev_state_oid as fa checkpoint create recorded it. Nothing is recomputed: fa verify accumulator recomputes each state from the journal. Empty when the book has no checkpoint; a link that cannot be followed is an error (exit 5), not a listing."
fields = ["checkpoints:[checkpoint_state]"]

[[event]]
name = "checkpoint_witnessed"
book = true
doc = "A recorded state's signed TransparencyCheckpoint cosigned by a witness key (plan §13.5, fa checkpoint witness), written to `out`: the same body with the witness's Ed25519 signature added, so checkpoint_oid names the cosigned object. state_oid, through_seq, leaf_count and root are the state's; signer_key_id and witness_public_key the witness's; book_public_key the book's checkpoint key. extends is the statement the witness signed last (from --previous), which the book proved this state extends before anything was signed, or null for a witness's first checkpoint. claim is witnessed_detection: a cosignature lets checkpoints that later disagree expose a fork; it never prevents one. Nothing is written to the book."
fields = ["state_oid:hex", "through_seq:seq", "leaf_count:int", "root:hex", "checkpoint_oid:hex", "signer_key_id:hex", "witness_public_key:hex", "book_public_key:hex", "extends:witness_statement?", "out:string", "claim:string"]

[[event]]
name = "witness_key_created"
doc = "A new Ed25519 witness key (plan §13.5, fa checkpoint witness-key): its 32-byte seed written as 64 hex characters to the new 0600 file `out`, its public key and the key id a checkpoint signature names it by. No book is read or written."
fields = ["public_key:hex", "signer_key_id:hex", "out:string"]

[[event]]
name = "checkpoint_created"
book = true
doc = "An AccumulatorState over every entry in the named book/branch prefix through through_seq, and every journaled evidence record (attestation, import receipt, custody transfer, supplemental evidence) created after evidence_after_seq, recorded in a later commit. evidence_after_seq is null only for a state from before evidence records were accumulated; leaf_kinds counts leaf_count by record kind. It may be the unsigned raw statement, or its TransparencyCheckpoint (checkpoint_oid) signed by the book's Ed25519 key public_key; signatures is ed25519 for the signed checkpoint and unsigned for the raw statement. prev_state_oid links its predecessor. scope entry_prefix names this accumulator prefix in commit order; signatures and bundles are not leaves. `fa proof signed-checkpoint` exports the signed checkpoint for fa-verify --key."
fields = ["book:hex", "branch:hex", "oid:hex", "recorded_at:seq", "through_seq:seq", "leaf_count:int", "evidence_after_seq:seq?", "leaf_kinds:accumulator_leaf_kinds", "root:hex", "prev_state_oid:hex?", "signatures:string", "checkpoint_oid:hex", "public_key:hex", "scope:string"]

[[event]]
name = "rea_recorded"
book = true
doc = "One REA control journaled (plan §4.1, §4.5): object is party, instrument, relationship, legal_entity, external_id (for an external id, code names the target it is bound to) or party_identifiers (a party's replaced identifier set; its values are never echoed); target is the recorded vertex (or edge) id; already_recorded is true when an exact retry found the recorded control and wrote nothing."
fields = ["object:string", "code:string", "target:hex", "control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "legal_entities"
book = true
doc = "The book's legal entities at known_at, in code order: each with its jurisdiction, functional unit, life span and the number of external ids it was created with."
fields = ["known_at:seq", "entities:[legal_entity_summary]"]


[[event]]
name = "effective_ownership"
book = true
doc = "One party's effective stake in another on a day (`fa party ownership`, plan §4.5): the exact sum over simple OWNS paths of at most max_depth edges of the product of their stakes, from relationships whose valid time covers as_of, in the REA graph known at known_at. stake is an exact num/den (0/1 when no path reaches); CONTROLS and RELATED_TO edges carry no stake."
fields = ["owner_vid:hex", "target_vid:hex", "as_of:date", "max_depth:int", "stake:string", "known_at:seq"]

[[event]]
name = "parties"
book = true
doc = "The book's parties at known_at, in code order, with the number of recorded relationship edges."
fields = ["known_at:seq", "parties:[party_summary]", "relationships:int"]

[[event]]
name = "instruments"
book = true
doc = "The book's instruments at known_at, in code order."
fields = ["known_at:seq", "instruments:[instrument_summary]"]

[[event]]
name = "account_lifecycle"
book = true
doc = "An account's life cycle moved by one journaled SchemaChange control (plan §4.3, §5.6): action is open, close or promote; already_recorded is true when an exact retry found the recorded control and wrote nothing. `roles` lists the account roles an opened account carries, each journaled after the open as its own role control (bead fa-kxc4); it is empty for close and promote."
fields = ["action:string", "code:string", "account:hex", "control_entry:hex", "recorded_at:seq", "already_recorded:bool", "roles:[account_role]"]

[[event]]
name = "journal_exported"
book = true
doc = "The committed journal at (known_at, effective_through) written in format by fa-formats with its export coordinate certificate (content_digest over the canonical journal, certificate_digest over the coordinate). files lists each output file with its byte length and digest; content carries it inline when no --out was given."
fields = ["format:string", "effective_through:date", "known_at:seq", "entries:int", "accounts:int", "content_digest:hex", "certificate_digest:hex", "out:string?", "files:[export_file]", "proof:ads_proof?"]

[[event]]
name = "export_verified"
book = true
doc = "An export (fa export) re-read with its format's reader, its coordinate certificate checked, and found byte for byte what fa export writes for this book at that coordinate (effective_through, known_at). reread names what the reader re-read and matched: journal (ads, saft, csv-gl: the whole journal, identical to the book's), balances (beancount, hledger: the same refolded balances), coordinate (an XBRL instance: its coordinate and calculation linkbase) or framing (an NDJSON stream: header, footer and row count). legs and refold_digest describe the book's journal the file matches; files lists each verified file with its length and digest."
fields = ["format:string", "file:string", "effective_through:date", "known_at:seq", "entries:int", "legs:int", "content_digest:hex", "certificate_digest:hex", "refold_digest:hex", "reread:string", "files:[export_file]"]

[[event]]
name = "proof_exported"
book = true
doc = "A raw portable proof from an existing recomputed checkpoint, the exact 80-byte checkpoint statement itself (kind checkpoint), or the state's TransparencyCheckpoint signed by the book's key (kind signed-checkpoint; signatures ed25519, trust checkpoint_public_key). checkpoint_bytes and next_checkpoint_bytes are hex statements; the latter is a consistency claim, not a trust anchor. checkpoint_public_key is the book's Ed25519 checkpoint key, the --key fa-verify judges a signed checkpoint with. bytes is full proof hex for inline output, otherwise null with a new binary file. No book write occurs. A raw statement needs external trust (signatures unsigned, trust external_checkpoint_required); scope and claim name the exact inclusion, prefix-completeness or balance predicate."
fields = ["kind:string", "scope:string", "state_oid:hex", "recorded_at:seq", "through_seq:seq", "leaf_count:int", "root:hex", "checkpoint_bytes:hex", "next_state_oid:hex?", "next_checkpoint_bytes:hex?", "signatures:string", "trust:string", "checkpoint_public_key:hex", "claim:object", "byte_len:int", "bytes:hex?", "file:string?"]

[[event]]
name = "bundle_produced"
book = true
doc = "An evidence bundle produced against a recorded checkpoint, with its detached production receipt signed by the book's key; nothing was written to the book. scope is prefix, account (one account's effective-day interval, proved complete by the signed scope index), entries (named entries, membership only), or report (native trial-balance certificate with complete authenticated payload prefix). digest is the bundle's domain-separated BLAKE3 digest (fa:bundle:v1 or fa:report-bundle:v1). bytes and receipt are complete hex for inline output, otherwise null with the new files file and receipt_file. checkpoint_public_key is the --key and verify the exact fa-verify command that checks both offline."
fields = ["scope:string", "digest:hex", "byte_len:int", "receipt_len:int", "balances:int", "inline_documents:bool", "checkpoint_public_key:hex", "bytes:hex?", "receipt:hex?", "file:string?", "receipt_file:string?", "verify:string"]

[[event]]
name = "doctor"
doc = "`fa doctor`: every check in order (registries, book_dir, keys, writer_lease, book, registers, availability, accumulator), each ok, warn, fail or skipped (what it needs is missing), with what it found and the fix when it is not ok. `healthy` is false when any check failed; the exit is then the first failing check's class and an `error` line follows."
fields = ["healthy:bool", "checks:[doctor_check]"]

[[event]]
name = "book_triage"
book = true
doc = "`fa triage`: the book's state. `health` is ok, or failing when derived state differs from the journal's refold (`derived` has the checks); `daemon` is serving (this answer came through the fad), absent, or held (with the holder). `pending_cells` counts register cells of open periods carrying reserved amounts. `due_holds` counts timed holds the latest tick has made due that no sweep has expired yet (plan §5.4, FA-CFG-02: still pending in every register); `due_reversals` counts scheduled reversals the latest tick has reached that the next reversal sweep mints, and `blocked_reversals` those whose period refuses the scheduler (reverse them by hand). `register_watermark_lag` lists each materialized period's register cache, its verified_through watermark and the journal entries after it; `open_drafts` and `drafts_awaiting_promotion` (open drafts holding planned intents, which an approver who is not the owner promotes); `finding_runs` counts recorded finding runs and `open_findings_by_severity` their findings still Open at the head, every severity listed. The envelope's next_actions are computed from this state, most urgent first and ranked for the caller's capability."
fields = ["health:string", "daemon:string", "periods:int", "periods_by_state:object", "open_periods:[string]", "accounts:int", "pending_cells:int", "due_holds:int", "due_reversals:int", "blocked_reversals:int", "derived:[doctor_check]", "register_watermark_lag:[register_lag]", "open_drafts:int", "drafts_awaiting_promotion:int", "finding_runs:int", "open_findings_by_severity:object"]

[[event]]
name = "next_step"
book = true
doc = "`fa next`: the most urgent step `fa triage` would list for the book now that the caller can run, as `command` (run it with the same --book) and `why`; both null when there is nothing to do. The envelope's next_actions carry the steps after it, ranked for the caller's capability (an Agent profile is never offered a trunk write; a write a draft can take is offered as opening that draft)."
fields = ["command:string?", "why:string?"]


[[event]]
name = "book_verification"
book = true
doc = "fa verify book's verdict, after each target's own event: green, and per target in the order run its verdict (pass, fail, error or skipped) and the failure or skip reason (empty on pass). green is true only when every target passed or was skipped for want of periods."
fields = ["green:bool", "targets:[verify_target]"]

[[event]]
name = "accumulator_verified"
book = true
doc = "Every existing accumulator state was recomputed from its journal prefix (entries, and evidence records after the state's evidence boundary) and every stored state belongs to the chain. status is verified or no_checkpoints; no_checkpoints makes no verification claim and verified_through is null. Otherwise verified_through names the newest checked prefix, never an implicit current-head claim. signatures is ed25519 when each state's signed TransparencyCheckpoint was reproduced from the journal prefix and the book's key, and unsigned when the stored state is the raw accumulator statement. scope is entry_prefix, the accumulator prefix in commit order. States are newest first."
fields = ["status:string", "signatures:string", "scope:string", "states_checked:int", "broken:string?", "verified_through:seq?", "states:[accumulator_state_check]", "unchained:[hex]"]

[[event]]
name = "registers_verified"
book = true
doc = "Every selected period's stored registers equal the refold at verified_through. Native cumulative daily usage is also verified at current head before these period checks. Stale means unread journal entries remain after that processed basis, not corruption; exit 8 still means a mismatch. Uninitialized empty caches have no verified_through."
fields = ["periods:[register_check]"]

[[event]]
name = "entities_verified"
book = true
doc = "Every selected period's per-legal-entity register refolds green against the journal at the head (FA-INV-01 per-entity): per account and unit the entity cells sum to the plain fold's cell, posted and pending; every committed entry of the period balances per unit and legal entity; in a multi-entity book every leg names a declared entity. A finding is exit 8, never a correction."
fields = ["periods:[entity_check]"]

[[event]]
name = "projections_verified"
book = true
doc = "Every decoded entry payload at known_at agrees with its immutable leg mirrors and HAS_LEG, POSTS_TO, IN_UNIT and FOR topology, including Pending and unpublished migration entries. edges_checked counts expected edges. Drift is sorted; applied counters and settlement edges have their own fold checker. Verification writes nothing and does not rebuild projections."
fields = ["known_at:seq","entries_checked:int","legs_checked:int","edges_checked:int","drift:[string]"]

[[event]]
name = "projections_rebuilt"
book = true
doc = "A leg-projection recovery derived from the journal at basis. dry_run=true previews the changes and writes nothing. Otherwise every change publishes in one commit at recorded_at, and projections and open items are then rechecked; wrote=false means the projections already equalled the journal, no sequence was consumed and recorded_at is null. Entries, payloads and settlement edges are never rewritten. This is a repair of derived state, not a certificate."
fields = ["dry_run:bool", "basis:seq", "recorded_at:seq?", "wrote:bool", "entries_checked:int", "legs_checked:int", "legs_created:int", "legs_repaired:int", "edges_created:int", "edges_repaired:int", "edges_retired:int"]

[[event]]
name = "outcomes_rebuilt"
book = true
doc = "Explicit common-idempotency recovery from verified native history at basis. dry_run=true previews and aborts without publishing. outcomes_created counts missing outcome records derived from immutable native entries; already_covered describes the prepared basis. Publication atomically retains those outcomes and coverage at recorded_at. An already-covered book consumes no sequence; wrote=false has recorded_at=null. Conflicting legacy keys or rewritten history refuse the complete recovery. Migration run keys are separate."
fields = ["dry_run:bool", "basis:seq", "recorded_at:seq?", "wrote:bool", "entries_checked:int", "outcomes_created:int", "already_covered:bool"]

[[event]]
name = "open_items_verified"
book = true
doc = "Every posted leg's applied mirror equals the open-item fold."
fields = ["known_at:seq", "legs_checked:int", "drift:[applied_drift]"]

[[event]]
name = "availability_verified"
book = true
doc = "Every limited account's expected LimitCell (the vertex at its derived identity) equals the refold from the journal — sums, generation, and its account_ref binding (plan §5.4–5.5); each account's availability in its normal-balance sign. Scope: only those expected cells are examined; LimitCell vertices that no limited account's identity references are not checked and not reported."
fields = ["known_at:seq", "accounts_checked:int", "cells_checked:int", "accounts:[account_availability]", "drift:[availability_drift]"]

[[event]]
name = "usage_verified"
book = true
doc = "Native cumulative daily usage was refolded from the complete retained history through known_at under current whole-book read and verify authority. charges_checked counts immutable unit charges; cells_checked counts UsageCell births keyed by original issuance, committed UTC day and native unit. The checker verifies charge sources, issuance lineage, time witnesses, cumulative generations and cell mirrors. Drift is sorted; verification writes nothing and never repairs usage."
fields = ["known_at:seq", "charges_checked:int", "cells_checked:int", "drift:[string]"]

[[event]]
name = "schedules_verified"
book = true
doc = "Every Schedule vertex and SCHEDULED_BY mirror agrees with the journal fold (plan §7.6): schedules_checked counts Schedule vertices examined; executed and cancelled count their derived statuses; drift lists any corrupt or mismatched mirrors."
fields = ["schedules_checked:int", "executed:int", "cancelled:int", "drift:[string]"]

[[event]]
name = "fx_conversion_verified"
book = true
doc = "Every FX-valued entry recorded at `known_at` recomputes (FA-INV-01 `base`, `base-residual`, `realized-fx`): `valued_entries` were checked, counted per FX law in `by_law`, each recomputed from the Rate documents it cites under the law row it names; a valued Reversal is the exact side-swap of the entry it reverses. `drift` is empty here; on drift the command exits 8 and the error's detail carries the same fields."
fields = ["known_at:seq", "valued_entries:int", "by_law:object", "drift:[fx_conversion_drift]"]

[[event]]
name = "periods_verified"
book = true
doc = "The complete native journal history through known_at was loaded and immutable Entry births verified before every Period's state and calendar mirrors were checked against its birth baseline and PeriodControl transitions (plan §7.3, FA-INV-02). Optional history_commits_checked and history_entries_checked report that complete native prefix; missing history, rewritten Entries or deleted birth declarations never produce this event. Version-2 books retain fiscal-year declarations independently of their projections. periods_checked counts Period vertices; optional legacy_periods counts version-1 periods checked against the original calendar-derived baseline without journaled creator provenance or whole-year loss detection; transitions_checked counts PeriodControl entries. periods lists refolded vs stored state; drift lists discrepancies."
fields = ["known_at:seq", "periods_checked:int", "legacy_periods:int?", "history_commits_checked:int?", "history_entries_checked:int?", "transitions_checked:int", "periods:[period_check]", "drift:[string]"]

[[event]]
name = "replay_verified"
book = true
doc = "The whole history replayed (plan §15.2, §16): every accounting commit's recorded rows through source_prefix replayed into a fresh scratch book, then checked against the source pair by pair (pairs_checked), entry by entry (entries_checked) and period fold by period fold (folds_checked). seq_map_digest binds the source-to-scratch sequence map. It proves the retained history reproduces the accounting state, not that the posting laws hold (rows are copied, not re-posted). Any difference is a verification failure (exit 8); history the scratch replay cannot reproduce, a divergence while replaying included, is FA-REF-134 (exit 5); neither is this event."
fields = ["source_prefix:seq", "commits:int", "pairs_checked:int", "entries_checked:int", "folds_checked:int", "seq_map_digest:hex"]

[[event]]
name = "registers_materialized"
book = true
doc = "A period's registers written from a fresh fold (derived state)."
fields = ["period:string", "cells:int", "pending_cells:int", "entries:int", "watermark:seq?", "fold_digest:hex", "recorded_at:seq"]

[[event]]
name = "registers_advanced"
book = true
doc = "Native posted/pending period registers advanced through the journal prefix. Cells and cursor publish atomically per period; wrote=false changes nothing and recorded_at is null. entries_decoded counts incremental decoding only; rebuilt=true reports a full journal refold instead. Damaged cache is refused. This is maintenance metadata, not a certified RegisterCheckpoint."
fields = ["period:string", "from:seq", "through:seq", "recorded_at:seq?", "entries_decoded:int", "rebuilt:bool", "wrote:bool", "cells:int", "pending_cells:int", "entries:int", "watermark:seq?", "fold_digest:hex"]

[[event]]
name = "entry"
book = true
doc = "One committed entry; when `found` is false every other field but `vid` is null."
fields = ["found:bool", "vid:string", "class:string?", "effective_date:date?", "recorded_at:seq?", "entry_digest:hex?", "proposal_digest:hex?", "description:untrusted_text?", "approvals:int?", "legs:[entry_leg]?", "supersedes:[lineage]?"]

[[event]]
name = "balance_explained"
book = true
doc = "A leaf account's register cells in one period at the `known_at` snapshot: the cells (one per unit, both columns), the fold they belong to (its digest and watermark), every contributing leg with its entry and recorded sequence, and the cells' known-at history. The legs re-add to the cells exactly or the command fails. With --certify, `certificate` identifies the retained native-read certificate emitted next; otherwise it is null."
fields = ["account:string", "account_vid:hex", "name:string", "type:string", "period:string", "known_at:seq", "watermark:seq?", "fold_digest:hex", "certificate:hex?", "cells:[explained_cell]", "contributions:[contribution]", "history:[cell_change]", "last_changed_at:seq?"]

[[event]]
name = "entry_explained"
book = true
doc = "An explained committed entry (`fa explain entry <vid>`): its payload, posting period, resolved legs with account codes and names, supersession lineage (both what it supersedes and any later entries that supersede it), cited evidence, cited REA event (`DERIVED_FROM`), and approval count."
fields = ["vid:hex", "entry_digest:hex", "proposal_digest:hex", "class:string", "effective_date:date", "period:string?", "recorded_at:seq", "principal:hex", "description:untrusted_text?", "approvals:int", "resolves:hex?", "disposition:string?", "legs:[explained_entry_leg]", "supersedes:[lineage]", "superseded_by:[lineage]", "evidence:[evidence_head]", "cited_event:event_summary?"]

[[event]]
name = "evidence_explained"
book = true
doc = "An entry's complete evidence closure (`fa explain evidence <entry-vid>`): the class's registered evidence policy minimum (`evidence_policy.toml`), every cited document with its commitment, intake grade, self-sourced status, Reviewed attestations, and SupplementalEvidence links, plus any ManualAssertion attestations over the entry's proposal digest, and whether the closure satisfies the class minimum. closure is the entry's provenance closure (plan §9.2): every member in canonical order (document, review, derivation, manual_assertion, approval, event, supersedes, principal, session, origin, plan_certificate, supplement, supplement_document) with its vertex, content digest, citation role and recording sequence (null for a bare reference), and two fa:closure:v1 digests: original_digest over the members the entry had as posted (recorded no later than it, no supplement), digest over all of them."
fields = ["entry:hex", "entry_digest:hex", "proposal_digest:hex", "class:string", "recorded_at:seq", "min_documents:int", "accepted_kinds:[string]", "accepts_self_sourced:bool", "accepts_manual_assertion:bool", "satisfied:bool", "documents:[explained_document]", "supplements:[evidence_supplement]", "manual_assertions:[explained_manual_assertion]", "closure:provenance_closure"]

[[event]]
name = "refusal_explained"
book = false
doc = "A refusal code from the embedded catalog (`refusal_catalog.toml`, `fa explain refusal <FA-REF-nnn>`): its exit code and class, law citation, message, remediation fix, and any cross-referenced admissibility matrix cells or SoD policy rows. Given an error's `refusal.id`, it expands that instance's code and echoes the id as `instance` (null for a bare code); the id is a citation, not a stored record."
fields = ["id:string", "instance:string?", "exit:int", "class:string", "cite:string", "message:string", "fix:string", "admissibility_cells:[explained_admissibility_cell]", "sod_rules:[explained_sod_rule]"]

[[event]]
name = "period_explained"
book = true
doc = "A fiscal period's state, boundaries, and recorded state-machine transition history (`fa explain period <code>`), plus the admissibility rules for posting into its current state."
fields = ["code:string", "kind:string", "state:string", "start:date", "end:date", "fiscal_year:int", "transitions:[period_transition_row]", "admissible_classes:[explained_admissibility_cell]"]

[[event]]
name = "register_explained"
book = true
doc = "A register cell's fold vs stored materialized state (`fa explain register <account-code> --period <code> [--unit <UNIT>] [--as-known-at HEAD|<seq>]`): the refolded cell, stored materialized cell, verification status (`green`, `cache_status`, `stale`, `lag_entries`), replayable checkpoint-cadence decision-card (`decision_card_digest`, `decision_card_bytes`), and contributing legs."
fields = ["account:string", "account_vid:hex", "name:string", "type:string", "period:string", "unit:string?", "known_at:seq", "watermark:seq?", "fold_digest:hex", "green:bool", "cache_status:string", "verified_through:seq?", "stale:bool", "lag_entries:int", "decision_card_digest:hex", "decision_card_bytes:hex", "cells:[explained_cell]", "contributions:[contribution]"]

[[event]]
name = "lineage_explained"
book = true
doc = "The complete `SUPERSEDES` lineage component containing `query_entry` (`fa explain lineage <entry-vid>`): topological steps with their registered `netting_law` (`supersession_kinds.toml`, plan §8.1), root entry, reversal/replacement status, and the net economic effect per `(account, unit)`."
fields = ["query_entry:hex", "root_entry:hex", "known_at:seq", "fully_reversed:bool", "replaced_by:hex?", "steps:[lineage_step]", "net_effect:[lineage_net_cell]"]

[[event]]
name = "documents"
book = true
doc = "The documents the book holds at known_at, in recorded order, as public metadata (plan §9.6): kind, media type, provenance grade, size and commitment; never their bytes (fa document read gates those). kind echoes --kind when one was given."
fields = ["kind:string?", "count:int", "documents:[document_summary]"]


[[event]]
name = "document_read"
book = true
doc = "A document read under the caller's capability (plan §9.7): `view` is `full` or `redacted`, `bytes_hex` carries the full content when unredacted, `text` wraps any UTF-8 content as `untrusted_text` with source `D:<oid>` (plan §9.3 prompt-injection boundary), and `disclosed_chunks`/`withheld_chunks`/`view_commit` describe a redacted view."
fields = ["oid:hex", "doc_commit:hex", "view:string", "kind:string", "mime:string?", "grade:string?", "size:int", "bytes_hex:hex?", "text:untrusted_text?", "disclosed_chunks:int?", "withheld_chunks:int?", "view_commit:hex?", "out:string?"]

[[event]]
name = "redacted_view_derived"
book = true
doc = "A redacted document view derived over the source document's 4 KiB chunk Merkle tree under a registered redaction contract (plan §9.7)."
fields = ["oid:hex", "view_vid:hex", "view_commit:hex", "contract:int", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "document_disclosure_exported"
book = true
doc = "A selective 4 KiB-chunk Merkle disclosure proof for one document (`fa:document-disclosure:v1`, plan §9.7) under current read, produce, and redaction authority."
fields = ["oid:hex", "doc_commit:hex", "kind:string", "document_length:int", "requested_chunks:[int]", "access:string", "contract:int?", "byte_len:int", "bytes:hex?", "out:string?"]

[[event]]
name = "evidence_disclosure_exported"
book = true
doc = "An end-to-end evidence disclosure proof (plan §9.7/§13.2) pairing a checkpoint entry-inclusion proof with a 4 KiB-chunk document disclosure proof."
fields = ["entry:hex", "entry_digest:hex", "document_oid:hex", "doc_commit:hex", "role:string", "state_oid:hex", "through_seq:seq", "requested_chunks:[int]", "access:string", "contract:int?", "inclusion_bytes:hex", "disclosure_bytes:hex?", "file:string?", "checkpoint_public_key:hex"]

[[event]]
name = "custody_transferred"
book = true
doc = "A journaled `CustodyEvent` transferring physical/logical custody of `oid` to `to` (plan §9.1)."
fields = ["oid:hex", "event_vid:hex", "index:int", "to:hex", "recorded_at:seq"]

[[event]]
name = "custody_chain"
book = true
doc = "The ordered chain of journaled `CustodyEvent` vertices (`receipt` then `transfer`) for `oid` (plan §9.1)."
fields = ["oid:hex", "events:[custody_event]"]

[[event]]
name = "legal_hold_placed"
book = true
doc = "A journaled `LegalHold` (`HoldControl(Place)`, plan §8.5/§14.6) pinning its `subjects` against erasure, GC, and retention expiry. A book-scope hold has no subjects and a `through` sequence: it pins every entry, document and party recorded at or before it (null for a subject hold)."
fields = ["hold_vid:hex", "subjects:[hex]", "through:seq?", "authority:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "legal_hold_release_planned"
book = true
doc = "A sealed legal-hold release plan prepared for independent Human approval (`fa approve --proposal <proposal_digest>`) before releasing `hold_vid`."
fields = ["hold_vid:hex", "proposal_digest:hex", "bytes:hex", "plan:string?"]

[[event]]
name = "legal_hold_released"
book = true
doc = "A journaled `HoldControl(Release)` releasing `hold_vid` after independent Human approval (plan §8.5/§14.6)."
fields = ["release_vid:hex", "hold_vid:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "legal_hold"
book = true
doc = "The current state and subject closure of one `LegalHold` vertex. `through` is a book-scope hold's sequence (it pins everything recorded at or before it), null for a hold that names its subjects."
fields = ["hold_vid:hex", "authority:hex", "subjects:[hex]", "through:seq?", "issued_by:hex", "placed_at:seq", "active:bool", "release_vid:hex?", "released_at:seq?"]

[[event]]
name = "legal_holds"
book = true
doc = "The legal holds active on one subject (an entry, a document or another held vertex), ascending by hold vid: what blocks its erasure. An empty list means no active hold; `fa document hold show <hold-vid>` gives each hold's authority and subject closure."
fields = ["subject:hex", "holds:[hex]"]

[[event]]
name = "attestation_recorded"
book = true
doc = "A journaled attestation vertex (`Reviewed`, `ManualAssertion`, `RegisterEquals`, `Confirmed` or `Represented`, plan §9.3–§9.4, §11.12) or its live holds evaluation."
fields = ["attestation_vid:hex", "claim:string", "subject:hex", "signed_digest:hex?", "recorded_at:seq", "already_recorded:bool", "holds:bool?"]

[[event]]
name = "evidence_attached"
book = true
doc = "A journaled SupplementalEvidence (plan §9.2 AttachEvidence): documents that support a committed entry, recorded after it with SUPPLEMENTS and EVIDENCED_BY edges. The entry and its own evidence list are unchanged; `fa explain evidence` lists the supplement. already_recorded marks the same attachment recorded before."
fields = ["supplement_vid:hex", "entry:hex", "entry_digest:hex", "documents:[evidence_ref]", "body_digest:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "import_recorded"
book = true
doc = "A journaled `ImportControl` run receipt (plan §9.3) recording a batch of documents from a registered intake source in one commit, with `oids_root` and `receipt_hash`."
fields = ["run_vid:hex", "source_kind:string", "document_count:int", "byte_count:int", "oids_root:hex", "receipt_hash:hex", "recorded:[hex]", "already_held:[hex]", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "import_receipt"
book = true
doc = "The journaled `RunReceipt` of an `ImportControl` entry (`fa import receipt <run-vid>`), optionally verified against presented `--evidence <oid>...` (`FA-REF-115` on mismatch)."
fields = ["run_vid:hex", "source_kind:string", "document_count:int", "byte_count:int", "oids_root:hex", "receipt_hash:hex", "recorded_at:seq", "verified:bool"]

[[event]]
name = "migration_controlled"
book = true
doc = "A journaled `MigrationControl` transition (`open`, `finalize`, or `abandon`, plan §8.6) on `run_vid`."
fields = ["run_vid:hex", "run_key:string", "action:string", "from:string?", "to:string", "control_entry:hex", "recorded_at:seq", "already_recorded:bool", "chunk_count:int", "tie_out_digest:hex"]

[[event]]
name = "migration_planned"
book = true
doc = "A sealed migration plan prepared for `stage`, `finalize` (including the verified `tie_out_digest` for two-approver SoD), or `abandon`."
fields = ["run_vid:hex", "action:string", "proposal_digest:hex", "tie_out_digest:hex?", "chunk_count:int", "bytes:hex", "plan:string?"]

[[event]]
name = "migration_run"
book = true
doc = "The state, staged chunk list, and live opening-balance tie-out of a `MigrationRun` (plan §8.6)."
fields = ["run_vid:hex", "run_key:string", "source_system:string", "mode:string", "state:string", "opened_at:seq", "opening_date:date", "trial_balance_oid:hex", "chunk_count:int", "chunks:[migration_chunk]", "tie_out_digest:hex", "ties_out:bool", "mismatches:[migration_mismatch]"]

[[event]]
name = "migration_import_prepared"
book = true
doc = "An OpeningOnly, PeriodBalances or FullDetail legacy import retains exact sealed chunk proposals after the mapped source ties to every independently declared trial balance. PeriodBalances selects opening stock and preserves later source dates; FullDetail also preserves earlier history, explicit special periods and the cumulative detail_base chain. FullDetail identifies sole_opening_source and each chunk's counts_after_finalize. opening_period is the run's calendar Opening code; sole-source FullDetail posts no own Opening chunk and does not require that row or lock. Each mode has a distinct package domain; existing OpeningOnly and PeriodBalances bytes are unchanged. package_oid is the resume handle; identical preparation reuses the first package and approval digests. recorded_count and ties_out describe staged chunks. The package creates no accounting legs; chunks and finalization still require native independent approvals."
fields = ["package_oid:hex", "package_commit:hex", "run_vid:hex", "run_key:string", "run_body_digest:hex", "source_oid:hex", "source_commit:hex", "format:string", "mode:string", "opening_date:date", "opening_period:string", "row_count:int", "chunk_count:int", "recorded_count:int", "run_state:string", "ties_out:bool", "chunks:[legacy_migration_chunk]", "sole_opening_source:bool?", "recorded_at:seq", "already_recorded:bool", "plan:string?"]

[[event]]
name = "migration_import_package"
book = true
doc = "A retained OpeningOnly, PeriodBalances or FullDetail import package after current full-source authorization and exact replay of its original source, sealed mapping, opening selection, explicit period selections, run body and complete proposals. Each chunk carries its original approval digest and staged sequence when present; PeriodBalances and FullDetail also name its effective period. Replay independently checks the opening and every cumulative trial balance, including FullDetail's special-period ordering and opening boundary. FullDetail reports sole_opening_source and per-chunk counts_after_finalize; its opening_period is a calendar code even when a sole-source run has no own Opening row. ties_out describes staged native chunks; only approved finalization activates eligible chunks in accounting folds."
fields = ["package_oid:hex", "package_commit:hex", "run_vid:hex", "run_key:string", "run_body_digest:hex", "source_oid:hex", "source_commit:hex", "format:string", "mode:string", "opening_date:date", "opening_period:string", "row_count:int", "chunk_count:int", "recorded_count:int", "run_state:string", "ties_out:bool", "chunks:[legacy_migration_chunk]", "sole_opening_source:bool?"]

[[event]]
name = "migration_import_staged"
book = true
doc = "The selected retained migration proposal was admitted through native Migration posting and independent approval laws, or its exact retry was already recorded. Staged entries remain invisible to ordinary balances until the run is independently finalized. ready_to_finalize means this Open run contains every exact package chunk and its declared trial balance ties; it is not finalization authority."
fields = ["package_oid:hex", "run_vid:hex", "chunk_index:int", "entry_vid:hex", "proposal_digest:hex", "recorded_at:seq", "already_recorded:bool", "run_state:string", "recorded_count:int", "chunk_count:int", "ready_to_finalize:bool"]

[[event]]
name = "allocation_reviewed"
book = true
doc = "A canonical allocation review artifact (`fa:allocation-review:v1` or `fa:balance-allocation-review:v1`, plan §6.3/§10.1) binding the allocation rule, resolved account vertices, exact target leg amounts, residual leg, canonical driver workpaper OID (`driver_document_oid`), `review_digest`, and sealed `proposal_digest`."
fields = ["kind:string", "source:string", "source_period:string?", "source_digest:hex?", "source_side:string", "total:amount", "method:string", "review_digest:hex", "proposal_digest:hex", "driver_document_oid:hex", "legs:[plan_leg]", "bytes:hex", "file:string?"]

[[event]]
name = "settlement_reviewed"
book = true
doc = "A canonical settlement review artifact (`fa:settlement-review:v1` or `fa:settlement-group-review:v1`, plan §5.7) binding the open-item snapshot (`known_at`), exact invoice applications (`applications`), resulting entry legs (`legs`), `review_digest`, and sealed `proposal_digest`."
fields = ["kind:string", "known_at:seq", "review_digest:hex", "proposal_digest:hex", "applications:[settlement_application]", "legs:[plan_leg]", "bytes:hex", "file:string?"]

[[event]]
name = "event_recorded"
book = true
doc = "A journaled REA `Event` vertex (`fa event record`, plan §4.1/§9.1) linking participant parties, economic resources, and evidence documents."
fields = ["event_vid:hex", "code:string", "kind:string", "occurred_on:date", "event_digest:hex", "control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "event_shown"
book = true
doc = "One recorded REA `Event` vertex (`fa event show <code|vid>`), with its participants, resources, evidence citations, and external IDs."
fields = ["detail:event_detail"]

[[event]]
name = "events_listed"
book = true
doc = "All recorded REA `Event` vertices at `known_at` (`fa event list`)."
fields = ["known_at:seq", "count:int", "events:[event_summary]"]

# ---------------------------------------------------------------------------
# Shapes: the objects events nest.
# ---------------------------------------------------------------------------

[[shape]]
name = "event_summary"
doc = "Summary of a recorded REA `Event` vertex."
fields = ["vid:hex", "code:string", "kind:string", "occurred_on:date", "event_digest:hex", "recorded_at:seq"]

[[shape]]
name = "event_detail"
doc = "Complete record of an REA `Event` vertex."
fields = ["vid:hex", "code:string", "kind:string", "occurred_on:date", "description:string", "participants:[hex]", "resources:[event_resource]", "evidence:[evidence_head]", "external_ids:[external_id]", "event_digest:hex", "recorded_at:seq"]

[[shape]]
name = "event_resource"
doc = "One economic resource delta on an REA `Event`."
fields = ["label:string", "instrument:hex?", "amount:amount"]

[[shape]]
name = "external_id"
doc = "An external system identifier pair `(system, id)`."
fields = ["system:string", "id:string"]

[[shape]]
name = "settlement_application"
doc = "One payment leg's open-item application summary in a reviewed settlement artifact."
fields = ["payment_leg:int", "account:string", "applied_count:int", "unapplied:amount"]

[[shape]]
name = "custody_event"
doc = "One journaled custody event (`receipt` or `transfer`) on a document."
fields = ["index:int", "kind:string", "holder:hex", "from:hex?", "digest:hex", "prev_digest:hex", "recorded_at:seq"]

[[shape]]
name = "migration_chunk"
doc = "One staged migration chunk entry and its proposal digest."
fields = ["vid:hex", "proposal_digest:hex", "recorded_at:seq"]

[[shape]]
name = "legacy_migration_chunk"
doc = "One exact retained migration proposal: its native entry identity, approval digest, effective date, original source document date, mapped legs and optional staged sequence. PeriodBalances and FullDetail include effective_period for the native destination. FullDetail counts_after_finalize identifies chunks eligible to affect balances and open items once the run is finalized: all sole-source detail, or separate opening stock and detail dated on or after the non-sole opening boundary. Earlier non-sole detail remains available for drilldown; an Abandoned run always reports false because it can never activate. This flag does not assert that an Open run is already visible. A null or absent recorded_at means this package chunk has not been staged."
fields = ["index:int", "entry_vid:hex", "proposal_digest:hex", "effective_date:date", "document_date:date?", "leg_count:int", "recorded_at:seq?", "legs:[legacy_migration_leg]", "effective_period:string?", "counts_after_finalize:bool?"]

[[shape]]
name = "legacy_migration_leg"
doc = "One mapped leg of a retained migration proposal; amount is positive in its native unit and side gives debit or credit."
fields = ["index:int", "account:string", "side:string", "amount:amount"]

[[shape]]
name = "migration_mismatch"
doc = "One account/unit difference between a migration run's declared trial balance and the folded staged chunks."
fields = ["period:string?", "account_code:string", "unit:string", "declared:amount", "folded:amount"]

[[shape]]
name = "doctor_check"
doc = "One check of `fa doctor` (or of `fa triage`'s derived state): its name, its status (ok, warn, fail, skipped), what it found, and the exact fix when it is not ok."
fields = ["name:string", "status:string", "detail:string", "fix:string?"]


[[shape]]
name = "accumulator_state_check"
doc = "One state's recomputation result. evidence_after_seq is the state's evidence boundary (null: entries alone); it must be the boundary the state's place on the chain implies. leaf_kinds is the recomputed prefix's leaves by record kind, null when the state was refused before its prefix was read. finding is null on success; verification failure reports the same shape in its detail."
fields = ["oid:hex", "through_seq:seq", "recorded_at:seq", "leaf_count:int", "evidence_after_seq:seq?", "leaf_kinds:accumulator_leaf_kinds?", "finding:string?"]

[[shape]]
name = "accumulator_leaf_kinds"
doc = "An accumulator prefix's leaves by record kind (fa-va02); the counts sum to its leaf_count."
fields = ["entries:int", "attestations:int", "import_receipts:int", "custody_transfers:int", "supplemental_evidence:int"]

[[event]]
name = "procedure_list"
book = false
doc = "Every registered Lantern procedure (procedures.toml): id, version, claim class, evidence row, tie-break policy, complexity bound, calibration status, how it uses the run's effective date (effective_through: required, optional, or not_taken, which refuses --effective-through), declared inputs and parameters with their pinned defaults."
fields = ["procedures:[procedure_row]", "count:int"]

[[event]]
name = "procedure_run"
book = true
doc = "One Lantern procedure run over the trunk as known at `known_at` (and, for the historical folds, through `effective_through`): the parameters and inputs it ran with, the digests an opposing expert reproduces, the population and work counted, and the findings sorted by severity then statistic then citations. A finding is a statistic with typed citations, never a conclusion."
fields = ["procedure:string", "version:int", "claim:string", "evidence:string", "known_at:seq", "effective_through:date?", "parameters:[procedure_parameter]", "inputs:[procedure_input]", "parameters_digest:hex", "inputs_digest:hex", "population:int", "work:lantern_work", "findings:[finding]", "finding_count:int", "findings_digest:hex"]

[[event]]
name = "sample_drawn"
book = true
doc = "One reproducible audit sample (uniform, MUS or stratified) of an account's open items at `known_at` (and through `as_of` when given): the population's count, total and digest, the declared seed and parameters, the selected items in population order, the excluded opposite-side items, and the sample_digest over method, population digest, seed, parameters and selected ids. MUS rows carry their basis (top_stratum or systematic) and, for a systematic hit, the cumulative dollar it landed on. A stratified sample's population digest binds each item's declared band; it lists every declared stratum (empty ones included) with its bounds, population, standard deviation and allocated size, the allocation used (neyman, or proportional when the decision card took its pinned fallback), the card's reason, and the canonical decision card and its digest; its parameters bind the bands, the allocation and every stratum's counts. Nothing is written to the book."
fields = ["method:string", "account:string", "unit:string", "as_of:date?", "known_at:seq", "seed:int", "population_count:int", "population_total:amount", "population_digest:hex", "parameters:string", "size:int?", "interval:amount?", "start:amount?", "top_stratum_count:int?", "systematic_count:int?", "tolerable:amount?", "expected:amount?", "confidence_percent:int?", "selected_count:int", "selected:[sample_item]", "excluded:[sample_excluded]", "sample_digest:hex", "replay_command:string", "allocation:string?", "strata:[sample_stratum]?", "decision_reason:string?", "decision_card:hex?", "decision_card_digest:hex?"]

[[shape]]
name = "sample_item"
doc = "One selected population item: its id (entry vid hex and five-digit leg ordinal), entry and ordinal, open amount as book value, for MUS its selection basis and the cumulative dollar hit (null for top-stratum items and uniform samples), and for a stratified sample its declared stratum."
fields = ["item_id:string", "entry:hex", "ordinal:int", "book_value:amount", "basis:string?", "hit:amount?", "stratum:string?"]

[[shape]]
name = "sample_stratum"
doc = "One declared stratum of a stratified sample: its name (b01 upward, in band order), the bound it lies above (null for b01) and at most (null for the last), its population count, the standard deviation of its book values (integer square root of the exact population variance; null when empty), and the sample size allocated to it."
fields = ["stratum:string", "above:amount?", "at_most:amount?", "population_count:int", "std_dev:amount?", "allocated:int"]

[[event]]
name = "engagement_opened"
book = true
doc = "An engagement was journaled by an EngagementControl Open record (or the identical engagement was already open: then nothing was written). Its materiality parameters are stated by the auditor, never judged by the system."
fields = ["engagement:engagement_summary", "control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "engagements"
book = true
doc = "Every engagement of the book, by opening sequence."
fields = ["engagements:[engagement_summary]"]

[[event]]
name = "engagement_detail"
book = true
doc = "One engagement and every proposed adjustment it journaled, by number, each with its legs, state and decision; its workpaper index in filing order; its documentation completion (null until journaled); every carry-forward of a prior engagement's misstatements in journal order (the last governs the summary); and the Lantern findings filed in its index in filing order. Every proposal, decision, workpaper, carry-forward and finding journaled after the completion is marked added_after_completion (AS 1215.16)."
fields = ["engagement:engagement_summary", "proposals:[proposal_row]", "workpapers:[engagement_workpaper]", "documentation:documentation_completion?", "carry_forwards:[engagement_carry_forward]", "findings:[engagement_finding]"]

[[event]]
name = "engagement_workpaper_filed"
book = true
doc = "A document the book holds was filed in the engagement's workpaper index by an EngagementControl File record (or the same filing was already recorded: then nothing was written). A document is filed once; after the documentation completion the filing is an addition after completion and says so."
fields = ["engagement:string", "document:hex", "control_entry:hex", "recorded_at:seq", "added_after_completion:bool", "already_recorded:bool"]

[[event]]
name = "engagement_documentation_completed"
book = true
doc = "The engagement's documentation completion was journaled by an EngagementControl Complete record, once, within 45 days after the report release date (AS 1215.15), or the identical completion was already recorded. Every later record of the engagement is an addition after completion."
fields = ["engagement:string", "documentation:documentation_completion", "control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "engagement_finding_filed"
book = true
doc = "A Lantern finding of the book was filed in the engagement's index by an EngagementControl File record (plan §11.12), or the same filing was already recorded; filed after the documentation completion, it is marked added_after_completion (AS 1215.16)."
fields = ["engagement:string", "finding:hex", "control_entry:hex", "recorded_at:seq", "added_after_completion:bool", "already_recorded:bool"]

[[event]]
name = "engagement_carry_forward_recorded"
book = true
doc = "An EngagementControl CarryForward record journaled that the prior engagement's uncorrected misstatements carry into this one (plan §11.12, SAB 108), with the prior proposals the auditor states turned around through this period's income and those an out-of-period correction here corrected; or the identical carry-forward was already recorded. The latest carry-forward governs fa engagement sud."
fields = ["engagement:string", "prior:string", "turned_around:[int]", "corrected:[int]", "control_entry:hex", "recorded_at:seq", "added_after_completion:bool", "already_recorded:bool"]

[[event]]
name = "engagement_sud"
book = true
doc = "The summary of uncorrected misstatements of one engagement (plan §11.12 audit.sud): the effect of each passed proposal, and of each booked one whose entry was since reversed or replaced, had it been booked and stood, each out-of-period correction in scope (out_of_period: a standing Adjusting entry posted with prior_period_error, plan §8.2, which misstates this period's income), each prior engagement item the latest carry-forward brings (carried_from names the prior engagement, null without one, and prior_period_carry_forward says whether there is one; carried lists its uncorrected proposals with what became of them: Uncorrected at this period's end, TurnedAround through this period's income, or Corrected here by an out-of-period correction), the rollover total (the proposals, the out-of-period corrections and the turned-around items) and the iron-curtain total (the proposals and the still-uncorrected carried items: an out-of-period correction leaves the period-end balance sheet corrected), and mechanical comparisons with the stated parameters under either method. The materiality judgment is the auditor's, not this report's. rollover_lines attributes the uncorrected proposals and the out-of-period corrections, reversed, to the lines of an income statement definition and iron_curtain_lines the uncorrected proposals to those of a balance sheet definition (--definition; the registered income-statement and balance-sheet by default), each line under its own sign and every formula line computed as the statement computes it; a carry-forward's turned-around items are on the income statement lines, reversed, and its still-uncorrected items on the balance sheet lines, their income legs on the equity account the book's closing routes send them to (refused, naming the account, without a route)."
fields = ["engagement:engagement_summary", "unit:string", "items:[sud_item]", "out_of_period:[sud_out_of_period]", "carried_from:string?", "carried:[sud_carried]", "rollover_income:amount", "iron_curtain:statement_effect", "prior_period_carry_forward:bool", "exceeds_performance:bool", "exceeds_overall:bool", "rollover_lines:sud_statement", "iron_curtain_lines:sud_statement"]

[[event]]
name = "adjustment_proposed"
book = true
doc = "A draft correcting entry was journaled in an engagement by an EngagementControl Propose record (or the identical proposal was already recorded). It never posts; it is booked or passed later, once."
fields = ["proposal:proposal_row", "control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "adjustment_decided"
book = true
doc = "A proposed adjustment was booked (the committed entry that made the correction, compared leg for leg) or passed (with its registered reason) by an EngagementControl record, or the identical decision was already recorded."
fields = ["proposal:proposal_row", "control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "sample_evaluated"
book = true
doc = "The Stringer evaluation of one re-drawn MUS sample (same account, seed, interval, as_of and known_at) against the auditor's value for every selected item: the confidence, the sample's digests, the counts, the exact-then-ceiling components (basic precision, most likely error, incremental allowance) and the upper misstatement limit, with its exact value in minor units, and each overstated item with its tainting and rank (top-stratum items carry their overstatement in full, without a tainting). A statistic for the auditor's conclusion, not the conclusion. Nothing is written to the book."
fields = ["account:string", "unit:string", "as_of:date?", "known_at:seq", "seed:int", "interval:amount", "confidence_percent:int", "tolerable:amount?", "expected:amount?", "population_digest:hex", "sample_digest:hex", "sample_size:int", "misstatement_count:int", "understatement_count:int", "top_stratum_misstatement:amount", "basic_precision:amount", "most_likely_error:amount", "incremental_allowance:amount", "upper_misstatement_limit:amount", "upper_misstatement_limit_exact:string", "misstatements:[sample_misstatement]"]

[[shape]]
name = "sample_misstatement"
doc = "One overstated sample item: book and audited values, the overstatement, whether it is in the top stratum, and for the other items the exact tainting (overstatement over book value, as numerator/denominator) and its rank among the taintings (1 is the largest)."
fields = ["item_id:string", "book_value:amount", "audited_value:amount", "overstatement:amount", "top_stratum:bool", "tainting:string?", "rank:int?"]

[[shape]]
name = "engagement_summary"
doc = "One engagement: its id and vertex, kind, firm principal, scope periods, the stated materiality parameters in its unit, the report release day, state, who opened it and when, its next proposal number, and how many proposals are proposed, booked and passed."
fields = ["engagement:string", "vid:hex", "kind:string", "firm_principal:hex", "scope_periods:[string]", "unit:string", "overall:amount", "performance:amount", "clearly_trivial:amount", "report_release:date?", "state:string", "opened_at:seq", "opened_by:hex", "next_proposal:int", "proposed:int", "booked:int", "passed:int"]

[[shape]]
name = "statement_effect"
doc = "What booking a correction would change, in one unit: net income (positive raises it), assets (debits less credits), liabilities and equity (credits less debits)."
fields = ["income:amount", "assets:amount", "liabilities:amount", "equity:amount"]

[[shape]]
name = "sud_carried"
doc = "One prior engagement's uncorrected proposal carried into the summary (SAB 108): its number in the prior engagement and its date; what became of it as the latest carry-forward states (Uncorrected, TurnedAround or Corrected); what correcting it would change now in the engagement's unit (an uncorrected item at this period's end, its prior income in opening retained earnings; a turned-around one in this period's income against opening retained earnings; a corrected one nothing); whether every line is within the stated clearly trivial threshold; and the other units its legs carry."
fields = ["prior_number:int", "effective_date:date", "carried:string", "effect:statement_effect", "clearly_trivial:bool", "other_units:[string]"]

[[shape]]
name = "engagement_finding"
doc = "One Lantern finding in an engagement's index: the finding's vid, its File record, sequence and principal, and whether it was filed after the documentation completion (AS 1215.16)."
fields = ["finding:hex", "record:hex", "filed_at:seq", "filed_by:hex", "added_after_completion:bool"]

[[shape]]
name = "engagement_carry_forward"
doc = "One journaled carry-forward of an engagement: the prior engagement, the prior proposals stated turned around and corrected, its record, sequence and principal, and whether it was recorded after the documentation completion."
fields = ["prior:string", "turned_around:[int]", "corrected:[int]", "record:hex", "recorded_at:seq", "recorded_by:hex", "added_after_completion:bool"]

[[shape]]
name = "sud_out_of_period"
doc = "One out-of-period correction in the summary of uncorrected misstatements (plan §8.2, SAB 108): the standing Adjusting entry that corrected an earlier period's error in this period, its date, the period the error belongs to, what moving it out of this period's income would change (its income effect reversed, against opening retained earnings in equity), whether every line is within the stated clearly trivial threshold, and the other units its legs carry (listed, never converted)."
fields = ["entry:hex", "effective_date:date", "relates_to:string", "effect:statement_effect", "clearly_trivial:bool", "other_units:[string]"]

[[shape]]
name = "sud_item"
doc = "One uncorrected proposal in the summary of uncorrected misstatements: its number and date; why it is uncorrected, either the registered reason it was passed or, for a booking whose entry was since reversed or replaced, the booked entry and the entry that superseded it; its statement effect in the engagement's unit; whether every line is within the stated clearly trivial threshold; and the other units its legs carry (listed, never converted)."
fields = ["number:int", "effective_date:date", "reason:string?", "booked_entry:hex?", "superseded_by:hex?", "effect:statement_effect", "clearly_trivial:bool", "other_units:[string]"]

[[shape]]
name = "sud_statement"
doc = "The summary of uncorrected misstatements over one statement definition's lines (plan §11.12, per statement line): the definition and its title, and every line in order with the amount it would change by had every uncorrected proposal been booked, in the engagement's unit."
fields = ["definition:string", "title:string", "lines:[sud_line]"]

[[shape]]
name = "sud_line"
doc = "One statement line's share of the uncorrected misstatements, under the line's own sign (a debit line rises with debits, a credit line with credits); a formula line adds and subtracts the lines it names."
fields = ["code:string", "label:string", "amount:amount"]

[[shape]]
name = "proposal_leg"
doc = "One leg of a proposed correcting entry: side, the account's code and vertex, and the amount."
fields = ["side:string", "account:string?", "account_vid:hex", "amount:amount"]

[[shape]]
name = "proposal_decision"
doc = "How a proposal was decided: book (the committed entry that made the correction) or pass (the registered reason it was left uncorrected), with the record, its sequence and who decided. superseded_by names the entry that has since reversed or replaced a booked entry: the decision stays on the record, and the proposal is uncorrected again."
fields = ["kind:string", "entry:hex?", "reason:string?", "record:hex", "recorded_at:seq", "decided_by:hex", "superseded_by:hex?", "added_after_completion:bool"]

[[shape]]
name = "proposal_row"
doc = "One proposed adjustment: its engagement and number, vertex, the effective date and legs of the draft correcting entry (which never posts), the Propose record, its sequence and principal, its state (proposed, booked or passed), and its decision."
fields = ["engagement:string", "number:int", "vid:hex", "effective_date:date", "legs:[proposal_leg]", "record:hex", "proposed_at:seq", "proposed_by:hex", "state:string", "decision:proposal_decision?", "added_after_completion:bool"]

[[shape]]
name = "engagement_workpaper"
doc = "One document in an engagement's workpaper index: its oid, the File record, its sequence and principal, whether it was filed after the documentation completion (AS 1215.16), and the Confirmed or Represented attestation over it, if any."
fields = ["document:hex", "record:hex", "filed_at:seq", "filed_by:hex", "added_after_completion:bool", "confirmation:workpaper_confirmation?", "representation:workpaper_representation?"]

[[shape]]
name = "workpaper_confirmation"
doc = "A confirmation in the workpaper index (AS 2310): the Confirmed attestation, the confirming party, the balance and date it confirmed, who attested it, who received the confirmation document (its custody receipt), and whether it is audit-grade for this engagement: true only when the engagement's firm principal received it."
fields = ["attestation:hex", "by_party:hex", "balance:amount", "as_of:date", "attested_by:hex", "received_by:hex?", "audit_grade:bool"]

[[shape]]
name = "workpaper_representation"
doc = "A management representation letter in the workpaper index (AS 2805): the Represented attestation, how many claims it represents (each sealed under the book key), as of when, and who attested it."
fields = ["attestation:hex", "claims:int", "as_of:date", "attested_by:hex"]

[[shape]]
name = "documentation_completion"
doc = "An engagement's journaled documentation completion (AS 1215.15): the report release date, the completion date at most 45 days after it, and its Complete record, sequence and principal."
fields = ["report_release:date", "completion_date:date", "record:hex", "recorded_at:seq", "completed_by:hex"]

[[shape]]
name = "sample_excluded"
doc = "An open item on the account's other side, outside the positive-value population, to be tested separately."
fields = ["item_id:string", "entry:hex", "ordinal:int", "side:string", "open:amount"]

[[shape]]
name = "procedure_row"
doc = "One procedures.toml row."
fields = ["id:string", "version:int", "claim:string", "evidence:string", "tie_break:string", "complexity:string", "calibration:string", "summary:string", "effective_through:string", "inputs:[procedure_input_decl]", "parameters:[procedure_parameter_decl]"]

[[shape]]
name = "procedure_claim"
doc = "`fa capabilities`: one registered Lantern procedure and the claim class of its output (doctrine 12: a score or threshold test is `statistical`, never an invariant); `fa procedure list` has the full row."
fields = ["id:string", "version:int", "claim:string", "summary:string"]

[[shape]]
name = "procedure_input_decl"
doc = "A declared input: its name, kind (date, period, account, entry) and meaning."
fields = ["name:string", "kind:string", "meaning:string"]

[[shape]]
name = "procedure_parameter_decl"
doc = "A registered parameter with its pinned default (the decision card's deterministic fallback)."
fields = ["name:string", "default:int", "meaning:string"]

[[shape]]
name = "procedure_parameter"
doc = "A parameter value the run used."
fields = ["name:string", "value:int"]

[[shape]]
name = "procedure_input"
doc = "An input the run used, as its canonical string (handles are 32-hex vids)."
fields = ["name:string", "value:string"]

[[shape]]
name = "lantern_work"
doc = "Work counted while the procedure ran: the complexity witness against the registry's declared bound."
fields = ["entries:int", "legs:int", "comparisons:int"]

[[shape]]
name = "finding"
doc = "One finding: its severity band, the statistic it rests on, its typed citations (every one resolves in the book) and a narrative built only from resolved handles and numbers."
fields = ["severity:string", "statistic:statistic", "cites:[cite]", "narrative:string"]

[[shape]]
name = "statistic"
doc = "The test statistic in fixed point (`value` at `scale` decimal places) with the size of the population it was computed over."
fields = ["name:string", "value:int", "scale:int", "population:int"]

[[shape]]
name = "cite"
doc = "A typed citation: `kind` is entry, leg, account, period, document, principal, approval or attestation, and exactly the fields that kind carries are non-null. Attestation references name their native Attestation vertex; they are never presented as Entry references."
fields = ["kind:string", "entry:hex?", "ordinal:int?", "account:hex?", "period:string?", "document:hex?", "principal:hex?", "approval:hex?", "attestation:hex?"]

[[shape]]
name = "evidence_ref"
doc = "One citation: the document, its commitment, and the EVIDENCED_BY role (evidence_policy.toml [[role]])."
fields = ["document_oid:hex", "doc_commit:hex", "role:string"]

[[shape]]
name = "alias"
doc = "A spelling that expands in the verb position."
fields = ["name:string", "expands:string"]

[[shape]]
name = "exit_code"
doc = "One row of the exit-code dictionary."
fields = ["code:int", "name:string", "meaning:string"]

[[shape]]
name = "robot_mode"
doc = "How to switch on robot mode and where the schema lives."
fields = ["flag:string", "envelope:string", "schema:string"]

[[shape]]
name = "capability_model"
doc = "The capability model this build enforces (plan §14.2, §14.4): the closed op vocabulary, the base profiles and the ops each can never hold, the caveats' semantics, the embedded posture's binding, and the digest of the policy (sod_policy.toml) a PolicyActivation must name."
fields = ["ops:[string]", "profiles:[capability_profile]", "ceilings:text", "expiry:text", "agent_trunk:text", "binding:capability_binding", "policy_oid:hex"]

[[shape]]
name = "capability_profile"
doc = "A base profile and the ops a capability under it can never hold."
fields = ["name:string", "forbidden_ops:[string]"]

[[shape]]
name = "capability_binding"
doc = "The actual execution binding: embedded-owner self-issues Human operations per command; MCP uses one trusted launch capability and exposes no per-call identity or authority flags. Neither posture authenticates the operator."
fields = ["commitment:hex", "flags:[string]", "posture:string", "profile:string", "ceilings:[string]", "expires_at:seq?", "trust_boundary:text"]

[[shape]]
name = "authority"
doc = "Execution authority: mcp-launch-config names the fixed principal, launch template (agent or preparer), and exact bounded ops. issued-token names a session bound to a holder's issued token (fa-mcp --token; fa --token): the token's principal, the profile it was issued under (an issued Human capability reports preparer) and its exact journaled ops; the kernel admits it only against its journaled issuance. Embedded-owner has Human profile and null ops because it self-issues per command; principal is null until parsed. Launch configuration does not authenticate the operator."
fields = ["posture:string", "principal:string?", "profile:string", "ops:[string]?"]

[[shape]]
name = "envelope_doc"
doc = "The robot-mode envelope: its version, the fields every line carries beside its event's own, and the wire frames that carry none."
fields = ["discriminator:string", "version:int", "fields:[field_doc]", "frames:[string]", "description:text", "types:[string]"]

[[shape]]
name = "event_doc"
doc = "One event's schema and the verbs that emit it (empty for the global events). `book` is true when the event is always about one book (its envelope `coordinate` is never null); `fields` are the event's own, beside the envelope's."
fields = ["name:string", "doc:text", "book:bool", "verbs:[string]", "fields:[field_doc]"]

[[shape]]
name = "shape_doc"
doc = "One nested object's schema."
fields = ["name:string", "doc:text", "fields:[field_doc]"]

[[shape]]
name = "field_doc"
doc = "One field and its type."
fields = ["name:string", "type:string"]

[[shape]]
name = "chart_account_detail"
doc = "An account row (as in shape account) with its normal side (debit or credit), parent code (null at a root), children codes, opened/closed/promoted_on dates (null when not journaled) and the commit that created it."
fields = ["code:string", "name:string", "type:string", "leaf:bool", "unit:string", "lower_bound:amount?", "upper_bound:amount?", "limit_scope:string?", "normal_side:string", "parent:string?", "children:[string]", "opened:date?", "closed:date?", "promoted_on:date?", "created_at:seq"]

[[shape]]
name = "account"
doc = "One chart row; the bounds and `limit_scope` (lifetime: the account's whole history; period: a budget cap per fiscal period) are null unless the chart declared a balance limit."
fields = ["code:string", "name:string", "type:string", "leaf:bool", "unit:string", "lower_bound:amount?", "upper_bound:amount?", "limit_scope:string?"]

[[shape]]
name = "period"
doc = "One period with its current state."
fields = ["code:string", "state:string", "kind:string", "start:date", "end:date", "fiscal_year:int"]

[[shape]]
name = "document_summary"
doc = "One held document's public metadata: its oid, registered kind, media type, provenance grade, byte size, commitment and recorded sequence."
fields = ["oid:hex", "kind:string", "mime:string", "grade:string", "size:int", "doc_commit:hex", "recorded_at:seq"]


[[shape]]
name = "party_summary"
doc = "One party: its code, kind, vertex id, opened name (untrusted text, null when erased) and recorded sequence."
fields = ["code:string", "kind:string", "vid:hex", "name:untrusted_text?", "created_at:seq"]

[[shape]]
name = "legal_entity_summary"
doc = "One legal entity: its code, name, jurisdiction, functional unit, formed and dissolved dates, the count of external ids it was created with, its vertex id and recorded sequence."
fields = ["code:string", "name:string", "jurisdiction:string", "functional_unit:string?", "formed:date?", "dissolved:date?", "external_ids:int", "vid:hex", "created_at:seq"]


[[shape]]
name = "instrument_summary"
doc = "One instrument: its code, name, kind, unit, vertex id, the party it is held at, the account it mirrors, and its recorded sequence."
fields = ["code:string", "name:string", "kind:string", "unit:string?", "vid:hex", "held_at:hex", "mirrors:hex", "created_at:seq"]

[[shape]]
name = "export_file"
doc = "One output file of an export: its name in the package, its length, its digest (fa:export-file:v1), and its content when returned inline."
fields = ["name:string", "bytes:int", "digest:hex", "content:string?"]

[[shape]]
name = "witness_statement"
doc = "The accumulator statement a witness signed last (fa checkpoint witness --previous): its recorded sequence, leaf count and root."
fields = ["through_seq:seq", "leaf_count:int", "root:hex"]

[[shape]]
name = "ads_proof"
doc = "The proof written beside an ADS extract (fa export ads --with-proofs, plan §13.1): the complete-prefix bundle and its signed production receipt (file names in the package), the bundle's digest, the recorded accumulator state and the sequence it proves complete through (the extract's known_at), its completeness grade, and the checkpoint public key fa-verify ads checks them with."
fields = ["bundle:string", "receipt:string", "bundle_digest:hex", "state:hex", "through_seq:seq", "completeness:string", "checkpoint_public_key:hex"]

[[shape]]
name = "batch_member"
doc = "One entry of a committed PostBatch, in member order."
fields = ["index:int", "vid:hex", "entry_digest:hex", "class:string?", "period:string?"]

[[shape]]
name = "draft_summary"
doc = "A draft as its DraftControl records state it (plan §15.2)."
fields = ["draft:hex", "name:string", "owner:hex", "state:string", "opened_at:seq", "intents:int", "closed_at:seq?", "closed_by:hex?", "outcome:hex?"]

[[shape]]
name = "draft_intent"
doc = "One planned intent: its Plan record and the entry its promotion will create."
fields = ["record:hex", "recorded_at:seq", "entry:hex", "class:string", "effective_date:date", "idempotency_key:hex", "legs:int", "principal:hex"]

[[shape]]
name = "scenario_summary"
doc = "One scenario as its records state it: owner, state, the trunk sequence it replays, the date its counterfactual starts, its assumption documents and intent count."
fields = ["scenario:hex", "name:string", "owner:hex", "state:string", "opened_at:seq", "fork_at:seq", "from:date?", "assumptions:[hex]", "intents:int", "discarded_at:seq?"]

[[shape]]
name = "scenario_diff_row"
doc = "One account and unit a scenario changes: trunk and scenario debits and credits, posted and pending (reserved, unposted) apart, and the signed change in each net (debits - credits) balance."
fields = ["account:hex", "code:string", "name:string", "trunk_debits:amount", "trunk_credits:amount", "scenario_debits:amount", "scenario_credits:amount", "delta:amount", "trunk_debits_pending:amount", "trunk_credits_pending:amount", "scenario_debits_pending:amount", "scenario_credits_pending:amount", "pending_delta:amount"]

[[shape]]
name = "draft_entry_ref"
doc = "A hypothetical member's exact entry identity and immutable entry digest. It is a scratch result, and becomes trunk membership only through separately authorized promotion."
fields = ["vid:hex","digest:hex"]

[[shape]]
name = "draft_diff_row"
doc = "One changed account and native unit: original and rehearsed stock balances, with posted and pending debits and credits kept apart. Each delta is the checked change in debit-minus-credit net."
fields = ["account:hex","code:string","name:string","unit_id:int","trunk_debits:amount","trunk_credits:amount","draft_debits:amount","draft_credits:amount","delta:amount","trunk_debits_pending:amount","trunk_credits_pending:amount","draft_debits_pending:amount","draft_credits_pending:amount","pending_delta:amount"]

[[shape]]
name = "issued_capability"
doc = "A capability as its journaled issuance records it (plan §14.2). daily_totals bounds cumulative gross debits per native unit and committed UTC day. daily_root is the original quota issuance commitment for a descendant; null means this issuance starts its own root when daily_totals is nonempty, or has no daily quota when the array is empty. The scope caveats (null when absent) confine what the holder reaches and are judged before any query, never as a result filter: books by id, accounts by subtree root code, periods by code, effective dates through effective_through, recorded frontiers through known_at_most, one branch, and redaction by registered contract."
fields = ["commitment:hex", "control_entry:hex", "holder:hex", "issuer:hex", "profile:string", "ops:[string]", "ceilings:[capability_ceiling]", "daily_totals:[capability_daily_total]", "daily_root:hex?", "expires_at:seq?", "books:[hex]?", "accounts:[string]?", "periods:[string]?", "effective_through:date?", "known_at_most:seq?", "branch:hex?", "redaction:int?", "issued_at:seq", "revoked_at:seq?"]

[[shape]]
name = "capability_ceiling"
doc = "A per-leg ceiling: the maximum mantissa at the unit's scale."
fields = ["unit_id:int", "max_mantissa:int"]

[[shape]]
name = "capability_daily_total"
doc = "A cumulative daily gross-debit limit in one native unit, expressed as a positive maximum mantissa at that unit's scale. Descendants share the original issuance's usage and may only narrow their limits."
fields = ["unit_id:int", "max_mantissa:int"]

[[shape]]
name = "tb_row"
doc = "One account in one unit."
fields = ["code:string", "name:string", "type:string", "debits:amount", "credits:amount", "net:amount", "debits_pending:amount", "credits_pending:amount"]

[[shape]]
name = "functional_tb_row"
doc = "One account and optional legal entity in the book's functional currency, in a posted or pending stock/activity column. net is exact debits less credits."
fields = ["account:string", "account_ref:hex", "entity:string?", "debits:amount", "credits:amount", "net:amount", "entry_count:int"]

[[shape]]
name = "functional_tb_totals"
doc = "Checked exact debit, credit and net totals in the functional currency for one stock or activity column."
fields = ["debits:amount", "credits:amount", "net:amount"]

[[shape]]
name = "tb_served"
doc = "How a head trial balance or period activity was answered (plan §5.3, §17). mode maintained: every contributing period from its maintained register cells at their cursor plus the exact tail after it; tail_length counts the entries decoded for those tails. mode literal: the journal was folded, and reason says why maintained cells could not answer and how to make them answer. Both modes yield the same report. Null for certified, historical, as-of and summary reads, which always fold the journal."
fields = ["mode:string", "tail_length:int?", "reason:string?", "periods:[tb_served_period]"]

[[shape]]
name = "tb_served_period"
doc = "One period maintained cells answered: its maintenance cursor and the entries decoded for its tail."
fields = ["period:string", "served_at:seq", "tail_entries:int"]

[[shape]]
name = "statement_column"
doc = "A current or comparative period selection. Stock includes opening history through the inclusive cutoff; activity starts at effective_from. Every column uses the statement's same known-at snapshot."
fields = ["label:string", "periods:[string]", "mode:string", "effective_from:date?", "effective_through:date"]

[[shape]]
name = "statement_line"
doc = "One mapped or computed line in one native unit; amounts appear in the order of the statement columns. There is no summation across units."
fields = ["code:string", "label:string", "unit:string", "amounts:[amount]"]

[[shape]]
name = "statement_mapping"
doc = "A historical leaf account and its unique registered mapped line; computed lines refer to mapped lines rather than mapping an account a second time."
fields = ["account_vid:hex", "account:string", "name:string", "type:string", "line:string"]

[[shape]]
name = "summary_group"
doc = "One root account and its disjoint leaf partition in a summary trial balance."
fields = ["code:string", "name:string", "type:string", "leaf:bool", "leaves:[string]", "rows:[tb_row]"]

[[shape]]
name = "statement_line_change"
doc = "One statement line's before, after, and exact `after - before` delta amounts across the statement columns."
fields = ["code:string", "label:string", "unit:string", "before:[amount]", "after:[amount]", "delta:[amount]"]

[[shape]]
name = "statement_mapping_change"
doc = "A leaf account whose statement mapping changed between `before_known_at` and `after_known_at`."
fields = ["account_vid:hex", "before:statement_mapping?", "after:statement_mapping?"]

[[shape]]
name = "statement_publication"
doc = "One adjacent recorded sequence step in a statement trace, with its entry links and sparse line/mapping changes."
fields = ["recorded_at:seq", "unchanged:bool", "entries:[statement_entry_link]", "changes:[statement_line_change]", "mapping_changes:[statement_mapping_change]"]

[[shape]]
name = "statement_entry_link"
doc = "Metadata-only entry link for a statement trace publication step (`recorded` or `became_visible`)."
fields = ["event:string", "vid:hex", "entry_digest:hex", "class:string", "recorded_at:seq", "posting_date:date?", "principal:hex", "references:[hex]", "migration_run:hex?"]

[[shape]]
name = "gl_cell"
doc = "One selected account/unit cell in a general-ledger detail report."
fields = ["account:string", "account_vid:hex", "name:string", "type:string", "unit:string", "opening:amount", "debits:amount", "credits:amount", "net_change:amount", "closing:amount", "line_count:int"]

[[shape]]
name = "gl_line"
doc = "One ordered posted leg movement with running balance in a general-ledger detail report."
fields = ["account:string", "unit:string", "entry_digest:hex", "leg_index:int", "recorded_at:seq", "effective_date:date", "class:string", "reason_code:string", "debits:amount", "credits:amount", "running_balance:amount"]

[[shape]]
name = "roll_forward_bucket"
doc = "One activity classification bucket in a roll-forward lead schedule."
fields = ["class:string", "reason_code:string", "rule_digest:hex?"]

[[shape]]
name = "roll_forward_row"
doc = "One account/unit row in a roll-forward lead schedule: `opening` plus `activity` aligned with `buckets` equals `closing`."
fields = ["account:string", "account_vid:hex", "name:string", "type:string", "unit:string", "opening:amount", "activity:[amount]", "net_change:amount", "closing:amount"]

[[shape]]
name = "equity_roll_forward_unit"
doc = "One unit's statement of changes in equity, credit-normal (credits minus debits): opening contributed equity (equity accounts) and unclosed earnings (revenue and expense not yet closed), their total, net income, issuances, distributions, other equity movements, the closing transfer's net (zero), the net change and the closing stocks; tie_out_residual = opening total + net change - closing total, which is zero."
fields = ["unit:string", "opening_contributed_equity:amount", "opening_unclosed_earnings:amount", "opening_total_equity:amount", "net_income:amount", "issuances:amount", "distributions:amount", "other_equity_movements:amount", "closing_transfers_net:amount", "net_equity_change:amount", "closing_contributed_equity:amount", "closing_unclosed_earnings:amount", "closing_total_equity:amount", "tie_out_residual:amount"]

[[shape]]
name = "equity_movement"
doc = "One classified equity leg of a statement of changes in equity: its entry digest and leg index, recorded sequence, effective date, entry class, kind (issuance or distribution from the named accounts, other_equity for any other equity leg, closing_transfer for every leg of a Closing entry), account, side and amount."
fields = ["entry_digest:hex", "leg_index:int", "recorded_at:seq", "effective_date:date", "class:string", "kind:string", "account:string", "side:string", "amount:amount"]

[[shape]]
name = "aging_band"
doc = "One effective-date age band in days (`upper_inclusive` is null for the open-ended final band)."
fields = ["lower_inclusive:int", "upper_inclusive:int?"]

[[shape]]
name = "aged_open_item"
doc = "One open item with its effective-date age in civil days and assigned band index."
fields = ["entry:hex", "ordinal:int", "account:string", "side:string", "effective_date:date", "recorded_at:seq", "original:amount", "applied:amount", "applied_out:amount", "open:amount", "age_days:int", "bucket:int"]

[[shape]]
name = "aging_cell"
doc = "Nonnegative debit and credit open-item sums for one account, native unit, and age band."
fields = ["account:string", "unit:string", "bucket:int", "debits:amount", "credits:amount", "item_count:int"]

[[shape]]
name = "aging_total"
doc = "Nonnegative debit and credit open-item totals across all age bands for one account and native unit."
fields = ["account:string", "unit:string", "debits:amount", "credits:amount", "item_count:int"]

[[shape]]
name = "aging_reconciliation_row"
doc = "One native-unit row tying an account's posted trial-balance net to its open-item net (`difference` = `posted_net - open_net`)."
fields = ["unit:string", "posted_debits:amount", "posted_credits:amount", "pending_debits:amount", "pending_credits:amount", "open_debits:amount", "open_credits:amount", "open_item_count:int", "posted_net:amount", "open_net:amount", "difference:amount"]

[[shape]]
name = "aging_portfolio_account"
doc = "One selected posting leaf in an aging portfolio: its native-unit control rows, whether every row has zero difference, and its open-item count."
fields = ["account:string", "account_vid:hex", "name:string", "reconciled:bool", "rows:[aging_reconciliation_row]", "item_count:int"]

[[shape]]
name = "aging_portfolio_uncovered"
doc = "A posting leaf the portfolio did not select; it is reported, not reconciled."
fields = ["account:string", "account_vid:hex", "name:string"]

[[shape]]
name = "cash_flow_section"
doc = "Gross inflows, gross outflows, and net movement for one cash-flow activity section in one native unit."
fields = ["inflows:amount", "outflows:amount", "net:amount"]

[[shape]]
name = "cash_flow_decision"
doc = "One selected original cash leg's derived activity and its basis: `account_rules` (every nonzero non-cash counterpart in its entry and unit has that activity), `override` (an explicit whole-leg choice), or `internal_transfer` (exact cancellation across distinct cash accounts within one entry and unit)."
fields = ["entry_digest:hex", "leg_index:int", "activity:string", "basis:string"]

[[shape]]
name = "cash_flow_unit"
doc = "Direct cash-flow summary for one native unit: `opening` plus `net_change` across operating, investing, financing, and exchange effects equals `closing`."
fields = ["unit:string", "opening:amount", "operating:cash_flow_section", "investing:cash_flow_section", "financing:cash_flow_section", "exchange_effects:cash_flow_section", "net_change:amount", "closing:amount"]

[[shape]]
name = "cash_flow_leg_split"
doc = "A cited original cash leg and the professional reason for splitting its exact native amount into positive activity portions. The entry digest and leg index identify the source at the fixed report coordinate."
fields = ["entry_digest:hex", "leg_index:int", "reason:string", "portions:[cash_flow_portion]"]

[[shape]]
name = "cash_flow_portion"
doc = "One explicit cash-flow activity portion, rendered as an exact positive amount in its original cash leg's native unit. The leg's bank direction is inherited; portions cannot introduce a currency conversion or a balancing residual."
fields = ["activity:string", "amount:amount"]

[[shape]]
name = "indirect_cash_flow_unit"
doc = "Indirect cash-flow reconciliation for one native unit: `net_income` plus `non_cash`, `working_capital`, and `non_operating` equals `operating` (`direct_operating` with zero `operating_residual`)."
fields = ["unit:string", "net_income:amount", "non_cash:amount", "working_capital:amount", "non_operating:amount", "operating:amount", "direct_operating:amount", "operating_residual:amount", "opening:amount", "investing:amount", "financing:amount", "exchange_effects:amount", "net_change:amount", "closing:amount"]

[[shape]]
name = "indirect_cash_flow_contribution"
doc = "One non-cash leg adjustment's signed contribution to the indirect operating-cash reconciliation."
fields = ["entry_digest:hex", "leg_index:int", "account:string", "account_vid:hex", "unit:string", "amount:amount"]

[[shape]]
name = "unit_total"
doc = "Posted totals of one unit."
fields = ["unit:string", "debits:amount", "credits:amount"]

[[shape]]
name = "pending_unit_total"
doc = "Pending totals of one unit."
fields = ["unit:string", "debits_pending:amount", "credits_pending:amount"]

[[shape]]
name = "chart_template"
doc = "One embedded chart template."
fields = ["name:string", "version:int", "description:string", "accounts:int", "leaves:int", "key:string"]

[[shape]]
name = "open_item"
doc = "One live posted leg and what has been applied to and from it."
fields = ["entry:hex", "ordinal:int", "account:string", "side:string", "effective_date:date", "recorded_at:seq", "original:amount", "applied:amount", "applied_out:amount", "open:amount", "applications:[application]"]

[[shape]]
name = "application"
doc = "One application against an open item."
fields = ["entry:hex", "ordinal:int", "amount:amount", "recorded_at:seq", "live:bool"]

[[shape]]
name = "register_lag"
doc = "One materialized period's register cache in fa triage: its cache_status (verified, corrupt or uninitialized), the verified_through watermark of the journal prefix it folded, and lag_entries, the journal entries recorded after it (fa registers advance folds them in)."
fields = ["period:string", "cache_status:string", "verified_through:seq?", "lag_entries:int"]

[[shape]]
name = "register_check"
doc = "One period's verify-by-refold at its processed basis (not its last monetary contribution). cache_status is uninitialized, verified, or corrupt. verified_through is null on a mismatch or an uninitialized cache; empty uninitialized caches compare green but certify no prefix. When green, stale reports unread journal entries and lag_entries counts their book-wide Entry creations, including controls and staged migrations; projection-only commits do not count."
fields = ["period:string", "green:bool", "cache_status:string", "verified_through:seq?", "stale:bool", "lag_entries:int", "cells_checked:int", "refold_digest:hex", "stored_digest:hex?", "drift:[cell_drift]", "pending_drift:[cell_drift]", "projection_errors:[string]"]

[[shape]]
name = "entity_check"
doc = "One period's per-entity refold: known_at is the frontier it was proved at, cells_checked the (account, unit, entity) cells, entries_checked the period's committed entries, fold_digest the refold's digest, findings each drift found (empty when green)."
fields = ["period:string", "green:bool", "known_at:seq", "cells_checked:int", "entries_checked:int", "fold_digest:hex", "findings:[string]"]

[[shape]]
name = "search_hit"
doc = "One ranked search hit: kind (entry), id (the entry's vid as 32-hex, for fa entry show), recorded_at (its creating sequence), score_micro (BM25 in micro-units), the query terms it matched, and a snippet of its text."
fields = ["kind:string", "id:hex", "recorded_at:seq", "score_micro:int", "matched_terms:[string]", "snippet:string"]

[[shape]]
name = "cell_drift"
doc = "A stored register cell that differs from the refold (raw mantissas)."
fields = ["account:hex", "unit_id:int", "stored:cell_values?", "refolded:cell_values"]

[[shape]]
name = "cell_values"
doc = "A register column's raw mantissas and entry count."
fields = ["debits:int", "credits:int", "entry_count:int"]

[[shape]]
name = "applied_drift"
doc = "A leg whose applied mirror differs from the open-item fold."
fields = ["entry:hex", "ordinal:int", "stored:int?", "refolded:int"]

[[shape]]
name = "account_availability"
doc = "One limited account's cell: its bounds, net, and pending flows in its normal-balance sign, and the refolded cell's generation. `period` names the fiscal period of a budget cap's cell (one row per period); null for a lifetime limit."
fields = ["account:string", "period:string?", "normal:string", "lower_bound:amount?", "upper_bound:amount?", "net:amount", "pending_out:amount", "pending_in:amount", "generation:int"]

[[shape]]
name = "availability_drift"
doc = "A limited account whose expected LimitCell differs from the refold (raw mantissas), or is bound (account_ref) to another account or to none, or (a budget cap's cell) to another period: `stored_account` is the vid the stored cell claims (null when the cell or its reference is missing or malformed), `stored_account_code` its code when it is an account of this book; `period` is the cell's fiscal period and `stored_period` the period it claims (null for a lifetime cell)."
fields = ["account:string", "period:string?", "stored_period:string?", "stored:limit_cell?", "refolded:limit_cell", "stored_account:hex?", "stored_account_code:string?"]

[[shape]]
name = "limit_cell"
doc = "A LimitCell's raw mantissas and its generation."
fields = ["debits_posted:int", "credits_posted:int", "debits_pending:int", "credits_pending:int", "generation:int"]

[[shape]]
name = "period_check"
doc = "One fiscal period's stored state mirror compared with its refolded state from birth through its journaled PeriodControl transitions."
fields = ["code:string", "fiscal_year:int", "ordinal:int", "kind:string", "born_state:string", "stored_state:string?", "refolded_state:string", "transitions:int", "green:bool"]

[[shape]]
name = "recorded_finding_run"
doc = "One recorded forensic run whose original certificate and observations fully replayed for this page. The publication identity and producer remain distinct from its source coordinate. certificate selects its complete finding set; no current human review status is inferred."
fields = ["run_vid:hex", "certificate:hex", "recorded_at:seq", "producer:hex", "source_known_at:seq", "effective_through:date?", "procedure:string", "version:int", "finding_count:int", "findings_digest:hex"]

[[shape]]
name = "recorded_finding"
doc = "One immutable certified observation with its stable native identity, original coordinate and producer, plus its verified human review history at the requested cutoff. The nested finding never changes when its review status changes."
fields = ["finding_vid:hex", "run_vid:hex", "certificate:hex", "ordinal:int", "recorded_at:seq", "producer:hex", "source_known_at:seq", "effective_through:date?", "status:string", "latest_review:hex?", "finding:finding", "reviews:[finding_review]"]

[[shape]]
name = "finding_review"
doc = "One append-only Human decision bound to its finding, explicit predecessor, current capability and retained evidence. reason is present only for dismissal; note is the reviewer's explanation."
fields = ["finding_vid:hex", "review_vid:hex", "ordinal:int", "recorded_at:seq", "principal:hex", "capability_commitment:hex", "action:string", "reason:string?", "previous:hex?", "note:string", "evidence:[hex]"]

[[shape]]
name = "bank_entry_ref"
doc = "A selected native journal entry bound by both its vertex identity and canonical entry digest. A bank match additionally names its exact cash-leg ordinal."
fields = ["vid:hex", "entry_digest:hex"]

[[shape]]
name = "bank_match_proposal"
doc = "One retained bank line with status proposed, unmatched, confirmed or occupied. Confirmed rows preserve the original DecisionCard, proposal digest, proposer, cash-leg coordinates and confirmed_match reference. Occupied means another retained interpretation already claims this original source line. Available eligibility excludes only native active claims and is computed before greedy proposal consumption; deterministic tie-breaking does not resolve ambiguity. Imported counterparty and reference text remain explicitly untrusted."
fields = ["line_ordinal:int", "eligible_candidate_count:int", "competing_bank_lines:bool", "ambiguous:bool", "line_document_oid:hex", "bank_line_id:hex", "booking_date:date", "value_date:date", "direction:string", "amount:amount", "counterparty:untrusted_text?", "reference:untrusted_text?", "status:string", "entry_ref:bank_entry_ref?", "leg_ordinal:int?", "candidate_ordinal:int?", "decision_card:hex", "decision_card_digest:hex", "proposal_digest:hex", "proposer:hex", "confirmation_command:string?", "confirmed_match:bank_confirmation?"]

[[shape]]
name = "bank_confirmation"
doc = "An immutable exact-match confirmation with original native publication identity, retained source lineage and actual cash-leg ordinal. Proposer is preserved from proposal bytes; confirmed_by and capability_commitment identify the admitted confirmer. These recorded facts survive later reversals and establish neither a live matched balance nor reconciled-through date."
fields = ["match_vid:hex","match_digest:hex","recorded_at:seq","manifest_oid:hex","statement_oid:hex","line_ordinal:int","line_document_oid:hex","bank_line_oid:hex","account_ref:hex","entry_ref:bank_entry_ref","leg_ordinal:int","proposer:hex","confirmed_by:hex","confirming_profile:string","capability_commitment:hex","source_known_at:seq","date_window:int","proposal_digest:hex","line_generation:int","leg_generation:int","previous_line_unmatch:bank_decision_ref?","previous_leg_unmatch:bank_decision_ref?","method:string"]

[[shape]]
name = "bank_decision_ref"
doc = "An exact immutable bank decision identified by its native VID and canonical payload digest."
fields = ["vid:hex", "digest:hex"]

[[shape]]
name = "bank_reconciliation"
doc = "A capability-bound exact statement-close attestation, fixed to the original evaluated prefix and cumulative cash contribution digest. matches names the exact native confirmations relied on. No external principal signature or complete outstanding-item inventory is implied."
fields = ["attestation_vid:hex", "attestation_digest:hex", "recorded_at:seq", "already_recorded:bool", "principal:hex", "manifest_oid:hex", "statement_oid:hex", "account_ref:hex", "unit_id:int", "statement_date:date", "evaluated_known_at:seq", "cash_balance:amount", "cash_fold_digest:hex", "matches:[bank_decision_ref]", "scope:string"]

[[shape]]
name = "bank_reconciliation_state"
doc = "An independently verified historical close and its comparison with the selected status prefix. Monetary equality alone does not hide changed cash contributions or released/replaced matches. changed_entries cites subsequent effective cash contributions; citing_entries retains explicit late-posting and activation-control citations."
fields = ["reconciliation:bank_reconciliation", "historical_claim_verified:bool", "cash_balance:amount", "cash_fold_digest:hex", "active_matches:[bank_decision_ref]", "balance_drift:bool", "cash_drift:bool", "match_drift:bool", "changed_entries:[bank_entry_ref]", "citing_entries:[bank_entry_ref]"]

[[shape]]
name = "bank_unmatch"
doc = "An immutable release referring to one exact confirmation, retaining its original releasing principal, current authority commitment and native publication sequence."
fields = ["unmatch_vid:hex","unmatch_digest:hex","recorded_at:seq","target:bank_decision_ref","unmatched_by:hex","unmatching_profile:string","capability_commitment:hex","security_policy_epoch:int","already_recorded:bool"]

[[shape]]
name = "bank_outstanding_leg"
doc = "A cash leg in the named candidate window that is neither claimed by an active native confirmation nor consumed by a fresh proposal. This is a candidate-window observation, not a full outstanding-item inventory."
fields = ["entry_ref:bank_entry_ref", "leg_ordinal:int", "effective_date:date", "side:string", "amount:amount"]

[[shape]]
name = "bank_cash_amounts"
doc = "Exact gross cash movements in the statement's unit. Inflow and outflow remain separate, so offsetting unresolved items cannot cancel. Bank credits and book debits are inflows."
fields = ["inflow:amount", "outflow:amount"]

[[shape]]
name = "bank_reconciliation_progress"
doc = "Active progress at the selected prefix. confirmed applies to this manifest; occupied means the original source line is claimed under another interpretation. remaining includes occupied, proposed and unmatched lines. outstanding covers only available cash legs inside the declared candidate window. all_statement_lines_confirmed and closing_balances_equal are independent observations; they do not attest a balance or establish a posting lock."
fields = ["confirmed:bank_cash_amounts", "occupied:bank_cash_amounts", "remaining:bank_cash_amounts", "proposed:bank_cash_amounts", "unmatched:bank_cash_amounts", "outstanding:bank_cash_amounts", "all_statement_lines_confirmed:bool", "closing_balances_equal:bool"]

[[shape]]
name = "untrusted_text"
doc = "Third-party-authored text from an imported document, entry description, or leg memo (plan §9.3 prompt-injection boundary): `untrusted_content` carries the UTF-8 text and `source` names its handle (`D:<oid>`, `E:<vid>`, or `E:<vid>:L<ordinal>`). Untrusted text is never interpolated into `fix`, `next_actions`, or `suggested_tool_calls`."
fields = ["untrusted_content:text", "source:string"]

[[shape]]
name = "entry_leg"
doc = "One leg of a committed entry."
fields = ["side:string", "account:hex", "amount:amount", "memo:untrusted_text?"]

[[shape]]
name = "plan_leg"
doc = "One proposed leg after actual admission, with the resolved account code and immutable account identity. Its amount is an exact decimal string with the book's unit."
fields = ["ordinal:int", "account:string", "account_vid:hex", "side:string", "amount:amount"]

[[shape]]
name = "plan_valuation"
doc = "The exact functional-currency amounts retained by a valued proposal, alongside its native plan legs. The registered law and its content-addressed identity govern these amounts; the preview neither selects a new rate nor grants authority. Null on an unvalued native plan."
fields = ["base_unit:string", "law:string", "law_oid:hex", "debits:amount", "credits:amount", "legs:[plan_base_leg]"]

[[shape]]
name = "plan_base_leg"
doc = "One retained functional amount, linked by ordinal to its native proposed leg."
fields = ["ordinal:int", "base_amount:amount"]

[[shape]]
name = "replacement_plan_member"
doc = "One ordered member of the joint correction artifact: exact request and prepared-entry digests, accounting preview, provenance and approval count. The complete sealed entry and approvals are retained in the artifact bytes."

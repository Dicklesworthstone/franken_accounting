[[mcp.tool]]
cluster = "fa.orient"
name = "next"
verb = "next"
subcommands = []
positionals = []
required = []
dont = ["Don't run the command blindly when it names a grant the launch does not hold (`--grant approve`, `--grant witness`): ask the operator."]
mistakes = ["Treating a null command as an error: it means there is nothing to do."]

[[mcp.tool]]
cluster = "fa.orient"
name = "doctor"
verb = "doctor"
subcommands = []
positionals = []
required = []
dont = ["Don't repair what a failing check names yourself: each check carries its exact fix, and key-file or lease problems are the operator's."]

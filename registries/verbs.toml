exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["production open <matter> --bates-prefix <PREFIX> [--start <n>] [--load-file dat] [--protective-order <oid>] [--key K] [--date YYYY-MM-DD]   (journals the matter's profile once, under produce authority; the prefix is 1..=16 printable ASCII bytes without spaces, --start is the first Bates number (1 by default), and the protective order is a document the book holds. One profile per matter: another principal's open is refused, and an exact retry returns the recorded profile. --load-file dat (Concordance DAT/OPT, the default), edrm (EDRM XML) or both; EDRM binds the bundle digest, so an edrm or both matter produces with fa produce --bundle)", "production list   (every matter: its prefix, next number and how many documents it has produced)", "production show <matter>   (every range the matter assigned, ascending, with the Produce record that assigned it)", "production document <oid>   (the document's range in every matter that produced it; plan §13.2: a document produced in two matters carries both ranges)"]

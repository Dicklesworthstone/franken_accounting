[[verb]]
name = "case"
summary = "Restatement cases (plan §8.3): open a case over the periods a material correction affects, journal its determination (day and authority), rehearse it on a scenario whose diff certificate is replayed, retained and attached, approve its effect manifest under dual control, post a PriorPeriodAdjustment or Revision case's entries in one batch, disclose it in a reviewed Disclosure document, close it, and read it."
writes = true
subcommands = ["open", "determine", "rehearse", "approve", "post", "disclose", "close", "show", "list"]
flags = ["--kind", "--periods", "--narrative", "--determined-on", "--authority", "--on", "--key", "--date", "--certificate", "--approval", "--document"]
switches = ["--dry-run"]
events = ["case_opened", "case_determined", "case_rehearsed", "case_manifest", "case_approved", "case_posted", "case_disclosed", "case_closed", "case", "cases"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["case approve <case> --dry-run   (prints the effect manifest: each entry the case will post, its intent digest and planner, and the digest approvers approve with fa approve --proposal <digest>)", "case approve <case> --approval <vid> --approval <vid> [--key K] [--date YYYY-MM-DD]   (Rehearsed → Approved: two Human approvals of the manifest digest, none by a principal who planned any of its entries; needs restate)", "case rehearse <case> --certificate <scenario-diff-certificate> [--key K] [--date YYYY-MM-DD]   (Determined → Rehearsed: replays the scenario's diff certificate (fa scenario diff <name> --period <code>... --certificate-out <file>), retains it and journals the rehearsal; the diff must cover every period the case affects and the scenario must be open; needs restate, read and produce)", "case open --kind Restatement|Revision|PriorPeriodAdjustment|PolicyChangeRetrospective --periods <code>[,<code>]... [--narrative <document-oid>] [--determined-on YYYY-MM-DD --authority <document-oid>] [--key K] [--date YYYY-MM-DD]   (journals a RestatementCase under restate, numbered next among the book's cases: Proposed, or Determined when the determination is already made. Every period must exist; the narrative and authority must be verified documents of this book. The default key is the request itself, so the same command opens the case once.)", "case determine <case> --on YYYY-MM-DD --authority <document-oid> [--key K]   (Proposed → Determined: the day the non-reliance or immateriality determination was made, and the document recording its authority. For a Restatement the Item 4.02 clock starts that day. FA-REF-176 from any other state.)", "case post <case> [--key K] [--date YYYY-MM-DD]   (Approved → Posted: the manifest's entries commit in one batch with the Post record, each the planned intent as the case's class under the poster, through its matrix row and SoD rule decided over the case's approvals, so the poster may not be one of the approvers; needs restate and post. This build posts PriorPeriodAdjustment and Revision cases: a Revision case's scenario plans each Revision with `revises` naming the posting it corrects and its delta legs, and it posts in a period the case affects; a Restatement case's entries are refused with FA-REF-178.)", "case disclose <case> --document <oid> [--key K] [--date YYYY-MM-DD]   (Posted → Disclosed: the document must be a Disclosure document of this book over which a principal other than its uploader recorded a Reviewed attestation with fa attest review <oid>; FA-REF-179 otherwise; needs restate and read)", "case close <case> [--key K] [--date YYYY-MM-DD]   (Disclosed → Closed: the case's last record; needs restate)", "case show <case>", "case list"]
example = "fa case open --kind Restatement --periods FY2025-P12 --narrative <oid> --book ./books/myco --json"

[[verb]]
name = "post"
summary = "Post an entry intent under balance, period and idempotency laws, with optional functional-currency valuation from retained Rate evidence (fa fx rate add)."
writes = true
subcommands = []
flags = ["--intent", "--grant", "--evidence", "--event", "--balancing", "--plan-out", "--timeout-ns", "--reverse-on", "--prior-period-error", "--draft", "--scenario"]
switches = ["--dry-run"]
events = ["posted", "recorded", "plan", "batch_posted", "batch_plan", "draft_planned", "scenario_run"]
exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["A leg may name its legal entity (\"entity\": code; in a multi-entity book every leg names one) and its counterparty (\"party\": code from fa party list); the kernel refuses an undeclared entity or an unknown party.", "post --intent <file.json|-> [--grant <op>]... [--evidence <oid>]... [--event <code|vid>] [--balancing 0|1] [--as <principal>]   (--balancing: that leg moves at most what its account's limit admits; the event says what was requested and what moved)", "post --intent <file.json|-> --dry-run [--plan-out <new-file>]   (runs the actual admission pipeline and aborts its staged transaction; emits the complete sealed PostEntry or PostBatch plan, commits nothing)", "Commit the reviewed plan with fa commit --plan <file|-> using the same --as and --grant. Any intervening book publication requires a new dry run; planning does not assemble new approvals or rehearse --balancing. --plan-out requires --dry-run and never overwrites a file.", "Pending accepts timeout_ns as an unsigned JSON integer, or --timeout-ns N. Its deadline is anchored to committed TimeEvidence. Adjusting accepts reverse_on as YYYY-MM-DD, or --reverse-on YYYY-MM-DD; the book must declare --time-zone UTC at creation. An Adjusting entry that corrects an immaterial prior-period error in the current period, without a case (plan §8.2), names the earlier period with prior_period_error as a period code, or --prior-period-error FY2025-P12; the kernel refuses it on any other class or a period that does not end before the effective date, and fa engagement sud counts it under the rollover method. Supply each value once. Only the daemon records production clock observations and runs timed effects.", "A Reversal intent names reverses and a registered reason (for example, \"reason\": \"WrongAccount\"); its legs come from the target.", "A PostBatch intent {\"idempotency_key\": K, \"intents\": [<entry intent>, ...]} commits every member atomically, in order, in one transaction: all or none, each member seeing the earlier members' effects (an application may settle an invoice earlier in the same batch by its derived vid). Members are Original, Adjusting, Reversal, Pending or Resolution entries of one principal with distinct keys. The batch key names its IntentOutcome: an identical retry returns the recorded outcome; the same key with different members is refused (exit 6). A member refusal names its index and nothing is posted.", "PostBatch --dry-run [--plan-out <new-file>] rehearses the complete carried transaction, including same-batch applications, and previews every member's exact amounts, dimensions and settlement targets. fa commit --plan publishes the reviewed batch, outcome and retaining certificate atomically. Exact retries verify and return the original publication. Agent-profile plans remain rehearsal only. Batch drafts, scenarios, saturating balancing and per-batch posting flags remain unsupported; put member options in each intent.", "post --intent <file.json|-> --draft <name>   (plan §15.2: rehearses a single intent under every posting law and journals it into the open draft; nothing reaches trunk until a principal holding approve who is not the draft's owner runs fa draft promote <name>)", "post --intent <file.json|-> --scenario <name>   (fa-k07b: rehearses a single intent on the scenario's materialization under every posting law and journals it into the open scenario; trunk never moves; fa scenario diff shows the effect)"]
example = "fa post --intent entry.json --book ./books/myco --json"

[[verb]]
name = "invoice"
summary = "Post a customer invoice (plan §15.3, Appendix B): typed sugar over fa post that builds the Original entry from its lines, debiting the receivable for the party and crediting each line's revenue account. No posting rule or tax is inferred."
writes = true
subcommands = []
flags = ["--party", "--number", "--date", "--receivable", "--revenue", "--line", "--entity", "--key", "--description", "--evidence", "--event", "--grant", "--plan-out", "--draft", "--scenario"]
switches = ["--dry-run"]
events = ["posted", "recorded", "plan", "draft_planned", "scenario_run"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["invoice --party <code> --number <invoice number> --date YYYY-MM-DD --receivable <code> [--revenue <code>] --line 'qty=10 unit_price=\"125.00 USD\" item=SKU-9 product=Widgets' [--line ...] [--evidence <oid>]... [--entity <code>] [--key K] [--dry-run [--plan-out <new-file>] | --draft <name> | --scenario <name>]", "A line is qty with unit_price (multiplied exactly) or amount, with an optional account (default --revenue) and item, product or description words for its memo. Lines share one unit and may name different decimal places; a zero line or an empty value is refused. The receivable leg names the party. The key is invoice:[<entity>:]<number> unless --key is given (the book numbers its invoices), so a retry by the same principal returns the recorded entry. There is no implicit tax: a line with tax is refused until the tax law exists (fa-c34). --dry-run, --plan-out, --draft and --scenario behave as for fa post; a --grant post_closed needs --yes."]
example = "fa invoice --party ACME-CUST-17 --number 10442 --date 2026-03-14 --receivable 1200 --revenue 4000 --line 'qty=10 unit_price=\"125.00 USD\" item=SKU-9' --evidence <oid> --dry-run --book ./books/myco --json"



# verbs.toml — the single verb registry (plan §15.2–§15.3, Appendix D).
#
# One source for the `fa` CLI's verbs, subcommands, aliases, per-verb flags,
# help text, exit codes, and the robot-mode event schemas that
# `fa robot-docs schema` prints. The daemon (fa-i8j) and fa-mcp (fa-xex) are
# driven by and checked against this file.
#
# Consumer: fa-cli (dispatch, flag parsing and correction, `--help`,
# `fa capabilities`, `fa robot-docs schema`). Gate: the fa-cli parity tests
# fail when a registered verb or subcommand has no handler, a handler has no
# row, an emitted `--json` line does not match its event schema, or a
# declared event is never emitted by the binary tests. Retire: never (it is
# the contract); rows are additive, a removal is a breaking change.
#
# Field types: string · text (free-form, may span lines) · int · seq (a
# CommitSeq, ≥ 0) · bool · amount ("1500.00 USD": exact decimal, a space, the
# unit code) · date (YYYY-MM-DD) · hex (lowercase hexadecimal) · object (a map
# with data-dependent keys) · any · <shape> (an object with exactly the
# shape's fields) · [T] (an array of T) · T? (T or null). Every field is
# always present; absence is spelled null.
#
# Envelope (plan Appendix D, bead fa-12x): every robot-mode line carries the
# `[envelope]` fields beside its event's own fields, except the daemon's wire
# frames. An event marked `book = true` is always about one book, so its
# `coordinate` is never null; the robot-schema fixture pin
# (registries/robot_schema/<version>.jsonl) holds `fa robot-docs schema --json`
# byte for byte.

schema_version = 1

[envelope]
discriminator = "event"
version = 1
payload = "data"
fields = ["v:int", "book:hex?", "coordinate:coordinate?", "certificate:hex?", "authority:authority", "warnings:[string]", "next_actions:[next_action]"]
frames = ["fad_request", "fad_response"]
description = "Robot mode (--json), plan Appendix D: stdout carries one JSON object per line, {v, event, book, coordinate, data, certificate, authority, warnings, next_actions}. `event` names the schema of `data`; `v` is the envelope version. `book` and `coordinate` (branch, known_at, effective) are non-null on book events and may be null before a book opens. `certificate` is the replay certificate oid for certified reports and replay, otherwise null. Post plans identify their canonical artifact and authenticated certificate with data.plan_digest and data.certificate_digest; these are public digests, not native object-store OIDs. `authority` declares embedded-owner or mcp-launch-config; MCP names its fixed principal, bounded launch template and exact ops, while owner ops are null because they are self-issued per command. Launch configuration does not authenticate the operator. `warnings` records non-refusal diagnostics. `next_actions` names follow-up commands and why; owner CLI calls use the same book, while MCP keeps its launch-bound book. Keys are sorted; amounts are exact strings with units, sequences are integers and dates are YYYY-MM-DD. Daemon wire frames are flat protocol objects without this envelope. stderr carries diagnostics; every nonzero command exit emits one error event containing class, exit and refusal_id."

[global]
flags = ["--book", "--keys", "--as", "--via", "--format"]
switches = ["--json", "--help", "--version", "--no-color", "--yes"]
events = ["version", "triage", "help", "error"]
# A mistyped verb, subcommand or flag within this edit distance gets a
# "did you mean"; correction only ever suggests, it never runs the guess.
correction_distance = 1
usage = "--book <dir> (or FA_BOOK) · --keys <file> (default <dir>/book.keys) · --json · --format json|toon|text · --as <principal> (default operator) · --via fad|direct (default: through the book's fad when one holds its writer lease) · --yes (confirm an operation that cannot be undone; `fa capabilities --json` lists them) · --no-color (also NO_COLOR, CI, TERM=dumb, or stdout not a terminal) · --help (also `fa <verb> --help`)"

# The fad daemon (plan §15.3, Appendix D, bead fa-i8j). One fad per book
# directory holds the book's writer lease (an OS lock on <dir>/<lease>, so a
# crashed daemon releases it) and serves `fa` over <dir>/<socket>. A frame is
# a 4-byte big-endian length then that many bytes of canonical JSON (sorted
# keys, integers only); the first frame on a connection is a fad_request, and
# every request gets exactly one fad_response. Every `fa` command that opens
# the book directly holds the same lease for its duration, so there is one
# writer per book at a time.

[daemon]
binary = "fad"
protocol = 1
socket = "fad.sock"
lease = "fad.lease"
max_frame_bytes = 67108864
idle_timeout_ms = 30000
tick_ns = 1000000000
sweep_batch = 64
clock_drift_ns = 250000000
verbs = ["serve", "status", "stop"]
flags = ["--book", "--keys", "--files-root", "--register-period"]
switches = ["--json", "--help", "--bootstrap-system"]
events = ["fad_request", "fad_response", "fad_serving", "fad_status", "fad_stopped"]
usage = ["fad serve --book <dir> [--keys <file>] [--files-root <dir>] [--bootstrap-system] [--register-period <code> ...] [--json]   (holds the writer lease and serves until `fad stop`)", "--files-root <dir> confines host file-reading and file-writing requests served over the daemon socket to an existing non-symlink directory; without it, file-reading and file-writing requests over fad are refused.", "--bootstrap-system opts the local book-key holder into daemon TimeEvidence and one bounded expiry batch plus one reversal batch per cycle. This is trusted local bootstrap authority, not journaled capability issuance. First/restart and uncorroborated clock observations never sweep. Batch sizes bound effects; candidate discovery still scans the book.", "--register-period selects 1..=64 distinct exact period codes at local launch and does not require --bootstrap-system. Derived-cache maintenance gets no System authority by itself; it attempts one period per cycle in round-robin order through the native maintainer. Adding --bootstrap-system separately enables TimeEvidence plus bounded expiry/reversal effects. Maintenance does not silently repair drift, change report semantics or certify a checkpoint. Unknown periods remain visible as per-period errors.", "fad status --book <dir> [--json]", "fad stop --book <dir> [--json]"]

# ---------------------------------------------------------------------------
# Verbs
# ---------------------------------------------------------------------------

[[verb]]
name = "book"
summary = "Create a book directory (store + key file), or describe one."
writes = true
subcommands = ["create", "info"]
flags = ["--name", "--base-unit", "--calendar", "--year-start-month", "--adjustment-periods", "--time-zone", "--opening-date"]
switches = []
events = ["book_created", "book"]
exits = [0, 2, 4, 5]
usage = ["book create --name \"My Co\" [--base-unit USD] [--calendar monthly|4-4-5|4-5-4|5-4-4|52-53[:last|nearest:<weekday>[:<month>]]] [--year-start-month 1] [--adjustment-periods 1] [--time-zone UTC] [--opening-date YYYY-MM-DD]", "--time-zone UTC records the explicit civil-day policy required by scheduled reversals. Omitting it leaves the policy unset; the machine's local zone is never assumed.", "book info"]
example = "fa book create --book ./books/myco --name \"My Co\" --json"

[[verb]]
name = "chart"
summary = "Install a chart of accounts as one journaled schema effect (from a file or an embedded template), list it, or list the templates."
writes = true
subcommands = ["import", "list", "templates"]
flags = ["--date", "--key", "--template"]
switches = []
events = ["chart_installed", "accounts", "chart_templates"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["chart import (<chart.json> | --template <name>) [--date YYYY-MM-DD] [--key K]   (an account may carry lower_bound/upper_bound: \"0.00\" in its unit and normal-balance sign; \"unit\": \"base\" is the book's base unit)", "chart list", "chart templates   (us-gaap-smb, ifrs-sme, us-bank-call-report: starting points, not GAAP, IFRS or regulatory advice)"]
example = "fa chart import chart.json --book ./books/myco --json"

[[verb]]
name = "period"
summary = "Create a fiscal year's periods, list them, or move one along the period state machine (journaled)."
writes = true
subcommands = ["create", "list", "open", "soft-close", "close", "lock", "reopen"]
flags = ["--fiscal-year", "--to", "--reason", "--key", "--date", "--plan-out", "--plan", "--approval"]
switches = ["--dry-run"]
events = ["periods_created", "periods", "period_transitioned", "recorded", "period_planned", "period_plan"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["period create --fiscal-year N", "period list", "period open|soft-close|close|lock|reopen <code> [--to open|soft-closed] [--reason N] [--key K] [--date YYYY-MM-DD]", "period <transition> <code> --dry-run   (returns the sealed proposal, its proposal_digest and canonical bytes as hex; writes no file or book data; commit authority and approvals are checked separately)", "period lock|reopen <code> --plan-out <file>   (owner CLI only: writes the planned proposal and prints its proposal_digest; commits nothing)", "period lock|reopen <code> --plan <file|-> --approval <vid>...   (owner CLI commits exactly the planned proposal, citing approvals of its digest; stdin accepts binary or complete bytes hex)"]
example = "fa period open FY2026-P03 --book ./books/myco --json"

[[verb]]
name = "approve"
summary = "Record an approval of a planned proposal's digest or a reviewed allocation/settlement review artifact under the caller's capability (journaled; bound to the current security policy epoch)."
writes = true
subcommands = []
flags = ["--proposal", "--review", "--digest", "--grant"]
switches = []
events = ["approved"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["approve --proposal <proposal_digest> [--as <principal>] [--grant <op>]...   (the digest is printed by `fa period <t> <code> --plan-out <file>`; a second approver is a second invocation as another principal)", "approve --review <file|-|hex> --digest <review_digest> [--as <principal>] [--grant <op>]...   (verifies the review artifact's digest and records an approval of its sealed proposal_digest)"]
example = "fa approve --proposal <proposal_digest> --as controller --book ./books/myco --json"

[[verb]]
name = "capability"
summary = "Steward capability controls: journal an irreversible capability revocation by commitment (plan §14.2)."
writes = true
subcommands = ["revoke"]
flags = ["--commitment", "--date", "--key", "--description", "--grant"]
switches = []
events = ["capability_revoked"]
exits = [0, 2, 4, 5, 6, 7]
usage = ["capability revoke --commitment <64-hex> [--date YYYY-MM-DD] [--key K] [--description <text>] --as <principal> [--grant issue_capability] --yes"]
example = "fa capability revoke --commitment 0101010101010101010101010101010101010101010101010101010101010101 --as controller --grant issue_capability --yes --book ./books/myco --json"

[[verb]]
name = "post"
summary = "Post one entry intent under the accounting laws (balance, period law, idempotency)."
writes = true
subcommands = []
flags = ["--intent", "--grant", "--evidence", "--balancing", "--plan-out", "--timeout-ns", "--reverse-on"]
switches = ["--dry-run"]
events = ["posted", "recorded", "plan"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["post --intent <file.json|-> [--grant <op>]... [--evidence <oid>]... [--balancing 0|1] [--as <principal>]   (--balancing: that leg moves at most what its account's limit admits; the event says what was requested and what moved)", "post --intent <file.json|-> --dry-run [--plan-out <new-file>]   (runs the actual admission pipeline and aborts its staged transaction; emits the exact sealed PostEntry plan, commits nothing)", "Commit the reviewed plan with fa commit --plan <file|-> using the same --as and --grant. Any intervening book publication requires a new dry run; this first slice does not assemble new approvals or rehearse --balancing. --plan-out requires --dry-run and never overwrites a file.", "Pending accepts timeout_ns as an unsigned JSON integer, or --timeout-ns N. Its deadline is anchored to committed TimeEvidence. Adjusting accepts reverse_on as YYYY-MM-DD, or --reverse-on YYYY-MM-DD; the book must declare --time-zone UTC at creation. Supply each value once. Only the daemon records production clock observations and runs timed effects.", "A Reversal intent names reverses and a registered reason (for example, \"reason\": \"WrongAccount\"); its legs come from the target."]
example = "fa post --intent entry.json --book ./books/myco --json"

[[verb]]
name = "commit"
summary = "Commit an exact reviewed PostEntry plan after current capability, snapshot and native effects revalidation."
writes = true
subcommands = []
flags = ["--plan", "--grant"]
switches = []
events = ["plan_committed"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["commit --plan <file|-> [--as <principal>] [--grant <op>]...", "The file is canonical binary bytes from --dry-run --plan-out; stdin also accepts the plan event's complete bytes hex string. The explicit commit confirms that authenticated exact artifact. The current caller independently supplies the same capability; no authority is taken from the file.", "The first commit atomically retains the canonical plan as a graph Certificate linked from the entry by CITES. Entry.plan_certificate remains absent because the pinned substrate has no generic object-store API. An exact retry returns the original identity and already_recorded=true. Any unrelated publication before the first commit invalidates this same-snapshot plan (exit 6); perform a new dry run and review its result."]
example = "fa commit --plan entry.plan --book ./books/myco --json"

[[verb]]
name = "reverse"
summary = "Post the exact reversal of an entry with a registered reason, preserving the original entry and its lineage."
writes = true
subcommands = []
flags = ["--reason", "--effective", "--period", "--key", "--description", "--grant", "--evidence", "--plan-out"]
switches = ["--dry-run"]
events = ["reversed", "recorded", "plan"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["reverse <vid|E:vid> --reason <name|code> [--effective YYYY-MM-DD] [--period <code>] [--key K] [--description <text>] [--grant <op>]... [--evidence <oid>]... [--dry-run [--plan-out <new-file>]]", "The default effective date and period are the target's; --effective never chooses an open period automatically. The default key is reverse:<target vid>. Repeating the same request returns the original outcome; changing a committed reversal is refused.", "--dry-run rehearses the exact derived reversal without publishing it; commit its reviewed sealed plan with fa commit --plan <file|-> at the same book snapshot.", "Reasons are registered in reason_codes.toml (scope supersession): WrongAccount, WrongPeriod, WrongAmount, Duplicate, and the other listed codes. Other requires --description. A reason records the preparer's statement, not its truth."]
example = "fa reverse <vid> --reason WrongAccount --book ./books/myco --json"

[[verb]]
name = "reserve"
summary = "Reserve amounts as a Pending entry (two-phase): nothing is posted."
writes = true
subcommands = []
flags = ["--intent", "--grant", "--evidence", "--balancing", "--plan-out", "--timeout-ns"]
switches = ["--dry-run"]
events = ["posted", "recorded", "plan"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["reserve --intent <hold.json> [--timeout-ns N] [--dry-run [--plan-out <new-file>]] (a Pending: amounts reserved, nothing posted)", "timeout_ns in the intent or --timeout-ns supplies one unsigned nanosecond duration from the latest committed TimeEvidence. Missing anchors and overflow refuse. Start fad serve --bootstrap-system to record clock observations and expire due holds.", "--dry-run runs the reservation laws without acquiring the hold; fa commit --plan <file|-> acquires exactly the reviewed hold if the book has not advanced. --balancing is not supported with --dry-run."]
example = "fa reserve --intent hold.json --book ./books/myco --json"

[[verb]]
name = "resolve"
summary = "Resolve a hold: post a sub-vector drawn from it, or void it; the rest is released."
writes = true
subcommands = []
flags = ["--intent", "--grant", "--evidence", "--plan-out"]
switches = ["--dry-run"]
events = ["posted", "recorded", "plan"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["resolve --intent <res.json> [--dry-run [--plan-out <new-file>]] (resolves <hold vid>; disposition posts (legs drawn from the hold) | voids)", "A direct void requires --yes. --dry-run releases nothing and needs no confirmation; fa commit --plan <file|-> explicitly confirms the authenticated exact plan and rechecks the hold at the same snapshot."]
example = "fa resolve --intent res.json --book ./books/myco --json"

[[verb]]
name = "allocate"
summary = "Allocate an explicit total or a journal-derived period balance across target leaf accounts under a registered allocation law (ExactProRata, LargestRemainder, SequentialWaterfall), with optional review artifacts, independent approvals, and dry-run plans."
writes = true
subcommands = []
flags = ["--intent", "--review", "--review-out", "--digest", "--period", "--evidence", "--approval", "--plan-out", "--grant"]
switches = ["--dry-run", "--review-only", "--approve"]
events = ["posted", "recorded", "plan", "allocation_reviewed", "approved"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["allocate --intent <alloc.json|-> [--period <code>] [--evidence <oid>]... [--approval <vid>]... [--dry-run [--plan-out <new-file>]] [--review-only | --review-out <new-file>]", "allocate approve --review <file|-|hex> --digest <review_digest> [--as <principal>] [--grant <op>]...", "allocate --review <file|-|hex> --digest <review_digest> [--approval <vid>]... [--dry-run [--plan-out <new-file>]]", "An allocation intent supplies either `total` + `source_side` (`debit`|`credit`) or `source_period` (or `--period <code>`) to fold `source_account`'s net period balance from the journal. The canonical driver workpaper is content-addressed and auto-imported when committed."]
example = "fa allocate --intent alloc.json --book ./books/myco --json"

[[verb]]
name = "settle"
summary = "Post a single-leg or multi-leg open-item settlement under an explicit matching policy (SpecificId, Fifo, Lifo) or reviewed settlement artifact, with optional review artifacts, independent approvals, and dry-run plans."
writes = true
subcommands = []
flags = ["--intent", "--review", "--review-out", "--digest", "--evidence", "--approval", "--plan-out", "--grant"]
switches = ["--dry-run", "--review-only", "--approve"]
events = ["posted", "recorded", "plan", "settlement_reviewed", "approved"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["settle --intent <settle.json|-> [--evidence <oid>]... [--approval <vid>]... [--dry-run [--plan-out <new-file>]] [--review-only | --review-out <new-file>]", "settle approve --review <file|-|hex> --digest <review_digest> [--as <principal>] [--grant <op>]...", "settle --review <file|-|hex> [--digest <review_digest>] [--approval <vid>]... [--dry-run [--plan-out <new-file>]]", "Single-leg intents name `payment_account`, `settlement_account`, `payment_side`, `amount`, and `policy` (`SpecificId`, `Fifo`, `Lifo`) with optional `on_account_account`. Multi-leg intents name `legs` and `applications` (`payment_leg`, `policy`, `on_account_account`)."]
example = "fa settle --intent settle.json --book ./books/myco --json"

[[verb]]
name = "document"
summary = "Record a source document, run a batch import with a content-addressed receipt, read or redact a document, export a disclosure proof, manage custody, evaluate erasure against legal holds, or record legal holds and attestations."
writes = true
subcommands = ["add", "read", "redact", "disclose", "custody", "erase", "hold", "attest", "import"]
flags = ["--kind", "--mime", "--grade", "--chunk", "--to", "--authority", "--subject", "--hold", "--effective", "--date", "--description", "--key", "--plan-out", "--plan", "--approval", "--document", "--against", "--intent", "--reason", "--statement", "--evidence", "--attestation", "--account", "--period", "--entity", "--unit", "--as-known-at", "--source", "--file", "--run", "--out", "--grant"]
switches = ["--dry-run"]
events = ["document", "document_read", "redacted_view_derived", "document_disclosure_exported", "custody_transferred", "custody_chain", "legal_hold_placed", "legal_hold_release_planned", "legal_hold_released", "legal_hold", "attestation_recorded", "import_recorded", "import_receipt"]
exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["document add <file|-> [--kind Invoice] [--mime application/pdf] [--grade AgentUpload|HumanUpload]", "document read <oid> [--out <new-file>] [--grant <op>]...", "document redact <oid> [--grant privileged]", "document disclose <oid> [--chunk <idx>]... [--out <new-file>]", "document custody <oid> [--to <principal>]", "document erase <subject-vid|oid> [--grant erase]", "document hold place --authority <document-oid> --subject <vid|oid>... [--effective YYYY-MM-DD] [--description <text>] [--key K]", "document hold release <hold-vid> [--effective YYYY-MM-DD] [--key K] [--dry-run | --plan-out <new-file> | --plan <file|-> --approval <vid>...]", "document hold show <hold-vid>", "document attest review <oid> [--against <oid>]...", "document attest manual --intent <file.json|-> --reason <name|code> --statement <text> [--plan-out <new-file>]", "document attest register-equals [<attestation-vid> | --account <code> --period <code> [--unit <CODE>] [--entity <id>] [--evidence <oid>]... [--as-known-at HEAD|<seq>]]", "document import run [--source Connector|Upload|Email:<id>|Scan:<dev>] --file <file|->... [--kind Invoice] [--mime application/pdf] [--grade AgentUpload|HumanUpload] [--date YYYY-MM-DD] [--description <text>] [--key K]", "document import receipt <run-vid> [--evidence <oid>]..."]
example = "fa document add invoice.pdf --kind Invoice --mime application/pdf --grade HumanUpload --book ./books/myco --json"

[[verb]]
name = "migrate"
summary = "Control a legacy-migration run (open, stage entries into the book's opening Locked period, tie out and finalize with dual approval, abandon, or inspect)."
writes = true
subcommands = ["open", "stage", "finalize", "abandon", "show"]
flags = ["--run", "--period", "--key", "--intent", "--evidence", "--description", "--as-known-at", "--plan-out", "--plan", "--approval", "--grant"]
switches = ["--dry-run"]
events = ["migration_controlled", "migration_planned", "migration_run", "posted", "recorded"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["migrate open --intent <run.json|-> [--key K] [--description <text>]", "migrate stage <run-key|vid> --intent <chunk.json|-> [--period <code>] [--evidence <oid>]... [--dry-run | --plan-out <new-file> | --plan <file|-> --approval <vid>...]", "migrate finalize <run-key|vid> [--key K] [--description <text>] [--dry-run | --plan-out <new-file> | --plan <file|-> --approval <vid>...]", "migrate abandon <run-key|vid> [--key K] [--description <text>] [--dry-run | --plan-out <new-file> | --plan <file|-> --approval <vid>...]", "migrate show <run-key|vid> [--as-known-at HEAD|<seq>]"]
example = "fa migrate show go-live-2026 --book ./books/myco --json"

[[verb]]
name = "tb"
summary = "Trial balance: stock or period activity at a known-at frontier; opt-in certification retains an immutable certificate in the book."
writes = true
subcommands = []
flags = ["--period", "--fiscal-year", "--as-of", "--as-known-at", "--root", "--certificate-out"]
switches = ["--activity", "--summary", "--certify"]
events = ["trial_balance", "summary_trial_balance", "report_certificate"]
exits = [0, 2, 3, 4, 5, 7, 8]
usage = ["tb ((--period <code>)... | --fiscal-year N) [--activity] [--summary [--root <code>]...] [--as-known-at HEAD|<seq>|<RFC3339>]", "tb --as-of YYYY-MM-DD [--summary [--root <code>]...] [--as-known-at HEAD|<seq>|<RFC3339>]", "Add --certify to retain a content-addressed certificate in the book and emit its complete canonical bytes as hex; --certificate-out <new-file> implies certification and also saves canonical binary bytes without replacing any existing file. Uncertified reports do not write; retention advances the metadata frontier while the report's known-at remains fixed.", "Stock balances include opening history; --activity is selected-period movement. --summary folds disjoint leaf subtrees under each root account (all roots by default, or --root <code>...). Known-at instants resolve from retained TimeEvidence and report the observed frontier and tick brackets; as-of remains a civil date. Certificates preserve the original instant resolution, with embedded-owner authority and fa-fold-over-prefix replay scope; no witness signature or physical timestamp claim."]
example = "fa tb --period FY2026-P03 --book ./books/myco --json"

[[verb]]
name = "statement"
summary = "Balance sheet or income statement from exact journal folds under a registered definition, with optional period comparatives, retained replay certificates, and frontier diff/trace bridges."
writes = true
subcommands = []
flags = ["--for", "--compare", "--definition", "--before", "--after", "--max-publications", "--known-at", "--as-known-at", "--certificate-out"]
switches = ["--certify"]
events = ["statement", "statement_diff", "statement_trace", "report_certificate"]
exits = [0, 2, 3, 4, 5, 7, 8]
usage = ["statement balance-sheet|income-statement --for <period> [--compare <period>] [--known-at HEAD|<seq>|<RFC3339>]", "statement diff --definition balance-sheet|income-statement --for <period> [--compare <period>] --before <seq> [--after HEAD|<seq>]", "statement trace --definition balance-sheet|income-statement --for <period> [--compare <period>] --before <seq> [--after HEAD|<seq>] [--max-publications 1..=256]", "Both columns use the same known-at snapshot and the registered definition. Balance sheets carry opening history through each selected period; income statements show that period's activity. Native units remain separate; there is no implicit FX conversion or presentation rounding.", "--as-known-at is an alias for --known-at; supply only one. Add --certify to retain an immutable certificate and emit its complete bytes inline. --certificate-out <new-file> also saves a binary copy without replacing a file. Uncertified statements do not publish metadata. Certificates prove replay and arithmetic over the journal, not GAAP conformity."]
example = "fa statement balance-sheet --for FY2026-P03 --compare FY2026-P02 --certify --book ./books/myco --json"

[[verb]]
name = "replay"
summary = "Verify a retained report certificate's complete native read closure and reproduce its original trial balance, statement, balance explanation, or open-items report."
writes = false
subcommands = []
flags = []
switches = []
events = ["trial_balance", "statement", "balance_explained", "open_items"]
exits = [0, 2, 3, 4, 5, 8]
usage = ["replay <C:oid|oid|certificate-file|->", "A 64-hex oid resolves the immutable certificate retained in this book. A file holds canonical binary certificate bytes; stdin also accepts the oid or complete bytes hex string from a report_certificate event. Prefix a 64-hex filename with ./ to read it as a file. The certificate fixes the selector and known-at; replay never substitutes today's frontier."]
example = "fa replay trial-balance.cert --book ./books/myco --json"

[[verb]]
name = "certificate"
summary = "Check whether later entries affect a retained report certificate's selector."
writes = false
subcommands = ["status"]
flags = []
switches = []
events = ["certificate_status"]
exits = [0, 2, 3, 4, 5, 8]

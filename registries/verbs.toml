# Intrinsic fiscal-year closing (fa-4o0).
[[event]]
name = "closing_routes_recorded"
book = true
doc = "A complete effective-dated nominal-to-equity route map recorded as an immutable SchemaChange control in one witnessed transaction. already_recorded returns the original control on an exact semantic retry."
fields = ["effective_from:date","routes:int","control_entry:hex","recorded_at:seq","digest:hex","already_recorded:bool"]

[[event]]
name = "closing_routes"
book = true
doc = "The latest applicable complete routing map at the selected effective date and recorded prefix, under current whole-book read authority. found=false means no map applies; every optional header is then null and routes is empty."
fields = ["as_of:date","known_at:seq","found:bool","effective_from:date?","control_entry:hex?","recorded_at:seq?","digest:hex?","routes:[closing_route]"]

[[event]]
name = "closing_reviewed"
book = true
doc = "An unexecuted exact year-end Closing proposal encoded as the existing canonical PostIntent. Its intrinsic basis binds the complete selected source contributions and journaled routing map. Review bytes preserve sealed fields across approval commits; approvals bind proposal_digest, while review_digest authenticates the complete retained artifact to its reviewer. Revalidation recomputes the native source; this event is neither a PostPlan nor a certification or posting permit."
fields = ["fiscal_year:int","period:string","closing_date:date","known_at:seq","routes_entry:hex","routes_digest:hex","source_digest:hex","latest_close:hex?","residuals:[closing_residual]","legs:[plan_leg]","review_digest:hex","proposal_digest:hex","bytes:hex","file:string?","scope:string"]

[[event]]
name = "closing_noop"
book = true
doc = "The selected nominal balances, including previous Closing legs, have no residual. No entry, review file, approval, certificate or metadata was published; latest_close may be null when no first close exists."
fields = ["fiscal_year:int","period:string","known_at:seq","latest_close:hex?","reason:string"]

[[event]]
name = "close_verified"
book = true
doc = "Native verification refolded nominal balances at the latest Closing and at the current selected prefix. Success requires nominal_zero_at_close=true and needs_reclose=false. Missing closing evidence, invalid closing balances or later residuals instead produce an exit-8 verification error carrying the same detail."
fields = ["fiscal_year:int","known_at:seq","latest_close:hex?","last_closed_at:seq?","nominal_zero_at_close:bool?","needs_reclose:bool","residuals:[closing_residual]"]

[[shape]]
name = "closing_route"
doc = "One nominal posting account's explicitly journaled Equity destination."
fields = ["account:string","account_vid:hex","closes_to:string","equity_vid:hex"]

[[shape]]
name = "closing_residual"
doc = "An exact debit-minus-credit nominal balance before close, preserving the native unit and optional legal entity. closes_to is the destination Equity account VID; a positive net requires a credit to the nominal account."
fields = ["account:string","account_vid:hex","closes_to:hex","entity:hex?","unit_id:int","net:amount"]

[[shape]]
name = "bank_import_predecessor"
doc = "The immediate predecessor verified from its retained original statement, canonical manifest and native ImportRun receipt. This records structural statement continuity, not a reconciliation confirmation."
fields = ["manifest_oid:hex","manifest_commit:hex","statement_oid:hex","statement_commit:hex","import_run:hex","receipt_hash:hex","recorded_at:seq","sequence_number:int","statement_date:date","closing_balance:amount"]

[[shape]]
name = "batch_plan_member"
doc = "One ordered member of an atomic batch rehearsal, with its derived entry identity and exact request/prepared digests. Complete sealed bytes and supplied approvals remain in the portable artifact."
fields = ["index:int", "vid:hex", "class:string", "effective_date:date", "period:string", "idempotency_key:hex", "intent_digest:hex", "proposal_digest:hex", "entry_digest:hex", "legs:[batch_plan_leg]", "resolves:hex?", "disposition:string?", "supersedes:[lineage]", "evidence:[evidence_head]", "approvals:int"]

[[shape]]
name = "batch_plan_leg"
doc = "One admitted batch leg including exact native/base amounts, application references and registered dimensions. Earlier batch members may be settlement targets; the native carried transaction independently validates their immutable digests and available amounts."
fields = ["ordinal:int", "account:string", "account_vid:hex", "side:string", "amount:amount", "base_amount:amount?", "settles:[batch_plan_settlement]", "dimensions:[batch_plan_dimension]"]

[[shape]]
name = "batch_plan_settlement"
doc = "One exact application to an existing or earlier batch member's entry and leg."
fields = ["entry:hex", "entry_digest:hex", "ordinal:int", "amount:amount"]

[[shape]]
name = "batch_plan_dimension"
doc = "One registered dimension identifier and its immutable value identity."
fields = ["dimension:int", "value:hex"]

[[shape]]
name = "explained_cell"
doc = "The account's cell in one unit: the posted column and the pending column."
fields = ["unit:string", "debits:amount", "credits:amount", "net:amount", "entry_count:int", "debits_pending:amount", "credits_pending:amount", "pending_count:int"]

[[shape]]
name = "contribution"

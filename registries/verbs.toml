[[mcp.tool]]
name = "verify"
cluster = "fa.book"
verb = "verify"
subcommands = ["registers", "open-items", "availability", "usage", "accumulator", "projections", "schedules", "periods", "replay"]
selector = "target"
positionals = []
required = []
dont = ["Don't treat a register, an aging or a statement as truth: truth is the fold, and this proves it (exit 8 on drift).", "Don't `materialize_registers` to make a verification pass; a drift is a finding, not a nuisance.", "Period verification loads complete native history at the selected as_known_at and requires current read and verify authority. A missing history window or deleted immutable birth declaration is a failure; legacy calendar baselines do not invent missing creator provenance.", "Usage verification refolds immutable daily charges and their original issuance, source entries and committed time witnesses at as_known_at. Current whole-book read and verify authority is still required. It has no period filter and cannot repair or reset a quota; registers verification also checks usage at current head."]
mistakes = ["Passing `period` or `fiscal_year` with a target other than `registers` (the other targets take no period filter).", "Reading `status: \"no_checkpoints\"` as verified: it makes no verification claim."]

[[mcp.tool]]
name = "advance_registers"
cluster = "fa.book"
verb = "registers"
subcommands = ["advance", "materialize"]
selector = "action"
positionals = []
required = []
dont = ["Don't treat the cursor or digest as a certified checkpoint; reports still fold the journal.", "Don't silently rebuild or rematerialize a damaged cache to make verification pass: verify (`fa_book_verify`, target `registers`) and retain the finding, then explicitly materialize with yes if repair is intended."]
mistakes = ["Expecting a second advance to write when no journal input changed: wrote=false is success.", "Assuming a fiscal-year advance is one transaction: each period publishes atomically on its own."]

[[mcp.tool]]
cluster = "fa.book"
name = "migrate"
verb = "migrate"
subcommands = ["open", "stage", "finalize", "abandon", "show", "import"]
selector = "action"
positionals = ["run?"]
flags = ["--period", "--key", "--intent", "--evidence", "--description", "--as-known-at", "--approval", "--action", "--package", "--chunk"]
switches = ["--dry-run"]
stdin_property = "intent"
stdin_kind = "object"

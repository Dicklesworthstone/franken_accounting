# ---- fa.post ----------------------------------------------------------------

[[mcp.tool]]
cluster = "fa.post"
name = "post"
verb = "post"
subcommands = []
positionals = []
stdin_property = "intent"
stdin_kind = "object"
stdin_via = "--intent"

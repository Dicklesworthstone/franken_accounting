[[verb]]
name = "doctor"
summary = "Diagnose what a book needs: the embedded registries, the book directory, key file and writer lease, that the book opens, and that its registers, limit availability and accumulator equal the journal's refold. Every check names its fix."
writes = false
subcommands = []
flags = []
switches = []
events = ["doctor"]
exits = [0, 2, 4, 5, 7, 8]
usage = ["doctor   (each check is ok, warn, fail or skipped, with the fix; exit 0 only when none failed, else the first failing check's class: 4 environment, 5 foundation, 8 verification)"]

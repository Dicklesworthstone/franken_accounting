dont = ["Don't treat a register, an aging or a statement as truth: truth is the fold, and this proves it (exit 8 on drift).", "Don't `materialize_registers` to make a verification pass; a drift is a finding, not a nuisance.", "Period verification loads complete native history at the selected as_known_at and requires current read and verify authority. A missing history window or deleted immutable birth declaration is a failure; legacy calendar baselines do not invent missing creator provenance.", "Usage verification refolds immutable daily charges and their original issuance, source entries and committed time witnesses at as_known_at. Current whole-book read and verify authority is still required. It has no period filter and cannot repair or reset a quota; registers verification also checks usage at current head.", "Don't try to repair projections or open-item applied mirrors from a session: retain the projections or open-items finding and ask the operator, because the journal-derived repair (`fa recover projections`) needs schema_change and --yes and is host-only."]

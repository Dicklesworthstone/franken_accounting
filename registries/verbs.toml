[[verb]]
name = "triage"
summary = "The book's state in one call (periods by state, open periods, pending cells, derived-state health, register watermark lag, drafts awaiting promotion, open findings by severity, the daemon), with the commands to run next in next_actions."
writes = false
subcommands = []
flags = []
switches = []
events = ["book_triage"]
exits = [0, 2, 4, 5, 7]
usage = ["triage   (next_actions: what to run next, computed from the book's state)", "Requires current read authority over the whole book at its head; scoped tokens are refused before the survey.", "Open findings are counted across every recorded finding run at their current review status. drafts_awaiting_promotion counts open drafts holding planned intents: no other approval is persisted before its commit (a plan is portable bytes until then), and a draft never holds an intent the kernel refused. Bank lines are not surveyed here: fa bank status needs reconcile and privileged authority."]
example = "fa triage --book ./books/myco --json"

[[verb]]
name = "next"
summary = "The single most urgent next step for the book that the caller's capability can run, as data (the rest of fa triage's steps follow in next_actions)."
writes = false
subcommands = []
flags = []
switches = []
events = ["next_step"]
exits = [0, 2, 4, 5, 7]
usage = ["next   (command and why; null when there is nothing to do)", "Requires the same current whole-book read authority as triage.", "Under a launch capability (token, fad session, MCP), steps whose registered ops it holds come first, and the rest follow naming the ops they need; an Agent profile is never offered a step that writes trunk: a write a draft can take (resolving holds) is offered as opening that draft, with the `fa draft plan` to run into it, for a Human approver to promote; any other write is left to a Human. The embedded owner grants itself each command's ops, so it gets the book's order."]
example = "fa next --book ./books/myco --json"


[[verb]]
name = "capabilities"
summary = "What this build can do: verbs, aliases, exit codes, entry classes, robot mode."
writes = false
subcommands = []
flags = ["--grant"]
switches = []
events = ["capabilities"]
exits = [0, 2, 5]
usage = ["capabilities [--as <principal>] [--grant <op>]..."]

fields = ["command:string", "why:string"]

[[shape]]
name = "invariant_clauses"
doc = "The invariant clauses this build enforces (registries/invariants.toml, fa-37f): `live` lists the clause ids whose checker runs (FA-INV-nn.clause), `gate_g1` the clauses Gate G1 requires; a dormant G1 clause is a G1 blocker."
fields = ["live:[string]", "gate_g1:[string]"]

[[shape]]
name = "dangerous_op"
doc = "An operation that cannot be undone in practice: refused with FA-REF-007 (exit 7) unless --yes (or a --plan file) confirms it. `subcommand` is null for a verb without subcommands; `condition` says when it applies; `safe` is the alternative the refusal names."
fields = ["verb:string", "subcommand:string?", "condition:string", "safe:string"]

[[shape]]
name = "planted_fact"
doc = "A planted accounting or forensic ground-truth fact in an initialized demo book (`fa demo init`)."
fields = ["id:string", "kind:string", "period:string", "entry_vids:[hex]", "summary:string"]

[[shape]]
name = "lot_item"

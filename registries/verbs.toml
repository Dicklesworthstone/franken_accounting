[[verb]]
name = "replace"
summary = "Correct an entry (plan §15.3, Appendix B Replace): its exact Reversal and the corrected Replacement commit as one pair, both or neither. Typed sugar over fa reverse --replace-with."
writes = true
subcommands = []
flags = ["--reason", "--intent", "--effective", "--period", "--key", "--description", "--grant", "--evidence", "--plan-out"]
switches = ["--dry-run"]
events = ["corrected", "replacement_plan"]
exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["replace <vid|E:vid> --reason <name|code> --intent <corrected.json|-> [--effective YYYY-MM-DD] [--period <code>] [--key K] [--description <text>] [--evidence <oid>]... [--dry-run [--plan-out <new-file>]]", "The corrected entry intent carries the legs, without class, reverses or reason; its effective_date, period and idempotency_key default to the target's date and period and replace:<vid>. --effective, --period, --key and --description apply to the reversal, as on fa reverse. The corrected entry is required: fa reverse <vid> --reason <name> reverses without a replacement. Correction drafts are not supported."]
example = "fa replace <vid> --reason WrongAmount --intent corrected.json --book ./books/myco --json"


[[verb]]
name = "commit"
summary = "Commit an exact reviewed PostEntry, atomic Replace or PostBatch plan after current capability, snapshot and native effects revalidation."
writes = true
subcommands = []
flags = ["--plan", "--grant"]
switches = []
events = ["plan_committed", "replacement_plan_committed", "batch_plan_committed"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["commit --plan <file|-> [--as <principal>] [--grant <op>]...", "The file is canonical binary bytes from --dry-run --plan-out; stdin also accepts the plan event's complete bytes hex string. PostEntry, atomic Replace and PostBatch plans are admitted. The explicit commit confirms that authenticated exact artifact. The current caller independently supplies the same capability; no authority is taken from the file.", "The first commit atomically retains the canonical plan as a graph Certificate linked from every member by CITES. A Replace plan publishes its Reversal and Replacement together; a PostBatch plan publishes its ordered members and keyed IntentOutcome together. Joint plans cannot be committed member by member. Entry.plan_certificate remains absent because the pinned substrate has no generic object-store API. An exact retry verifies and returns the original identities and already_recorded=true. Any intervening publication before the first commit invalidates the plan (exit 6). The refusal's detail carries the same intent planned again at the current head (fresh_plan, with changed naming what differs, or replan_refusal when it can no longer be planned); it is never committed for you: review it, then commit its bytes with fa commit --plan -."]
example = "fa commit --plan entry.plan --book ./books/myco --json"

[[verb]]
name = "reclass"
summary = "Post a Reclassification: move part of an entry's leg to another account with a registered reason, citing the entry (plan §8.2 Reclassifies); the original stays."
writes = true
subcommands = []
flags = ["--from", "--to", "--amount", "--reason", "--effective", "--period", "--key", "--description", "--grant", "--evidence", "--plan-out", "--draft"]
switches = ["--dry-run"]
events = ["posted", "recorded", "plan", "draft_planned"]
exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["reclass <vid|E:vid> --from <account> --to <account> --amount <amount> --reason <name|code> [--effective YYYY-MM-DD] [--period <code>] [--key K] [--description <text>] [--grant <op>]... [--evidence <oid>]... [--dry-run [--plan-out <new-file>]]", "Moves --amount of the target's leg on --from to --to, with that leg's side and dimensions: the entry credits --from and debits --to when the target debited --from, and the other way round. The target's legs on --from must agree in side and dimensions; otherwise post an intent with class Reclassification, reclassifies and explicit legs.", "The date, period and evidence default to the target's; a Closed period admits a reclassification only with post_closed and one approval (Appendix C). The default key is reclass:<target>:<from>:<to>:<amount>, so the same command records once.", "FA-REF-185 when the move exceeds what the target's leg has left after earlier live reclassifications, when the target is reversed, or when nothing moves to another account. FA-REF-054 without a registered reason."]
example = "fa reclass <vid> --from 6100 --to 6200 --amount \"300.00 USD\" --reason WrongAccount --book ./books/myco --json"

[[verb]]
name = "reverse"
summary = "Post the exact reversal of an entry with a registered reason, preserving the original entry and its lineage."
writes = true
subcommands = []

fields = ["verb:string", "subcommand:string?", "condition:string", "safe:string"]

# ---------------------------------------------------------------------------
# MCP (plan §15.4, bead fa-xex): this registry as tool clusters.
# ---------------------------------------------------------------------------
# fa-mcp exposes every [[verb]] (and every subcommand) above as a tool in
# exactly one cluster of at most `max_tools_per_cluster` tools, or lists it
# under [[mcp.excluded]] with the reason — host-only or interactive verbs only.
# The fa-mcp parity test fails on a verb or subcommand that is neither, on one
# that is both, on one covered by two tools, on a cluster over the limit, and
# on a tool naming a verb or subcommand this registry lacks. Only verbs that
# exist today are mapped; the plan's remaining clusters appear with their verbs.
#
# A tool's wire name is its cluster with `.` → `_`, then `_`, then its name
# (`fa.read` + `trial_balance` = `fa_read_trial_balance`): hosts restrict tool
# names to [A-Za-z0-9_-]. A tool's arguments are the verb's value flags without
# the dashes (`--as-known-at` → `as_known_at`), its switches as booleans, the
# positionals named in `positionals` (a trailing `?` marks an optional one),
# `selector` (which subcommand, when the tool covers several), `book` (the book
# directory; the server's --book when absent), `as` and `keys` (the global
# flags), and `yes` on a verb with a [[dangerous]] row. `stdin_property` is a
# JSON property the server forwards on stdin as the `-` argument of
# `stdin_via` (a flag, or a positional's name); the flag or positional keeps
# its string (path) form beside it. `required` names flags and positionals the
# host must supply. `flags`/`switches`, when present, narrow the verb's lists
# to what the covered subcommands read. `dont` and `mistakes` are the tool's
# own lines of the generated Do / Don't / Discovery / Examples / Common
# mistakes documentation; the rest is derived from the verb row, the
# [[dangerous]] rows, the [[next_action]] rows and the detectors. Amounts
# cross the boundary only as strings with their unit (plan §15.4); the server's
# mistake detectors refuse a JSON number in an amount field, an instant where
# a civil date is required, a placeholder, a posting leg on a summary account,
# a re-dated intent after a period-law refusal, and a self-approval, before
# anything is dispatched.

[mcp]
server = "fa-mcp"
max_tools_per_cluster = 7
# Host-only flags: the server sets --json itself and chooses the transport.
hidden_flags = ["--json", "--via", "--no-color", "--help", "--version"]
# Flags that may repeat: the property is an array of strings (one string is accepted too).
repeat_flags = ["--grant", "--evidence", "--approval", "--period"]
# Flags whose values are integers: the property accepts a JSON integer or its decimal string.
integer_flags = ["--fiscal-year", "--year-start-month", "--adjustment-periods", "--reason", "--balancing"]

[[mcp.cluster]]
name = "fa.orient"
doc = "Where to start: what this build can do, the in-tool documentation, one verb's usage."

[[mcp.cluster]]
name = "fa.book"
doc = "A book as a whole: create or describe it, publish a checkpoint, verify derived state against the journal, rebuild registers."

[[mcp.cluster]]
name = "fa.chart"
doc = "The chart of accounts: install it as one journaled schema effect, or list it."

[[mcp.cluster]]
name = "fa.post"
doc = "Posting under the accounting laws: entries, two-phase holds and their resolutions. Every amount is a string with its unit; nothing is auto-balanced."

[[mcp.cluster]]
name = "fa.read"
doc = "Certified reads over the journal: trial balance, an explained balance, open items, one entry."

[[mcp.cluster]]
name = "fa.time"
doc = "Period law: create a fiscal year's periods, list them, move one along the state machine, approve a planned transition."

[[mcp.cluster]]
name = "fa.evidence"
doc = "Evidence: record a source document, content-addressed, so an entry can cite it."

[[mcp.excluded]]
verb = "fad"
subcommand = "serve"
reason = "host-only: controls the daemon process that will host fa-mcp (plan §15.4 registered exclusion)"

[[mcp.excluded]]
verb = "fad"
subcommand = "status"
reason = "host-only: reports on the daemon process, not on a book (plan §15.4 registered exclusion)"

[[mcp.excluded]]
verb = "fad"
subcommand = "stop"
reason = "host-only: stops the daemon process that will host fa-mcp (plan §15.4 registered exclusion)"

# ---- fa.orient --------------------------------------------------------------

[[mcp.tool]]
cluster = "fa.orient"
name = "capabilities"
verb = "capabilities"
subcommands = []
positionals = []
required = []
dont = ["Don't guess a verb, an exit code or a dangerous operation: this lists all of them for this build."]
mistakes = ["Reading the exit-code dictionary from memory instead of from `exit_codes` here (1 is never emitted; empty results are 0)."]

[[mcp.tool]]
cluster = "fa.orient"
name = "robot_docs"
verb = "robot-docs"
subcommands = ["guide", "exit-codes", "examples", "schema"]
selector = "topic"
positionals = ["name?"]
required = []
dont = ["Don't infer an event's fields: `topic: \"schema\"` with `name` prints exactly the fields of one event or shape."]
mistakes = ["Passing `name` with a topic other than `schema` (it is the event or shape to print)."]

[[mcp.tool]]
cluster = "fa.orient"
name = "help"
verb = "help"
subcommands = []
positionals = ["verb?"]
required = []
dont = ["Don't call this for the tool contract — the tool descriptions and input schemas are the contract; this is the CLI's own usage text."]
mistakes = ["Passing a tool's wire name as `verb` (it takes the CLI verb, e.g. `tb`, or an alias such as `trial-balance`)."]

# ---- fa.book ----------------------------------------------------------------

[[mcp.tool]]
cluster = "fa.book"
name = "create"
verb = "book"
subcommands = ["create"]
positionals = []
required = ["--name", "book"]
dont = ["Don't create a book inside an existing book directory; `book` names a new directory.", "Don't lose the key file the result names (`keys`): keys are never regenerated."]
mistakes = ["Omitting `book`: creation needs the new directory, the server's default book is an existing one.", "Passing `base_unit` in lowercase (`usd`): unit codes are the registered spellings (USD, EUR, …)."]

[[mcp.tool]]
cluster = "fa.book"
name = "info"
verb = "book"
subcommands = ["info"]
positionals = []
required = []
dont = ["Don't read `periods_by_state` as period law: `fa_time_period_status` lists each period with its state."]

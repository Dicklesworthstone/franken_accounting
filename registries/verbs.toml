fields = ["attestation_vid:hex", "reviewer:hex", "against:[hex]", "recorded_at:seq"]

[[shape]]
name = "explained_supplement"
doc = "A SupplementalEvidence link recorded against an entry."
fields = ["supplement_vid:hex", "document_oid:hex", "role:int", "role_name:string?", "recorded_at:seq"]

[[shape]]
name = "evidence_supplement"

name = "adjustment"
summary = "Proposed audit adjustments (plan §11.12): propose a draft correcting entry in an engagement (balanced per unit on posting leaves, dated inside a scope period; it never posts), book it by naming the committed entry that makes the correction, or pass it with a registered reason. A proposal is decided once."
writes = true
subcommands = ["propose", "book", "pass"]
flags = ["--engagement", "--intent", "--proposal", "--entry", "--reason", "--key", "--date", "--grant"]
switches = []

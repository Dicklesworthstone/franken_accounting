events = ["general_ledger", "roll_forward", "aging", "aging_reconciled", "aging_portfolio_reconciled", "cash_flow", "policy_cash_flow", "split_cash_flow", "indirect_cash_flow", "lots", "report_certificate"]
exits = [0, 2, 3, 4, 5, 7, 8]
usage = ["gl detail --account <code[,code...]> [--unit <CODE[,CODE...]>] --from YYYY-MM-DD --to YYYY-MM-DD [--label <text>] [--as-known-at HEAD|<seq>|<RFC3339>] [--certify | --certificate-out <new-file>]","gl roll-forward --account <code[,code...]> [--unit <CODE[,CODE...]>] --from YYYY-MM-DD --to YYYY-MM-DD [--label <text>] [--as-known-at HEAD|<seq>|<RFC3339>] [--certify | --certificate-out <new-file>]","gl aging [--account <code[,code...]> | --all-posting] --as-of YYYY-MM-DD [--bucket <days>]... [--reconcile] [--certify | --certificate-out <new-file>] [--as-known-at HEAD|<seq>|<RFC3339>]","gl cash-flow --account <code[,code...]> [--unit <CODE[,CODE...]>] --from YYYY-MM-DD --to YYYY-MM-DD --policy <file.json|-> [--indirect --income-period <code>...] [--label <text>] [--as-known-at HEAD|<seq>|<RFC3339>] [--certify | --certificate-out <new-file>]","gl lots --account <code> [--as-of YYYY-MM-DD] [--as-known-at HEAD|<seq>|<RFC3339>] [--relieve <amount> --law FIFO|LIFO|SpecificId|WeightedAverage [--regime US-GAAP|US-TAX|IFRS] [--rounding-law HalfEven|HalfUp|Down|Up|Ceiling|Floor] [--target <vid[:ordinal]>]...]","Historical folds are read-only unless --certify or --certificate-out retains their complete source certificate. Detail retains its roll-forward source; roll-forward, aging, aging reconciliation, the aging portfolio and direct or indirect cash-flow retain their own full native artifact. Current read and produce authority are required. Replay by the returned C:<digest> works after reopening the book and later backdated postings. Cash-flow and reconciliation receipts include a replay command with the producing request as --expect JSON; recipients must retain and select that request independently before accepting replay. Lots certification remains refused.","Uncertified RFC3339 known-at queries resolve retained TimeEvidence ticks and disclose the original resolution and brackets. Certification requires HEAD or a commit sequence because the current GL certificate format cannot retain that instant-resolution witness. Run an instant query without certification, then pass its resolved_seq to --as-known-at when requesting a certificate over that journal prefix. The same restriction applies to --certificate-out.","Opening stock, posted movements and closing stock share one known-at frontier. --reconcile ties an account's open-item fold to its control balance and needs an explicit selection: one --account code (aging_reconciled), or a comma-separated --account list or --all-posting (every posting leaf), which reconcile from one chart, one aging fold and one control trial balance at one coordinate (aging_portfolio_reconciled). Unselected leaves are listed as uncovered, never as zero. complete and reconciled are separate verdicts, and neither is a close permit. Cash-flow policies classify each cash leg (or indirect non-cash adjustment) explicitly without inventing a balancing plug. A direct policy with `account_rules` ([{account, activity}] for non-cash counterpart accounts) and optional `overrides` (whole cash legs, like assignments) is a rule policy (policy_cash_flow): a cash leg takes a rule's activity only when every nonzero non-cash counterpart in its entry and unit has that one activity, mixed or unmapped counterparts need an override, and `decisions` records each leg's basis. A rule policy cannot also carry assignments and does not combine with --indirect.","A certified detail replay_command includes --view detail plus the original explicit account, unit, date, label and recorded-sequence selections. Retain these expectations independently before accepting a delivered certificate; replay verifies them before rendering ledger lines.", "A policy with splits selects exact split cash flow. Its splits array names entry_digest, leg_index, reason, and portions:[{activity,amount}] for each original cash leg. Every amount is a positive exact unit-tagged string in that leg's actual currency, and portions total its original amount exactly. For example, a 100.00 USD loan payment can have financing 80.00 USD and operating 20.00 USD portions. Splits cannot combine with assignments, account_rules or --indirect. Certification retains fa:cash-flow-split:v1; recipient replay takes --expect kind split-cash-flow with independently selected full policy, reasons, units and fixed numeric known_at."]
example = "fa gl detail --account 1000 --from 2026-03-01 --to 2026-03-31 --book ./books/myco --json"

[[verb]]
name = "explain"
summary = "Explain a leaf account's balance, a committed entry and its lineage, an entry's complete supersession lineage and net effect, an entry's evidence closure, a refusal code from the embedded catalog, a fiscal period's state and transitions, or a register cell's fold vs materialized state."
writes = true
subcommands = ["balance", "entry", "evidence", "refusal", "period", "register", "lineage"]
flags = ["--period", "--unit", "--as-known-at", "--certificate-out", "--branch"]
switches = ["--certify"]
events = ["balance_explained", "entry_explained", "evidence_explained", "refusal_explained", "period_explained", "register_explained", "lineage_explained", "report_certificate"]
exits = [0, 2, 3, 4, 5, 8]
usage = ["explain balance <account code> --period <code> [--as-known-at HEAD|<seq>|<RFC3339>] [--certify | --certificate-out <new-file>]", "explain entry <vid|E:vid>", "explain lineage <vid|E:vid> [--as-known-at HEAD|<seq>]", "explain evidence <entry-vid|E:vid>", "explain refusal <FA-REF-nnn>", "explain period <period-code>", "explain register <account-code> --period <code> [--unit <CODE>] [--as-known-at HEAD|<seq>]", "Without certification this is a pure read; `explain refusal` requires no book. --certify (on `explain balance`) retains the exact explanation and native read closure in the book; --certificate-out also creates a new external copy. The certificate binds historical account metadata, contributing entries, evidence references, lineage, cell history, and the whole-period fold."]
example = "fa explain balance 1000 --period FY2026-P03 --book ./books/myco --json"


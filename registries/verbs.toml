[[mcp.tool]]
cluster = "fa.proof"
name = "gl"
verb = "gl"
subcommands = ["detail", "roll-forward", "aging", "cash-flow", "lots"]
selector = "view"
positionals = []
flags = ["--account", "--unit", "--from", "--to", "--label", "--as-of", "--bucket", "--policy", "--income-period", "--relieve", "--law", "--regime", "--rounding-law", "--target", "--as-known-at", "--branch", "--from-source", "--aging-certificate", "--control-certificate"]
switches = ["--reconcile", "--all-posting", "--indirect", "--certify"]
stdin_property = "policy"
stdin_kind = "object"
stdin_via = "--policy"
required = []
dont = ["Don't treat running balances as balances known on each movement's recorded day: they are effective-date running balances at the selected known-at snapshot.","Don't invent a balancing plug in a cash-flow policy: every selected cash leg (or indirect non-cash adjustment) must be explicitly classified and tie out to the native fold. A direct policy classifies legs either by assignments or, as a rule policy, by account_rules for non-cash counterpart accounts plus whole-leg overrides (event policy_cash_flow, with each leg's basis in decisions); mixed or unmapped counterparts need an override.","Reconcile several leaves at one coordinate with view aging, reconcile: true and a comma-separated account list or all_posting: true (event aging_portfolio_reconciled); unselected leaves are listed as uncovered, and complete and reconciled are separate verdicts, never a close permit.","Use certify: true on detail, roll-forward, aging (including reconcile) or cash-flow (including indirect) to retain the complete source artifact and receive its digest and complete bytes inline. This requires read and produce; fa_read_replay accepts the digest after restart. Detail uses the complete roll-forward source certificate.","Uncertified RFC3339 as_known_at queries resolve retained TimeEvidence ticks and disclose their original resolution and brackets. With certify: true, as_known_at must be HEAD or a commit sequence: the GL certificate format cannot retain an instant-resolution witness. Run the instant query without certification first, then use its resolved_seq to certify that journal prefix.","For detailed ledger lines, the replay_command includes view detail and all explicit original request selections. Supply those independently reviewed expectations to fa_read_replay; the certificate remains the original complete roll-forward source.", "An inline policy with splits partitions original cash legs into portions. Every portion amount must be an exact unit-tagged string in the cited leg's actual currency; portions total that leg exactly and each split records a reason. Splits cannot combine with assignments, account_rules or indirect. Certify and replay use the complete split-cash-flow expectation with an independently fixed numeric known_at; both paths check currency against the original native leg.", "With certify: true, view aging can reuse saved certificates instead of re-folding: from_source (a retained open-items certificate) ages that exact prefix; reconcile: true with aging_certificate (a gl aging certificate) and control_certificate (the trial balance as-of certificate at the same prefix and date) reconciles from exactly those sources. The other arguments, including a numeric as_known_at for a reconciliation, are the question the sources must answer (exit 8 otherwise)."]
mistakes = ["Passing policy_file: MCP refuses host filesystem paths; supply the policy object inline as policy.", "Running view aging with reconcile: true without an explicit account selection: pass account (one code or a comma list) or all_posting: true; an omitted account is never read as the whole book.", "Certifying lots is unsupported. Cash-flow (direct, rule-policy, split and indirect), aging reconciliation and aging portfolio replay requires the original independently selected request in the expect JSON string.", "Passing a file path as from_source, aging_certificate or control_certificate: MCP accepts retained C:<oid> values only."]

[[mcp.tool]]
cluster = "fa.read"
name = "trial_balance"
verb = "tb"
subcommands = []
positionals = []
flags = ["--period", "--fiscal-year", "--as-of", "--as-known-at", "--root", "--branch", "--as-issued-to", "--as-reported-in", "--render"]
required = []
dont = ["Don't pass an instant to `as_of`: a civil date, never a timestamp; instants are unsupported here.", "Don't mix `as_of` with `period`, `fiscal_year` or `activity`.", "Use certify: true to retain the certificate in the book and receive the report and complete certificate as two data items. Replay accepts its oid or bytes string. Certification writes metadata only; MCP exposes no certificate_out host-file write.", "For functional currency, supply functional: true with one period or as_of civil date for cumulative stock; add activity: true with one period for movement only. Both use committed base valuations and refuse unvalued foreign legs. Functional reports cannot combine with certify, summary, fiscal_year, branch or as_originally_reported. as_of cannot combine with period or activity. Reporting does not recalculate valuations at current rates.", "Use render: md to also receive the trial balance as Markdown inline (a rendered item after the report). html, svg, pdf and pdfa write files and are host-only: MCP exposes no out host-file write."]
mistakes = ["Reading `activity` rows as stock: stock includes opening history, `activity: true` is the selected periods' movement.", "Treating a known-at instant as an exact physical commit timestamp: it is a retained TimeEvidence bucket, with its frontier and brackets in the coordinate."]

[[mcp.tool]]
cluster = "fa.read"
name = "statement"
verb = "statement"
subcommands = []
positionals = ["name"]
flags = ["--for", "--compare", "--definition", "--before", "--after", "--max-publications", "--known-at", "--as-known-at", "--branch", "--before-certificate", "--after-certificate", "--from-diff", "--as-issued-to", "--as-reported-in", "--render", "--from", "--to", "--issuance", "--distribution", "--unit", "--label"]
switches = ["--certify", "--as-originally-reported", "--functional"]
required = ["name"]
dont = ["Use functional: true with balance-sheet or income-statement to sum exact retained functional-currency valuations, verified against their original Rate evidence. Both current and compare columns use one known-at. Whole-book read is required, and certify additionally requires produce. The retained v5 certificate replays the functional basis and supports status; no new rate or valuation is chosen. Unvalued foreign legs refuse. Do not combine functional with diff, trace, branches, issuance views, lint or equity-roll-forward.", "name equity-roll-forward is the statement of changes in equity over inclusive from and to dates, not a period code: name the equity accounts that carry owner issuances and distributions in issuance and distribution (every other equity leg is another equity movement; nothing is inferred from names). It takes none of for, compare or definition. certify: true retains the complete statement; replay and certificate status require the receipt's equity-roll-forward expect with its independently retained fixed prefix, units, dates and issuance/distribution roles.", "Use name balance-sheet or income-statement (or diff|trace with definition and before), for a fiscal period code, and optionally compare for another period. Both columns share one known-at snapshot.", "Use name lint with definition (balance-sheet, income-statement, us_gaap_small_company_balance_sheet or us_gaap_small_company_income_statement) and optionally as_known_at to check whether the definition partitions the chart (FA-INV-04): clean, unmapped and multiply mapped leaves. Lint takes no for; findings are data, not an error.", "Keep native units separate: no implicit FX, consolidation or GAAP conformity is claimed. A balance sheet includes opening history; an income statement shows selected-period activity.", "Use certify: true for a retained certificate, including diff and trace, and replay it with fa_read_replay. Certified comparisons and traces require read and produce on the launch capability. certificate_out is forbidden; certificate bytes and oid are returned inline.", "To compare two statements already certified (for example as reported then and as stated now), use name diff with before_certificate and after_certificate set to their C:<oid> values and for (plus compare) naming the statement they certify; the certificates fix both frontiers, so omit before, after and known_at, and a for, compare or definition they do not answer is refused. To attribute a saved comparison to each intermediate publication, use name trace with from_diff set to its C:<oid>, the same for, and certify: true.", "Use render: md to also receive the statement as Markdown inline (a rendered item after the report; not for diff or trace). html, svg, pdf and pdfa write files and are host-only: MCP exposes no out host-file write."]
mistakes = ["Omitting for on a statement (every name except lint), passing multiple for or compare periods, or using a date where a period code is required.", "Supplying known_at and as_known_at together: they name the same selector.", "Treating a later-period comparative as a different known-at snapshot; use a separate statement call for that question.", "Passing a file path as a certificate input: MCP accepts retained C:<oid> values only."]

[[mcp.tool]]
cluster = "fa.read"
name = "replay"
verb = "replay"
subcommands = []
positionals = ["file?"]
flags = ["--expect", "--view", "--account", "--unit", "--from", "--to", "--label", "--as-known-at"]
stdin_property = "certificate"
stdin_kind = "string"
stdin_via = "file"
required = ["file"]
dont = ["For cash-flow (direct, rule-policy or indirect), aging reconciliation or the aging portfolio, supply expect as the original independently selected request encoded as a JSON string; for effective-date aging it is optional and binds the replay to your own question. With workpaper: true (and read plus produce) the response also carries the family's recipient-bound JSONL workpaper inline as workpaper_exported.text, for ledger detail (view: detail), the roll-forward lead schedule (view: roll-forward), aging (with its expect), cash-flow, aging reconciliation, the aging portfolio, statement diff and statement trace.","Certificate content still travels in the separate inline certificate property; expect is never a host file or inferred from the delivered artifact.","Pass the retained oid (bare 64-hex or C: prefixed) or complete bytes hex string from report_certificate inline as certificate. Never edit the certificate or substitute the current known-at.","A replay proves the retained closure produces the same result; it is not a witness signature or a judgment on the accounting treatment.","For general-ledger lines, supply view: detail and all independently reviewed account, unit, from, to, label and numeric as_known_at expectations. HEAD and omitted units refuse. Do not combine view: detail with expect. This returns general_ledger followed by the existing roll-forward report_replayed receipt; the source certificate and output digest remain unchanged.","view: roll-forward takes the same required expectations and binds a roll-forward lead schedule's replay to them; it returns roll_forward followed by report_replayed."]
mistakes = ["Looking up an oid in a different book; use the book where certification retained it.", "Passing file: MCP refuses host paths; use the inline certificate property."]


fields = ["document_oid:hex", "doc_commit:hex", "role:int", "role_name:string?", "kind:string", "grade:string", "self_sourced:bool", "size:int", "recorded_at:seq", "reviews:[explained_review]", "supplements:[explained_supplement]", "counts_toward_minimum:bool"]

[[shape]]
name = "explained_review"

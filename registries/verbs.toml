usage = ["adjustment propose --engagement <id> --intent <entry.json|-> [--key K]   (the intent is {\"effective_date\": \"YYYY-MM-DD\", \"description\": \"...\", \"legs\": [{\"side\": \"debit|credit\", \"account\": \"<code>\", \"amount\": \"<amount> <UNIT>\"}, ...]}; proposals are numbered from 1 per engagement; the default key is the proposal's content, so the identical proposal retries exactly and different proposals never collide)", "adjustment book --engagement <id> --proposal <n> --entry E:<vid>   (needs read and produce; the standing trunk posting, recorded after the proposal and effective in its period, whose legs equal the proposal's and that books no other proposal; FA-REF-182 otherwise)", "adjustment pass --engagement <id> --proposal <n> --reason ClearlyTrivial|BelowPerformanceMateriality|ManagementDeclined|Other   (reason_codes.toml scope adjustment_pass; a decided proposal is FA-REF-181)"]

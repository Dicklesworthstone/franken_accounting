usage = ["receipt --party <code> --number <reference> --date YYYY-MM-DD --cash <code> --receivable <code> --amount \"1290.00 USD\" [--applies <invoice vid>[:<leg>][=<amount>]]... [--evidence <oid>]... [--entity <code>] [--key K] [--dry-run [--plan-out <new-file>] | --draft <name> | --scenario <name>]", "--applies names an open item (an invoice's receivable leg is leg 0); with one --applies the whole amount applies, with several each names its amount; the kernel refuses more than is open (FA-REF-072) and names the open amount. Without --applies the receipt is on account. A zero amount or application is refused. The key is receipt:[<entity>:]<party>:<number> unless --key is given (the reference is the customer's); fa bank match reads <number> as the bank reference.", "For a foreign invoice paid in the book's functional currency, name exactly one --applies <vid>:<leg>=<foreign amount> and all of --fx-rate D:<retained Settlement Rate oid> --conversion <AnyCurrency account> --realized-fx <gain/loss account>. --amount is the actual cash amount and must equal the retained rate conversion. RemainingCarryingValue derives relief from the invoice and prior live applications, including exact reversal restoration; final payment consumes the remaining base value. Ambiguous carrying histories or unapportioned revaluations refuse. Review --dry-run and save --plan-out; after an uncertain acknowledgement retry the saved plan with fa commit."]
example = "fa receipt --party ACME-CUST-17 --number WIRE-IN-1 --date 2026-03-20 --cash 1000 --receivable 1200 --amount \"1250.00 USD\" --applies <invoice vid> --evidence <oid> --book ./books/myco --json"



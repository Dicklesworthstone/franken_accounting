[[verb]]
name = "receipt"
summary = "Post a customer receipt (plan §15.3, Appendix B): cash debited, the receivable credited for the party, the credit applied to the open invoices --applies names. Typed sugar over fa post."
writes = true
subcommands = []
flags = ["--party", "--number", "--date", "--cash", "--receivable", "--amount", "--applies", "--fx-rate", "--conversion", "--realized-fx", "--entity", "--key", "--description", "--evidence", "--event", "--grant", "--plan-out", "--draft", "--scenario"]
switches = ["--dry-run"]
events = ["posted", "recorded", "plan", "draft_planned", "scenario_run"]

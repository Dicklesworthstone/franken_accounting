[[mcp.tool]]
cluster = "fa.book"
name = "checkpoint"
verb = "checkpoint"
subcommands = ["create"]
positionals = []
required = []
dont = ["Don't present the checkpoint as an evidence bundle or a document-receipt proof: it covers entries only, signed by the book's key (public_key)."]

[[verb]]
name = "robot-docs"
summary = "In-tool documentation for agents: the guide, the exit codes, worked examples, and the robot-mode schema."
writes = false
subcommands = ["guide", "exit-codes", "examples", "schema"]
flags = []
switches = []
events = ["robot_docs", "robot_schema"]
exits = [0, 2, 5]
usage = ["robot-docs guide|exit-codes|examples", "robot-docs schema [<event or shape>]"]
example = "fa robot-docs schema balance_explained --json"

[[verb]]
name = "help"
summary = "The command list, or one verb's usage."
writes = false
subcommands = []
flags = []
switches = []
events = ["help"]
exits = [0, 2]
usage = ["help [<verb>]"]
example = "fa help explain"

[[verb]]
name = "demo"
summary = "Initialize a deterministic, realistic demo book directory with chart, periods, migration opening balances, operating entries, planted forensic findings, materialized registers, and a signed transparency checkpoint."
writes = true
subcommands = ["init"]
flags = ["--scenario", "--seed"]
switches = []
events = ["demo_initialized"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["demo init [--scenario retail|saas|manufacturing|nonprofit|holding|crypto|bank|ponzi|shell-network|worldcom|channel-stuffing] [--seed <N>]", "Creates a self-contained demo book in --book <dir> (with keys at --keys <file> or <dir>/book.keys), installs the scenario's chart, opens FY2026 periods, finalizes an OpeningOnly MigrationRun, posts operating and planted forensic entries, advances registers, and creates a signed checkpoint."]
example = "fa demo init --scenario retail --seed 7 --book ./books/retail-demo --json"


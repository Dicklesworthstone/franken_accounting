[[verb]]
name = "schedule"
summary = "Approved recurring fixed entries driven by committed TimeEvidence: prepare an exact template and calendar cadence, activate it with independent approval, inspect journal-derived progress, and stop future occurrences by cancellation lineage."
writes = true
subcommands = ["recurring"]
flags = ["--template", "--every-months", "--month-end", "--end", "--plan", "--plan-out", "--approval", "--reason"]
switches = ["--dry-run"]
events = ["recurring_plan", "recurring_recorded", "recurring_schedules", "recurring_cancelled"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["schedule recurring create <name> --template <entry.json|-> --every-months <positive integer> --month-end PreserveDay|ClampToMonthEnd|LastDayStaysLast [--end YYYY-MM-DD] --dry-run [--plan-out <new-file>]   (template is an Original intent with explicit native legs, evidence, idempotency_key and effective_date as its start. Description, evidence and effects are fixed. No applications, FX derivation, pending entries or automatic reversals. The plan binds the current execution capability and requires a declared book time-zone policy.)", "schedule recurring create <name> --plan <file|hex|-> --approval <vid>...   (one independent Human approves proposal_digest with fa approve. Use the unchanged plan and creator capability. Creation journals a ScheduleControl and is idempotent by schedule name. The plan authorizes fixed effects; it does not exempt later occurrences from current account, amount, authority, evidence or period laws.)", "schedule recurring list   (current schedules, explicit cadence, next occurrence and any calendar refusal; read authority required)", "schedule recurring cancel <name> --reason <text>   (creator or a principal holding approve may stop future execution under current read/post authority. Cancellation is journaled; existing occurrences require ordinary corrections.)", "The daemon sweeps due occurrences only under corroborated committed TimeEvidence ticks. Each occurrence has a deterministic schedule/index identity, and cancellation, tick and execution progress are transaction witnesses. A Closed period blocks the named occurrence. Agent-profile activation and draft recurring schedules remain unsupported in this slice; a Human creates the approved schedule."]
example = "fa schedule recurring create monthly-rent --template rent.json --every-months 1 --month-end ClampToMonthEnd --end 2026-12-31 --dry-run --plan-out rent.plan --book ./books/myco --json"


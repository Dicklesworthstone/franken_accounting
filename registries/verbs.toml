events = ["rea_recorded", "instruments"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["instrument add <instrument.json|->   ({\"code\": \"BA-1\", \"name\": \"Operating account\", \"kind\": \"BankAccount\", \"unit\": \"USD\", \"held_at\": \"BANK-1\", \"mirrors\": \"1000\"}; held_at is a party code, mirrors a GL leaf account code)", "instrument list", "add is a journaled SchemaChange control under schema_change authority; the default key is instrument:<code>. Instruments are what fa event record --resource <label>:<amount>:<instrument> names."]
example = "fa instrument add operating.json --book ./books/myco --json"


[[verb]]
name = "entity"
summary = "REA legal entities (plan §4.1, §4.5): record a reporting entity with its jurisdiction, functional unit and life span (lifting a code declared at book creation to its full specification), or list them."
writes = true
subcommands = ["add", "list"]
flags = ["--key", "--date"]
switches = []
events = ["rea_recorded", "legal_entities"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["entity add <entity.json|->   ({\"code\": \"ACME-DE\", \"name\": \"Acme GmbH\", \"jurisdiction\": \"DE\", \"functional_unit\": \"USD\", \"formed\": \"2019-04-01\", \"dissolved\": null, \"external_ids\": [{\"system\": \"lei\", \"id\": \"5299001ABCDEF\"}]}; a code declared with fa book create --entity keeps its declared name)", "entity list", "add is a journaled SchemaChange control under schema_change authority; the default key is entity:<code>. Parties and legal entities are what fa party relate names.", "functional_unit must be the book's base unit: one functional currency per book (plan §0.4); a subsidiary in another currency is its own book, consolidated."]
example = "fa entity add acme-de.json --book ./books/myco --json"

[[verb]]
name = "finding"
summary = "Discover recorded forensic runs, record a certified run, inspect its immutable findings, append independent human reviews, and export or replay numbered workpapers."
writes = true
subcommands = ["record", "runs", "list", "show", "review", "export", "replay"]
flags = ["--certificate", "--param", "--account", "--source", "--effective-through", "--known-at", "--as-known-at", "--page-size", "--cursor", "--action", "--note", "--dismissal-reason", "--previous", "--evidence", "--file", "--export-format", "--out", "--grant"]
switches = ["--include-reviews"]
events = ["findings_recorded", "finding_runs", "finding_list", "finding_shown", "finding_reviewed", "finding_exported", "finding_replayed"]
exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["finding record <procedure-id> [--param <name=integer>]... [--account <code>] [--source E:<vid>] [--known-at HEAD|<seq>] [--effective-through YYYY-MM-DD]", "finding record --certificate C:<digest>   (the exact idempotent retry; a new run at HEAD may select a later source prefix)", "finding runs [--page-size 1..32] [--cursor <192-hex>] [--known-at HEAD|<seq>]   (discover recorded runs; default page size 16)", "finding list --certificate C:<digest> [--known-at HEAD|<seq>]   (every finding in this certified run, not a global inventory)", "finding show F:<vid> [--known-at HEAD|<seq>]", "finding review F:<vid> --action acknowledge|dismiss|reopen --note <text> [--previous R:<latest-review>] [--dismissal-reason explained|duplicate|data-quality|outside-scope|other] [--evidence D:<oid>]...", "finding review --certificate C:<run> --file <reviews.json|->   (an explicit selection from ONE run reviewed in one transaction: a JSON array of {finding, action, note, previous?, dismissal_reason?, evidence?: [D:<oid>]}, each validated as a single review; any refused decision refuses the whole set, and one finding_reviewed event is emitted per decision in certified order)", "finding export --certificate C:<digest> [--export-format md|jsonl|canonical] [--include-reviews [--known-at HEAD|<seq>]] [--out <new-file>]", "finding replay <canonical-workpaper|-> [--certificate C:<expected-digest> --known-at <exact-seq>]", "Recording and exporting require read and produce; discovering runs, listing, showing and replaying require read. Review requires a Human with read and approve who is independent of the run producer. Dismissal also requires a registered reason and retained evidence. Supply the current --previous after the first decision; stale decisions refuse instead of overwriting history.", "Run discovery has scope recorded-runs: total_recorded_runs counts the structurally checked inventory at known_at; only summaries in the returned page also undergo full certificate and computation replay. It establishes neither current review status nor complete detector coverage. Pass next_cursor unchanged to continue the same book and inventory: omitted known_at or HEAD inherits the cursor cutoff; an explicit sequence must equal it. Current authority is always rechecked, and checked_through names the current validation frontier.", "The original numbered workpaper remains unchanged when later reviews are appended. --include-reviews adds a separate review appendix with its own fixed cutoff. Canonical exports replay against retained native evidence; Markdown and JSONL are presentations. Recipient-bound replay requires both the independently expected certificate and exact review cutoff; replay without them states its as-supplied historical scope. Complete responses refuse if they exceed transport limits, never truncate.", "Bank statement drift observations additionally require current reconcile authority when recording, reading, reviewing, exporting or replaying their retained run. A saved certificate or workpaper never grants that authority; ordinary procedure runs keep their existing operation requirements."]
example = "fa finding record jet.round_amounts --book ./books/myco --json"

[[verb]]
name = "fx"
summary = "Retain exact Rate evidence, journal revaluation routes, and review or post source-derived period-end FX adjustments."
writes = true
subcommands = ["rate", "routes", "revalue"]
flags = ["--from-json", "--grant", "--route", "--effective-from", "--key", "--description", "--as-of", "--as-known-at", "--period", "--account", "--rate", "--entity", "--evidence", "--approval", "--review", "--review-out", "--digest", "--plan-out"]
switches = ["--dry-run", "--review-only"]
events = ["fx_rate_added", "fx_routes_recorded", "fx_routes", "fx_revaluation_reviewed", "fx_revaluation_noop", "plan", "posted", "recorded"]
exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["fx rate add --from-json <rate.json|->", "Rate JSON fields: base_unit (functional currency code), quote_unit (foreign currency code), rate_num and rate_den (positive exact decimal integer strings, at most u128), rounding (registered law name), as_of (YYYY-MM-DD), retrieved_at_ns (nonnegative u64 integer), purpose (spot_close | period_average | period_close | settlement), and source (uploader's source description). The ratio states functional-currency units per one foreign-currency unit. Unknown and repeated fields, floats, zero denominators and unknown units refuse.", "The existing authenticated intake path derives HumanUpload or AgentUpload. Source and retrieval metadata are uploaded assertions, never a verified provider transcript or trusted clock. A retry preserves the original uploader's evidence grade and receipt. Admission precedes host-file or stdin consumption. MCP uses the on-demand fa.fx cluster with action add and inline rate JSON; host paths are refused.", "For a valued posting, fa post --intent <entry.json|-> accepts fx: {law: SpotClose | PeriodAverage, rates: [D:<retained-Rate-oid>, ...]}. JSON string values must be quoted. The facade reads complete governed Rate documents and computes base amounts; the posting kernel independently recomputes them inside its transaction. Caller-supplied base_amount and base_totals refuse. Current read and post authority are required; a bound capability is never widened.", "SpotClose uses spot_close evidence as of the entry's effective date. PeriodAverage uses period_average evidence as of the last included day of the actual posting period. Both live laws require HalfEven rounding. A Reversal inherits the original entry's exact valuation, Rate evidence and residual and cannot supply a new fx selection. SpotClose and PeriodAverage reversals may post on a later lawful date or period: native admission verifies the original valuation date and period through the exact retained reversal chain. The new posting date still governs period admission, account effectivity and approvals.", "Read functional stock with fa tb --functional --period <one code> or --as-of YYYY-MM-DD; add --activity with one period for movement only. Optional --as-known-at HEAD|<seq>|<RFC3339> fixes the retained prefix. Stock includes opening history across fiscal years. Posted and outstanding pending columns stay separate; foreign legs lacking committed base valuations refuse. These reads do not revalue entries or issue certificates; summary, fiscal-year, scenario, original-report and certification options refuse. Current whole-book read authority is checked even for historical prefixes.", "fx routes set --route <source-code>:<valuation-code>:<unrealized-code>... --effective-from YYYY-MM-DD --key K [--description TEXT]   (complete additive map; read and schema_change required; sources are single foreign-currency Asset/Liability leaves, dedicated unused valuation leaves use the base currency and same account type)", "fx routes show --as-of YYYY-MM-DD [--as-known-at HEAD|<seq>|<RFC3339>]", "fx revalue --period <normal-period> --account <source-code> --rate D:<closing-rate-oid> --key K [--entity <legal-entity-code>] [--description TEXT] [--evidence <oid>]... [--review-only | --review-out <new-file> | --dry-run [--plan-out <new-file>] | --yes]", "fx revalue --review <file|-|hex> --digest <review_digest> [--approval <vid>]... [--dry-run [--plan-out <new-file>] | --yes]   (restore unchanged PostIntent bytes; independent approvals name proposal_digest)", "Revaluation derives cumulative foreign exposure and functional carrying values from immutable entries, including prior verified adjustments. PeriodClose evidence uses the actual Normal period's last included date and HalfEven. Native foreign amounts never change; only the signed difference is posted between the registered valuation and unrealized leaves. An exact zero difference publishes nothing. An old recorded review retry returns its original outcome; relevant source or route drift invalidates an unposted review.", "This revaluation workflow requires current whole-book read/post authority and full governed Rate access. Closed periods retain normal post_closed authority and independent approval. Multiple legal entities require an explicit entity. General dimensions, limited accounts, AnyCurrency source exposure, atomic batches, draft promotion and reversing a revaluation are refused; corrections use another source-derived delta. Manual postings to a dedicated valuation leaf make revaluation refuse, including offsetting pairs.", "Native --dry-run plans write nothing. Commit exact plan bytes with fa commit --plan <file|-> --grant read and the same holder and grants. Review is a proposed calculation, not a certificate, approval or posting permit."]
example = "fa fx rate add --from-json rate.json --book ./books/myco --json"

[[verb]]
name = "bank"
summary = "Retain bank statements, confirm and correct exact matches, attest statement closes, and inspect historical reconciliation and later drift."
writes = true
subcommands = ["import", "match", "confirm", "unmatch", "history", "status", "reconcile", "reconciliation"]
flags = ["--previous-import", "--bank-format", "--account", "--layout", "--import", "--date-window", "--as-known-at", "--grant", "--line-ordinal", "--proposal-digest", "--source-known-at", "--proposer", "--match", "--digest"]
switches = []
events = ["bank_imported", "bank_matches_proposed", "bank_match_confirmed", "bank_match_unmatched", "bank_match_history", "bank_confirmation_status", "bank_reconciled", "bank_reconciliation_status"]
exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["bank import <statement|-> --bank-format camt053|camt052|bai2|ofx|mt940|csv --account <cash-account-code> [--layout <JSON-file|inline-JSON>] [--previous-import <manifest_oid> --grant privileged]", "bank match --import <manifest_oid> [--date-window <days>] [--as-known-at HEAD|<seq>|<RFC3339>]", "bank confirm --import <manifest_oid> --line-ordinal <ordinal> --proposal-digest <hex64> --source-known-at <exact-seq> --proposer <hex32> [--date-window <days>] --grant privileged", "bank status --import <manifest_oid> --grant privileged [--as-known-at HEAD|<seq>|<RFC3339>]", "bank unmatch --match <hex32> --digest <hex64> --yes", "bank history [--account <code>] [--import <manifest_oid>] [--as-known-at HEAD|<seq>]", "bank reconcile --import <manifest_oid> --source-known-at <reviewed-seq> --grant privileged --yes", "bank reconciliation --import <manifest_oid> [--as-known-at HEAD|<seq>]", "Import requires read, post and reconcile and one debit-normal Asset leaf in the statement currency. Original bytes, canonical lines and the parser/account manifest are retained atomically with the native import receipt; an exact repeat returns the existing receipt.", "Match requires read and reconcile. It reopens and verifies the retained source closure, then proposes exact amount, date and reference matches against cash-leg memos; the default date window is 3 days. Complete decision cards and stable leg identities explain every proposal. Active native claims remove occupied lines and cash legs before eligibility is computed; candidate ordinals remain stable. eligible_candidate_count and competing_bank_lines expose ties before greedy proposal consumption. Existing confirmations retain their original card, proposer and exact reference with status=confirmed; lines claimed under another retained interpretation have status=occupied. Available ambiguous proposals and unmatched lines competing for one cash leg require review. This read creates no monetary entry or match confirmation.", "Matching replays the complete original BankStatement and requires authority to disclose its full source; a redacted view is insufficient. An embedded-owner operator explicitly opts in with fa bank match --import <manifest_oid> --grant privileged. Reading the original source similarly uses fa document read <statement_oid> --grant privileged. Current MCP launch templates cannot hold privileged: fa_bank_match refuses governed BankStatement sources, so an independently authorized operator must perform those matches.", "The response names its inclusive candidate window. Outstanding means available cash legs in that window left unmatched by proposals, excluding active native claims across statements; it is never a complete reconciliation inventory; an empty statement has no candidate window. The closing difference separately compares the statement balance with the journal's closing balance. Wire formats accept the bounded profiles documented by fa-formats and refuse ambiguous sources; unlinked imports remain explicitly unlinked.", "An explicit previous import replays its complete retained chain before publication. The bank/instrument identity, mapped cash account, currency, checked next sequence, opening-to-prior-closing balance and statement date order must agree. Cross-uploader exact repeats return the original receipt; a competing predecessor for the same statement/account refuses atomically. The bounded chain ends at an explicitly unlinked retained statement. continuity=verified_predecessor is structural evidence, never a confirmed match or reconciliation.", "An unambiguous match row includes proposer and confirmation_command. Confirmation reconstructs the complete selected proposal at source_known_at, verifies its digest and source closure, then atomically records the exact original cash-leg ordinal and an exclusive line/leg claim. Current Human read, reconcile and full-source authority are required. The recorded confirmer is distinct from the proposer preserved in the proposal bytes; those bytes are not a separate signed preparation event. An exact retry returns the original immutable receipt even under a different authorized reviewer or after release and rematching; it cannot reactivate a released generation. Conflicting or ambiguous selections refuse; no amount, fee or residual is posted.", "Status replays the retained source and inventories native confirmation births at the selected prefix. confirmed_lines counts distinct source lines ever confirmed and remaining_lines counts those never confirmed. Separate reconciliations verify each original exact-close claim and compare it with the selected cash and active-match sets. reconciled_through is established only by verified closing attestations, and remains protected after drift; confirmations alone never establish it.", "Unmatch requires current Human read and reconcile authority and an exact match VID plus digest. With --yes it appends an attributed release of that confirmation and its cash-leg claim; prior records and amounts remain unchanged. The two resources may then be confirmed in independent later generations that cite their releases. An exact release retry returns the original release and never affects a later generation.", "History requires current read and reconcile authority and verifies native confirmation, claim and release births without opening statement or manifest bytes, including externally stored manifests. It reports all selected decisions plus active claims at the numeric --as-known-at prefix or HEAD. Optional account and manifest filters select metadata; history establishes neither a live balance attestation nor a reconciliation lock. Revocation is checked against current authority even for older prefixes. The history tool is available to appropriately scoped MCP sessions; unmatch remains a Human host operation.", "Confirm and status also need complete governed BankStatement replay. An embedded owner must explicitly opt into --grant privileged. Current MCP launch ceilings cannot hold privileged, so the on-demand tools refuse these governed sources; per-call arguments cannot widen launch authority.", "Reconcile requires a current Human with read, reconcile and full-source authority, --yes, and the exact reviewed numeric source_known_at. It verifies the retained source and predecessor chain; every statement line must have an active exact confirmation to a leg effective by statement_date. Cumulative posted cash from inception through statement_date must equal the statement closing. It records a capability-bound Reconciled attestation without posting money; this exact-close profile refuses unmatched lines, later-effective matches and unequal balances, and does not claim adjusted outstanding-item reconciliation or complete lifetime source coverage.", "An attested statement close protects its cash account through the statement date, including empty statements and quiet statement tails. Backdated native postings and migration activations require reconcile authority and retain attestation citations. A subsequent cash change, even net-zero, or match correction does not rewrite the original claim. The metadata reconciliation command verifies original historical claims and shows contribution, amount and match drift at a selected prefix; it is available to authorized MCP sessions without privileged document access. An exact same-principal retry at the original evaluated prefix returns the original attestation."]
example = "fa bank import statement.xml --bank-format camt053 --account 1000 --book ./books/myco --json"

[[verb]]
name = "export"
summary = "Export the committed journal at one coordinate in an interop format (plan §8.6, §15.9): the AICPA ADS GL package, OECD SAF-T, a CSV GL extract, Beancount or hledger, or an XBRL 2.1 instance validated against the vendored calculation linkbase, each with its export coordinate certificate."
writes = false
subcommands = ["ads", "saft", "csv-gl", "beancount", "hledger", "ndjson", "xbrl"]
flags = ["--period", "--as-of", "--as-known-at", "--out", "--grant", "--state"]
switches = ["--with-proofs"]
events = ["journal_exported"]
exits = [0, 2, 3, 4, 5, 7]
usage = ["export ads|saft|csv-gl|beancount|hledger|ndjson|xbrl (--period <code> | --as-of YYYY-MM-DD) [--as-known-at HEAD|<seq>|<RFC3339>] [--out <new path>]", "export ads (--period <code> | --as-of YYYY-MM-DD) --out <new dir> --with-proofs [--state <oid|latest>]   (plan §13.1, the auditor's extract proved complete: the package is selected at exactly the recorded accumulator state's sequence, and ADS_Proof.fab (the state's complete-prefix bundle, seq_range_complete) with its signed ADS_Proof.receipt is written beside it. `fa-verify ads <dir> --key <checkpoint_public_key>` checks offline that GL_Detail is exactly the proven entries the export selects and Trial_Balance exactly their refold; no --as-known-at, since the state names the sequence; a book with no recorded state is refused, and the owner publishes one with fa checkpoint create --grant witness)","The export selects what the trial balance folds: every entry visible at the known-at prefix whose effective date is on or before --as-of (or the period's last day), with legs and not a pending hold. Refolding the exported legs gives the stock trial balance at that coordinate. Every format writes the same selection. ndjson is the streaming GL detail: a gl_stream_header coordinate row, one gl_detail_row per leg, and a gl_stream_footer with the row count and refold digest.", "ads writes four tables (Chart_of_Accounts, GL_Detail, Trial_Balance, ADS_Coordinate_Certificate.toml); its --out names a new directory. The other formats write one file. Without --out the content is returned inline; an export too large for the inline transport is refused, never truncated.", "Descriptions, leg memos and migration source ids are opened with the book's key; an erased field exports empty. Requires read and produce: an export discloses the journal."]
example = "fa export ads --period FY2026-P03 --out ./ads-2026-03 --book ./books/myco --json"

[[verb]]
name = "verify"
summary = "Verify derived state against the journal: leg projections, refolded registers, cumulative daily usage, open-item applied mirrors, limited accounts' availability cells, scheduled reversals, complete native period history, accumulator states, FX valuations recomputed from their Rate documents, or a replay of the whole history (exit 8 on drift)."
writes = false
subcommands = ["book", "registers", "entities", "open-items", "availability", "usage", "accumulator", "projections", "schedules", "periods", "fx-conversion", "replay", "close", "export"]
flags = ["--period", "--fiscal-year", "--as-known-at"]
switches = []
events = ["registers_verified", "entities_verified", "open_items_verified", "availability_verified", "usage_verified", "accumulator_verified", "projections_verified", "schedules_verified", "periods_verified", "fx_conversion_verified", "replay_verified", "close_verified", "book_verification", "export_verified"]
exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["verify book   (every target below except close, cheapest first: projections, periods, schedules, accumulator, open-items, availability, usage, fx-conversion, entities and registers over every period, replay; each emits its own event, then book_verification names each verdict: pass, fail, error or skipped. Exit 8 when any target fails; otherwise the first other failure is returned as itself after the remaining targets ran)", "verify close FY2026 [--as-known-at <sequence>] (check nominal-zero at the last Closing and later deltas at that recorded prefix; exit 8 when a close or reclose is needed)", "verify registers ((--period <code>)... | --fiscal-year N)   (also verifies cumulative daily usage at current head before checking the selected period folds)", "verify usage [--as-known-at HEAD|<seq>|<RFC3339>]   (refold every native daily charge and UsageCell from retained history at the selected prefix, including original issuance, gross-debit source entries and committed time witnesses; requires current whole-book read and verify authority; no period filter, no writes or implicit repair; FA-REF-167, exit 8 on drift)", "verify replay   (replays every accounting commit's recorded rows into a fresh scratch book and checks it against the source pair by pair: the same entries with the same digests, and the same period folds. It proves the retained history reproduces the book's accounting state, not that the posting laws hold: rows are copied, not re-posted, and both sides fold with the same code. No period filter; exit 8 on any difference; history the scratch replay cannot reproduce, a divergence included, is FA-REF-134, exit 5)", "verify open-items", "verify availability", "verify accumulator (every recorded checkpoint; no period filter)", "verify projections (all entry payloads and leg topology at current head; no period filter)", "verify schedules (every Schedule vertex and SCHEDULED_BY mirror; no period filter)", "verify periods [--as-known-at HEAD|<seq>|<RFC3339>] (loads the complete native journal history through one selected prefix, verifies immutable Entry births, then checks every Period against its birth baseline and PeriodControl transitions; current read and verify authority required; no period filter; missing history or deleted declarations never produce a successful verification)", "verify fx-conversion [--as-known-at HEAD|<seq>|<RFC3339>]   (FA-INV-01 base: every FX-valued entry recorded at the selected prefix recomputed from the Rate documents it cites under the FX law it names, the law's registered row whatever its status now; a valued Reversal must be the exact side-swap of the entry it reverses; current whole-book read and verify authority; no period filter; exit 8 on any entry that does not recompute)", "verify entities (--period <code>)... | --fiscal-year N   (FA-INV-01 per-entity: refold each period's per-legal-entity register and prove it against the journal: per account and unit the entity cells sum to the plain fold, every entry balances per unit and legal entity, and in a multi-entity book every leg names a declared entity; exit 8 on any finding)", "verify export ads|saft|csv-gl|beancount|hledger|ndjson|xbrl <the exported file, or the ads package directory>   (plan §16, export then import is the identity: the format's reader re-reads the file and the book's journal is selected again at the coordinate it carries, under read and verify. ads, saft and csv-gl re-read to the identical journal under their verified coordinate certificate; beancount and hledger, balance-differential formats, refold to the same balances; xbrl re-reads its coordinate and calculation linkbase; ndjson its framing and header. Every file must then be byte for byte what fa export writes there; exit 8 names the first difference. The coordinate is the file's own: no --as-known-at. Known limit (fa-8kpw): export replaces a delimiter in a description, memo or account name (csv-gl: comma or line break; ads: pipe; a line break splits an ads row), so the reader refuses such an export, as its certificate covers the original text)"]
example = "fa verify registers --period FY2026-P03 --book ./books/myco"

[[verb]]
name = "registers"
summary = "Advance native posted/pending period registers from the journal delta, or explicitly rebuild them from a fresh fold. Head trial balances and period activity read these cells plus the exact tail when they can answer (`served` says which); every other report folds the journal."
writes = true
subcommands = ["materialize", "advance"]
flags = ["--period", "--fiscal-year"]
switches = []
events = ["registers_materialized", "registers_advanced"]
exits = [0, 2, 4, 5, 7, 8]
usage = ["registers materialize ((--period <code>)... | --fiscal-year N)   (over a period that already has cells: --yes)", "registers advance ((--period <code>)... | --fiscal-year N)   (each period publishes atomically; damaged cache is refused)"]
example = "fa registers materialize --period FY2026-P03 --book ./books/myco"

[[verb]]
name = "recover"
summary = "Explicitly rebuild leg projections or common idempotency outcomes from verified native journal history. Preview with --dry-run; publishing needs --yes and can bind the reviewed head with --basis."
writes = true
subcommands = ["projections", "outcomes"]
flags = ["--basis"]
switches = ["--dry-run"]
events = ["projections_rebuilt", "outcomes_rebuilt"]
exits = [0, 2, 4, 5, 6, 7, 8]
usage = ["recover projections --dry-run   (the exact mirror and edge changes a repair would publish at this head; writes nothing)", "recover projections --yes [--basis <seq>]   (one commit, then projections and open items are rechecked; with the dry run's --basis it publishes exactly that previewed repair and exits 6 if the head moved; a clean book publishes nothing; needs read, verify and schema_change, never on trunk from an Agent profile; host-only over MCP)", "recover outcomes --dry-run   (verify retained native history and preview missing common-idempotency outcomes and coverage at this exact head; writes nothing, including after checkpoint reopen)", "recover outcomes --yes [--basis <seq>]   (atomically publish every verified legacy outcome and establish coverage; a moved --basis exits 6, rewritten history or conflicting legacy keys refuse without publishing, and an already-covered book publishes nothing; requires current whole-book read and schema_change, never on trunk from an Agent profile; host-only over MCP; migration run keys remain separate)"]
example = "fa recover projections --dry-run --book ./books/myco --json"

[[verb]]
name = "entry"
summary = "Read one committed entry back by its vid, verifying its digests."
writes = false
subcommands = ["show"]
flags = []
switches = []
events = ["entry"]
exits = [0, 2, 4, 5, 7]

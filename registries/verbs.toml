verb = "checkpoint"
subcommands = ["create"]
positionals = []
required = ["--grant"]
dont = ["Don't present the state as a signed checkpoint or an evidence bundle: it is unsigned and covers entries only."]
mistakes = ["Omitting `grant: [\"witness\"]` — the embedded posture self-issues the op."]

[[mcp.tool]]
cluster = "fa.book"
name = "verify"
verb = "verify"
subcommands = ["registers", "open-items", "availability", "accumulator"]

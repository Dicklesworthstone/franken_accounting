[[event]]
name = "subledger_recorded"
book = true
doc = "A native AR/AP control definition was journaled, or its exact retry returned the existing definition without writing. It never posts a second control balance."
fields = ["subledger:native_subledger", "already_recorded:bool"]

[[event]]
name = "subledgers"
book = true
doc = "Native subledger definitions at one recorded prefix, ordered by code. Show returns exactly one definition."
fields = ["known_at:seq", "subledgers:[native_subledger]"]

[[event]]
name = "subledger_reconciled"
book = true
doc = "Party-qualified immutable journal contributions compared with a separately folded control trial balance at one known-at/effective-through coordinate. Native currencies and posted/pending columns are separate. This is not an external-feed attestation or a replay certificate."
fields = ["subledger:native_subledger", "known_at:seq", "effective_through:date", "rows:[native_subledger_row]", "totals:[native_subledger_total]", "reconciled:bool"]

[[shape]]
name = "native_subledger"
doc = "An immutable receivable/payable subledger definition and the SchemaChange entry that registered it. The control account remains a posting leaf."
fields = ["code:string", "name:string", "kind:string", "vid:hex", "control_account:string", "control_vid:hex", "control_entry:hex", "recorded_at:seq"]

[[shape]]
name = "native_subledger_row"
doc = "One party and native unit's gross posted and pending amounts. Net is debit minus credit, including for payable accounts."
fields = ["party:string", "party_vid:hex", "unit:string", "debits:amount", "credits:amount", "net:amount", "debits_pending:amount", "credits_pending:amount"]

[[shape]]
name = "native_subledger_total"
doc = "The independently computed detail and control totals, compared separately in every native unit and measure."
fields = ["unit:string", "detail_debits:amount", "detail_credits:amount", "detail_debits_pending:amount", "detail_credits_pending:amount", "control_debits:amount", "control_credits:amount", "control_debits_pending:amount", "control_credits_pending:amount"]

[[event]]
name = "account_role_recorded"
book = true
doc = "An account role was assigned or removed by one journaled schema control (bead fa-kxc4), or nothing was written because the account already held, or already lacked, the role; already_recorded is then true and role names the control that set that state."
fields = ["role:account_role", "already_recorded:bool"]

[[event]]
name = "account_roles"
book = true
doc = "Every role registered in registries/account_roles.toml at one recorded prefix: what it means, the account types it admits, the Lantern procedures that select their population by it, and the accounts holding it (ordered by account code). A role no account holds lists none, and its procedures refuse until one does."
fields = ["known_at:seq", "roles:[role_population]"]

[[shape]]
name = "account_role"
doc = "One account's role and the immutable schema control that last set it: assigned true for an assignment, false for a removal."
fields = ["account:string", "account_vid:hex", "role:string", "assigned:bool", "control_entry:hex", "recorded_at:seq"]

[[shape]]
name = "role_population"
doc = "A registered account role and the accounts holding it at the event's prefix."
fields = ["role:string", "meaning:string", "account_types:[string]", "consumers:[string]", "accounts:[account_role]"]

[[mcp.cluster]]
name = "fa.roles"
on_demand = true
doc = "Account roles (bead fa-kxc4): assign or remove the registered role (suspense, intercompany) that tells Lantern which accounts form a procedure's population, instead of a guess from account names. Read them with fa_chart_list_accounts action roles. On demand (fa-mcp --cluster fa.roles): the default surface is at its 40-tool budget."

[[mcp.tool]]
cluster = "fa.roles"
name = "assign"
verb = "chart"
subcommands = ["role"]
positionals = ["code", "role"]
flags = ["--key"]
switches = ["--remove"]
required = ["code", "role"]
dont = ["Name the account by its chart code and the role by its registered name; fa_chart_list_accounts with action roles lists both, and which procedures read each role.", "Don't assign a role to a summary account: assign it to each posting leaf under it.", "Don't assign a role to make a procedure run: a role says what the account is for, and a procedure's findings are only as good as that statement."]
mistakes = ["A role the registry does not list (the refusal names the registered ones).", "An account type the role does not admit: suspense and intercompany admit Asset or Liability accounts.", "Expecting remove to write when the account never held the role: it is refused with nothing written."]

[[bound]]
verbs = ["chart"]
subcommands = ["role"]
ops = ["read", "schema_change"]


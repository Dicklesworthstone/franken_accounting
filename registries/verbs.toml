required = ["file"]
dont = ["For cash-flow, indirect cash-flow or aging reconciliation, supply expect as the original independently selected request encoded as a JSON string. Certificate content still travels in the separate inline certificate property; expect is never a host file or inferred from the delivered artifact.","Pass the retained oid (bare 64-hex or C: prefixed) or complete bytes hex string from report_certificate inline as certificate. Never edit the certificate or substitute the current known-at.","A replay proves the retained closure produces the same result; it is not a witness signature or a judgment on the accounting treatment.","For general-ledger lines, supply view: detail and all independently reviewed account, unit, from, to, label and numeric as_known_at expectations. HEAD and omitted units refuse. Do not combine view: detail with expect. This returns general_ledger followed by the existing roll-forward report_replayed receipt; the source certificate and output digest remain unchanged."]
mistakes = ["Looking up an oid in a different book; use the book where certification retained it.", "Passing file: MCP refuses host paths; use the inline certificate property."]


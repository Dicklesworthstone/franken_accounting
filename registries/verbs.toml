# verbs.toml — the single verb registry (plan §15.2–§15.3, Appendix D).
#
# One source for the `fa` CLI's verbs, subcommands, aliases, per-verb flags,
# help text, exit codes, and the robot-mode event schemas that
# `fa robot-docs schema` prints. The daemon (fa-i8j) and fa-mcp (fa-xex) are
# generated from and checked against this file when they land.
#
# Consumer: fa-cli (dispatch, flag parsing and correction, `--help`,
# `fa capabilities`, `fa robot-docs schema`). Gate: the fa-cli parity tests
# fail when a registered verb or subcommand has no handler, a handler has no
# row, an emitted `--json` line does not match its event schema, or a
# declared event is never emitted by the binary tests. Retire: never (it is
# the contract); rows are additive, a removal is a breaking change.
#
# Field types: string · text (free-form, may span lines) · int · seq (a
# CommitSeq, ≥ 0) · bool · amount ("1500.00 USD": exact decimal, a space, the
# unit code) · date (YYYY-MM-DD) · hex (lowercase hexadecimal) · object (a map
# with data-dependent keys) · any · <shape> (an object with exactly the
# shape's fields) · [T] (an array of T) · T? (T or null). Every field is
# always present; absence is spelled null.
#
# Envelope (plan Appendix D, bead fa-12x): every robot-mode line carries the
# `[envelope]` fields beside its event's own fields, except the daemon's wire
# frames. An event marked `book = true` is always about one book, so its
# `coordinate` is never null; the robot-schema fixture pin
# (registries/robot_schema/<version>.jsonl) holds `fa robot-docs schema --json`
# byte for byte.

schema_version = 1

[envelope]
discriminator = "event"
version = 1
payload = "data"
fields = ["v:int", "book:hex?", "coordinate:coordinate?", "certificate:hex?", "warnings:[string]", "next_actions:[next_action]"]
frames = ["fad_request", "fad_response"]
description = "Robot mode (--json), plan Appendix D: stdout carries one JSON object per line and nothing else, {v, event, book, coordinate, data, certificate, warnings, next_actions}. `event` names the line's schema below and `data` holds exactly that schema's fields. `v` is the envelope version. `book` is the book's id and `coordinate` the (branch, known_at, effective) the line describes; both are never null on an event about a book (`book: true` below) and null on the others (version, help, an error before any book was opened). `certificate` is the replay certificate's oid, null until plan certificates land (fa-we7). `warnings` lists what the command noticed but did not refuse (always present, usually empty). `next_actions` lists the commands an agent usually runs next, each with why (run them with the same --book). Keys are sorted, amounts are strings with their unit (never JSON numbers), recorded sequences are integers, dates are civil YYYY-MM-DD. The daemon's wire frames (fad_request, fad_response) are its protocol, not robot lines: flat, with their protocol `v`. stderr carries diagnostics only. The exit code is the verdict (fa robot-docs exit-codes): every non-zero exit emits exactly one `error` event, whose data carries the exit's `class` (exit_codes.toml), the `exit`, and the `refusal_id` (the refusal catalog code, or null)."

[global]
flags = ["--book", "--keys", "--as", "--via"]
switches = ["--json", "--help", "--version", "--no-color", "--yes"]
events = ["version", "triage", "help", "error"]
# A mistyped verb, subcommand or flag within this edit distance gets a
# "did you mean"; correction only ever suggests, it never runs the guess.
correction_distance = 1
usage = "--book <dir> (or FA_BOOK) · --keys <file> (default <dir>/book.keys) · --json · --as <principal> (default operator) · --via fad|direct (default: through the book's fad when one holds its writer lease) · --yes (confirm an operation that cannot be undone; `fa capabilities --json` lists them) · --no-color (also NO_COLOR, CI, TERM=dumb, or stdout not a terminal) · --help (also `fa <verb> --help`)"

# The fad daemon (plan §15.3, Appendix D, bead fa-i8j). One fad per book
# directory holds the book's writer lease (an OS lock on <dir>/<lease>, so a
# crashed daemon releases it) and serves `fa` over <dir>/<socket>. A frame is
# a 4-byte big-endian length then that many bytes of canonical JSON (sorted
# keys, integers only); the first frame on a connection is a fad_request, and
# every request gets exactly one fad_response. Every `fa` command that opens
# the book directly holds the same lease for its duration, so there is one
# writer per book at a time.

[daemon]
binary = "fad"
protocol = 1
socket = "fad.sock"
lease = "fad.lease"
max_frame_bytes = 67108864
idle_timeout_ms = 30000
verbs = ["serve", "status", "stop"]
flags = ["--book", "--keys"]
switches = ["--json", "--help"]
events = ["fad_request", "fad_response", "fad_serving", "fad_status", "fad_stopped"]
usage = ["fad serve --book <dir> [--keys <file>] [--json]   (holds the writer lease and serves until `fad stop`)", "fad status --book <dir> [--json]", "fad stop --book <dir> [--json]"]

# ---------------------------------------------------------------------------
# Verbs
# ---------------------------------------------------------------------------

[[verb]]
name = "book"
summary = "Create a book directory (store + key file), or describe one."
writes = true
subcommands = ["create", "info"]
flags = ["--name", "--base-unit", "--calendar", "--year-start-month", "--adjustment-periods"]
switches = []
events = ["book_created", "book"]
exits = [0, 2, 4, 5]
usage = ["book create --name \"My Co\" [--base-unit USD] [--calendar monthly] [--year-start-month 1] [--adjustment-periods 1]", "book info"]
example = "fa book create --book ./books/myco --name \"My Co\" --json"

[[verb]]
name = "chart"
summary = "Install a chart of accounts as one journaled schema effect, or list it."
writes = true
subcommands = ["import", "list"]
flags = ["--date", "--key"]
switches = []
events = ["chart_installed", "accounts"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["chart import <chart.json> [--date YYYY-MM-DD] [--key K]   (an account may carry lower_bound/upper_bound: \"0.00\" in its unit and normal-balance sign)", "chart list"]
example = "fa chart import chart.json --book ./books/myco --json"

[[verb]]
name = "period"
summary = "Create a fiscal year's periods, list them, or move one along the period state machine (journaled)."
writes = true
subcommands = ["create", "list", "open", "soft-close", "close", "lock", "reopen"]
flags = ["--fiscal-year", "--to", "--reason", "--key", "--date", "--plan-out", "--plan", "--approval"]
switches = []
events = ["periods_created", "periods", "period_transitioned", "period_planned"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["period create --fiscal-year N", "period list", "period open|soft-close|close|lock|reopen <code> [--to open|soft-closed] [--reason N] [--key K] [--date YYYY-MM-DD]", "period lock|reopen <code> --plan-out <file>   (writes the planned proposal and prints its proposal_digest; commits nothing)", "period lock|reopen <code> --plan <file> --approval <vid>...   (commits exactly the planned proposal, citing approvals of its digest)"]
example = "fa period open FY2026-P03 --book ./books/myco --json"

[[verb]]
name = "approve"
summary = "Record an approval of a planned proposal's digest under the caller's capability (journaled; bound to the current security policy epoch)."
writes = true
subcommands = []
flags = ["--proposal", "--grant"]
switches = []
events = ["approved"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["approve --proposal <proposal_digest> [--as <principal>] [--grant <op>]...   (the digest is printed by `fa period <t> <code> --plan-out <file>`; a second approver is a second invocation as another principal)"]
example = "fa approve --proposal <proposal_digest> --as controller --book ./books/myco --json"

[[verb]]
name = "post"
summary = "Post one entry intent under the accounting laws (balance, period law, idempotency)."
writes = true
subcommands = []
flags = ["--intent", "--grant", "--evidence", "--balancing"]
switches = []
events = ["posted", "recorded"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["post --intent <file.json|-> [--grant <op>]... [--evidence <oid>]... [--balancing 0|1] [--as <principal>]   (--balancing: that leg moves at most what its account's limit admits; the event says what was requested and what moved)"]
example = "fa post --intent entry.json --book ./books/myco --json"

[[verb]]
name = "reserve"
summary = "Reserve amounts as a Pending entry (two-phase): nothing is posted."
writes = true
subcommands = []
flags = ["--intent", "--grant", "--evidence", "--balancing"]
switches = []
events = ["posted", "recorded"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["reserve --intent <hold.json> (a Pending: amounts reserved, nothing posted)"]
example = "fa reserve --intent hold.json --book ./books/myco --json"

[[verb]]
name = "resolve"
summary = "Resolve a hold: post a sub-vector drawn from it, or void it; the rest is released."
writes = true
subcommands = []
flags = ["--intent", "--grant", "--evidence"]
switches = []
events = ["posted", "recorded"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["resolve --intent <res.json> (resolves <hold vid>; disposition posts (legs drawn from the hold) | voids)"]
example = "fa resolve --intent res.json --book ./books/myco --json"

[[verb]]
name = "document"
summary = "Record a source document, content-addressed; its doc_commit is the public commitment an entry's evidence cites."
writes = true
subcommands = ["add"]
flags = ["--kind", "--mime", "--grade"]
switches = []
events = ["document"]
exits = [0, 2, 3, 4, 5]
usage = ["document add <file|-> [--kind Invoice] [--mime application/pdf] [--grade AgentUpload|HumanUpload]"]
example = "fa document add invoice.pdf --kind Invoice --mime application/pdf --grade HumanUpload --book ./books/myco --json"

[[verb]]
name = "tb"
summary = "Trial balance: stock through the selected periods or a civil date, or period activity, at a known-at frontier."
writes = false
subcommands = []
flags = ["--period", "--fiscal-year", "--as-of", "--as-known-at"]
switches = ["--activity"]
events = ["trial_balance"]
exits = [0, 2, 4, 5]
usage = ["tb ((--period <code>)... | --fiscal-year N) [--activity] [--as-known-at HEAD|<seq>]", "tb --as-of YYYY-MM-DD [--as-known-at HEAD|<seq>]", "Stock balances include opening history; --activity is selected-period movement. Instants are unsupported."]
example = "fa tb --period FY2026-P03 --book ./books/myco --json"

[[verb]]
name = "open-items"
summary = "Open items (plan §5.7): each live posted leg, its applications, and its open amount."
writes = false
subcommands = []
flags = ["--account", "--as-known-at"]
switches = []
events = ["open_items"]
exits = [0, 2, 4, 5]
usage = ["open-items [--account <code>] [--as-known-at HEAD|<seq>]"]
example = "fa open-items --account 1200 --book ./books/myco --json"

[[verb]]
name = "explain"
summary = "Explain a balance: the account's register cells in a period, the fold they belong to, every contributing leg with its recorded sequence, and the cell's known-at history."
writes = false
subcommands = ["balance"]
flags = ["--period", "--as-known-at"]
switches = []
events = ["balance_explained"]
exits = [0, 2, 4, 5]
usage = ["explain balance <account code> --period <code> [--as-known-at HEAD|<seq>]"]
example = "fa explain balance 1000 --period FY2026-P03 --book ./books/myco --json"

[[verb]]
name = "checkpoint"
summary = "Publish an unsigned, recomputable accumulator state over the book's entry prefix."
writes = true
subcommands = ["create"]
flags = ["--grant"]
switches = []
events = ["checkpoint_created"]
exits = [0, 2, 4, 5, 6, 7, 8]
usage = ["checkpoint create --grant witness [--as <principal>]", "The state is unsigned and covers entries; it is not a signed TransparencyCheckpoint or an evidence bundle."]
example = "fa checkpoint create --grant witness --book ./books/myco --json"

[[verb]]
name = "verify"
summary = "Verify derived state against the journal by refolding: registers, open-item applied mirrors, limited accounts' availability cells, or accumulator states (exit 8 on drift)."
writes = false
subcommands = ["registers", "open-items", "availability", "accumulator"]
flags = ["--period", "--fiscal-year"]
switches = []
events = ["registers_verified", "open_items_verified", "availability_verified", "accumulator_verified"]
exits = [0, 2, 4, 5, 8]
usage = ["verify registers ((--period <code>)... | --fiscal-year N)", "verify open-items", "verify availability", "verify accumulator (every recorded checkpoint; no period filter)"]
example = "fa verify registers --period FY2026-P03 --book ./books/myco"

[[verb]]
name = "registers"
summary = "Materialize a period's registers from a fresh fold (derived state; rebuilt on demand)."
writes = true
subcommands = ["materialize"]
flags = ["--period", "--fiscal-year"]
switches = []
events = ["registers_materialized"]
exits = [0, 2, 4, 5, 7]
usage = ["registers materialize ((--period <code>)... | --fiscal-year N)   (over a period that already has cells: --yes)"]
example = "fa registers materialize --period FY2026-P03 --book ./books/myco"

[[verb]]
name = "entry"
summary = "Read one committed entry back by its vid, verifying its digests."
writes = false
subcommands = ["show"]
flags = []
switches = []
events = ["entry"]
exits = [0, 2, 4, 5]
usage = ["entry show <vid-hex>"]
example = "fa entry show 3f2a… --book ./books/myco --json"

[[verb]]
name = "capabilities"
summary = "What this build can do: verbs, aliases, exit codes, entry classes, robot mode."
writes = false
subcommands = []
flags = []
switches = []
events = ["capabilities"]
exits = [0, 5]
usage = ["capabilities"]
example = "fa capabilities --json"

[[verb]]
name = "robot-docs"
summary = "In-tool documentation for agents: the guide, the exit codes, worked examples, and the robot-mode schema."
writes = false
subcommands = ["guide", "exit-codes", "examples", "schema"]
flags = []
switches = []
events = ["robot_docs", "robot_schema"]
exits = [0, 2, 5]
usage = ["robot-docs guide|exit-codes|examples", "robot-docs schema [<event or shape>]"]
example = "fa robot-docs schema balance_explained --json"

[[verb]]
name = "help"
summary = "The command list, or one verb's usage."
writes = false
subcommands = []
flags = []
switches = []
events = ["help"]
exits = [0, 2]
usage = ["help [<verb>]"]
example = "fa help explain"

# Spellings agents try first (plan §15.3 intent inference). An alias expands
# in the verb position; it is never a correction of a mistyped write verb.

[[alias]]
name = "trial-balance"
expands = ["tb"]

[[alias]]
name = "balance"
expands = ["explain", "balance"]

[[alias]]
name = "journal"
expands = ["post"]

# Operations that cannot be undone in practice (plan §15.3, Appendix D
# FA-REF-007). Without --yes, or a --plan file naming the exact proposal,
# they are refused with exit 7 before anything is written, and the refusal's
# fix is `safe`: a reversible or read-only alternative that exists today.
# `fa capabilities --json` lists them. `condition` (closed vocabulary):
# always · grant:<op> (the command self-issues that op with --grant) ·
# disposition:voids (the intent voids a hold) · existing-cells (the period
# already has materialized register cells). Gate: every operation the plan
# names dangerous has a row (fa-cli dangerous-operation test), and every row
# is refused without --yes and admitted with it.

[[dangerous]]
verb = "period"
subcommand = "close"
condition = "always"
safe = "`fa period soft-close <code>` stops ordinary postings and stays reopenable without approvals"

[[dangerous]]
verb = "period"
subcommand = "lock"
condition = "always"
safe = "leave the period Closed (`fa period list --json` shows every state); a Closed period already refuses ordinary postings"

[[dangerous]]
verb = "period"
subcommand = "reopen"
condition = "always"
safe = "only a lawfully classified adjustment or an authorized reopen (case-bound, `fa approve`) changes what a closed period reports; never re-date an entry to avoid the period law (`fa period list --json` shows each period's state)"

[[dangerous]]
verb = "post"
condition = "grant:post_closed"
safe = "leave the intent unposted; keep its true effective date and obtain the authorization or the admissible adjustment class the period-law refusal names (`fa period list --json` shows each period's state)"

[[dangerous]]
verb = "resolve"
condition = "disposition:voids"
safe = "resolve the hold with disposition `posts` to post what it held; a void releases it for good"

[[dangerous]]
verb = "registers"
subcommand = "materialize"
condition = "existing-cells"
safe = "`fa verify registers --period <code> --json` checks the existing cells against the journal without rewriting them"

# What an agent usually runs next after an event (plan Appendix D
# `next_actions`): every listed event's lines carry these, in order. The
# commands omit --book; run them with the same --book (or FA_BOOK).

[[next_action]]
after = "triage"
command = "fa capabilities --json"
why = "every verb, exit code and dangerous operation this build knows"

[[next_action]]
after = "book_created"
command = "fa chart import <chart.json> --json"
why = "a new book has no accounts; install the chart"

[[next_action]]
after = "chart_installed"
command = "fa period create --fiscal-year <N> --json"
why = "entries post into periods; create the fiscal year's"

[[next_action]]
after = "periods_created"
command = "fa period open <code> --json"
why = "a Future period admits no postings until it is opened"

[[next_action]]
after = "document"
command = "fa post --intent <entry.json> --evidence <oid> --json"
why = "cite the document in an entry"

[[next_action]]
after = "posted"
command = "fa tb --json"
why = "the trial balance with this entry folded in"

[[next_action]]
after = "recorded"
command = "fa entry show <vid> --json"
why = "this idempotency key already recorded that entry; nothing new was written"

[[next_action]]
after = "registers_materialized"
command = "fa verify registers --json"
why = "prove the materialized cells equal the journal's refold"

[[next_action]]
after = "checkpoint_created"
command = "fa verify accumulator --json"
why = "recompute every checkpoint from the journal"

# ---------------------------------------------------------------------------
# Events: every `event` a --json line can carry, with exactly its fields.
# ---------------------------------------------------------------------------

[[event]]
name = "document"
book = true
doc = "A document the book holds. `oid` locates it; `doc_commit` = BLAKE3(\"fa:doc:v1\" ‖ kind ‖ length ‖ 4 KiB-chunk Merkle root) is its public commitment; `evidence` is the citation for an intent's `evidence` list (or pass --evidence <oid>). On a repeat intake `already_recorded` is true and kind/grade are the book's. `self_sourced` (AgentUpload) will need a reviewer's attestation before promotion; not yet enforced."
fields = ["oid:hex", "doc_commit:hex", "kind:string", "grade:string", "self_sourced:bool", "size:int", "recorded_at:seq", "already_recorded:bool", "evidence:evidence_ref"]

[[event]]
name = "fad_request"
doc = "A frame from a client to fad. op `run` executes `argv` (an `fa` command line, without --via) exactly as `fa` would, with relative paths resolved against `cwd` and `-` reading `stdin` (hex); op `status` and op `stop` take an empty argv."
fields = ["v:int", "op:string", "argv:[string]", "cwd:string?", "stdin:hex?"]

[[event]]
name = "fad_response"
doc = "fad's answer to one fad_request: the command's exit code and its stdout and stderr, byte for byte as `fa` would have written them (the stdout lines are themselves robot-mode events when the request asked for --json). A protocol fault is answered with exit 2 and an `error` line (class usage), then the connection closes."
fields = ["v:int", "op:string", "exit:int", "stdout:text", "stderr:text"]

[[event]]
name = "fad_serving"
book = true
doc = "`fad serve`: the writer lease is held and the socket is listening."
fields = ["book_id:hex", "dir:string", "socket:string", "pid:int", "protocol:int", "max_frame_bytes:int"]

[[event]]
name = "fad_status"
doc = "`fad status`: whether a fad serves the book; when one does, its pid, book, and requests answered so far. `holder` is the lease file's note when the lease is held by something that is not answering (a direct `fa` command mid-flight)."
fields = ["serving:bool", "dir:string", "socket:string", "pid:int?", "book_id:hex?", "requests:int?", "holder:string?"]

[[event]]
name = "fad_stopped"
doc = "`fad stop` (and the daemon itself, on its way out): the daemon released the lease after answering `requests` requests."
fields = ["dir:string", "requests:int"]

[[event]]
name = "version"
doc = "The build's version."
fields = ["version:string"]

[[event]]
name = "triage"
doc = "Bare `fa`: where to start, as text."
fields = ["version:string", "text:text"]

[[event]]
name = "help"
doc = "`fa --help`, `fa help [<verb>]`, `fa <verb> --help`: usage as text; `verb` is null for the full list."
fields = ["verb:string?", "text:text"]

[[event]]
name = "error"
doc = "Every non-zero exit emits exactly one (plan Appendix D). `class` names the exit (exit_codes.toml): usage (2: a bad flag, verb, argument or intent document), refusal (3: an accounting-law refusal), environment (4: no book, a bad key file), foundation (5: a foundation or I-O failure), conflict (6), safety (7: period law, capability, SoD, an unconfirmed dangerous operation), verification (8: derived state differs from the journal's refold). `refusal_id` is the refusal catalog code (FA-REF-nnn) when the failure is a catalog refusal, else null; `cite` is the law, matrix cell or policy row it cites (null otherwise); `fix` is the exact next step (null when none applies): do it, and never invent a leg, a date, or an approval. FA-REF-007 means the operation cannot be undone in practice: `fix` names the safe alternative; rerun with --yes only when the operation is intended. `detail` is a verification failure's payload (the per-period checks for registers, the leg drift for open items), null otherwise."
fields = ["class:string", "exit:int", "refusal_id:string?", "message:string", "cite:string?", "fix:string?", "detail:any"]

[[event]]
name = "capabilities"
doc = "What this build can do."
fields = ["version:string", "verbs:[string]", "aliases:[alias]", "exit_codes:[exit_code]", "entry_classes:[string]", "robot_mode:robot_mode", "stdout:string", "stderr:string", "tui:bool", "capability:capability_model", "dangerous:[dangerous_op]", "invariants:invariant_clauses"]

[[event]]
name = "robot_docs"
doc = "`fa robot-docs guide|exit-codes|examples --json`: the topic's text."
fields = ["topic:string", "text:text"]

[[event]]
name = "robot_schema"
doc = "`fa robot-docs schema [<name>] --json`: the envelope and the events (with every shape they reference), or the one named event or shape."
fields = ["envelope:envelope_doc", "events:[event_doc]", "shapes:[shape_doc]"]

[[event]]
name = "book_created"
book = true
doc = "A new book directory: the store and the key file (keep it; keys are never regenerated)."
fields = ["book_id:hex", "dir:string", "keys:string", "name:string", "base_unit:string", "calendar:string"]

[[event]]
name = "book"
book = true
doc = "A book's identity and size."
fields = ["book_id:hex", "calendar:string", "periods:int", "periods_by_state:object", "accounts:int", "units_registered:int"]

[[event]]
name = "chart_installed"
book = true
doc = "A chart installed by one journaled control entry."
fields = ["accounts:int", "control_entry:hex", "recorded_at:seq"]

[[event]]
name = "accounts"
book = true
doc = "The chart, sorted by code."
fields = ["accounts:[account]"]

[[event]]
name = "periods_created"
book = true
doc = "A fiscal year's periods, all Future."
fields = ["fiscal_year:int", "periods:[string]", "recorded_at:seq"]

[[event]]
name = "periods"
book = true
doc = "Every period in calendar order with its current state."
fields = ["periods:[period]"]

[[event]]
name = "period_transitioned"
book = true
doc = "A period moved along the state machine by a journaled control entry."
fields = ["period:string", "from:string", "to:string", "control_entry:hex", "recorded_at:seq"]

[[event]]
name = "period_planned"
book = true
doc = "A transition was planned and its sealed proposal written to a file; nothing was committed. Approvals bind proposal_digest."
fields = ["period:string", "from:string", "to:string", "proposal_digest:hex", "plan:string"]

[[event]]
name = "approved"
book = true
doc = "An approval of a proposal digest was recorded (or already existed: then nothing was written and security_policy_epoch is null)."
fields = ["approval_vid:hex", "approved_digest:hex", "security_policy_epoch:int?", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "posted"
book = true
doc = "An entry committed; `recorded_at` is its CommitSeq, assigned by the journal. With --balancing, `requested` is the amount asked for and `moved` what the balancing leg's account admitted (the legs posted at `moved`); both null otherwise."
fields = ["class:string", "vid:hex", "entry_digest:hex", "recorded_at:seq", "period:string", "requested:amount?", "moved:amount?"]

[[event]]
name = "recorded"
book = true
doc = "The same idempotency key was already recorded with the same content; nothing new was written. For a balancing post the identity is the request (key, requested amount, leg): `requested`/`moved` are the recorded ones, whatever availability is now; null otherwise."
fields = ["vid:hex", "entry_digest:hex", "recorded_at:seq", "requested:amount?", "moved:amount?"]

[[event]]
name = "trial_balance"
book = true
doc = "Stock (through `effective_through`) or activity (the selected periods), at the `known_at` snapshot."
fields = ["periods:[string]", "known_at:seq", "effective_through:date?", "activity:bool", "mode:string", "rows:[tb_row]", "unit_totals:[unit_total]", "pending_unit_totals:[pending_unit_total]", "balanced:bool"]

[[event]]
name = "open_items"
book = true
doc = "Open items, optionally on one account, at the `known_at` snapshot."
fields = ["account:string?", "count:int", "items:[open_item]"]

[[event]]
name = "checkpoint_created"
book = true
doc = "An unsigned AccumulatorState over every entry in the named book/branch prefix through through_seq, recorded in a later commit. prev_state_oid links its predecessor. The scope excludes document receipts, attestations, signatures, and bundles."
fields = ["book:hex", "branch:hex", "oid:hex", "recorded_at:seq", "through_seq:seq", "leaf_count:int", "root:hex", "prev_state_oid:hex?", "signatures:string", "scope:string"]

[[event]]
name = "accumulator_verified"
book = true
doc = "Every existing accumulator state was recomputed from its entry prefix and every stored state belongs to the chain. status is verified or no_checkpoints; no_checkpoints makes no verification claim and verified_through is null. Otherwise verified_through names the newest checked prefix, never an implicit current-head claim. signatures is unsigned and scope is entry_prefix. States are newest first."
fields = ["status:string", "signatures:string", "scope:string", "states_checked:int", "broken:string?", "verified_through:seq?", "states:[accumulator_state_check]", "unchained:[hex]"]

[[event]]
name = "registers_verified"
book = true
doc = "Every selected period's stored registers equal the refold."
fields = ["periods:[register_check]"]

[[event]]
name = "open_items_verified"
book = true
doc = "Every posted leg's applied mirror equals the open-item fold."
fields = ["known_at:seq", "legs_checked:int", "drift:[applied_drift]"]

[[event]]
name = "availability_verified"
book = true
doc = "Every limited account's expected LimitCell (the vertex at its derived identity) equals the refold from the journal — sums, generation, and its account_ref binding (plan §5.4–5.5); each account's availability in its normal-balance sign. Scope: only those expected cells are examined; LimitCell vertices that no limited account's identity references are not checked and not reported."
fields = ["known_at:seq", "accounts_checked:int", "cells_checked:int", "accounts:[account_availability]", "drift:[availability_drift]"]

[[event]]
name = "registers_materialized"
book = true
doc = "A period's registers written from a fresh fold (derived state)."
fields = ["period:string", "cells:int", "pending_cells:int", "entries:int", "watermark:seq?", "fold_digest:hex", "recorded_at:seq"]

[[event]]
name = "entry"
book = true
doc = "One committed entry; when `found` is false every other field but `vid` is null."
fields = ["found:bool", "vid:string", "class:string?", "effective_date:date?", "recorded_at:seq?", "entry_digest:hex?", "proposal_digest:hex?", "approvals:int?", "legs:[entry_leg]?"]

[[event]]
name = "balance_explained"
book = true
doc = "An account's register cells in one period at the `known_at` snapshot: the cells (one per unit, both columns), the fold they belong to (its digest and watermark), every contributing leg with its entry and recorded sequence, and the cells' known-at history. The legs re-add to the cells exactly or the command fails. A certified-read precursor: `certificate` is null until the notary lands."
fields = ["account:string", "account_vid:hex", "name:string", "type:string", "period:string", "known_at:seq", "watermark:seq?", "fold_digest:hex", "certificate:hex?", "cells:[explained_cell]", "contributions:[contribution]", "history:[cell_change]", "last_changed_at:seq?"]


# ---- fa.orient --------------------------------------------------------------

[[mcp.cluster]]
name = "fa.forensics"
on_demand = true
doc = "Lantern: the registered forensic and audit procedures (journal-entry tests, duplicates, sequence gaps, cutoff, aging, digit tests, round trips, structuring, tracing laws) run as pure reads; findings are statistics with typed citations."

[[mcp.cluster]]
name = "fa.search"
on_demand = true
doc = "Full-text search over entry descriptions and leg memos at a recorded frontier, ranked by exact fixed-point BM25 from an index rebuilt from the journal per query. A pure read. On demand (fa-mcp --cluster fa.search): the default surface is at its 40-tool limit."

[[mcp.cluster]]
name = "fa.query"
on_demand = true
doc = "GQL over the book's graph in the FrankenAccounting profile (plan §15.5): native reads plus AS KNOWN AT, FOR PERIOD, EFFECTIVE BETWEEN and CALL fa.trial_balance, with the amount law checked before anything runs. A pure read. On demand (fa-mcp --cluster fa.query): the default surface is at its 40-tool limit."

[[mcp.cluster]]
name = "fa.correct"
on_demand = true
doc = "Corrections beyond an exact reversal (plan §8.2): a Reclassification moves part of an entry's leg to another account, citing it with Reclassifies and a registered reason. A Replacement posts the corrected entry with the Reversal of the one it corrects, as one pair (the same pair as the reverse tool's replace_with in fa.post). On demand (fa-mcp --cluster fa.correct): the default surface is at its 40-tool budget."

[[mcp.cluster]]
name = "fa.case"
on_demand = true
doc = "Restatement cases (plan §8.3): read one journaled case, or every case of the book, with its kind, affected periods, state and transitions. Opening and determining a case need restate, a host-side operation. On demand (fa-mcp --cluster fa.case)."

[[mcp.cluster]]
name = "fa.registry"
on_demand = true
doc = "The registered laws (rounding, allocation, conversion, FX, lot, tracing) and unit versions this build embeds (plan §6.2–§6.4): the law names an intent may use and each unit's immutable scale; and the book's fiscal calendar with the periods it generates. Pure reads. On demand (fa-mcp --cluster fa.registry): the default surface is at its 40-tool budget."

[[mcp.cluster]]
name = "fa.audit"
on_demand = true
doc = "Audit sampling (plan §11.7): reproducible uniform and monetary-unit samples of an account's open items from a declared seed, and the Stringer evaluation of an MUS sample's audited values; and the access log (plan §9.7): who read what. Pure reads. On demand (fa-mcp --cluster fa.audit)."


flags = ["--chunk", "--to", "--authority", "--subject", "--through", "--hold", "--effective", "--date", "--description", "--key", "--plan", "--approval", "--document", "--against", "--reason", "--statement", "--evidence", "--attestation", "--account", "--period", "--entity", "--unit", "--as-known-at", "--source", "--run", "--kind", "--party", "--balance", "--as-of", "--claim"]
switches = ["--dry-run"]
stdin_property = "plan"
stdin_kind = "string"
stdin_via = "--plan"
required = []
dont = ["Don't release a legal hold you placed yourself: HoldControl(Release) requires an independent Human approval (`fa_time_approve`).", "Don't record a Reviewed attestation from an Agent profile: promoting an AgentUpload document requires a human reviewer with approve authority.", "Don't pass host filesystem paths in plan_file, plan_out or out: MCP returns disclosure proofs and release plans inline."]
mistakes = ["Attempting to erase a document under an active legal hold (FA-REF-117, exit 7) or without an eligible erasure class (FA-REF-088, exit 3).", "Recording a ManualAssertion without a registered manual_assertion reason code and explicit statement.", "Passing a document's doc_commit where the 64-hex document oid is required."]

[[mcp.tool]]
cluster = "fa.evidence"
name = "event"
verb = "event"
subcommands = ["record", "show", "list"]
selector = "action"
positionals = ["target?"]
flags = ["--code", "--kind", "--occurred-on", "--description", "--participant", "--resource", "--evidence", "--external-id", "--effective", "--key", "--as-known-at"]
switches = []
required = []
dont = ["Don't record an REA event without evidence: every Event requires at least one held document citation (`FA-REF-080`).", "Don't cite an AgentUpload document on an Event before a human Reviewer has attested `Reviewed` (`FA-REF-086`)."]
mistakes = ["Passing an unregistered event kind: use `sale`, `purchase`, `receipt`, `payment`, `shipment`, `return`, `accrual`, or `depreciation`.", "Citing an Event in `fa_post_post` that has not been recorded yet (`FA-REF-080`)."]

[[mcp.tool]]
cluster = "fa.forensics"
name = "ownership"
verb = "party"
subcommands = ["ownership"]
positionals = ["owner", "target"]
flags = ["--as-of", "--max-depth"]
switches = []
required = ["owner", "target", "--as-of"]
dont = ["Name the owner and the target by party or legal-entity code (or vid) and the day as as_of YYYY-MM-DD; the stake is an exact ratio such as 2/5, never a float.", "Don't read 0/1 as no relationship: CONTROLS and RELATED_TO edges carry no stake, and only OWNS paths of up to max_depth edges (default 8) valid on as_of count."]
mistakes = ["Omitting as_of: no date defaults to today.", "Expecting a percentage: stake is num/den."]

[[mcp.tool]]
cluster = "fa.forensics"
name = "procedure"
verb = "procedure"
subcommands = ["list", "run"]
selector = "action"
positionals = ["id?"]
required = []
dont = ["Don't invent a procedure id or a parameter name: `action: \"list\"` returns every registered procedure with its pinned default and meaning.", "Don't treat a finding as a conclusion: it is a statistic with citations; every cited handle resolves and should be read before anything is asserted.", "Don't pass an instant to known_at: procedures run at HEAD or a recorded sequence.", "The bank statement drift procedure requires Read and Reconcile in the launch capability. Recording its findings also requires Produce. A call cannot grant these operations to itself."]
mistakes = ["Passing a parameter in display units (10000.00) instead of the unit's mantissa (1000000 at scale 2); the listing's `meaning` says which.", "Running aging.* or trace.* without effective_through (they are historical folds and are refused naming it).", "Running trace.* without account and source (the commingled account and the deposit entry).", "Overriding a parameter with a float; parameters are integers in the registered unit."]

[[mcp.tool]]
cluster = "fa.search"
name = "search"
verb = "search"
subcommands = []
positionals = ["query"]
flags = ["--as-known-at", "--limit"]
required = ["query"]
dont = ["Don't read a high score as evidence of anything: BM25 ranks text, it states no finding, and no amount is parsed from a hit.", "Use the hit's id with the read tools (show entry, explain lineage) to read the entry itself; the snippet is only its matched text."]
mistakes = ["Expecting documents or findings among the hits: this build indexes entry descriptions and leg memos only.", "Expecting erased or subject-sealed text to match: it is never indexed."]

[[mcp.tool]]
cluster = "fa.query"
name = "gql"
verb = "query"
subcommands = []
positionals = ["statement"]
flags = []
switches = ["--certify"]
required = ["statement"]
dont = ["Use certify: true to retain the result as a certificate (it needs produce); the replay tool (fa_read_replay) reproduces the rows byte for byte from it.", "Don't read a SUM of legs as a balance: rows are the graph as recorded, pending holds and staged migration chunks included. A balance is CALL fa.trial_balance FOR PERIOD '<code>' or the report tools.", "Don't aggregate amounts across units: group by the unit (RETURN u.code, SUM(l.amount) with (l)-[:IN_UNIT]->(u:Unit)) or pin one; the statement is refused otherwise (FA-REF-189).", "Don't write FOR SYSTEM_TIME yourself: select the coordinate with AS KNOWN AT <seq> | HEAD."]
mistakes = ["Comparing an amount with a number (l.amount > 100) or a float literal: an amount compares only with an amount pinned to the same unit.", "Summing l.amount without grouping by l.side: a leg's amount is a positive magnitude and side is 0 (debit) or 1 (credit).", "Using FOR PERIOD with two legs bound, or with no leg and no entry: it selects the period one entry posted to."]

[[mcp.tool]]
cluster = "fa.case"
name = "read"
verb = "case"
subcommands = ["show", "list"]
selector = "action"
positionals = ["target?"]
flags = []
switches = []
required = []
dont = ["Use action list for every restatement case and action show with target set to a case number. Reads need read.", "Don't expect to open or determine a case here: both need restate, which no launch-bound template holds; a Human operator opens a case on the host with fa case open."]
mistakes = ["Passing a case's vid as target: action show takes the case number (1, 2, ...).", "Reading an Approved case as posted: its entries reach trunk only when a Human posts the case on the host with fa case post, and its state is then Posted."]

[[mcp.tool]]
cluster = "fa.registry"
name = "law"
verb = "law"
subcommands = ["list", "show"]
selector = "action"
positionals = ["target?"]
flags = ["--family"]
switches = []
required = []
dont = ["Use action list (optionally with family) to see the registered laws, and action show with target set to a law name before an intent names it; a name in several families needs family.", "Don't invent a rounding, allocation or conversion law: an intent names a registered one or is refused."]
mistakes = ["Passing a law id as target: action show takes the law's name (HalfEven, LargestRemainder, ...)."]

[[mcp.tool]]
cluster = "fa.registry"
name = "unit"
verb = "unit"
subcommands = ["list"]
positionals = []
flags = []
switches = []
required = []
dont = ["Call it before writing an amount to see each unit version's immutable scale; an amount's mantissa is at the unit's scale."]
mistakes = ["Expecting a unit's scale to change: a precision change is a new unit version."]

[[mcp.tool]]
cluster = "fa.registry"
name = "calendar"
verb = "calendar"
subcommands = ["show", "periods"]
selector = "action"
positionals = []
flags = ["--fiscal-year"]
switches = []
required = []
dont = ["Use action periods with fiscal_year to preview a year's period codes and bounds before fa period create records them; created says which already exist."]
mistakes = ["Passing a date as fiscal_year: it is a year such as 2026, numbered by the calendar year the fiscal year ends in."]

[[mcp.tool]]
cluster = "fa.audit"
name = "sample"
verb = "sample"
subcommands = ["uniform", "mus", "stratified", "evaluate"]
selector = "method"
positionals = []
stdin_property = "audited"
stdin_kind = "object"
stdin_via = "--audited"
required = ["--account", "--seed"]
dont = ["Don't pick or change a seed to get a different sample: the seed is declared before drawing and recorded with the sample, and an examiner reproduces the draw from it.", "Don't treat excluded items as tested: they are the account's opposite-side open items, outside the positive-value population, and need their own procedure.", "Don't present upper_misstatement_limit as a conclusion: it is the Stringer statistic; comparing it with tolerable misstatement is the auditor's judgment.", "Don't supply book values to evaluate: they come from the re-drawn sample; audited carries only item_id and audited for every selected item."]
mistakes = ["Passing --interval as a bare number: it is an amount with its unit, \"500.00 USD\", in the population's unit.", "Planning with tolerable but without an explicit expected (\"0.00 USD\" when none is expected) and confidence, or passing interval together with tolerable.", "Asking for a uniform size larger than population_count, or passing size to mus or interval to uniform.", "Evaluating without the sample's numeric as_known_at, or with audited values for only some selected items (exit 8 names the missing and unexpected ids).", "Passing a stratified sample's bands as one comma-joined string, unsorted, or as bare numbers: band is a list of amounts with their unit, strictly ascending upper bounds (\"1000.00 USD\", \"10000.00 USD\").", "Asking a stratified sample for fewer items than non-empty strata: every non-empty stratum takes at least one."]

[[mcp.tool]]
cluster = "fa.audit"
name = "engagement"
verb = "engagement"
subcommands = ["open", "list", "show", "sud", "file", "complete", "carry-forward"]
selector = "action"
positionals = ["engagement?"]
flags = ["--kind", "--period", "--overall", "--performance", "--clearly-trivial", "--report-release", "--key", "--date", "--definition", "--document", "--completion-date", "--from", "--turned-around", "--corrected", "--finding"]
switches = []
required = []
dont = ["Opening an engagement needs produce and a Human launch profile: an Agent-profile session journals no trunk record (FA-REF-013). Reads need read.", "Don't treat the materiality parameters as conclusions: overall, performance and clearly trivial are the auditor's stated parameters; the system compares against them mechanically and never judges materiality.", "Don't reopen an engagement to change its parameters: its profile is immutable; open a new engagement under another id."]
mistakes = ["Giving a parameter as a bare number: amounts carry their unit (\"50000.00 USD\") in the book's base unit.", "Stating clearly trivial above performance, or performance above overall (refused, exit 2).", "Naming a scope period the book does not have: create the fiscal year's periods first."]

[[mcp.tool]]
cluster = "fa.audit"
name = "adjustment"
verb = "adjustment"
subcommands = ["propose", "book", "pass"]
selector = "action"
positionals = []
stdin_property = "intent"
stdin_kind = "object"
stdin_via = "--intent"

[[verb]]
name = "replay"
summary = "Replay a complete retained report artifact under current authority and reproduce its original native report, independently selected ledger detail, statement comparison, publication trace, procedure, or canonical output."
writes = false
subcommands = []
flags = ["--output", "--expect", "--view", "--account", "--unit", "--from", "--to", "--label", "--as-known-at"]
switches = []
events = ["trial_balance", "statement", "balance_explained", "open_items", "summary_trial_balance", "general_ledger", "roll_forward", "aging", "statement_diff", "statement_trace", "scenario_diff", "procedure_run", "report_replayed"]
exits = [0, 2, 3, 4, 5, 7, 8]
usage = ["replay <C:oid|oid|certificate-file|-> [--output <new-file>] [--expect <json>]","A 64-hex oid resolves the complete immutable artifact retained in this book, including its outer family. A file holds canonical binary certificate bytes; stdin also accepts the oid or complete bytes hex string from a report_certificate event. Prefix a 64-hex filename with ./ to read it as a file. The certificate fixes the selector and known-at; replay never substitutes today's frontier.","--output writes the original canonical report bytes only after the complete artifact replays, then emits report_replayed with its family, length and output digest. Existing files are never replaced. Summary, effective-date aging and roll-forward replay their original report events and preserve the report_replayed receipt even without a file. Cash-flow, policy cash-flow, indirect cash-flow, aging reconciliation and the aging portfolio require --expect with the recipient-selected original request as an inline JSON object: kind (cash-flow, policy-cash-flow, indirect-cash-flow, aging-reconciliation or aging-portfolio), explicit integer known_at, original account/date/unit selectors, and the original policy or bucket law. Cash-flow expectations use accounts, units, from, through, label and policy; a policy cash-flow's policy carries name, cash_accounts, account_rules and overrides; indirect expectations also use income_periods. Aging reconciliation uses account, through and buckets. The aging portfolio uses scope (all-posting, or selected with accounts), through and buckets. Retain these expectations independently of the delivered certificate; a replay_command is a convenience, not independent evidence of the intended request. These five families return report_replayed and can reproduce the exact original canonical output with --output. Omitted, mismatched or malformed expectations refuse before any output file is created.","To reproduce general-ledger lines, add --view detail with independently reviewed --account, --unit, --from, --to, --label and numeric --as-known-at expectations. All are required; HEAD and implicit base units are refused. Do not combine --view detail with --expect. The original detail report supplies a complete replay_command. A mismatch refuses before any success event or file write. The retained certificate, output_digest, --output bytes and report_replayed receipt still identify the original roll-forward source."]
example = "fa replay trial-balance.cert --book ./books/myco --json"

[[verb]]
name = "certificate"
summary = "Verify a complete retained report, then check whether later entries affect its accounting selection."
writes = false
subcommands = ["status"]
flags = ["--expect"]
switches = []
events = ["certificate_status"]
exits = [0, 2, 3, 4, 5, 7, 8]
usage = ["certificate status <C:oid|oid|certificate-file|-> [--expect <json>]", "A 64-hex oid resolves the complete certificate retained in this book; file and inline bytes are also accepted. Current or SupersededBy is evaluated against the current book after the complete artifact verifies; supersession does not erase the historical report. For a statement diff or trace, relevance begins at the final statement frontier and the returned oid remains the outer certificate. A scenario diff's trunk side is fixed at its fork, so only Plan records its scenario gained after the certified prefix supersede it (later_entries names them); known_at is the fork.", "Roll-forward and general-ledger source certificates use their selected posted accounts, native units and inclusive closing cutoff. Later postings before the activity window count because they change opening stock; unrelated accounts, other currencies, pending reservations and activity after the cutoff do not. Direct, split and policy cash-flow certificates use the same financial selection and require --expect with the original independently retained request and classification, exactly as fa replay does. New cash activity supersedes the original classification even if it has no assignment in the old policy. Other report families refuse selector status until their own relevance law is implemented."]
example = "fa certificate status trial-balance.cert --book ./books/myco --json"


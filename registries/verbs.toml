-approval <vid>   (submit the retained proposal bytes to native migration law; resume with the same package; only a separately approved migrate finalize activates the completed run)", "Import preparation and staging require a Human operator with read, post and migrate; show requires current read authority. Full source and trial-balance access is required for every import action. A governed source may require the embedded owner's explicit --grant privileged; launch-bound sessions cannot grant themselves this authority. Import prepare retains approval material and does not accept --dry-run."]

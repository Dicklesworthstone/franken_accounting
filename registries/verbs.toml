events = ["rea_recorded", "parties"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["party identifiers <code> --identifier <name>=<value>... --key <change-id>   (replaces the party's identifier set, for example its bank routing and account numbers; values are sealed with the book's key and never echoed; --clear removes every identifier; --key names the change and is required; needs schema_change; host-only over MCP: plan §14.4 treats a bank-detail change as the business-email-compromise vector)", "party bind <code|vertex id> --external-id <system>:<id> [--key K]   (binds another system's identifier to a party, legal entity or instrument; the id is sealed with the book's key; one (system, id) names one vertex; a code that names more than one party, legal entity or instrument is refused, so name it by vertex id; a malformed id is not echoed; the default key is bind:<code>:<system>)", "party add <party.json|->   ({\"code\": \"V-17\", \"kind\": \"Vendor\", \"name\": \"Acme Supplies\", \"identifiers\": {\"ein\": \"12-3456789\"}, \"external_ids\": [{\"system\": \"qbo\", \"id\": \"55\"}]}; name, identifiers and external ids are sealed with the book's key)", "party relate <from> <to> --kind owns|controls|related --basis <code> --valid-from YYYY-MM-DD [--valid-to YYYY-MM-DD] [--pct <num>/<den>]   (an OWNS, CONTROLS or RELATED_TO edge under a basis in relationship_bases.toml; owns needs an exact --pct; from and to are party or legal-entity codes or vids)", "party list", "add and relate are journaled SchemaChange controls under schema_change authority. The default key is party:<code>, or relationship:<from>:<to>:<kind>:<basis>:<valid-from>, so an exact retry returns the recorded control. Parties are what fa event record --participant and the related-party procedures name."]
example = "fa party add vendor.json --book ./books/myco --json"


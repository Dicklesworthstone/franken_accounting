fields = ["attestation_vid:hex", "asserter:hex", "reason_code:int", "reason:string?", "recorded_at:seq"]

[[shape]]
name = "explained_admissibility_cell"
doc = "One cell of the Appendix C admissibility matrix (`admissibility.toml`)."
fields = ["entry_class:string", "period_state:string", "admitted:bool", "required_capability:string?", "requires_case_id:bool", "requires_reason_code:bool", "min_approvers:int"]

[[shape]]
name = "explained_sod_rule"

[[verb]]
name = "migrate"
summary = "Control a legacy-migration run, or prepare and resume exact opening chunks from retained legacy exports and explicit account mappings; native independent approvals govern staging and finalization."
writes = true
subcommands = ["open", "stage", "finalize", "abandon", "show", "import"]
flags = ["--run", "--period", "--key", "--intent", "--evidence", "--description", "--as-known-at", "--plan-out", "--plan", "--approval", "--grant", "--action", "--package", "--chunk"]
switches = ["--dry-run"]
events = ["migration_controlled", "migration_planned", "migration_run", "migration_import_prepared", "migration_import_package", "migration_import_staged", "posted", "recorded"]
exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["migrate open --intent <run.json|-> [--key K] [--description <text>]", "migrate stage <run-key|vid> --intent <chunk.json|-> [--period <code>] [--evidence <oid>]... [--dry-run | --plan-out <new-file> | --plan <file|-> --approval <vid>...]", "migrate finalize <run-key|vid> [--key K] [--description <text>] [--dry-run | --plan-out <new-file> | --plan <file|-> --approval <vid>...]", "migrate abandon <run-key|vid> [--key K] [--description <text>] [--dry-run | --plan-out <new-file> | --plan <file|-> --approval <vid>...]", "migrate show <run-key|vid> [--as-known-at HEAD|<seq>]", "migrate import --action prepare --intent <import.json|-> [--plan-out <new-file>]   (bind an existing OpeningOnly, PeriodBalances or FullDetail run, a retained original source Document, explicit legacy-to-leaf account_map and independently declared trial balances; retain exact sealed proposals in a Workpaper uploaded under the admitted Human operator's custody; custody does not certify the transformation)", "Import intent fields: run, source (D:<oid>), format (quickbooks-iif | quickbooks-csv | xero-csv | netsuite-csv | csv | beancount), account_map, optional default_unit, and column_map TOML for generic csv. A beancount source is a Beancount v3 ledger: each transaction is one entry whose source ID is L<line> (its header's line), account_map keys are full account names, one posting may omit its amount, and postings at cost or price, pad, include and plugin are refused (import the ledger as Beancount prints it after processing). OpeningOnly ties the whole source to the declared opening trial balance and posts at the run opening date. PeriodBalances additionally requires opening_entries, an array of exact source journal IDs for opening stock. Those entries post to the Opening period; other entries keep their original dates in the run's declared locked Historical periods. Every cumulative period trial balance must tie exactly, including periods with no activity. The source must be distinct from every trial-balance Document. FullDetail preserves complete dated history and the run's independently declared detail_base, checking every cumulative Historical trial balance in fiscal calendar order, including adjustments and year-end closing journals. A declared Normal period's trial balance is checked before following Adjustment and Closing periods. Non-sole FullDetail requires opening_entries for separate opening stock; its earlier historical detail remains available for drilldown but does not count in balances or open items after finalization. Sole-source FullDetail forbids opening_entries, opening lines and detail_base; all historical detail counts after finalization and no own Opening period row or lock is required. FullDetail alone accepts optional entry_periods, an object mapping exact source journal IDs to explicit native period codes. Dates shared by Normal, Opening, Adjustment or Closing periods require this mapping; the importer never infers special periods from descriptions. Mapped periods must contain the source date and be locked inside the declared span. IDs cannot be absent, repeated or selected in both opening_entries and entry_periods. Legacy settlement applications are not reconstructed: settlement-ready opening AR/AP legs must already represent individual items net of legacy applications.", "migrate import --action show --package D:<oid>   (reauthorize and replay the complete retained source, mapping, run and exact proposals before reporting their staged state)", "migrate import --action stage --package D:<oid> --chunk <zero-based-index> --approval <vid> --approval <vid>   (submit the retained proposal bytes to native migration law; resume with the same package; only a separately approved migrate finalize activates the completed run)", "Import preparation and staging require a Human operator with read, post and migrate; show requires current read authority. Full source and trial-balance access is required for every import action. A governed source may require the embedded owner's explicit --grant privileged; launch-bound sessions cannot grant themselves this authority. Import prepare retains approval material and does not accept --dry-run."]
example = "fa migrate show go-live-2026 --book ./books/myco --json"

[[verb]]
name = "tb"
summary = "Trial balance: native leaf or summary stock/activity, or exact functional-currency stock and period activity, at a known-at frontier. Native reports support retained certification."
writes = true
subcommands = []
flags = ["--period", "--fiscal-year", "--as-of", "--as-known-at", "--root", "--certificate-out", "--branch", "--as-issued-to", "--as-reported-in", "--render", "--out"]
switches = ["--activity", "--summary", "--certify", "--as-originally-reported", "--functional"]
events = ["trial_balance", "summary_trial_balance", "report_certificate", "functional_trial_balance", "functional_stock_balance", "rendered"]
exits = [0, 2, 3, 4, 5, 7, 8]
usage = ["tb ((--period <code>)... | --fiscal-year N) [--activity] [--summary [--root <code>]...] [--as-known-at HEAD|<seq>|<RFC3339>] [--certify]", "tb --functional --activity --period <one code> [--as-known-at HEAD|<seq>|<RFC3339>]   (exact functional-currency movement from immutable committed valuations, with posted and pending columns separate; requires current whole-book read authority; refuses unvalued foreign legs)", "tb --functional (--period <one code> | --as-of YYYY-MM-DD) [--as-known-at HEAD|<seq>|<RFC3339>]   (cumulative functional stock through the period end or civil date, including opening history across fiscal years; no rate is selected or recalculated at report time)", "Functional --activity requires exactly one period; without --activity select one period end or one --as-of date. Both preserve committed valuations, separate pending holds, require current whole-book read authority, and refuse unvalued foreign contributions. Functional reports do not provide summary, fiscal-year, scenario, original-report or certificate selections. Use retained Rate evidence in intent.fx when posting foreign-currency entries; fa fx --help describes source intake and the admitted valuation laws.", "tb --period <code> --as-originally-reported [--activity] [--certify]   (plan §7.4: one period as first reported: at the known-at of the certificate its first StatementIssuance issued, else at its first Lock transition; never its first Close, never HEAD. A period with neither is refused with FA-REF-161. Cannot be combined with --as-known-at.)", "tb --period <code> (--as-issued-to board|auditor|lender|regulator|sec|tax-authority|other | --as-reported-in C:<oid>) [--activity] [--certify]   (plan §7.4: the period as issued to that audience, at the certificate of its first issuance to it (FA-REF-173 when it never was), or as reported in that retained trunk statement certificate, which must report the period in a current or comparative column (FA-REF-174 otherwise). One restatement view at a time; none combines with --as-known-at.)", "tb --as-of YYYY-MM-DD [--summary [--root <code>]...] [--as-known-at HEAD|<seq>|<RFC3339>] [--certify]", "Add --certify to retain a content-addressed certificate in the book and emit its complete canonical bytes as hex; --certificate-out <new-file> implies certification and also saves canonical binary bytes without replacing any existing file. Uncertified reports do not write; retention advances the metadata frontier while the report's known-at remains fixed. --summary --certify binds the selected roots and exact group membership as well as the leaf source; it requires read and produce, and a sequence selector (HEAD or <seq>).", "Stock balances include opening history; --activity is selected-period movement. --summary folds disjoint leaf subtrees under each root account (all roots by default, or --root <code>...). Known-at instants resolve from retained TimeEvidence and report the observed frontier and tick brackets; as-of remains a civil date. Native certificates preserve the original instant resolution; the summary certificate format currently binds sequences only. Replay scope is fa-fold-over-prefix; no witness signature or physical timestamp claim.", "--branch scenario:<name> reads a scenario's materialization (trunk replayed at its fork plus its intents; fa scenario fork|run) instead of trunk; --branch draft:<name> reads a draft's rehearsal (trunk at the head with every planned intent posted together, as promotion would; fa draft new|plan, under whole-book read). Either is uncertified, and the coordinate's known_at is the replay's own sequence. It cannot be combined with --certify, --certificate-out, --as-originally-reported or a known-at selector.", "Add --render md|html|svg|pdf|pdfa to also render the trial balance as a document (stock, activity or as-of; not --summary, --functional or --branch) (fa-cet): md returns the Markdown inline unless --out <new-file> names a file; html, svg, pdf and pdfa write --out <new-file> (never overwriting) and are dated by the latest corroborated TimeEvidence tick known at the report's frontier, never the wall clock, so the same report renders to the same bytes whenever it is rendered; a book with no such tick renders md only (exit 4 otherwise). pdfa is checked by the built-in PDF/A-2b validator before it is written. The rendered event names the IR digest, the file digest and the tick."]
example = "fa tb --period FY2026-P03 --book ./books/myco --json"

[[verb]]
name = "statement"
summary = "Balance sheet or income statement from exact journal folds under a registered definition, with optional period comparatives, retained replay certificates, and frontier diff/trace bridges."
writes = true
subcommands = []
flags = ["--for", "--compare", "--definition", "--before", "--after", "--max-publications", "--known-at", "--as-known-at", "--certificate-out", "--branch", "--before-certificate", "--after-certificate", "--from-diff", "--certificate", "--issued-to", "--document", "--key", "--date", "--plan", "--approval", "--as-issued-to", "--as-reported-in", "--render", "--out", "--present-in", "--rounding", "--from", "--to", "--issuance", "--distribution", "--unit", "--label"]
switches = ["--certify", "--as-originally-reported", "--dry-run", "--functional"]
events = ["statement", "statement_presented", "statement_diff", "statement_trace", "report_certificate", "statement_issuance_plan", "statement_issued", "statement_issuances", "statement_lint", "rendered", "equity_roll_forward"]
exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["statement balance-sheet|income-statement --functional --for <period> [--compare <period>] [--as-known-at HEAD|<seq>|<RFC3339>] [--certify]   (one functional currency from exact retained base amounts; all valuation laws and retained Rate evidence verify at the selected prefix, pending holds stay outside the statement, and income excludes Closing entries and their reversals. No current rate or new valuation is selected. Whole-book read is required; certification also requires produce and retains a distinct v5 certificate that replays and reports later relevant drift. Native certificate formats are unchanged. --render and --present-in work with this basis; diff, trace, scenario/draft branches, issuance views and equity-roll-forward do not take --functional.)", "statement balance-sheet|income-statement --for <period> [--compare <period>] [--known-at HEAD|<seq>|<RFC3339>]", "statement balance-sheet|income-statement --for <period> --present-in units|thousands|millions [--rounding HalfEven|<law>]   (plan §12.1: after the exact statement, a statement_presented event divides every line by 10^(unit scale + 0|3|6) under the registered rounding law (default HalfEven) and inserts an explicit Presentation rounding line before any total whose rounded parts do not sum to its rounded value, so the presented statement foots; the exact statement and its certificate are unchanged; not with diff, trace, certificate comparisons or --render)", "statement balance-sheet|income-statement --for <period> [--compare <period>] --as-originally-reported [--certify]   (plan §7.4: the statement as it stood when its --for period was first reported: at the known-at of the certificate the period's first StatementIssuance issued, else at its first Lock transition; never its first Close, never HEAD. A --compare column is read at that same snapshot. A period with neither is refused with FA-REF-161. Cannot be combined with a known-at selector, diff, trace or certificate inputs.)", "statement balance-sheet|income-statement --for <period> [--compare <period>] (--as-issued-to <audience> | --as-reported-in C:<oid>) [--certify]   (plan §7.4: the statement as its --for period was issued to that audience (FA-REF-173 when it never was), or as reported in that retained trunk statement certificate, which must report the period (FA-REF-174 otherwise). The --compare column is read at the same snapshot.)", "statement diff --definition balance-sheet|income-statement --for <period> [--compare <period>] --before <seq> [--after HEAD|<seq>]", "statement trace --definition balance-sheet|income-statement --for <period> [--compare <period>] --before <seq> [--after HEAD|<seq>] [--max-publications 1..=256]", "statement diff --before-certificate <C:oid|file|-> --after-certificate <C:oid|file|-> [--for <period> [--compare <period>]] [--definition <name>] [--certify]   (bridge two retained certificates of the same trunk statement selection at ordered frontiers; both replay in full first, and a certified comparison keeps those exact source certificates)", "statement trace --from-diff <C:oid|file|-> [--for <period> [--compare <period>]] [--definition <name>] [--max-publications 1..=256] --certify   (attribute a saved statement comparison to every intermediate publication; its original endpoint certificates are kept and the trace must reproduce the saved bridge)", "With certificate inputs, the certificates fix both frontiers: --before, --after and known-at selectors are refused. A stated --for, --compare or --definition is checked against the certificates (exit 8 when they answer a different statement), never used to re-select.", "Both columns use the same known-at snapshot and the registered definition. Balance sheets carry opening history through each selected period; income statements show that period's activity. Native units remain separate; there is no implicit FX conversion or presentation rounding.", "--as-known-at is an alias for --known-at; supply only one. Add --certify to retain an immutable certificate and emit its complete bytes inline. --certificate-out <new-file> also saves a binary copy without replacing a file. Uncertified statements do not publish metadata. Certificates prove replay and arithmetic over the journal, not GAAP conformity.", "--branch scenario:<name> reads a scenario's materialization (trunk replayed at its fork plus its intents; fa scenario fork|run) instead of trunk; --branch draft:<name> reads a draft's rehearsal (trunk at the head with every planned intent posted together, as promotion would; fa draft new|plan, under whole-book read). Either is uncertified, and the coordinate's known_at is the replay's own sequence. It cannot be combined with --certify, --certificate-out, --as-originally-reported or a known-at selector.", "statement issue --certificate C:<oid> [--for <period>] --issued-to board|auditor|lender|regulator|sec|tax-authority|other [--document <oid>] [--key K] [--date YYYY-MM-DD] --dry-run   (plan §12.5, IssueStatements: plans the StatementIssuance of a retained trunk statement certificate for the period it reports (--for may be omitted when it reports one) at the period's next ordinal; needs close and read; writes nothing. An approver who is not the planner runs fa approve --proposal <proposal_digest>.)", "statement issue --plan <file|-> --approval <vid>...   (journals exactly the planned issuance under close and read with one independent Human approval; the plan's ordinal must still be the period's next (exit 6 otherwise: plan again). The period's first issuance is what --as-originally-reported reads from then on; a later issuance never moves it. The same plan committed again returns the recorded issuance.)", "statement issuances [--for <period>]   (every journaled issuance of the period, by ordinal, or of the book)", "statement lint --definition balance-sheet|income-statement|us_gaap_small_company_balance_sheet|us_gaap_small_company_income_statement [--as-known-at HEAD|<seq>]   (plan §12.1, FA-INV-04: whether the definition partitions the chart a statement folds at that frontier: covered leaves no line maps or several lines map, and codes a line names that are unknown, summary or outside its account types; clean=true iff it partitions. Reads the whole chart under current read authority; findings are data, exit 0.)", "statement equity-roll-forward --from YYYY-MM-DD --to YYYY-MM-DD [--issuance <code[,code...]>] [--distribution <code[,code...]>] [--unit <CODE[,CODE...]>] [--label <text>] [--known-at HEAD|<seq>|<RFC3339>]   (plan §12.1, the statement of changes in equity, from the roll-forward lead schedule of every equity, revenue and expense leaf at one recorded prefix. Per unit, opening equity (posted equity plus unclosed earnings) + net income (revenue and expense activity outside Closing entries) + issuances (legs on the --issuance equity accounts) + distributions (legs on the --distribution accounts) + other equity movements (every other equity leg) = closing equity, which is the balance sheet's total_equity at --to; a Closing entry's legs, the closing transfer, net to zero; it is refused when they do not tie. No account's role is inferred from its name or code: an unnamed equity account's legs are other equity movements. Add --certify or --certificate-out <new-file> to retain the complete statement and its source schedule. Replay/status require the receipt's independent equity-roll-forward --expect (fixed prefix, dates, units and issuance/distribution roles). None of --for, --compare, --definition, --render or --present-in applies)", "Add --render md|html|svg|pdf|pdfa to also render the statement as a document (not diff, trace or certificate-sourced statements) (fa-cet): md returns the Markdown inline unless --out <new-file> names a file; html, svg, pdf and pdfa write --out <new-file> (never overwriting) and are dated by the latest corroborated TimeEvidence tick known at the report's frontier, never the wall clock, so the same report renders to the same bytes whenever it is rendered; a book with no such tick renders md only (exit 4 otherwise). pdfa is checked by the built-in PDF/A-2b validator before it is written. The rendered event names the IR digest, the file digest and the tick."]
example = "fa statement balance-sheet --for FY2026-P03 --compare FY2026-P02 --certify --book ./books/myco --json"

[[verb]]
name = "replay"
summary = "Replay a complete retained report artifact under current authority and reproduce its original native report, independently selected ledger detail, statement comparison, publication trace, procedure, or canonical output."
writes = false
subcommands = []
flags = ["--output", "--workpaper-out", "--expect", "--view", "--account", "--unit", "--from", "--to", "--label", "--as-known-at", "--grant"]
switches = ["--workpaper"]
events = ["trial_balance", "statement", "balance_explained", "open_items", "summary_trial_balance", "general_ledger", "roll_forward", "aging", "statement_diff", "statement_trace", "scenario_diff", "draft_diff", "procedure_run", "query_rows", "external_feed_reconciled", "report_replayed", "workpaper_exported"]
exits = [0, 2, 3, 4, 5, 7, 8]
usage = ["replay <C:oid|oid|certificate-file|-> [--output <new-file>] [--workpaper-out <new-file> | --workpaper] [--expect <json>]","--workpaper-out writes the family's recipient-bound JSONL workpaper (every amount and count a decimal string, except the integer unit ids, day numbers and counts of the statement-diff package) to a new file and emits workpaper_exported; --workpaper returns the same text inline in that event's text field instead (the form MCP uses, since it accepts no host paths). It needs read and produce, and the export replays the certificate again against the same independent request, so it is written only after both replays succeed. Families: ledger detail and the roll-forward lead schedule (a roll-forward source replayed with --view detail or --view roll-forward), effective-date aging (with its aging --expect), cash-flow, aging-reconciliation, aging-portfolio, statement-diff (the JSONL of the library's review package) and statement-trace; any other family is refused before replay. A workpaper is a readable deliverable, not an outsider proof, and never contains the source certificates or protected text.","A 64-hex oid resolves the complete immutable artifact retained in this book, including its outer family. A file holds canonical binary certificate bytes; stdin also accepts the oid or complete bytes hex string from a report_certificate event. Prefix a 64-hex filename with ./ to read it as a file. The certificate fixes the selector and known-at; replay never substitutes today's frontier.","--output writes the original canonical report bytes only after the complete artifact replays, then emits report_replayed with its family, length and output digest. Existing files are never replaced. Summary, effective-date aging and roll-forward replay their original report events and preserve the report_replayed receipt even without a file. Cash-flow, policy cash-flow, indirect cash-flow, aging reconciliation and the aging portfolio require --expect with the recipient-selected original request as an inline JSON object: kind (cash-flow, policy-cash-flow, indirect-cash-flow, aging-reconciliation or aging-portfolio), explicit integer known_at, original account/date/unit selectors, and the original policy or bucket law. Cash-flow expectations use accounts, units, from, through, label and policy; a policy cash-flow's policy carries name, cash_accounts, account_rules and overrides; indirect expectations also use income_periods. Aging reconciliation uses account, through and buckets. The aging portfolio uses scope (all-posting, or selected with accounts), through and buckets. Effective-date aging also accepts an optional kind aging expectation (account, omitted for the whole book, through, known_at and buckets): replay then refuses a certificate that answers a different question, and --workpaper-out needs it. Retain these expectations independently of the delivered certificate; a replay_command is a convenience, not independent evidence of the intended request. These five families return report_replayed and can reproduce the exact original canonical output with --output. Omitted, mismatched or malformed expectations refuse before any output file is created.","To reproduce general-ledger lines, add --view detail with independently reviewed --account, --unit, --from, --to, --label and numeric --as-known-at expectations. All are required; HEAD and implicit base units are refused. Do not combine --view detail with --expect. The original detail report supplies a complete replay_command. A mismatch refuses before any success event or file write. The retained certificate, output_digest, --output bytes and report_replayed receipt still identify the original roll-forward source.","--view roll-forward takes the same required expectations and binds the replay of a roll-forward certificate's lead schedule to them (exit 8 when the certificate answers a different account, unit, date, label or recorded-sequence question); without a view a roll-forward replays as supplied."]
example = "fa replay trial-balance.cert --book ./books/myco --json"

[[verb]]
name = "certificate"
summary = "Verify a complete retained report, then check whether later entries affect its accounting selection, or whether a summary trial balance's selector still reproduces it."
writes = false
subcommands = ["status"]
flags = ["--expect", "--grant"]
switches = []
events = ["certificate_status"]
exits = [0, 2, 3, 4, 5, 7, 8]
usage = ["certificate status <C:oid|oid|certificate-file|-> [--expect <json>]", "A 64-hex oid resolves the complete certificate retained in this book; file and inline bytes are also accepted. Current or SupersededBy is evaluated against the current book after the complete artifact verifies; supersession does not erase the historical report. For a statement diff or trace, relevance begins at the final statement frontier and the returned oid remains the outer certificate. A scenario diff's trunk side is fixed at its fork, so only Plan records its scenario gained after the certified prefix supersede it (later_entries names them); known_at is the fork. A summary trial balance is Changed, with empty later_entries, when its root and effective selector no longer reproduces the certified report exactly at HEAD; it takes no --expect.","Roll-forward and general-ledger source certificates use their selected posted accounts, native units and inclusive closing cutoff. Later postings before the activity window count because they change opening stock; unrelated accounts, other currencies, pending reservations and activity after the cutoff do not. Direct, split and policy cash-flow certificates use the same financial selection and require --expect with the original independently retained request and classification, exactly as fa replay does. New cash activity supersedes the original classification even if it has no assignment in the old policy. Other report families refuse selector status until their own relevance law is implemented."]
example = "fa certificate status trial-balance.cert --book ./books/myco --json"

[[verb]]
name = "open-items"
summary = "Open items (plan §5.7): each live posted leg, its applications, and its open amount, with account metadata at the selected historical snapshot."
writes = true
subcommands = []
flags = ["--account", "--as-of", "--as-known-at", "--certificate-out", "--branch"]
switches = ["--certify"]
events = ["open_items", "report_certificate"]
exits = [0, 2, 3, 4, 5, 7, 8]
usage = ["open-items [--account <code>] [--as-of YYYY-MM-DD] [--as-known-at HEAD|<seq>|<RFC3339>] [--certify | --certificate-out <new-file>]", "Without certification this is a pure read. --as-of folds open items through an inclusive civil date. --certify retains an immutable report certificate in the book; --certificate-out also creates a new external copy. Unknown account filters refuse, including accounts absent at the selected known-at. Replay fixes that snapshot, account metadata, and application/reversal lineage."]
example = "fa open-items --account 1200 --book ./books/myco --json"

[[verb]]
name = "gl"
default_subcommand = "detail"
summary = "General-ledger detail, account roll-forward lead schedules, effective-date open-item aging and control reconciliation, cost-basis lot schedules and relief planning, and direct/indirect cash-flow workpapers over one recorded snapshot."
writes = true
subcommands = ["detail", "roll-forward", "aging", "cash-flow", "lots"]
flags = ["--account", "--unit", "--from", "--to", "--label", "--as-of", "--bucket", "--policy", "--income-period", "--relieve", "--law", "--regime", "--rounding-law", "--target", "--as-known-at", "--grant", "--certificate-out", "--branch", "--from-source", "--aging-certificate", "--control-certificate"]
switches = ["--reconcile", "--all-posting", "--indirect", "--certify"]
events = ["general_ledger", "roll_forward", "aging", "aging_reconciled", "aging_portfolio_reconciled", "cash_flow", "policy_cash_flow", "split_cash_flow", "indirect_cash_flow", "lots", "report_certificate"]
exits = [0, 2, 3, 4, 5, 7, 8]
usage = ["gl detail --account <code[,code...]> [--unit <CODE[,CODE...]>] --from YYYY-MM-DD --to YYYY-MM-DD [--label <text>] [--as-known-at HEAD|<seq>|<RFC3339>] [--certify | --certificate-out <new-file>]","gl roll-forward --account <code[,code...]> [--unit <CODE[,CODE...]>] --from YYYY-MM-DD --to YYYY-MM-DD [--label <text>] [--as-known-at HEAD|<seq>|<RFC3339>] [--certify | --certificate-out <new-file>]","gl aging [--account <code[,code...]> | --all-posting] --as-of YYYY-MM-DD [--bucket <days>]... [--reconcile] [--certify | --certificate-out <new-file>] [--as-known-at HEAD|<seq>|<RFC3339>]","gl aging --from-source <C:oid|file|-> [--account <code>] --as-of YYYY-MM-DD [--bucket <days>]... (--certify | --certificate-out <new-file>)","gl aging --reconcile (--account <code[,code...]> | --all-posting) --as-of YYYY-MM-DD [--bucket <days>]... --as-known-at <seq> --aging-certificate <C:oid|file|-> --control-certificate <C:oid|file|-> (--certify | --certificate-out <new-file>)","Saved sources: --from-source ages a retained open-items certificate (fa open-items --certify) at its own recorded prefix and keeps it as the aging's source; a stated --account is checked against it (exit 8), and --as-known-at is refused. --aging-certificate (a gl aging certificate: one account, or the whole book for a portfolio) and --control-certificate (the tb --as-of certificate at the same prefix and date) are reused byte-for-byte as the reconciliation's sources. The other flags state the recipient's complete question, including a numeric --as-known-at, and a different question exits 8. Each form certifies.","gl cash-flow --account <code[,code...]> [--unit <CODE[,CODE...]>] --from YYYY-MM-DD --to YYYY-MM-DD --policy <file.json|-> [--indirect --income-period <code>...] [--label <text>] [--as-known-at HEAD|<seq>|<RFC3339>] [--certify | --certificate-out <new-file>]","gl lots --account <code> [--as-of YYYY-MM-DD] [--as-known-at HEAD|<seq>|<RFC3339>] [--relieve <amount> --law FIFO|LIFO|SpecificId|WeightedAverage [--regime US-GAAP|US-TAX|IFRS] [--rounding-law HalfEven|HalfUp|Down|Up|Ceiling|Floor] [--target <vid[:ordinal]>]...]","Historical folds are read-only unless --certify or --certificate-out retains their complete source certificate. Detail retains its roll-forward source; roll-forward, aging, aging reconciliation, the aging portfolio and direct or indirect cash-flow retain their own full native artifact. Current read and produce authority are required. Replay by the returned C:<digest> works after reopening the book and later backdated postings. Cash-flow, aging and reconciliation receipts include a replay command with the producing request as --expect JSON; recipients must retain and select that request independently before accepting replay. Lots certification remains refused.","Uncertified RFC3339 known-at queries resolve retained TimeEvidence ticks and disclose the original resolution and brackets. Certification requires HEAD or a commit sequence because the current GL certificate format cannot retain that instant-resolution witness. Run an instant query without certification, then pass its resolved_seq to --as-known-at when requesting a certificate over that journal prefix. The same restriction applies to --certificate-out.","Opening stock, posted movements and closing stock share one known-at frontier. --reconcile ties an account's open-item fold to its control balance and needs an explicit selection: one --account code (aging_reconciled), or a comma-separated --account list or --all-posting (every posting leaf), which reconcile from one chart, one aging fold and one control trial balance at one coordinate (aging_portfolio_reconciled). Unselected leaves are listed as uncovered, never as zero. complete and reconciled are separate verdicts, and neither is a close permit. Cash-flow policies classify each cash leg (or indirect non-cash adjustment) explicitly without inventing a balancing plug. A direct policy with `account_rules` ([{account, activity}] for non-cash counterpart accounts) and optional `overrides` (whole cash legs, like assignments) is a rule policy (policy_cash_flow): a cash leg takes a rule's activity only when every nonzero non-cash counterpart in its entry and unit has that one activity, mixed or unmapped counterparts need an override, and `decisions` records each leg's basis. A rule policy cannot also carry assignments and does not combine with --indirect.","A certified detail replay_command includes --view detail plus the original explicit account, unit, date, label and recorded-sequence selections. Retain these expectations independently before accepting a delivered certificate; replay verifies them before rendering ledger lines.", "A policy with splits selects exact split cash flow. Its splits array names entry_digest, leg_index, reason, and portions:[{activity,amount}] for each original cash leg. Every amount is a positive exact unit-tagged string in that leg's actual currency, and portions total its original amount exactly. For example, a 100.00 USD loan payment can have financing 80.00 USD and operating 20.00 USD portions. Splits cannot combine with assignments, account_rules or --indirect. Certification retains fa:cash-flow-split:v1; recipient replay takes --expect kind split-cash-flow with independently selected full policy, reasons, units and fixed numeric known_at."]
example = "fa gl detail --account 1000 --from 2026-03-01 --to 2026-03-31 --book ./books/myco --json"

[[verb]]
name = "explain"
summary = "Explain a leaf account's balance, a committed entry and its lineage, an entry's complete supersession lineage and net effect, an entry's evidence closure, a refusal code from the embedded catalog, a fiscal period's state and transitions, or a register cell's fold vs materialized state."
writes = true
subcommands = ["balance", "entry", "evidence", "refusal", "period", "register", "lineage"]
flags = ["--period", "--unit", "--as-known-at", "--certificate-out", "--branch", "--as-issued-to", "--as-reported-in"]
switches = ["--certify", "--as-originally-reported"]
events = ["balance_explained", "entry_explained", "evidence_explained", "refusal_explained", "period_explained", "register_explained", "lineage_explained", "report_certificate"]
exits = [0, 2, 3, 4, 5, 7, 8]
usage = ["explain balance <account code> --period <code> [--as-known-at HEAD|<seq>|<RFC3339>] [--certify | --certificate-out <new-file>]", "explain balance <account code> --period <code> --as-originally-reported [--certify | --certificate-out <new-file>]   (plan §7.4: the balance as its period was first reported, as fa tb --as-originally-reported: at the certificate of the period's first StatementIssuance, else its first Lock; FA-REF-161 when the period was never reported; cannot be combined with --as-known-at)", "explain balance <account code> --period <code> (--as-issued-to <audience> | --as-reported-in C:<oid>) [--certify | --certificate-out <new-file>]   (the balance as its period was issued to that audience or reported in that retained statement certificate, as on fa tb)","explain entry <vid|E:vid>", "explain lineage <vid|E:vid> [--as-known-at HEAD|<seq>]", "explain evidence <entry-vid|E:vid>", "explain refusal <FA-REF-nnn | refusal_id>", "explain period <period-code>", "explain register <account-code> --period <code> [--unit <CODE>] [--as-known-at HEAD|<seq>]", "Without certification this is a pure read; `explain refusal` requires no book. --certify, --certificate-out and the restatement views (--as-originally-reported, --as-issued-to, --as-reported-in) apply only to `explain balance`; the other subcommands refuse them (exit 2). --certify (on `explain balance`) retains the exact explanation and native read closure in the book; --certificate-out also creates a new external copy. The certificate binds historical account metadata, contributing entries, evidence references, lineage, cell history, and the whole-period fold."]
example = "fa explain balance 1000 --period FY2026-P03 --book ./books/myco --json"

[[verb]]
name = "search"
summary = "Full-text search over entry descriptions and leg memos at a recorded frontier, ranked by exact fixed-point BM25 from an index rebuilt from the journal for each query and never stored (plan §9)."
writes = false
subcommands = []
flags = ["--as-known-at", "--limit"]
switches = []
events = ["search_results"]
exits = [0, 2, 3, 4, 5, 7]
usage = ["search <query> [--as-known-at HEAD|<seq>|<RFC3339>] [--limit N]   (quote a phrase; terms match whole tokens; hits are best first, at most --limit of them, default 20, 1..=200)", "The index is rebuilt from the journal at the frontier for this query alone (never stored, so it cannot drift from the journal; index_digest names it). Each committed entry's description and leg memos are indexed, opened with the book's key: erased text, or text sealed under a subject's own key, is never indexed and never appears in a snippet. Documents and findings are not indexed yet. A whole-book read: a token carrying any scope caveat is refused. No amount is parsed from a hit; fa entry show <id> reads the entry itself."]
example = "fa search \"office rent\" --book ./books/myco --json"

[[verb]]
name = "query"
summary = "Run a GQL statement in the FrankenAccounting profile (plan §15.5): native GQL plus AS KNOWN AT, FOR PERIOD, EFFECTIVE BETWEEN and AT BRANCH, compiled onto one certified native read at one recorded sequence; CALL fa.trial_balance is fa tb itself."
writes = false
subcommands = []
flags = ["--certificate-out", "--branch"]
switches = ["--certify"]
events = ["query_rows", "trial_balance", "report_certificate"]
exits = [0, 2, 3, 4, 5, 7, 8]
usage = ["query \"<statement>\" [--certify] [--certificate-out <new-file>] [--branch scenario:<name>|draft:<name>]   (quote the whole statement; at most 16 KiB)", "A statement is native GQL beginning with MATCH (MATCH, OPTIONAL MATCH, WHERE, WITH, RETURN, ORDER BY, SKIP, LIMIT, UNION) over the book's graph: Entry, Leg, Account, Unit, Period, Party, Document and the other registered labels, with HAS_LEG, POSTS_TO, IN_UNIT, IN_PERIOD, SUPERSEDES and the other registered relations. A leg carries side (0 debit, 1 credit), unit_id, ordinal, _fa_effective_day and amount, a positive decimal at its unit's scale; reach its account through POSTS_TO.", "Selectors, anywhere at the statement's top level: AS KNOWN AT <commit sequence> | HEAD | '<RFC3339 instant>' (default HEAD, always reported as a sequence) or AS CURRENTLY STATED; FOR PERIOD '<code>' (the period each entry posted to, through its IN_PERIOD edge: bind exactly one (l:Leg), or one (e:Entry) with no leg); EFFECTIVE BETWEEN '<date>' AND '<date>' (a leg's effective day, both included); AT BRANCH trunk, AT BRANCH 'scenario:<name>' (the same as --branch scenario:<name>) for the scenario's replay (trunk at its fork plus its intents), or AT BRANCH 'draft:<name>' for the draft's rehearsal (trunk with its planned intents posted, as promotion would): read at the replay's head, uncertified, with the branch in the envelope's coordinate (no AS KNOWN AT and no certification beside it). CALL fa.trial_balance [FOR PERIOD '<code>'] [AS KNOWN AT <seq>] runs fa tb with that selection and emits its trial_balance.", "The amount law is checked before anything runs (FA-REF-189): an aggregate over amounts is grouped by unit (RETURN u.code, SUM(l.amount) with (l)-[:IN_UNIT]->(u:Unit)) or pinned to one ((u:Unit {code: 'USD'}) or WHERE l.unit_id = <id>); an amount compares or orders only with amounts pinned to the same unit and never with a literal; no float literal is admitted. The profile computes an amount aggregate itself, exactly, in the statement's one final RETURN: its items are group keys and COUNT(*), COUNT, SUM, MIN, MAX or AVG of one binding or property, followed only by ORDER BY its output columns, SKIP and LIMIT. AVG is an exact decimal or fraction, a null mirror or an overflow is refused, and at most 1000000 native rows are folded. Other profile clauses, parameters, writes, a CALL inside a pipeline and the Register caches are refused naming the admissible form (FA-REF-188).", "Rows are the graph as recorded at that sequence, pending holds and staged migration chunks included; a balance is a fold, read with CALL fa.trial_balance or the report verbs. A result is at most 10000 rows (a larger one is refused, never cut; add LIMIT). A whole-book read: a token carrying any scope caveat is refused.", "--certify retains the result's certificate in the book (it needs produce as well as read) and emits report_certificate after query_rows; --certificate-out <new-file> implies it and also saves the canonical bytes without replacing a file. The certificate binds the statement, the substrate's certificate of the native read, the whole-book stock trial balance at the same sequence and the exact rows. fa replay C:<oid> replays the native read against retained history and reproduces the rows byte for byte (exit 8 otherwise); fa certificate status C:<oid> is Current while the statement still answers the same at HEAD, else Changed. A certificate binds a sequence: certify an instant-selected statement AS KNOWN AT the sequence it resolves to. CALL fa.trial_balance --certify is fa tb --certify. A leading EXPLAIN (CERTIFICATE), as in EXPLAIN (CERTIFICATE) MATCH ... AS KNOWN AT 12, is --certify written in the statement."]
example = "fa query \"MATCH (l:Leg)-[:IN_UNIT]->(u:Unit) RETURN u.code, l.side, SUM(l.amount) AS total FOR PERIOD 'FY2026-P03'\" --book ./books/myco --json"

[[verb]]
name = "procedure"
summary = "Lantern (plan §11): list the registered forensic and audit procedures, or run one over the book's trunk at a recorded sequence and, for a procedure that takes one (its effective_through in procedure list), through an effective date; a date given to any other procedure is refused. A finding is a statistic with typed citations, never an accusation."
writes = false
subcommands = ["list", "run"]
flags = ["--known-at", "--effective-through", "--param", "--account", "--source", "--budget", "--grant"]
switches = []
events = ["procedure_list", "procedure_run"]
exits = [0, 2, 3, 4, 5, 7, 8]
usage = ["procedure list", "procedure run <procedure id> [--known-at HEAD|<seq>] [--effective-through YYYY-MM-DD] [--param <name>=<integer>]... [--account <code>] [--source <entry vid>] [--budget <work units>]", "--budget caps the run's work (entries, legs and comparisons counted as the procedure runs): the procedure stops at the first unit past it and the run is refused with exit 3 and no finding. A run is also stopped, with no finding, when its caller is cancelled. A procedure runs under its work meter alone, with no clock, entropy, network or filesystem.", "Parameters default to procedures.toml's pinned values; --param overrides one registered parameter. aging.* and trace.* need --effective-through; trace.* also need --account (the commingled account) and --source (the deposit entry).", "recon.bank_statement_drift needs current whole-book read and reconcile authority; supply --grant reconcile on the embedded owner route. An unrecorded run needs no produce grant. It evaluates every retained exact statement close at --known-at; --effective-through selects statement close dates without changing their immutable cash cutoff. Use finding record recon.bank_statement_drift to certify and retain the complete observations."]
example = "fa procedure run jet.round_amounts --book ./books/myco --json"

[[verb]]
name = "sample"
summary = "Audit sampling (plan §11.7): a reproducible uniform, monetary-unit (MUS) or stratified sample of one account's open items at one recorded coordinate, from a declared seed, and the Stringer evaluation of an MUS sample's audited values. A stratified sample's strata are book-value bands the auditor declares. Nothing is written."
writes = false
subcommands = ["uniform", "mus", "stratified", "evaluate"]
flags = ["--account", "--seed", "--size", "--interval", "--tolerable", "--expected", "--as-of", "--as-known-at", "--audited", "--confidence", "--band"]
switches = []
events = ["sample_drawn", "sample_evaluated"]
exits = [0, 2, 3, 4, 5, 7, 8]
usage = ["sample uniform --account <code> --seed <u64> --size <n> [--as-of YYYY-MM-DD] [--as-known-at HEAD|<seq>|<RFC3339>]", "sample stratified --account <code> --seed <u64> --size <n> --band \"<amount> <UNIT>\"... [--as-of YYYY-MM-DD] [--as-known-at HEAD|<seq>|<RFC3339>]   (the bands are ascending upper bounds in the population's unit: b01 holds the items at most the first, each later stratum the items above the previous bound, and the last every item above the last bound; allocation is proportional, the decision card's pinned fallback, until a sampling policy is activated)", "sample mus --account <code> --seed <u64> (--interval \"<amount> <UNIT>\" | --tolerable \"<amount> <UNIT>\" --expected \"<amount> <UNIT>\" --confidence 90|95|99) [--as-of YYYY-MM-DD] [--as-known-at HEAD|<seq>|<RFC3339>]", "sample evaluate --account <code> --seed <u64> (--interval \"<amount> <UNIT>\" | --tolerable \"<amount> <UNIT>\" --expected \"<amount> <UNIT>\") --as-known-at <seq> [--as-of YYYY-MM-DD] --audited <audited.json|-> --confidence 90|95|99", "plan §11.12: instead of stating --interval, an MUS sample can be planned from the auditor's tolerable and expected misstatement at a confidence: interval = (tolerable - expected x expansion factor) / reliability factor, rounded down to the unit, with the AICPA expansion factors 1.5, 1.6, 1.9 and the zero-misstatement Poisson factors 2.31, 3.00, 4.61 at 90, 95, 99%. --expected is always explicit (\"0.00 <UNIT>\" when none is expected). The draw reports tolerable, expected and confidence_percent, and its replay_command restates them; evaluate plans the same interval at its --confidence. Tolerable misstatement is a parameter the auditor states, never a judgment made here.", "evaluate re-draws the MUS sample from the same --account, --seed, --interval, --as-of and a numeric --as-known-at, then takes {\"items\":[{\"item_id\",\"audited\":\"<amount> <UNIT>\"}]} with exactly one audited value for every selected item and none for any other (exit 8 otherwise, naming the missing and unexpected ids). Book values come from the sample, never from the file. The Stringer upper misstatement limit is the basic precision (interval times the Poisson factor at zero errors) plus the most likely error (top-stratum overstatement in full, and interval times each tainting) plus the incremental allowance for ranked taintings; each component is exact and rounded up to the unit, and upper_misstatement_limit_exact keeps the exact value in minor units. Overstatements are bounded; understatements are counted. The limit is a statistic for the auditor's conclusion, not the conclusion.","The population is the account's open items (fa open-items) on its normal-balance side with a positive open amount, in one unit, at --as-known-at (and, with --as-of, through that effective date). Items are <entry vid hex>:<five-digit ordinal> valued at their open amount, canonically ordered and digested (population_digest). Open items on the other side cannot carry a positive book value: they are listed in excluded, to be tested separately, never silently dropped. Fully applied items are not open. Read authority is required.", "uniform selects --size items without replacement; mus selects every item whose open amount is at least --interval (top stratum) and a systematic dollar hit every --interval from a seeded random start. Selection is a pure function of the population digest, the declared --seed and the parameters over PCG64DXSM, reproducible in Python with numpy.random.PCG64DXSM(seed) and the snippet documented on fa_lantern::sample::Pcg64Dxsm. The seed is never drawn from entropy.", "sample_digest binds the method, population digest, seed, parameters and selected item ids; it is recomputed, not a retained report certificate. replay_command repeats the draw at the same recorded sequence. Stratified (Neyman) selection is not on the CLI yet."]
example = "fa sample uniform --account 1200 --seed 20260115 --size 25 --book ./books/myco --json"

[[verb]]
name = "engagement"
summary = "Audit engagements (plan §11.12, §0.4 decision 3): open an engagement (its kind, scope periods and the materiality parameters the auditor states, journaled once by an EngagementControl record under produce authority), list the book's engagements, or show one with every proposed adjustment and its decision."
writes = true
subcommands = ["open", "list", "show", "sud", "file", "complete", "carry-forward"]
flags = ["--kind", "--period", "--overall", "--performance", "--clearly-trivial", "--report-release", "--key", "--date", "--grant", "--definition", "--document", "--completion-date", "--from", "--turned-around", "--corrected", "--finding"]
switches = []
events = ["engagement_opened", "engagements", "engagement_detail", "engagement_sud", "engagement_workpaper_filed", "engagement_documentation_completed", "engagement_carry_forward_recorded", "engagement_finding_filed"]
exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["engagement open <id> --kind audit|review|examination|investigation|litigation --period <code>... --overall \"<amount> <UNIT>\" --performance \"<amount> <UNIT>\" --clearly-trivial \"<amount> <UNIT>\" [--report-release YYYY-MM-DD] [--key K] [--date YYYY-MM-DD]   (journals the engagement once, under produce authority; the parameters are in the book's base unit with 0 <= clearly trivial <= performance <= overall, and are stated, never judged; every scope period must exist)", "engagement list   (every engagement of the book, under read authority)", "engagement show <id>   (the engagement and each proposed adjustment: its legs, its state proposed|booked|passed, and its decision)", "engagement sud <id> [--definition <income statement>] [--definition <balance sheet>]   (plan §11.12 audit.sud, the summary of uncorrected misstatements: every passed proposal's effect had it been booked, on income, assets, liabilities and equity in the engagement's unit, legs in other units listed and never converted; the rollover (period income) and iron-curtain (period-end balance sheet) totals, which sum the same items while no prior-period engagement is carried forward; per statement line, rollover_lines over an income statement definition and iron_curtain_lines over a balance sheet definition, each one a name fa statement lint takes (income-statement and balance-sheet by default, us_gaap_small_company_* for the classified presets), refused when an account maps to no line or to several; and mechanical comparisons with the stated clearly trivial, performance and overall parameters. Materiality is the auditor's judgment, not this report's)", "engagement file <id> --finding <vid> [--key K]   (plan §11.12: puts a Lantern finding of the book (its vid from fa finding list or fa finding record) in the engagement's index, once per finding, by an EngagementControl File record under produce; after the documentation completion it is marked added_after_completion; fa engagement show lists the findings)", "engagement file <id> --document <oid> [--key K]   (plan §11.12: puts a document the book holds in the engagement's workpaper index, once per document, journaled by an EngagementControl File record under produce; after the documentation completion the filing is marked added_after_completion, and nothing filed is withdrawn)", "engagement carry-forward <id> --from <prior engagement> [--turned-around <n>]... [--corrected <n>]... [--key K]   (plan §11.12, SAB 108: journals under produce that the prior engagement's uncorrected misstatements carry into this one; the auditor states which of them turned around through this period's income and which an out-of-period correction here corrected, and the rest are still uncorrected at this period's end. The prior engagement is another of this book in the same unit whose scope periods all end before this one's begin, and each number is one of its uncorrected proposals (FA-REF-191 otherwise). The latest carry-forward governs fa engagement sud: still-uncorrected items count under the iron curtain, turned-around ones under the rollover, corrected ones under neither; carried items are listed under carried and attributed to statement lines, a still-uncorrected item's income through the book's closing routes (fa close map) to equity)", "engagement complete <id> --completion-date YYYY-MM-DD [--report-release YYYY-MM-DD] [--key K]   (AS 1215.15: journals the documentation completion once, at most 45 days after the report release date; the release date is the engagement's own when it was opened with one, else --report-release names it (FA-REF-190 otherwise, or when the date is outside the window or the completion is already journaled). Every proposal, decision and workpaper journaled after it is marked added_after_completion in engagement show)"]
example = "fa engagement open FY2026-audit --kind audit --period FY2026-P01 --period FY2026-P02 --overall \"50000.00 USD\" --performance \"37500.00 USD\" --clearly-trivial \"2500.00 USD\" --book ./books/myco --json"


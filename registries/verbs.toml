# Operations that cannot be undone in practice (plan §15.3, Appendix D
# FA-REF-007). Without --yes, or a --plan file naming the exact proposal,
# they are refused with exit 7 before anything is written, and the refusal's
# fix is `safe`: a reversible or read-only alternative that exists today.
# `fa capabilities --json` lists them. `condition` (closed vocabulary):
# always · grant:<op> (the command self-issues that op with --grant) ·
# disposition:voids (the intent voids a hold) · existing-cells (the period
# already has materialized register cells). Gate: every operation the plan
# names dangerous has a row (fa-cli dangerous-operation test), and every row
# is refused without --yes and admitted with it.

[[dangerous]]
verb = "bank"
subcommand = "unmatch"
condition = "always"
safe = "inspect bank history and select the exact match VID and digest before releasing its line and cash-leg claim"

[[dangerous]]
verb = "bank"
subcommand = "reconcile"
condition = "always"
safe = "review bank status and the statement closing balance at the exact --source-known-at prefix before attesting the close and protecting its cash dates"

[[dangerous]]
verb = "close"
subcommand = "year-end"
condition = "always"
safe = "prepare the exact closing proposal with --review-only, or rehearse its native posting with --dry-run; inspect the nominal residuals and obtain any required independent approval before committing"

[[dangerous]]
verb = "fx"
subcommand = "revalue"
condition = "always"
safe = "prepare the source-derived adjustment with --review-only or rehearse the native --dry-run plan; inspect the signed carrying values and retained closing Rate before committing"

[[dangerous]]
verb = "period"
subcommand = "close"
condition = "always"
safe = "`fa period soft-close <code>` stops ordinary postings and stays reopenable without approvals"

[[dangerous]]
verb = "period"
subcommand = "lock"
condition = "always"
safe = "leave the period Closed (`fa period list --json` shows every state); a Closed period already refuses ordinary postings"

[[dangerous]]
verb = "period"
subcommand = "reopen"
condition = "always"
safe = "only a lawfully classified adjustment or an authorized reopen (case-bound, `fa approve`) changes what a closed period reports; never re-date an entry to avoid the period law (`fa period list --json` shows each period's state)"

[[dangerous]]
verb = "post"
condition = "grant:post_closed"
safe = "leave the intent unposted; keep its true effective date and obtain the authorization or the admissible adjustment class the period-law refusal names (`fa period list --json` shows each period's state)"

[[dangerous]]
verb = "reclass"
condition = "grant:post_closed"
safe = "keep the target's date and obtain the authority and approval the period law requires for a Closed period; `fa period list --json` shows the target period's state"

[[dangerous]]
verb = "reverse"
condition = "grant:post_closed"
safe = "keep the intended reversal date and obtain the authority the period law requires; `fa period list --json` shows the target period's state"

[[dangerous]]
verb = "replace"
condition = "grant:post_closed"
safe = "keep the intended reversal date and obtain the authority the period law requires; `fa period list --json` shows the target period's state"

[[dangerous]]
verb = "invoice"
condition = "grant:post_closed"
safe = "leave the document unposted; keep its true date and obtain the authorization or the admissible adjustment class the period-law refusal names (`fa period list --json` shows each period's state)"

[[dangerous]]
verb = "bill"
condition = "grant:post_closed"
safe = "leave the document unposted; keep its true date and obtain the authorization or the admissible adjustment class the period-law refusal names (`fa period list --json` shows each period's state)"

[[dangerous]]
verb = "receipt"
condition = "grant:post_closed"
safe = "leave the document unposted; keep its true date and obtain the authorization or the admissible adjustment class the period-law refusal names (`fa period list --json` shows each period's state)"

[[dangerous]]
verb = "payment"
condition = "grant:post_closed"
safe = "leave the document unposted; keep its true date and obtain the authorization or the admissible adjustment class the period-law refusal names (`fa period list --json` shows each period's state)"

[[dangerous]]
verb = "reserve"
condition = "grant:post_closed"
safe = "keep the intent's true effective date and obtain the authorization the period-law refusal names; `--dry-run` rehearses it without confirmation (`fa period list --json` shows each period's state)"

[[dangerous]]
verb = "accrue"
condition = "grant:post_closed"
safe = "keep the intent's true effective date and obtain the authorization the period-law refusal names; `--dry-run` rehearses it without confirmation (`fa period list --json` shows each period's state)"

[[dangerous]]
verb = "defer"
condition = "grant:post_closed"
safe = "keep the intent's true effective date and obtain the authorization the period-law refusal names; `--dry-run` rehearses it without confirmation (`fa period list --json` shows each period's state)"

[[dangerous]]
verb = "batch"
condition = "grant:post_closed"
safe = "keep the intent's true effective date and obtain the authorization the period-law refusal names; `--dry-run` rehearses it without confirmation (`fa period list --json` shows each period's state)"

[[dangerous]]
verb = "post-reserve"
condition = "grant:post_closed"
safe = "keep the intent's true effective date and obtain the authorization the period-law refusal names; `--dry-run` rehearses it without confirmation (`fa period list --json` shows each period's state)"

[[dangerous]]
verb = "void-reserve"
condition = "grant:post_closed"
safe = "keep the intent's true effective date and obtain the authorization the period-law refusal names; `--dry-run` rehearses it without confirmation (`fa period list --json` shows each period's state)"

[[dangerous]]
verb = "resolve"
condition = "grant:post_closed"
safe = "keep the intent's true effective date and obtain the authorization the period-law refusal names; `--dry-run` rehearses it without confirmation (`fa period list --json` shows each period's state)"

[[dangerous]]
verb = "allocate"
condition = "grant:post_closed"
safe = "keep the intent's true effective date and obtain the authorization the period-law refusal names; `--dry-run` rehearses it without confirmation (`fa period list --json` shows each period's state)"

[[dangerous]]
verb = "settle"
condition = "grant:post_closed"
safe = "keep the intent's true effective date and obtain the authorization the period-law refusal names; `--dry-run` rehearses it without confirmation (`fa period list --json` shows each period's state)"

[[dangerous]]
verb = "resolve"
condition = "disposition:voids"
safe = "resolve the hold with disposition `posts` to post what it held; a void releases it for good"

[[dangerous]]
verb = "registers"
subcommand = "materialize"
condition = "existing-cells"
safe = "`fa verify registers --period <code> --json` checks the existing cells against the journal without rewriting them"

[[dangerous]]
verb = "recover"
subcommand = "projections"
condition = "always"
safe = "`fa verify projections --json` reports the drift without writing, and `fa recover projections --dry-run --json` previews every mirror and edge the repair would publish; retain both, then publish exactly that repair with `--yes --basis <its basis>`"

[[dangerous]]
verb = "recover"
subcommand = "outcomes"
condition = "always"
safe = "`fa recover outcomes --dry-run --json` verifies native history and previews the missing outcomes without writing; retain that preview, then establish exactly its common-idempotency coverage with `--yes --basis <its basis>`"

[[dangerous]]
verb = "draft"
subcommand = "promote"
condition = "always"
safe = "inspect what the promotion will post first (`fa draft show <name> --json`); every planned intent is re-admitted against current trunk and posts in one batch"

[[dangerous]]
verb = "capability"
subcommand = "revoke"
condition = "always"
safe = "inspect the target capability's commitment first (`fa capabilities --json`); a revoked capability is never reinstated"

# What an agent usually runs next after an event (plan Appendix D
# `next_actions`): every listed event's lines carry these, in order. The
# commands omit --book; run them with the same --book (or FA_BOOK).

[[next_action]]
after = "triage"
command = "fa capabilities --json"
why = "every verb, exit code and dangerous operation this build knows"

[[next_action]]
after = "book_created"
command = "fa chart import <chart.json> --json"
why = "a new book has no accounts; install the chart"

[[next_action]]

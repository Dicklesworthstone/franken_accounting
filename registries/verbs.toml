doc = "Approved fixed-entry monthly schedules over committed time evidence: prepare, activate, inspect and cancel. On demand; current read/post and independent Human approval govern activation."

[[mcp.tool]]
cluster = "fa.schedule"
name = "recurring"
verb = "schedule"
subcommands = ["recurring"]
positionals = ["action", "name?"]
flags = ["--template", "--every-months", "--month-end", "--end", "--plan", "--approval", "--reason"]
switches = ["--dry-run"]
stdin_property = "template"
stdin_kind = "object"
stdin_via = "--template"
required = ["action"]
dont = ["Use action create with name, inline template, explicit every_months and month_end, and dry_run:true to prepare. Save the returned complete bytes and obtain independent Human approval of proposal_digest. Then create with the same name, plan set to that hex string and approval references; omit template and cadence inputs.", "Use action list for read-only inspection, or cancel with name and reason to journal cancellation. Plan host paths are refused over MCP; only complete inline hex is accepted. Authority is fixed at launch; Agent-profile activation is unavailable.", "The plan does not pre-admit future periods. Each occurrence uses the current creator capability and normal posting laws; only the daemon's committed, corroborated TimeEvidence drives execution."]
mistakes = ["Rebuilding sealed templates after approval, silently choosing a month-end policy, or supplying an ambient today value.", "Expecting cancellation to remove already committed entries."]

[[mcp.tool]]
cluster = "fa.subledger"
name = "detail"
verb = "subledger"
subcommands = ["detail"]
positionals = []
flags = ["--input"]
switches = []
stdin_property = "detail"
stdin_kind = "object"
stdin_via = "--input"
required = ["--input"]
dont = ["Supply feed, batch_key, effective_date and complete rows inline. Every row has unique source_digest, account, debit|credit side and exact amount; entity and party are optional codes. Include counterpart rows explicitly. Retain the returned bytes as Workpaper evidence and obtain an independent Reviewed attestation before posting.", "Canonicalization does not upload evidence, approve it, or post a summary; source digests remain assertions about the source system."]
mistakes = ["Supplying an amount as a JSON number, duplicating a source digest, or omitting counterpart effects."]

[[mcp.tool]]
cluster = "fa.subledger"
name = "feed"
verb = "subledger"
subcommands = ["feed"]
positionals = []
flags = ["--document", "--date", "--key", "--description"]
switches = ["--dry-run"]
required = ["--document", "--date", "--key"]
dont = ["Name a retained independently reviewed Workpaper containing canonical external detail. Its complete gross summary is independently checked inside the posting transaction. Use dry_run:true to receive an authenticated PostPlan.", "Each feed/batch_key can be consumed once regardless of posting idempotency key; after an uncertain commit retry the unchanged request or original plan."]
mistakes = ["Trying to fix a mismatch with a balancing plug, changing the declared effective date, or treating an uploader's own review as independent."]

[[mcp.tool]]
cluster = "fa.subledger"
name = "verify_feed"
verb = "subledger"
subcommands = ["verify-feed"]
positionals = ["entry"]
flags = ["--as-known-at"]
switches = []
required = ["entry"]
dont = ["Name the committed summary entry; the original source and independent review are checked at its publication prefix. A later review cannot repair a deficient original entry."]
mistakes = ["Treating the source-summary tie-out as proof that the upstream system supplied every transaction."]

[[bound]]
verbs = ["schedule"]
subcommands = ["recurring"]
ops = ["read"]

[[bound]]
verbs = ["subledger"]
subcommands = ["detail", "verify-feed"]
ops = ["read"]

[[bound]]
verbs = ["subledger"]
subcommands = ["feed"]
ops = ["read", "post"]

[[event]]
name = "external_feed_reconciled"
book = true
doc = "All reviewed batches and authenticated reversal descendants of one external feed through an explicit effective cutoff at one recorded prefix, compared with all activity of its control account and the independent stock trial balance. Gross sides and pending columns stay separate. Unattributed legs are explicit even when their net is zero; reconciled is false when control activity lacks source coverage. This is mechanical source-to-ledger reconciliation, not upstream completeness or exclusive control-account designation. The envelope certificate identifies the retained report when requested."
fields = ["feed:string", "control_account:hex", "known_at:seq", "effective_through:date", "batches:[external_feed_batch]", "contributions:[external_feed_contribution]", "unattributed:[external_feed_leg]", "rows:[external_feed_row]", "totals:[external_feed_total]", "reconciled:bool"]

[[shape]]
name = "external_feed_batch"
doc = "The original matched summary and reviewed source document."
fields = ["entry:hex", "entry_digest:hex", "recorded_at:seq", "batch_key:string", "document_oid:hex", "review:hex", "detail_rows:int"]

[[shape]]
name = "external_feed_contribution"
doc = "A feed summary or an authenticated reversal descendant contributing at this coordinate."
fields = ["entry:hex", "entry_digest:hex", "recorded_at:seq", "effective_date:date", "source:hex", "source_digest:hex", "reversed:bool"]

[[shape]]
name = "external_feed_leg"
doc = "A control-account leg not attributable to the named feed, with original entry and ordinal."
fields = ["entry:hex", "entry_digest:hex", "ordinal:int", "unit_id:int", "side:string", "amount:amount", "dimension_set:[batch_plan_dimension]", "pending:bool"]

[[shape]]
name = "external_feed_row"
doc = "Exact gross source and control columns for one native unit and dimension set."
fields = ["unit_id:int", "dimension_set:[batch_plan_dimension]", "detail_debits:amount", "detail_credits:amount", "control_debits:amount", "control_credits:amount", "pending_debits:amount", "pending_credits:amount"]

[[shape]]
name = "external_feed_total"
doc = "Unit-level source and control sums, independently compared with the stock trial balance including pending holds."
fields = ["unit_id:int", "detail_debits:amount", "detail_credits:amount", "control_debits:amount", "control_credits:amount", "pending_debits:amount", "pending_credits:amount", "register_debits:amount", "register_credits:amount", "register_debits_pending:amount", "register_credits_pending:amount"]

[[mcp.tool]]
cluster = "fa.audit"
name = "external_feed"
verb = "subledger"
subcommands = ["reconcile-feed"]
positionals = ["feed"]
flags = ["--control", "--as-of", "--as-known-at"]
switches = ["--certify"]
required = ["feed", "--control", "--as-of"]
dont = ["Choose the feed, control account and effective cutoff explicitly. The whole-book prefix is read before projecting this report, so current whole-book read authority is required; certify also requires produce.", "Keep the returned external-feed-reconciliation request separately when replaying or checking certificate status. Unmatched legs remain discrepancies even when debit and credit net to zero.", "A reconciled result proves the supplied reviewed feed ties to this control account at this coordinate; it does not prove upstream transaction completeness."]
mistakes = ["Omitting the effective cutoff, supplying an instant instead of a recorded sequence, or attempting to sum different native units."]

[[bound]]
verbs = ["subledger"]
subcommands = ["reconcile-feed"]
when_any = ["--certify", "--certificate-out"]
ops = ["read", "produce"]
reach = "judged"

[[bound]]
verbs = ["subledger"]
subcommands = ["reconcile-feed"]
ops = ["read"]
reach = "judged"

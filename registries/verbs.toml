stdin_property = "intent"
stdin_kind = "object"
stdin_via = "--intent"
required = []
dont = ["Don't void a hold to tidy up: `disposition: \"voids\"` releases it for good. dry_run previews a void without releasing it; committing the void remains unavailable through MCP until separate confirmation exists, and a plan cannot replace that exchange. `posts` draws legs from the hold.", "Don't draw a leg the hold does not have: each resolving leg is the same account and side as one hold leg, at most its reserved amount."]

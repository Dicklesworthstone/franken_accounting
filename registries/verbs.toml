[[verb]]
name = "produce"
summary = "Produce documents in a matter (plan §13.2, Appendix B Produce): each document the matter has not produced receives the next Bates numbers, journaled by one ProductionControl record, a document it produced keeps its range, and the volume is written into a new directory: Concordance DAT and Opticon OPT load files and each fully readable document's native."
writes = true
subcommands = []
flags = ["--matter", "--document", "--out", "--withhold", "--privilege", "--volume", "--key", "--date", "--state", "--account", "--from", "--to", "--entry", "--balance", "--grant"]
switches = ["--bundle", "--inline-documents"]
events = ["production_recorded"]
exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["produce --matter <matter> --document <oid>[:pages[:designation]]... --out <new-dir> [--withhold <oid>]... [--privilege <claims.json>] [--volume VOL001] [--key K] [--date YYYY-MM-DD]   (needs read and produce; documents are numbered in argument order; pages default to 1 and the designation to none (none, confidential, aeo, highly-confidential), both only for a document the matter has not produced: for a produced one they must be absent or equal to its range (FA-REF-171))", "The volume is <out>/<VOLUME>.dat, <out>/<VOLUME>.opt and <out>/NATIVES/<BEGBATES><ext>. A document the capability reads only through its redacted view is listed REDACTED with its contract and ships no native. The directory must not exist; it is checked before anything is journaled. The default key is the request itself, so the identical command returns the recorded production (and writes the same volume into a new --out); a production that numbers nothing new writes no record.", "The volume also carries <out>/PRIVILEGE_LOG.md: a row for each produced document whose redacted view withholds bytes, and one for each --withhold document (held by the book, never produced, numbered by no Bates range). --privilege is a JSON array of claims, [{\"document\": <oid>, \"date\": \"YYYY-MM-DD\", \"author\": ..., \"recipients\": [...], \"description\": ..., \"basis\": ...}]; every withheld document needs one, a claim may name only a withheld or redacted document, and a redacted row without a claim states no date (UNSPECIFIED). Claims are checked before anything is journaled.", "produce --matter <matter> --bundle [--state <oid>|latest] [--account <code> --from YYYY-MM-DD --to YYYY-MM-DD | --entry <vid>...] [--balance <code>:<UNIT>[:YYYY-MM-DD]]... [--inline-documents] --out <new-dir> [--withhold <oid>]... [--privilege <claims.json>]   (Appendix B Produce: an evidence bundle over the scope, exactly as fa bundle produce makes it, against a recorded checkpoint; the documents its in-scope entries cite are numbered in journal order, less any --withhold; the volume adds <VOLUME>.fab and its signed <VOLUME>.receipt (fa-verify bundle checks both offline), <VOLUME>.xml (EDRM XML, when the matter's profile names edrm or both: it binds the bundle digest) and FRE902_DECLARATION.md, FRE902_VERIFICATION.md and FRE902_NOTICE.md over the journaled ranges. The default key is the bundle digest, so the identical production retries exactly. A withheld document's bytes never ride the bundle: --inline-documents with a withheld cited document is refused.)", "No-claim boundary: the volume proves the journaled Bates ranges, the documents' public commitments and (with --bundle) the bundle against its checkpoint; a privilege row records the producer's claim, not the privilege, and the FRE 902 package states technical predicates: admissibility is counsel's call."]
example = "fa produce --matter SEC-v-Acme --document <oid>:12:confidential --document <oid> --out ./prod-001 --book ./books/myco --json"

[[verb]]
name = "subledger"
summary = "Native receivable/payable subledgers (plan §5.6): designate one control leaf whose legs must name parties, inspect its journaled definition, and reconcile party detail with the control account at an explicit coordinate."
writes = true
subcommands = ["add", "list", "show", "verify", "detail", "feed", "verify-feed", "reconcile-feed"]
flags = ["--input", "--out", "--document", "--description", "--plan-out", "--control", "--kind", "--name", "--date", "--key", "--as-of", "--as-known-at", "--certificate-out"]
switches = ["--dry-run", "--certify"]
events = ["subledger_recorded", "subledgers", "subledger_reconciled", "external_subledger_detail", "external_subledger_reconciled", "external_feed_reconciled", "report_certificate", "posted", "recorded", "plan"]
exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["subledger reconcile-feed <feed> --control <account> --as-of YYYY-MM-DD [--as-known-at HEAD|<seq>] [--certify | --certificate-out <new-file>]   (all reviewed source batches and exact reversal descendants for the feed, compared by unit and dimensions against every control-account posting and an independent stock trial balance. Gross debit/credit and pending columns remain separate; unmatched legs are cited even when they net to zero. Certification retains the full historical reconciliation; replay and status require its separately retained external-feed-reconciliation --expect request.)", "subledger detail --input <batch.json|-> [--out <new-file>]   (canonical detail Workpaper bytes; JSON has feed, batch_key, effective_date and rows: each source_digest is unique nonzero 64-hex, account is a GL code, side is debit|credit, amount is an exact unit-bearing string, entity and party are optional codes. Include every counterpart explicitly. Rows are sorted by source digest without deduplication; maximum 128 rows, 32 summary legs and 8192 canonical bytes.)", "Retain those bytes with fa document add <detail-file> --kind Workpaper; an independent Human reviews the document with fa attest review <oid> --as <reviewer>. The source remains evidence rather than a second posting universe.", "subledger feed --document D:<oid> --date YYYY-MM-DD --key K [--description <text>] [--dry-run [--plan-out <new-file>]]   (derive every summary leg from retained independently reviewed detail, then run the ordinary posting kernel. Complete gross sides by account/unit/dimensions must match; no netting, implicit counterpart, FX, pending or settlement effects. Each feed/batch_key is consumed once across posting keys; unchanged retries remain idempotent. Saved plans commit with fa commit --plan.)", "subledger verify-feed <entry> [--as-known-at HEAD|<seq>]   (recompute the entry against its exact source and independent review at the original publication prefix, plus its immutable unique-batch guard. Later reviews or corrections never rewrite the original assertion.)", "subledger add <code> --control <account> --kind receivables|payables [--name <name>] [--date YYYY-MM-DD] [--key K]   (AR requires an Asset leaf, AP a Liability leaf; needs read and schema_change. Every existing control leg, including staged migration history, must already name a valid party. Registration journals one immutable definition and never adds a posting. The default key is subledger:<code>; an identical retry writes nothing.)", "subledger list [--as-known-at HEAD|<seq>|<RFC3339>]", "subledger show <code> [--as-known-at HEAD|<seq>|<RFC3339>]", "subledger verify <code> --as-of YYYY-MM-DD [--as-known-at HEAD|<seq>|<RFC3339>]   (literal native-unit journal fold by party, compared with an independent control-account trial balance; posted debits/credits and pending debits/credits remain separate. Reversals and reservation releases keep their original party attribution. Reads require whole-book read scope; unsupported scoped requests refuse before data is observed.)", "Native reconciliation and matched external-feed reconciliation are read-only folds. verify-feed verifies one reviewed source batch and its summary; reconcile-feed compares all matching batches with the complete selected control account. Neither asserts source-system completeness or reserves a whole control account exclusively for external feeds."]
example = "fa subledger verify AR --as-of 2026-03-31 --book ./books/myco --json"

[[verb]]
name = "party"
summary = "REA parties (plan §4.1, §4.5): record a party (customer, vendor, employee, bank, related entity, beneficial owner, regulator, counterparty), relate two parties by a registered basis over a valid-time interval, bind another system's identifier to a party, legal entity or instrument, list them, or compute one party's effective ownership of another on a day."
writes = true
subcommands = ["add", "relate", "bind", "identifiers", "ownership", "list"]
flags = ["--key", "--date", "--kind", "--basis", "--valid-from", "--valid-to", "--pct", "--external-id", "--identifier", "--as-of", "--max-depth"]
switches = ["--clear"]
events = ["rea_recorded", "effective_ownership", "parties"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["party identifiers <code> --identifier <name>=<value>... --key <change-id>   (replaces the party's identifier set, for example its bank routing and account numbers; values are sealed with the book's key and never echoed; --clear removes every identifier; --key names the change and is required; needs schema_change; host-only over MCP: plan §14.4 treats a bank-detail change as the business-email-compromise vector)", "party bind <code|vertex id> --external-id <system>:<id> [--key K]   (binds another system's identifier to a party, legal entity or instrument; the id is sealed with the book's key; one (system, id) names one vertex; a code that names more than one party, legal entity or instrument is refused, so name it by vertex id; a malformed id is not echoed; the default key is bind:<code>:<system>)", "party add <party.json|->   ({\"code\": \"V-17\", \"kind\": \"Vendor\", \"name\": \"Acme Supplies\", \"identifiers\": {\"ein\": \"12-3456789\"}, \"external_ids\": [{\"system\": \"qbo\", \"id\": \"55\"}]}; name, identifiers and external ids are sealed with the book's key)", "party relate <from> <to> --kind owns|controls|related --basis <code> --valid-from YYYY-MM-DD [--valid-to YYYY-MM-DD] [--pct <num>/<den>]   (an OWNS, CONTROLS or RELATED_TO edge under a basis in relationship_bases.toml; owns needs an exact --pct; from and to are party or legal-entity codes or vids)", "party ownership <owner> <target> --as-of YYYY-MM-DD [--max-depth 1..=16]   (the owner's effective stake in the target on that day: the exact sum over simple OWNS paths of up to --max-depth edges, default 8, of the product of their stakes, from relationships whose valid time covers the day; an exact num/den, 0/1 when no path reaches; needs read)", "party list", "add and relate are journaled SchemaChange controls under schema_change authority. The default key is party:<code>, or relationship:<from>:<to>:<kind>:<basis>:<valid-from>, so an exact retry returns the recorded control. Parties are what fa event record --participant and the related-party procedures name."]
example = "fa party add vendor.json --book ./books/myco --json"

[[verb]]
name = "instrument"
summary = "REA instruments (plan §4.1): record a bank account, card, loan, security or other instrument held at a party and mirrored by a GL leaf account, or list them."
writes = true
subcommands = ["add", "list"]
flags = ["--key", "--date"]

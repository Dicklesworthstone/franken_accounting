# verbs.toml — the single verb registry (plan §15.2–§15.3, Appendix D).
#
# One source for the `fa` CLI's verbs, subcommands, aliases, per-verb flags,
# help text, exit codes, and the robot-mode event schemas that
# `fa robot-docs schema` prints. The daemon (fa-i8j) and fa-mcp (fa-xex) are
# driven by and checked against this file.
#
# Consumer: fa-cli (dispatch, flag parsing and correction, `--help`,
# `fa capabilities`, `fa robot-docs schema`). Gate: the fa-cli parity tests
# fail when a registered verb or subcommand has no handler, a handler has no
# row, an emitted `--json` line does not match its event schema, or a
# declared event is never emitted by the binary tests. Retire: never (it is
# the contract); rows are additive, a removal is a breaking change.
#
# Field types: string · text (free-form, may span lines) · int · seq (a
# CommitSeq, ≥ 0) · bool · amount ("1500.00 USD": exact decimal, a space, the
# unit code) · date (YYYY-MM-DD) · hex (lowercase hexadecimal) · object (a map
# with data-dependent keys) · any · <shape> (an object with exactly the
# shape's fields) · [T] (an array of T) · T? (T or null). Every field is
# always present; absence is spelled null.
#
# Envelope (plan Appendix D, bead fa-12x): every robot-mode line carries the
# `[envelope]` fields beside its event's own fields, except the daemon's wire
# frames. An event marked `book = true` is always about one book, so its
# `coordinate` is never null; the robot-schema fixture pin
# (registries/robot_schema/<version>.jsonl) holds `fa robot-docs schema --json`
# byte for byte.

schema_version = 1

[envelope]
discriminator = "event"
version = 1
payload = "data"
fields = ["v:int", "book:hex?", "coordinate:coordinate?", "certificate:hex?", "authority:authority", "warnings:[string]", "next_actions:[next_action]"]
frames = ["fad_request", "fad_response"]
description = "Robot mode (--json), plan Appendix D: stdout carries one JSON object per line, {v, event, book, coordinate, data, certificate, authority, warnings, next_actions}. `event` names the schema of `data`; `v` is the envelope version. `book` and `coordinate` (branch, known_at, effective) are non-null on book events and may be null before a book opens. `certificate` is the replay certificate oid for certified reports and replay, otherwise null. Post plans identify their canonical artifact and authenticated certificate with data.plan_digest and data.certificate_digest; these are public digests, not native object-store OIDs. `authority` declares embedded-owner, mcp-launch-config or issued-token; MCP names its fixed principal, bounded launch template and exact ops; issued-token names a holder's journaled capability (fa --token, fa-mcp --token) and its exact ops, which the kernel admits only against its journaled issuance; owner ops are null because they are self-issued per command. Launch configuration does not authenticate the operator. `warnings` records non-refusal diagnostics. `next_actions` names follow-up commands and why; owner CLI calls use the same book, while MCP keeps its launch-bound book. Keys are sorted; amounts are exact strings with units, sequences are integers and dates are YYYY-MM-DD. Daemon wire frames are flat protocol objects without this envelope. stderr carries diagnostics; every nonzero command exit emits one error event containing class, exit and refusal_id."

[global]
flags = ["--book", "--keys", "--as", "--via", "--format", "--token"]
switches = ["--json", "--help", "--version", "--no-color", "--yes"]
events = ["version", "triage", "help", "error"]
# A mistyped verb, subcommand or flag within this edit distance gets a
# "did you mean"; correction only ever suggests, it never runs the guess.
correction_distance = 1
# The spellings agents try first for registered flags (plan §15.3: `--robot`
# anywhere, `--for-period`, `--effective-at`), rewritten to the flag before
# parsing: registered synonyms, never guessed corrections.
flag_aliases = ["--robot=--json", "--for-period=--period", "--effective-at=--as-of"]
usage = "--book <dir> (or FA_BOOK) · --keys <file> (default <dir>/book.keys) · --json · --format json|toon|text · --as <principal> (default operator) · --token <file> (act as the holder of an issued capability token instead of --as/--grant: the session is bound to its journaled capability, directly or through the book's fad) · --via fad|direct (default: through the book's fad when one holds its writer lease) · --yes (confirm an operation that cannot be undone; `fa capabilities --json` lists them) · --no-color (also NO_COLOR, CI, TERM=dumb, or stdout not a terminal) · --help (also `fa <verb> --help`) · aliases: --robot = --json, --for-period = --period, --effective-at = --as-of · a one-edit flag typo on a read-only command runs corrected with a warning; on a writing command it is a usage error naming the correction"

# The fad daemon (plan §15.3, Appendix D, bead fa-i8j). One fad per book
# directory holds the book's writer lease (an OS lock on <dir>/<lease>, so a
# crashed daemon releases it) and serves `fa` over <dir>/<socket>. A frame is
# a 4-byte big-endian length then that many bytes of canonical JSON (sorted
# keys, integers only); the first frame on a connection is a fad_request, and
# every request gets exactly one fad_response. Every `fa` command that opens
# the book directly holds the same lease for its duration, so there is one
# writer per book at a time.

[daemon]
binary = "fad"
protocol = 1
socket = "fad.sock"
lease = "fad.lease"
max_frame_bytes = 67108864
idle_timeout_ms = 30000
# Bound the complete client call, including queued work and report execution.
# This is not the server's incomplete-frame idle timeout. A client timeout
# never retries the request or claims that an accepted write was rolled back.
request_timeout_ms = 300000
tick_ns = 1000000000
sweep_batch = 64
clock_drift_ns = 250000000
verbs = ["serve", "status", "stop"]
flags = ["--book", "--keys", "--files-root", "--register-period"]
switches = ["--json", "--help", "--bootstrap-system"]
events = ["fad_request", "fad_response", "fad_serving", "fad_status", "fad_stopped"]
usage = ["fad serve --book <dir> [--keys <file>] [--files-root <dir>] [--bootstrap-system] [--register-period <code> ...] [--json]   (holds the writer lease and serves until `fad stop`)", "--files-root <dir> confines host file-reading and file-writing requests served over the daemon socket to an existing non-symlink directory; without it, file-reading and file-writing requests over fad are refused.", "--bootstrap-system opts the local book-key holder into daemon TimeEvidence and one bounded expiry batch plus one reversal batch per cycle. This is trusted local bootstrap authority, not journaled capability issuance. First/restart and uncorroborated clock observations never sweep. Batch sizes bound effects; candidate discovery still scans the book.", "--register-period selects 1..=64 distinct exact period codes at local launch and does not require --bootstrap-system. Derived-cache maintenance gets no System authority by itself; it attempts one period per cycle in round-robin order through the native maintainer. Adding --bootstrap-system separately enables TimeEvidence plus bounded expiry/reversal effects. Maintenance does not silently repair drift, change report semantics or certify a checkpoint. Unknown periods remain visible as per-period errors.", "fad status --book <dir> [--json]", "fad stop --book <dir> [--json]"]

# ---------------------------------------------------------------------------
# Verbs
# ---------------------------------------------------------------------------

[[verb]]
name = "book"
summary = "Create a book directory (store + key file), describe one, or fork its receivership."
writes = true
subcommands = ["create", "info", "fork"]
flags = ["--name", "--base-unit", "--calendar", "--year-start-month", "--adjustment-periods", "--time-zone", "--opening-date", "--entity", "--periods", "--authority", "--at", "--date", "--description"]
switches = []
events = ["book_created", "book", "receivership_forked"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["book create --name \"My Co\" [--base-unit USD] [--calendar monthly|4-4-5|4-5-4|5-4-4|52-53[:last|nearest:<weekday>[:<month>]]] [--year-start-month 1] [--adjustment-periods 1] [--time-zone UTC] [--opening-date YYYY-MM-DD] [--entity <code>[:<name>][:<functional_unit>]]...", "--time-zone UTC records the explicit civil-day policy required by scheduled reversals. Omitting it leaves the policy unset; the machine's local zone is never assumed.", "book create --name \"My Co\" --calendar custom --periods <periods.json|-> [--adjustment-periods 1] [--opening-date YYYY-MM-DD]   (plan §7.2 Custom: {\"years\":[{\"fiscal_year\":2026,\"periods\":[{\"start\":\"2026-01-04\",\"end\":\"2026-01-31\"},...]}]}, inclusive days; consecutive, contiguous fiscal years of 1..=53 contiguous periods each; only the declared years exist, and fa period create refuses any other)", "book info", "book fork receivership --authority <order-oid> [--at HEAD|<seq>] [--date YYYY-MM-DD] [--description <text>]   (plan §15.6, the receiver takes over; needs receivership, hold and post: a book-scope legal hold pins every entry, document and party recorded through the appointment sequence on the order's authority, and the `receivership` scenario forks at that sequence with the order as its assumption document; the estate posts with --scenario receivership and reads with --branch scenario:receivership until substrate branches land. Repeating the fork is its recorded outcome; another appointment is refused)"]
example = "fa book create --book ./books/myco --name \"My Co\" --json"

[[verb]]
name = "chart"
summary = "Install a chart of accounts as one journaled schema effect (from a file or an embedded template), list it, or list the templates; assign the account roles Lantern selects populations by, and list them."
writes = true
subcommands = ["import", "list", "show", "templates", "open", "close", "promote", "role", "roles"]
flags = ["--date", "--key", "--template", "--opened", "--closed", "--on", "--as-known-at"]
switches = ["--remove"]
events = ["chart_installed", "accounts", "chart_account", "chart_templates", "account_lifecycle", "account_role_recorded", "account_roles"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["chart import (<chart.json> | --template <name>) [--date YYYY-MM-DD] [--key K]   (an account may carry lower_bound/upper_bound: \"0.00\" in its unit and normal-balance sign; \"unit\": \"base\" is the book's base unit)", "chart list", "chart show <code>   (one account: its row, normal side, parent and children codes, opened/closed/promoted dates and the commit that created it)", "chart templates   (us-gaap-smb, ifrs-sme, us-bank-call-report: starting points, not GAAP, IFRS or regulatory advice)", "chart open <account.json|-> --opened YYYY-MM-DD [--closed YYYY-MM-DD] [--key K]   (one account object in the chart format, e.g. {\"code\":\"6100\",\"name\":\"Office supplies\",\"type\":\"Expense\",\"unit\":\"USD\"}; it accepts legs dated in [opened, closed))", "chart close <code> --on YYYY-MM-DD [--key K]   (the account must have a zero balance in every unit; nothing posts to it on or after that day, and its history stays)", "chart promote <code> --on YYYY-MM-DD [--key K]   (the leaf becomes a summary account from that day; new legs go to its children)", "open, close and promote are journaled SchemaChange controls under schema_change authority; no date defaults to today. The default key is account-open:<code>, or account-<action>:<code>:<day>, so an exact retry returns the recorded control.", "chart role <account> <role> [--remove] [--key K]   (assign a role registered in registries/account_roles.toml, or remove it with --remove; needs read and schema_change. The account must be a posting leaf of a type the role admits. An account that already holds, or already lacks, the role writes nothing. The default key is role:<account>:<role>:<n>, n counting the earlier changes of that role on that account)", "chart roles [--as-known-at HEAD|<seq>|<RFC3339>]   (every registered role, the procedures that select by it, and the accounts holding it; a chart import journals each account's \"roles\": [\"suspense\"] the same way)"]
example = "fa chart import chart.json --book ./books/myco --json"

[[verb]]
name = "access"
summary = "Who read what (plan §9.7, §14.5): every command a read-only Human bound session runs (a capability whose ops stay within read, produce and verify, as the Auditor, Regulator, Investigator and Production templates are) commits an AccessEvent before it observes the book; access log lists them. Agent sessions are not recorded."
writes = false
subcommands = ["log"]
flags = ["--since", "--reader"]
switches = []
events = ["access_log"]
exits = [0, 2, 3, 4, 5, 7]
usage = ["access log [--since <seq>] [--reader <principal name>]   (the AccessEvents recorded after --since, in recording order: principal, capability commitment and ops, the command, the digest of its arguments, the head it observed and the sequence it was recorded at)", "A record is committed before the read it describes observes the book, so a delivered answer always has one; a command that then fails leaves a record with nothing delivered. Reading the log under such a session records that read too. Embedded-owner, Agent and writing sessions are not recorded by this slice."]
example = "fa access log --since 0 --json"

[[verb]]
name = "law"
summary = "The registered laws this build embeds (plan §6.2–§6.4): rounding, allocation, conversion, FX, lot and tracing laws by family, id, name and version, with every field of their registry row. Reads no book."
writes = false
subcommands = ["list", "show"]
flags = ["--family"]
switches = []
events = ["laws", "law"]
exits = [0, 2]
usage = ["law list [--family rounding|allocation|conversion|fx|lot|tracing]", "law show <name> [--family <family>]   (a name registered in several families needs --family)", "Every rounding, allocation and FX conversion names a registered law (doctrine 4); these are the names an intent may use."]
example = "fa law show HalfEven --json"

[[verb]]
name = "unit"
summary = "The unit versions this build embeds (plan §4.4): code, version, immutable scale, kind, ISO 4217 number and default rounding law. Reads no book."
writes = false
subcommands = ["list"]
flags = []
switches = []
events = ["units"]
exits = [0, 2]
usage = ["unit list   (a precision change is a new unit version, never an edit of an existing row)"]
example = "fa unit list --json"

[[verb]]
name = "period"
summary = "Create a fiscal year's periods, list them, or move one along the period state machine (journaled)."
writes = true
subcommands = ["create", "list", "open", "soft-close", "close", "lock", "reopen"]
flags = ["--fiscal-year", "--to", "--reason", "--key", "--plan-out", "--plan", "--approval", "--grant"]
switches = ["--dry-run"]
events = ["periods_created", "periods", "period_transitioned", "recorded", "period_planned", "period_plan"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["period create --fiscal-year N", "period list", "period open|soft-close|close|lock|reopen <code> [--to open|soft-closed] [--reason <name|code>] [--key K]   (--reason is required for close, lock and reopen: Scheduled, Reclose or AuditComplete; reopen gives LateTransactions, AuditAdjustment, ErrorCorrection or Restatement; open and soft-close default to Scheduled. The period dates the control: open on its first day, every other transition on its last day)", "period <transition> <code> --dry-run   (returns the sealed proposal, its proposal_digest and canonical bytes as hex; writes no file or book data; commit authority and approvals are checked separately)", "period lock|reopen <code> --plan-out <file>   (owner CLI only: writes the planned proposal and prints its proposal_digest; commits nothing)", "period lock|reopen <code> --plan <file|-> --approval <vid>...   (owner CLI commits exactly the planned proposal, citing approvals of its digest; stdin accepts binary or complete bytes hex)"]
example = "fa period open FY2026-P03 --book ./books/myco --json"


[[verb]]
name = "calendar"
summary = "The book's fiscal calendar (plan §7.2), as journaled at genesis, and the periods it generates for a fiscal year, each marked created or not. Reads only; fa period create records a year's periods."
writes = false
subcommands = ["show", "periods"]
flags = ["--fiscal-year"]
switches = []
events = ["calendar", "calendar_periods"]
exits = [0, 2, 4, 5, 7]
usage = ["calendar show   (id, kind, fiscal-year start month or week pattern and year-end rule, adjustment periods)", "calendar periods --fiscal-year N   (every period the calendar generates for FY N, with its kind and civil bounds, and whether fa period create has recorded it)"]
example = "fa calendar periods --fiscal-year 2026 --book ./books/myco --json"

[[verb]]
name = "close"
summary = "Rehearse an existing draft atomically with exact balance changes and a replayable certificate, or journal routes and prepare an incremental year-end close for independent approval."
writes = true
subcommands = ["map","routes","year-end","dry-run"]
flags = ["--route","--effective-from","--as-of","--as-known-at","--fiscal-year","--period","--key","--description","--evidence","--approval","--review","--review-out","--digest","--plan-out","--grant","--draft","--certificate-out"]
switches = ["--dry-run","--review-only","--certify"]
events = ["closing_routes_recorded","closing_routes","closing_reviewed","closing_noop","posted","recorded","plan","draft_diff","report_certificate"]
exits = [0,2,3,4,5,6,7,8]
usage = ["close dry-run --period <code> --draft <name> [--certify | --certificate-out <new-file>]   (rehearse the exact retained plans as one atomic scratch batch; show stock trial-balance changes, posted and pending separately; real trunk and draft state remain unchanged)", "Draft rehearsal preserves original planner capabilities, approvals and publication coordinates. CLI review and retained-locator replay require current whole-book read authority. --certify retains a complete replayable review under read and produce; fa replay C:<oid> reproduces its selected source prefix after later plans, promotion or discard. This supplied-draft review does not generate close tasks or issue statements; unsupported draft member classes refuse.", "close map --route <nominal-code>:<equity-code>... --effective-from YYYY-MM-DD --key K [--description TEXT]   (journal a complete routing version; Revenue and Expense posting leaves route to Equity posting leaves)","close routes --as-of YYYY-MM-DD [--as-known-at <sequence>]","close year-end --fiscal-year N --period FY<N>-CLOSE --key K [--description TEXT] [--evidence <oid>]... [--review-only | --review-out <new-file> | --dry-run [--plan-out <new-file>] | --yes]","close year-end --review <file|-|hex> --digest <review_digest> [--approval <vid>]... [--dry-run [--plan-out <new-file>] | --yes]","A review preserves the exact sealed PostIntent and intrinsic source basis; approve its proposal_digest with fa approve --proposal <digest> --as <independent-approver>. Then restore the review and cite that approval. Relevant journal or routing changes require a new review; approval publications alone do not.","A native --dry-run plan writes nothing. Commit its exact bytes with fa commit --plan <file|-> --grant read --grant close and the same --as/--grant. A first close zeros current fiscal-year nominal balances in both native units and functional currency; a reclose includes prior Closing legs and transfers only the residual. A zero native balance with a nonzero functional balance still needs a close; a residual of zero in both bases publishes no entry.","Foreign-currency closing preserves the exact retained functional amounts under YearEndCloseCarrying, without selecting a new rate. Review residuals show native net and base_net; each proposed valued leg shows base_amount. The Equity destination must accept the native units being transferred. Unvalued foreign activity, general dimensions and balance-limited accounts refuse. Undimensioned and legal-entity balances are supported. Closed periods retain their independent approval requirement; Locked case-bound reclose and the full CloseTask DAG remain unavailable."]
example = "fa close year-end --fiscal-year 2026 --period FY2026-CLOSE --key close-2026 --review-only --book ./books/myco --json"

[[verb]]
name = "approve"
summary = "Record an approval of a planned proposal's digest or a reviewed allocation/settlement review artifact under the caller's capability (journaled; bound to the current security policy epoch)."
writes = true
subcommands = []
flags = ["--proposal", "--review", "--digest", "--grant"]
switches = []
events = ["approved"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["approve --proposal <proposal_digest> [--as <principal>] [--grant <op>]...   (the digest is printed by `fa period <t> <code> --plan-out <file>`; a second approver is a second invocation as another principal)", "approve --review <file|-|hex> --digest <review_digest> [--as <principal>] [--grant <op>]...   (verifies the review artifact's digest and records an approval of its sealed proposal_digest)"]
example = "fa approve --proposal <proposal_digest> --as controller --book ./books/myco --json"

[[verb]]
name = "capability"
summary = "Steward capability controls: issue a holder-bound capability, list or show the book's issued capabilities, and journal an irreversible revocation by commitment (plan §14.2)."
writes = true
subcommands = ["revoke", "issue", "list", "show"]
flags = ["--commitment", "--date", "--key", "--description", "--grant", "--holder", "--profile", "--op", "--ceiling", "--daily-total", "--expires-at", "--period", "--effective-through", "--known-at-most", "--redaction", "--account", "--branch", "--class", "--operator-kind", "--issuer-token", "--out"]
switches = ["--requires-dry-run", "--book-scope"]
events = ["capability_revoked", "capability_issued", "capabilities_issued", "capability_issued_detail"]
exits = [0, 2, 4, 5, 6, 7]
usage = ["capability revoke --commitment <64-hex> [--date YYYY-MM-DD] [--key K] [--description <text>] --as <principal> [--grant issue_capability] --yes", "capability issue --holder <principal> --profile agent|human --op <op>... [--ceiling \"1000.00 USD\"]... [--daily-total \"1000.00 USD\"]... [--expires-at <seq>] [--period <code>]... [--effective-through YYYY-MM-DD] [--known-at-most <seq>] --out <new-file> [--date YYYY-MM-DD] [--key K] --as <issuer> --grant issue_capability   (journals the holder-bound capability, then writes the holder's 0600 token: principal, capability and secret; the issued ops, units, per-leg ceilings, daily totals, scope caveats and expiry never widen the issuer's; --period, --effective-through and --known-at-most scope its reads and writes, refused before any query, never filtered)", "capability issue --issuer-token <existing-token-file> --holder <principal> --profile agent|human --op <op>... [--ceiling \"1000.00 USD\"]... [--daily-total \"1000.00 USD\"]... [--expires-at <seq>] [--period <code>]... [--effective-through YYYY-MM-DD] [--known-at-most <seq>] --out <new-file>   (uses the issued Human token holder and exact authority, with current Read and IssueCapability admission; descendants inherit the original shared daily root and cannot widen its limits. --as, --grant and launch-bound sessions cannot be combined with --issuer-token; the token must be an explicit file, never stdin)", "--daily-total bounds cumulative gross debits per native unit and committed UTC day across the original issuance and its descendants. Repeated limits tighten by minimum; descendants retain the original quota root. Posting requires an explicit UTC book calendar and corroborated retained TimeEvidence. A retry does not charge twice, and a reversal or release does not refund capacity. FA-REF-166 refuses a daily limit breach; FA-REF-167 refuses inconsistent usage history.", "capability list   (every capability this book issued, from the journal, with its revocation state, per-leg ceilings and daily quota lineage)", "capability show --commitment <64-hex>", "An issued token is admitted only against its journaled issuance (FA-REF-156 otherwise); launch fa-mcp with --token <file> to bind a session to it. Issuance and delegation remain operator acts; a launch-bound session cannot grant itself issue_capability."]
example = "fa capability revoke --commitment 0101010101010101010101010101010101010101010101010101010101010101 --as controller --grant issue_capability --yes --book ./books/myco --json"

[[verb]]
name = "draft"
summary = "Drafts (plan §15.2): an intent log an Agent can work in. Open a draft, plan intents into it (each rehearsed under every posting law), inspect it, discard it, or promote it: every planned intent posts to trunk in one batch, re-admitted against current trunk, when a principal holding approve who is not its owner promotes it."
writes = true
subcommands = ["new", "plan", "list", "show", "promote", "discard"]
flags = ["--intent", "--evidence", "--event", "--date", "--description", "--reason", "--grant"]
switches = []
events = ["draft_opened", "draft_planned", "drafts", "draft_detail", "draft_promoted", "draft_discarded"]
exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["draft new <name> [--description <text>] [--as <principal>]   (opens an intent log owned by --as; nothing in it is a trunk entry)", "draft plan <name> --intent <file.json|-> [--evidence <oid>]...   (rehearses the intent under every posting law and journals it into the draft; also: the same post, reverse, reserve or resolve command with --draft <name>)", "draft list", "draft show <name>   (the planned intents in promotion order, and the entries a promotion created)", "draft promote <name> --as <approver> [--grant approve] --yes   (a principal holding approve who is not the draft's owner: every planned intent posts in one batch, admitted again against current trunk; any refusal promotes nothing)", "draft discard <name> [--reason <text>]   (the owner, or a principal holding approve, closes the draft; nothing is deleted)"]
example = "fa draft new close-03 --as agent-7 --book ./books/myco --json"

[[verb]]
name = "scenario"
summary = "Scenarios (plan §15.2, §15.6.5): counterfactual intent logs over a fixed trunk prefix. Fork one at a trunk sequence (HEAD by default) with an optional counterfactual start date and assumption documents, run intents in it (each rehearsed on the scenario's materialization: a scratch replay of the trunk prefix plus its earlier intents, under every posting law), inspect it, diff it against trunk as known at the fork, or discard it. A scenario never posts to trunk and is never promoted."
writes = true
subcommands = ["fork", "run", "list", "show", "diff", "discard"]
flags = ["--at", "--from", "--evidence", "--event", "--intent", "--period", "--date", "--description", "--reason", "--grant", "--certificate-out"]
switches = ["--activity", "--certify"]
events = ["scenario_forked", "scenario_run", "scenarios", "scenario_detail", "scenario_diff", "scenario_discarded", "report_certificate"]
exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["scenario fork <name> [--at HEAD|<seq>] [--from YYYY-MM-DD] [--evidence <assumption-document-oid>]... [--description <text>] [--date YYYY-MM-DD]   (forks at a trunk sequence, HEAD by default; --from is where the counterfactual starts: every intent run in the scenario is effective on or after it; trunk history is never filtered)", "scenario run <name> --intent <file.json|-> [--evidence <oid>]...   (rehearses the intent on the scenario's materialization and journals it into the scenario; the planner's authority over the intent (its ops, ceilings and scope caveats) is admitted on trunk first, as for a dry run, and nothing is rehearsed for a refused intent; an identical retry returns its record even after a discard; also: fa post, invoice, bill, receipt or payment with --scenario <name>)", "scenario list", "scenario show <name>   (its fork, assumptions and intents in run order)", "scenario diff <name> --period <code>... [--activity] [--certify | --certificate-out <new-file>]   (per account and unit, exact: trunk as known at the fork sequence against the scenario's materialization; only changed rows, posted and pending columns apart; stock balances, or period movement with --activity. --certify retains a replayable certificate (read and produce): a native trial-balance certificate of trunk at the fork, plus the scenario body and exactly the intents it holds now; fa replay C:<oid> re-materializes those intents and reproduces the diff byte for byte, even after later intents run)", "scenario discard <name> [--reason <text>] [--date YYYY-MM-DD]   (the owner, or a principal holding approve, closes it; nothing is deleted)", "A scenario is materialized on every run and diff (plan §15.2 interim posture until substrate branches): the trunk prefix's accounting objects are replayed into a scratch book and every intent is posted again under every posting law. The diff binds the scenario body, its intent records, the fork sequence and the replay's SeqMap digest; --certify retains it as a replayable certificate. Reads select a scenario with --branch scenario:<name> (tb, statement, explain, open-items, gl), uncertified. Every check is on trunk and the replay is fixed at the fork: a document, period reopening or authority issued on trunk after the fork reaches only a scenario forked after it. The replay posts each intent under a Human embedded capability of its planner, so an Agent preparer's extra Human approver (a trunk SoD rule) is not re-applied there."]
example = "fa scenario fork but-for-breach --from 2025-07-01 --book ./books/myco --json"

[[verb]]
name = "branch"
summary = "Every branch of the book in one listing (plan §15.3): its drafts, by opening sequence, and its scenarios, by forking sequence, as draft list and scenario list show them."
writes = false
subcommands = ["list"]
flags = []
switches = []
events = ["branches"]
exits = [0, 2, 4, 5, 7]
usage = ["branch list   (drafts and scenarios; trunk is implicit. fa draft show <name> and fa scenario show <name> read one)"]

# verbs.toml — the single verb registry (plan §15.2–§15.3, Appendix D).
#
# One source for the `fa` CLI's verbs, subcommands, aliases, per-verb flags,
# help text, exit codes, and the robot-mode event schemas that
# `fa robot-docs schema` prints. The daemon (fa-i8j) and fa-mcp (fa-xex) are
# generated from and checked against this file when they land.
#
# Consumer: fa-cli (dispatch, flag parsing and correction, `--help`,
# `fa capabilities`, `fa robot-docs schema`). Gate: the fa-cli parity tests
# fail when a registered verb or subcommand has no handler, a handler has no
# row, an emitted `--json` line does not match its event schema, or a
# declared event is never emitted by the binary tests. Retire: never (it is
# the contract); rows are additive, a removal is a breaking change.
#
# Field types: string · text (free-form, may span lines) · int · seq (a
# CommitSeq, ≥ 0) · bool · amount ("1500.00 USD": exact decimal, a space, the
# unit code) · date (YYYY-MM-DD) · hex (lowercase hexadecimal) · object (a map
# with data-dependent keys) · any · <shape> (an object with exactly the
# shape's fields) · [T] (an array of T) · T? (T or null). Every field is
# always present; absence is spelled null.
#
# Envelope (plan Appendix D, bead fa-12x): every robot-mode line carries the
# `[envelope]` fields beside its event's own fields, except the daemon's wire
# frames. An event marked `book = true` is always about one book, so its
# `coordinate` is never null; the robot-schema fixture pin
# (registries/robot_schema/<version>.jsonl) holds `fa robot-docs schema --json`
# byte for byte.

schema_version = 1

[envelope]
discriminator = "event"
version = 1
payload = "data"
fields = ["v:int", "book:hex?", "coordinate:coordinate?", "certificate:hex?", "authority:authority", "warnings:[string]", "next_actions:[next_action]"]
frames = ["fad_request", "fad_response"]
description = "Robot mode (--json), plan Appendix D: stdout carries one JSON object per line, {v, event, book, coordinate, data, certificate, authority, warnings, next_actions}. `event` names the schema of `data`; `v` is the envelope version. `book` and `coordinate` (branch, known_at, effective) are non-null on book events and may be null before a book opens. `certificate` is the replay certificate oid for certified reports and replay, otherwise null. Post plans identify their canonical artifact and authenticated certificate with data.plan_digest and data.certificate_digest; these are public digests, not native object-store OIDs. `authority` declares embedded-owner or mcp-launch-config; MCP names its fixed principal, bounded launch template and exact ops, while owner ops are null because they are self-issued per command. Launch configuration does not authenticate the operator. `warnings` records non-refusal diagnostics. `next_actions` names follow-up commands and why; owner CLI calls use the same book, while MCP keeps its launch-bound book. Keys are sorted; amounts are exact strings with units, sequences are integers and dates are YYYY-MM-DD. Daemon wire frames are flat protocol objects without this envelope. stderr carries diagnostics; every nonzero command exit emits one error event containing class, exit and refusal_id."

[global]
flags = ["--book", "--keys", "--as", "--via"]
switches = ["--json", "--help", "--version", "--no-color", "--yes"]
events = ["version", "triage", "help", "error"]
# A mistyped verb, subcommand or flag within this edit distance gets a
# "did you mean"; correction only ever suggests, it never runs the guess.
correction_distance = 1
usage = "--book <dir> (or FA_BOOK) · --keys <file> (default <dir>/book.keys) · --json · --as <principal> (default operator) · --via fad|direct (default: through the book's fad when one holds its writer lease) · --yes (confirm an operation that cannot be undone; `fa capabilities --json` lists them) · --no-color (also NO_COLOR, CI, TERM=dumb, or stdout not a terminal) · --help (also `fa <verb> --help`)"

# The fad daemon (plan §15.3, Appendix D, bead fa-i8j). One fad per book
# directory holds the book's writer lease (an OS lock on <dir>/<lease>, so a
# crashed daemon releases it) and serves `fa` over <dir>/<socket>. A frame is
# a 4-byte big-endian length then that many bytes of canonical JSON (sorted
# keys, integers only); the first frame on a connection is a fad_request, and
# every request gets exactly one fad_response. Every `fa` command that opens
# the book directly holds the same lease for its duration, so there is one
# writer per book at a time.

[daemon]
binary = "fad"
protocol = 1
socket = "fad.sock"
lease = "fad.lease"
max_frame_bytes = 67108864
idle_timeout_ms = 30000
verbs = ["serve", "status", "stop"]
flags = ["--book", "--keys"]
switches = ["--json", "--help"]
events = ["fad_request", "fad_response", "fad_serving", "fad_status", "fad_stopped"]
usage = ["fad serve --book <dir> [--keys <file>] [--json]   (holds the writer lease and serves until `fad stop`)", "fad status --book <dir> [--json]", "fad stop --book <dir> [--json]"]

# ---------------------------------------------------------------------------
# Verbs
# ---------------------------------------------------------------------------

[[verb]]
name = "book"
summary = "Create a book directory (store + key file), or describe one."
writes = true
subcommands = ["create", "info"]
flags = ["--name", "--base-unit", "--calendar", "--year-start-month", "--adjustment-periods"]
switches = []
events = ["book_created", "book"]
exits = [0, 2, 4, 5]
usage = ["book create --name \"My Co\" [--base-unit USD] [--calendar monthly] [--year-start-month 1] [--adjustment-periods 1]", "book info"]
example = "fa book create --book ./books/myco --name \"My Co\" --json"

[[verb]]
name = "chart"
summary = "Install a chart of accounts as one journaled schema effect, or list it."
writes = true
subcommands = ["import", "list"]
flags = ["--date", "--key"]
switches = []
events = ["chart_installed", "accounts"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["chart import <chart.json> [--date YYYY-MM-DD] [--key K]   (an account may carry lower_bound/upper_bound: \"0.00\" in its unit and normal-balance sign)", "chart list"]
example = "fa chart import chart.json --book ./books/myco --json"

[[verb]]
name = "period"
summary = "Create a fiscal year's periods, list them, or move one along the period state machine (journaled)."
writes = true
subcommands = ["create", "list", "open", "soft-close", "close", "lock", "reopen"]
flags = ["--fiscal-year", "--to", "--reason", "--key", "--date", "--plan-out", "--plan", "--approval"]
switches = ["--dry-run"]
events = ["periods_created", "periods", "period_transitioned", "period_planned", "period_plan"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["period create --fiscal-year N", "period list", "period open|soft-close|close|lock|reopen <code> [--to open|soft-closed] [--reason N] [--key K] [--date YYYY-MM-DD]", "period <transition> <code> --dry-run   (returns the sealed proposal, its proposal_digest and canonical bytes as hex; writes no file or book data; commit authority and approvals are checked separately)", "period lock|reopen <code> --plan-out <file>   (owner CLI only: writes the planned proposal and prints its proposal_digest; commits nothing)", "period lock|reopen <code> --plan <file|-> --approval <vid>...   (owner CLI commits exactly the planned proposal, citing approvals of its digest; stdin accepts binary or complete bytes hex)"]
example = "fa period open FY2026-P03 --book ./books/myco --json"

[[verb]]
name = "approve"
summary = "Record an approval of a planned proposal's digest under the caller's capability (journaled; bound to the current security policy epoch)."
writes = true
subcommands = []
flags = ["--proposal", "--grant"]
switches = []
events = ["approved"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["approve --proposal <proposal_digest> [--as <principal>] [--grant <op>]...   (the digest is printed by `fa period <t> <code> --plan-out <file>`; a second approver is a second invocation as another principal)"]
example = "fa approve --proposal <proposal_digest> --as controller --book ./books/myco --json"

[[verb]]
name = "post"
summary = "Post one entry intent under the accounting laws (balance, period law, idempotency)."
writes = true
subcommands = []
flags = ["--intent", "--grant", "--evidence", "--balancing", "--plan-out"]
switches = ["--dry-run"]
events = ["posted", "recorded", "plan"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["post --intent <file.json|-> [--grant <op>]... [--evidence <oid>]... [--balancing 0|1] [--as <principal>]   (--balancing: that leg moves at most what its account's limit admits; the event says what was requested and what moved)", "post --intent <file.json|-> --dry-run [--plan-out <new-file>]   (runs the actual admission pipeline and aborts its staged transaction; emits the exact sealed PostEntry plan, commits nothing)", "Commit the reviewed plan with fa commit --plan <file|-> using the same --as and --grant. Any intervening book publication requires a new dry run; this first slice does not assemble new approvals or rehearse --balancing. --plan-out requires --dry-run and never overwrites a file.", "A Reversal intent names reverses and a registered reason (for example, \"reason\": \"WrongAccount\"); its legs come from the target."]
example = "fa post --intent entry.json --book ./books/myco --json"

[[verb]]
name = "commit"
summary = "Commit an exact reviewed PostEntry plan after current capability, snapshot and native effects revalidation."
writes = true
subcommands = []
flags = ["--plan", "--grant"]
switches = []
events = ["plan_committed"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["commit --plan <file|-> [--as <principal>] [--grant <op>]...", "The file is canonical binary bytes from --dry-run --plan-out; stdin also accepts the plan event's complete bytes hex string. The explicit commit confirms that authenticated exact artifact. The current caller independently supplies the same capability; no authority is taken from the file.", "The first commit atomically retains the canonical plan as a graph Certificate linked from the entry by CITES. Entry.plan_certificate remains absent because the pinned substrate has no generic object-store API. An exact retry returns the original identity and already_recorded=true. Any unrelated publication before the first commit invalidates this same-snapshot plan (exit 6); perform a new dry run and review its result."]
example = "fa commit --plan entry.plan --book ./books/myco --json"

[[verb]]
name = "reverse"
summary = "Post the exact reversal of an entry with a registered reason, preserving the original entry and its lineage."
writes = true
subcommands = []
flags = ["--reason", "--effective", "--period", "--key", "--description", "--grant", "--evidence", "--plan-out"]
switches = ["--dry-run"]
events = ["reversed", "recorded", "plan"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["reverse <vid|E:vid> --reason <name|code> [--effective YYYY-MM-DD] [--period <code>] [--key K] [--description <text>] [--grant <op>]... [--evidence <oid>]... [--dry-run [--plan-out <new-file>]]", "The default effective date and period are the target's; --effective never chooses an open period automatically. The default key is reverse:<target vid>. Repeating the same request returns the original outcome; changing a committed reversal is refused.", "--dry-run rehearses the exact derived reversal without publishing it; commit its reviewed sealed plan with fa commit --plan <file|-> at the same book snapshot.", "Reasons are registered in reason_codes.toml (scope supersession): WrongAccount, WrongPeriod, WrongAmount, Duplicate, and the other listed codes. Other requires --description. A reason records the preparer's statement, not its truth."]
example = "fa reverse <vid> --reason WrongAccount --book ./books/myco --json"

[[verb]]
name = "reserve"
summary = "Reserve amounts as a Pending entry (two-phase): nothing is posted."
writes = true
subcommands = []
flags = ["--intent", "--grant", "--evidence", "--balancing", "--plan-out"]
switches = ["--dry-run"]
events = ["posted", "recorded", "plan"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["reserve --intent <hold.json> [--dry-run [--plan-out <new-file>]] (a Pending: amounts reserved, nothing posted)", "--dry-run runs the reservation laws without acquiring the hold; fa commit --plan <file|-> acquires exactly the reviewed hold if the book has not advanced. --balancing is not supported with --dry-run."]
example = "fa reserve --intent hold.json --book ./books/myco --json"

[[verb]]
name = "resolve"
summary = "Resolve a hold: post a sub-vector drawn from it, or void it; the rest is released."
writes = true
subcommands = []
flags = ["--intent", "--grant", "--evidence", "--plan-out"]
switches = ["--dry-run"]
events = ["posted", "recorded", "plan"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["resolve --intent <res.json> [--dry-run [--plan-out <new-file>]] (resolves <hold vid>; disposition posts (legs drawn from the hold) | voids)", "A direct void requires --yes. --dry-run releases nothing and needs no confirmation; fa commit --plan <file|-> explicitly confirms the authenticated exact plan and rechecks the hold at the same snapshot."]
example = "fa resolve --intent res.json --book ./books/myco --json"

[[verb]]
name = "document"
summary = "Record a source document, content-addressed; its doc_commit is the public commitment an entry's evidence cites."
writes = true
subcommands = ["add"]
flags = ["--kind", "--mime", "--grade"]
switches = []
events = ["document"]
exits = [0, 2, 3, 4, 5]
usage = ["document add <file|-> [--kind Invoice] [--mime application/pdf] [--grade AgentUpload|HumanUpload]"]
example = "fa document add invoice.pdf --kind Invoice --mime application/pdf --grade HumanUpload --book ./books/myco --json"

[[verb]]
name = "tb"
summary = "Trial balance: stock or period activity at a known-at frontier; opt-in certification retains an immutable certificate in the book."
writes = true
subcommands = []
flags = ["--period", "--fiscal-year", "--as-of", "--as-known-at", "--certificate-out"]
switches = ["--activity", "--certify"]
events = ["trial_balance", "report_certificate"]
exits = [0, 2, 3, 4, 5, 8]
usage = ["tb ((--period <code>)... | --fiscal-year N) [--activity] [--as-known-at HEAD|<seq>|<RFC3339>]", "tb --as-of YYYY-MM-DD [--as-known-at HEAD|<seq>|<RFC3339>]", "Add --certify to retain a content-addressed certificate in the book and emit its complete canonical bytes as hex; --certificate-out <new-file> implies certification and also saves canonical binary bytes without replacing any existing file. Uncertified reports do not write; retention advances the metadata frontier while the report's known-at remains fixed.", "Stock balances include opening history; --activity is selected-period movement. Known-at instants resolve from retained TimeEvidence and report the observed frontier and tick brackets; as-of remains a civil date. Certificates preserve the original instant resolution, with embedded-owner authority and fa-fold-over-prefix replay scope; no witness signature or physical timestamp claim."]
example = "fa tb --period FY2026-P03 --book ./books/myco --json"

[[verb]]
name = "statement"
summary = "Balance sheet or income statement from exact journal folds under a registered definition, with optional period comparatives and retained replay certificates."
writes = true
subcommands = []
flags = ["--for", "--compare", "--known-at", "--as-known-at", "--certificate-out"]
switches = ["--certify"]
events = ["statement", "report_certificate"]
exits = [0, 2, 3, 4, 5, 7, 8]
usage = ["statement balance-sheet|income-statement --for <period> [--compare <period>] [--known-at HEAD|<seq>|<RFC3339>]", "Both columns use the same known-at snapshot and the registered definition. Balance sheets carry opening history through each selected period; income statements show that period's activity. Native units remain separate; there is no implicit FX conversion or presentation rounding.", "--as-known-at is an alias for --known-at; supply only one. Add --certify to retain an immutable certificate and emit its complete bytes inline. --certificate-out <new-file> also saves a binary copy without replacing a file. Uncertified statements do not publish metadata. Certificates prove replay and arithmetic over the journal, not GAAP conformity."]
example = "fa statement balance-sheet --for FY2026-P03 --compare FY2026-P02 --certify --book ./books/myco --json"

[[verb]]
name = "replay"
summary = "Verify a retained report certificate's complete native read closure and reproduce its original trial balance, statement, balance explanation, or open-items report."
writes = false
subcommands = []
flags = []
switches = []
events = ["trial_balance", "statement", "balance_explained", "open_items"]
exits = [0, 2, 3, 4, 5, 8]
usage = ["replay <C:oid|oid|certificate-file|->", "A 64-hex oid resolves the immutable certificate retained in this book. A file holds canonical binary certificate bytes; stdin also accepts the oid or complete bytes hex string from a report_certificate event. Prefix a 64-hex filename with ./ to read it as a file. The certificate fixes the selector and known-at; replay never substitutes today's frontier."]
example = "fa replay trial-balance.cert --book ./books/myco --json"

[[verb]]
name = "certificate"
summary = "Check whether later entries affect a retained report certificate's selector."
writes = false
subcommands = ["status"]
flags = []
switches = []
events = ["certificate_status"]
exits = [0, 2, 3, 4, 5, 8]
usage = ["certificate status <C:oid|oid|certificate-file|->", "A 64-hex oid resolves the certificate retained in this book; file and inline bytes are also accepted. Current or SupersededBy is evaluated against the current book after the original certificate verifies; supersession does not erase the historical report, which still replays."]
example = "fa certificate status trial-balance.cert --book ./books/myco --json"

[[verb]]
name = "open-items"
summary = "Open items (plan §5.7): each live posted leg, its applications, and its open amount, with account metadata at the selected historical snapshot."
writes = true
subcommands = []
flags = ["--account", "--as-known-at", "--certificate-out"]
switches = ["--certify"]
events = ["open_items", "report_certificate"]
exits = [0, 2, 3, 4, 5, 8]
usage = ["open-items [--account <code>] [--as-known-at HEAD|<seq>|<RFC3339>] [--certify | --certificate-out <new-file>]", "Without certification this is a pure read. --certify retains an immutable report certificate in the book; --certificate-out also creates a new external copy. Unknown account filters refuse, including accounts absent at the selected known-at. Replay fixes that snapshot, account metadata, and application/reversal lineage."]
example = "fa open-items --account 1200 --book ./books/myco --json"

[[verb]]
name = "explain"
summary = "Explain a leaf account's balance: its register cells in a period, the fold they belong to, every contributing leg with its recorded sequence, and the cell's known-at history."
writes = true
subcommands = ["balance"]
flags = ["--period", "--as-known-at", "--certificate-out"]
switches = ["--certify"]
events = ["balance_explained", "report_certificate"]
exits = [0, 2, 3, 4, 5, 8]
usage = ["explain balance <account code> --period <code> [--as-known-at HEAD|<seq>|<RFC3339>] [--certify | --certificate-out <new-file>]", "Without certification this is a pure read. --certify retains the exact explanation and native read closure in the book; --certificate-out also creates a new external copy. The certificate binds historical account metadata, contributing entries, evidence references, lineage, cell history, and the whole-period fold."]
example = "fa explain balance 1000 --period FY2026-P03 --book ./books/myco --json"

[[verb]]
name = "checkpoint"
summary = "Publish an unsigned, recomputable accumulator state over the book's entry prefix."
writes = true
subcommands = ["create"]
flags = ["--grant"]
switches = []
events = ["checkpoint_created"]
exits = [0, 2, 4, 5, 6, 7, 8]
usage = ["checkpoint create --grant witness [--as <principal>]", "The state is unsigned and covers entries; it is not a signed TransparencyCheckpoint or an evidence bundle."]
example = "fa checkpoint create --grant witness --book ./books/myco --json"

[[verb]]
name = "verify"
summary = "Verify derived state against the journal: leg projections, refolded registers, open-item applied mirrors, limited accounts' availability cells, or accumulator states (exit 8 on drift)."
writes = false
subcommands = ["registers", "open-items", "availability", "accumulator", "projections"]
flags = ["--period", "--fiscal-year"]
switches = []
events = ["registers_verified", "open_items_verified", "availability_verified", "accumulator_verified", "projections_verified"]
exits = [0, 2, 4, 5, 8]
usage = ["verify registers ((--period <code>)... | --fiscal-year N)", "verify open-items", "verify availability", "verify accumulator (every recorded checkpoint; no period filter)", "verify projections (all entry payloads and leg topology at current head; no period filter)"]
example = "fa verify registers --period FY2026-P03 --book ./books/myco"

[[verb]]
name = "registers"
summary = "Advance native posted/pending period registers from the journal delta, or explicitly rebuild them from a fresh fold. Reports remain journal folds."
writes = true
subcommands = ["materialize", "advance"]
flags = ["--period", "--fiscal-year"]
switches = []
events = ["registers_materialized", "registers_advanced"]
exits = [0, 2, 4, 5, 7, 8]
usage = ["registers materialize ((--period <code>)... | --fiscal-year N)   (over a period that already has cells: --yes)", "registers advance ((--period <code>)... | --fiscal-year N)   (each period publishes atomically; damaged cache is refused)"]
example = "fa registers materialize --period FY2026-P03 --book ./books/myco"

[[verb]]
name = "entry"
summary = "Read one committed entry back by its vid, verifying its digests."
writes = false
subcommands = ["show"]
flags = []
switches = []
events = ["entry"]
exits = [0, 2, 4, 5]
usage = ["entry show <vid-hex>"]
example = "fa entry show 3f2a… --book ./books/myco --json"

[[verb]]
name = "capabilities"
summary = "What this build can do: verbs, aliases, exit codes, entry classes, robot mode."
writes = false
subcommands = []
flags = []
switches = []
events = ["capabilities"]
exits = [0, 5]
usage = ["capabilities"]
example = "fa capabilities --json"

[[verb]]
name = "robot-docs"
summary = "In-tool documentation for agents: the guide, the exit codes, worked examples, and the robot-mode schema."
writes = false
subcommands = ["guide", "exit-codes", "examples", "schema"]
flags = []
switches = []
events = ["robot_docs", "robot_schema"]
exits = [0, 2, 5]
usage = ["robot-docs guide|exit-codes|examples", "robot-docs schema [<event or shape>]"]
example = "fa robot-docs schema balance_explained --json"

[[verb]]
name = "help"
summary = "The command list, or one verb's usage."
writes = false
subcommands = []
flags = []
switches = []
events = ["help"]
exits = [0, 2]
usage = ["help [<verb>]"]

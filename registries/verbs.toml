fields = ["action:string", "conflict_with:string", "min_distinct_principals:int", "agent_eligible:bool", "refusal_code:string"]

[[shape]]
name = "period_transition_row"
doc = "One journaled period-state transition control entry."
fields = ["control_entry:hex", "from:string", "to:string", "reason_code:int?", "reason:string?", "principal:hex", "approvals:int", "effective_date:date", "recorded_at:seq"]

[[shape]]
name = "coordinate"
doc = "What a line describes (plan §4.8), beside the envelope's `book` (the book id): the branch (`trunk`; drafts and scenarios land later), `known_at` (the recorded sequence: the head when read, or the one --as-known-at selected; after a write, the head that write produced), and `effective` (`all`, `period:<code>`, `periods:<code>,<code>…`, or `as-of:<YYYY-MM-DD>`). `time_evidence` is null for sequence/HEAD reads; instant reads and their replays retain the original observed frontier, resolved sequence and tick brackets."
fields = ["branch:string", "known_at:seq", "effective:string", "time_evidence:time_evidence?"]

[[shape]]
name = "time_evidence"
doc = "The retained resolution of a requested UTC instant under plan §7.1a. precision is tick_bucket; source_grade preserves clock corroboration. A null upper bracket is open at frontier. This does not establish a physical commit instant, and replay uses this saved frontier."
fields = ["requested_instant:string", "requested_utc_ns:int", "frontier:seq", "resolved_seq:seq", "precision:string", "source_grade:string", "lower:time_tick", "upper:time_tick?"]

[[shape]]
name = "time_tick"
doc = "One journaled TimeEvidence observation and its immutable entry identity. source 0 is the daemon clock; monotonic_ok records corroboration, not proof of UTC accuracy."
fields = ["entry:hex", "recorded_at:seq", "observed_utc_ns:int", "source:int", "monotonic_ok:bool"]

[[shape]]
name = "next_action"
doc = "A command an agent usually runs next, and why. It omits --book: run it with the same --book."
fields = ["command:string", "why:string"]

[[shape]]
name = "invariant_clauses"
doc = "The invariant clauses this build enforces (registries/invariants.toml, fa-37f): `live` lists the clause ids whose checker runs (FA-INV-nn.clause), `gate_g1` the clauses Gate G1 requires; a dormant G1 clause is a G1 blocker."
fields = ["live:[string]", "gate_g1:[string]"]

[[shape]]
name = "dangerous_op"
doc = "An operation that cannot be undone in practice: refused with FA-REF-007 (exit 7) unless --yes (or a --plan file) confirms it. `subcommand` is null for a verb without subcommands; `condition` says when it applies; `safe` is the alternative the refusal names."
fields = ["verb:string", "subcommand:string?", "condition:string", "safe:string"]

[[shape]]
name = "planted_fact"
doc = "A planted accounting or forensic ground-truth fact in an initialized demo book (`fa demo init`)."
fields = ["id:string", "kind:string", "period:string", "entry_vids:[hex]", "summary:string"]

[[shape]]
name = "lot_item"
doc = "One cost-basis lot on an `AnyUnit` account: its acquiring entry and leg ordinals (`qty_ordinal` in the non-base quantity unit, `cost_ordinal` in the book's base unit), original/relieved/open quantities and costs, and ordered `RELIEVES` applications."
fields = ["entry:hex", "entry_digest:hex", "qty_ordinal:int", "cost_ordinal:int", "side:string", "effective_date:date", "recorded_at:seq", "original_quantity:amount", "relieved_quantity:amount", "open_quantity:amount", "original_cost:amount", "relieved_cost:amount", "open_cost:amount", "relieves:[lot_relief]"]

[[shape]]
name = "lot_relief"
doc = "One disposal application (`RELIEVES {quantity, cost}`) against a lot; `live` is false when a reversal (`UNSETTLES`) undid the relief."
fields = ["disposal_entry:hex", "qty_ordinal:int", "cost_ordinal:int?", "quantity:amount", "cost:amount", "recorded_at:seq", "live:bool"]

[[shape]]
name = "lot_disposal_plan"
doc = "A deterministic lot disposal relief plan under `FIFO`, `LIFO`, `SpecificId`, or `WeightedAverage` (`lot_laws.toml`, plan §6.5), with exact per-lot slices and `wac_residual_numerator`."
fields = ["law:string", "regime:string", "rounding_law:string", "total_quantity:amount", "total_cost:amount", "wac_residual_numerator:int", "slices:[lot_disposal_slice]"]

[[shape]]
name = "lot_disposal_slice"
doc = "One lot slice relieved by a planned disposal, with before/after open quantities and costs."
fields = ["entry:hex", "entry_digest:hex", "qty_ordinal:int", "cost_ordinal:int", "effective_date:date", "recorded_at:seq", "quantity_relieved:amount", "cost_relieved:amount", "open_quantity_before:amount", "open_quantity_after:amount", "open_cost_before:amount", "open_cost_after:amount"]

[[shape]]
name = "lineage_step"
doc = "One entry in a `SUPERSEDES` lineage component, with its liveness and supersession links and registered netting laws."
fields = ["entry:hex", "entry_digest:hex", "class:string", "effective_date:date", "recorded_at:seq", "live:bool", "supersedes:[lineage_edge]"]

[[shape]]
name = "lineage_edge"
doc = "One `SUPERSEDES` edge with its registered `netting_law` (`supersession_kinds.toml`)."
fields = ["target:hex", "kind:string", "netting_law:string", "reason_code:int", "reason:string?"]

[[shape]]
name = "lineage_net_cell"
doc = "Net economic effect `(debit - credit)` of a `SUPERSEDES` lineage component on one `(account, unit)` cell."
fields = ["account:string", "account_vid:hex", "account_name:string", "unit:string", "debits:amount", "credits:amount", "net:amount"]

# ---------------------------------------------------------------------------
# MCP (plan §15.4, bead fa-xex): this registry as tool clusters.
# ---------------------------------------------------------------------------
# fa-mcp exposes every [[verb]] (and every subcommand) above as a tool in
# exactly one cluster of at most `max_tools_per_cluster` tools, or lists it
# under [[mcp.excluded]] with the reason — host-only or interactive verbs only.
# The fa-mcp parity test fails on a verb or subcommand that is neither, on one
# that is both, on one covered by two tools, on a cluster over the limit, and
# on a tool naming a verb or subcommand this registry lacks. Only verbs that
# exist today are mapped; the plan's remaining clusters appear with their verbs.
#
# A tool's wire name is its cluster with `.` → `_`, then `_`, then its name
# (`fa.read` + `trial_balance` = `fa_read_trial_balance`): hosts restrict tool
# names to [A-Za-z0-9_-]. A tool's arguments are the verb's value flags without
# the dashes (`--as-known-at` → `as_known_at`), its switches as booleans, the
# positionals named in `positionals` (a trailing `?` marks an optional one),
# `selector` (which subcommand, when the tool covers several). Authority and
# book selection are fixed at trusted launch: `as`, `grant`, `yes`, `keys`,
# `book`, `principal`, `profile` and `via` are forbidden call properties.
# `stdin_property` is a
# JSON property the server forwards on stdin as the `-` argument of
# `stdin_via` (a flag, or a positional's name); the flag or positional keeps
# its string (path) form beside it. `required` names flags and positionals the
# host must supply. `flags`/`switches`, when present, narrow the verb's lists
# to what the covered subcommands read. `dont` and `mistakes` are the tool's
# own lines of the generated Do / Don't / Discovery / Examples / Common
# mistakes documentation; the rest is derived from the verb row, the
# [[dangerous]] rows, the [[next_action]] rows and the detectors. Amounts
# cross the boundary only as strings with their unit (plan §15.4); the server's
# mistake detectors refuse a JSON number in an amount field, an instant where
# a civil date is required, a placeholder, a posting leg on a summary account,
# a re-dated intent after a period-law refusal, and a self-approval, before
# anything is dispatched.

[mcp]
server = "fa-mcp"
max_tools_per_cluster = 7
# The server fixes authority and book selection once; it never forwards caller grants.
hidden_flags = ["--json", "--format", "--via", "--no-color", "--help", "--version", "--as", "--grant", "--yes", "--keys", "--book", "--token"]
# Flags that may repeat: the property is an array of strings (one string is accepted too).
repeat_flags = ["--evidence", "--approval", "--period", "--param", "--entry", "--balance", "--root", "--bucket", "--income-period", "--chunk", "--subject", "--against", "--target", "--participant", "--resource", "--external-id", "--entity", "--line", "--applies"]
# Flags whose values are integers: the property accepts a JSON integer or its decimal string.
integer_flags = ["--fiscal-year", "--year-start-month", "--adjustment-periods", "--reason", "--balancing", "--timeout-ns", "--before", "--after", "--max-publications", "--chunk", "--seed", "--date-window", "--page-size", "--line-ordinal", "--source-known-at"]

[[mcp.cluster]]
name = "fa.orient"
doc = "Where to start: what this build can do, the in-tool documentation, one verb's usage."

[[mcp.cluster]]
name = "fa.book"
doc = "A book as a whole: create or describe it, publish a checkpoint, verify derived state against the journal, rebuild registers."

[[mcp.cluster]]
name = "fa.chart"
doc = "The chart of accounts: install it as one journaled schema effect, or list it."

[[mcp.cluster]]
name = "fa.draft"
on_demand = true
doc = "Drafts (plan §15.2): an Agent opens an intent log, plans intents into it (each rehearsed under every posting law), inspects or discards it. Promotion to trunk is a Human approver's host-side act."

[[mcp.cluster]]
name = "fa.scenario"
on_demand = true
doc = "Scenarios (plan §15.2, §15.6.5): fork a counterfactual over a fixed trunk prefix, run intents in it (each rehearsed on its scratch materialization), and diff it against trunk per account and unit. A scenario never posts to trunk."

[[mcp.cluster]]
name = "fa.post"
doc = "Posting under the accounting laws: entries, two-phase holds and their resolutions, with explicit dry-run plans and exact plan commits. Every amount is a string with its unit; nothing is auto-balanced."

[[mcp.cluster]]
name = "fa.read"
doc = "Certified reads over the journal: trial balance, financial statements, an explained balance, open items, one entry."

[[mcp.cluster]]
name = "fa.time"
doc = "Period law: create a fiscal year's periods, list them, move one along the state machine, approve a planned transition."

[[mcp.cluster]]
name = "fa.evidence"
doc = "Evidence: record a source document, content-addressed, so an entry can cite it."

[[mcp.cluster]]
name = "fa.rea"
on_demand = true
doc = "REA parties and instruments (plan §4.1, §4.5): record them, relate parties by a registered basis, and list them, so events can name participants and resources and the related-party procedures have a graph."
[[mcp.cluster]]
name = "fa.io"
on_demand = true
doc = "Interop exports (plan §8.6, §15.9): the committed journal at one coordinate as the AICPA ADS GL package, OECD SAF-T, a CSV GL extract, Beancount, hledger or an NDJSON GL stream, returned inline with its export coordinate certificate."
[[mcp.cluster]]
name = "fa.billing"
on_demand = true
doc = "Customer invoices, vendor bills, receipts and payments (plan §15.3, Appendix B): typed sugar over fa.post's entry intent. The caller names every account; no posting rule or tax is inferred; dry_run returns the plan."
[[mcp.cluster]]
name = "fa.proof"
doc = "General-ledger views at one coordinate (detail, roll-forward, aging, cash flow, lots) that reconcile to the journal fold."
[[mcp.cluster]]
name = "fa.findings"
on_demand = true
doc = "Discover recorded forensic runs with bounded cursor pages, then inspect retained certified findings, independent append-only human decisions, and deterministic numbered workpapers. Finding lists select an explicit certified run; replay can bind an independently requested source and review cutoff."

[[mcp.cluster]]
name = "fa.bank"
on_demand = true
doc = "Bank source intake, reproducible exact proposals, immutable line-to-cash-leg confirmations and recorded confirmation history. Parser/account manifests and complete evidence closures bind every selection. Governed BankStatement replay requires full disclosure authority that current MCP launch templates cannot hold; an independently authorized operator performs those operations. Confirmation records the admitted Human principal and exclusive line/leg claims without posting money or establishing a reconciliation lock."

[[mcp.cluster]]
name = "fa.close"
on_demand = true
doc = "Inspect journaled fiscal-year closing routes and verify the last mechanical close at an explicitly selected history prefix. Routing changes and close preparation/publication remain host-side operations under independent schema, close and approval authority."

[[mcp.cluster]]
name = "fa.notary"
on_demand = true
doc = "Portable accounting proofs from recorded checkpoints (signed by the book's key, or raw statements) and evidence bundles, checked independently without book keys (plan §15.4: discoverable on demand)."

[[mcp.excluded]]
verb = "fad"
subcommand = "serve"
reason = "host-only: controls the daemon process that will host fa-mcp (plan §15.4 registered exclusion)"

[[mcp.excluded]]
verb = "fad"
subcommand = "status"
reason = "host-only: reports on the daemon process, not on a book (plan §15.4 registered exclusion)"

[[mcp.excluded]]
verb = "fad"
subcommand = "stop"
reason = "host-only: stops the daemon process that will host fa-mcp (plan §15.4 registered exclusion)"

[[mcp.excluded]]
verb = "demo"
subcommand = "init"
reason = "host-only: creates a new demo book directory and key files on the host filesystem (plan §15.4 registered exclusion)"

[[mcp.excluded]]
verb = "party"
subcommand = "identifiers"
reason = "host-only: replacing a party's bank or tax identifiers is the business-email-compromise vector (plan §14.4); a Human operator with schema_change performs it on the host, never a launch-bound session (fa-lzrn)"

[[mcp.excluded]]
verb = "draft"
subcommand = "promote"
reason = "host-only: promotion needs a principal holding approve, distinct from the draft's owner, and --yes; a bound MCP session can hold neither (plan §15.2/§15.4 registered exclusion, fa-s7x)"

[[mcp.excluded]]
verb = "close"
subcommand = "map"
reason = "host-only: changing the reviewed Revenue/Expense-to-Equity routing map requires schema_change, which neither launch-bound MCP templates nor their issued tokens may hold (plan §7.5/§15.4 registered exclusion)"

[[mcp.excluded]]
verb = "close"
subcommand = "year-end"
reason = "host-only: preparing or publishing the intrinsic fiscal-year close requires close and post, and Closed reclose additionally requires an independent approval; close and approval are outside MCP launch ceilings and a tool cannot supply dangerous confirmation (plan §7.5/§15.4 registered exclusion)"

[[mcp.excluded]]
verb = "capability"
subcommand = "issue"
reason = "host-only: issuing authority needs --grant issue_capability and writes the holder's secret token file on the host; a bound MCP session never issues capabilities (plan §14.2/§15.4 registered exclusion, fa-v62)"

[[mcp.excluded]]
verb = "capability"
subcommand = "list"
reason = "host-only: the operator's inventory of every grant in the book; a bound session reads its own authority through fa_orient_capabilities (plan §15.4 registered exclusion, fa-v62)"

[[mcp.excluded]]
verb = "capability"
subcommand = "show"
reason = "host-only: the operator's view of one grant in the book; a bound session reads its own authority through fa_orient_capabilities (plan §15.4 registered exclusion, fa-v62)"

[[mcp.excluded]]
verb = "capability"
subcommand = "revoke"
reason = "host-only: revokes a capability commitment with --grant issue_capability and --yes, neither of which a bound MCP session can hold or supply (plan §14.2/§15.4 registered exclusion)"

# ---- fa.orient --------------------------------------------------------------

[[mcp.cluster]]
name = "fa.forensics"
doc = "Lantern: the registered forensic and audit procedures (journal-entry tests, duplicates, sequence gaps, cutoff, aging, digit tests, round trips, structuring, tracing laws) run as pure reads; findings are statistics with typed citations."

[[mcp.tool]]
cluster = "fa.orient"
name = "capabilities"
verb = "capabilities"
subcommands = []
positionals = []
required = []
dont = ["Don't guess a verb, an exit code or a dangerous operation: this lists all of them for this build."]
mistakes = ["Reading the exit-code dictionary from memory instead of from `exit_codes` here (1 is never emitted; empty results are 0)."]

[[mcp.tool]]
cluster = "fa.orient"

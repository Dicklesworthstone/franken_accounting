required = ["code"]
dont = ["Don't reopen to admit an ordinary posting: only a lawfully classified adjustment or an authorized, case-bound reopen changes what a closed period reports.", "Don't approve your own plan: `plan_out` seals a proposal; `fa_time_approve` must run as a different principal (`as`).", "Don't close, lock or reopen without `yes` unless the operation is intended; the refusal names the reversible alternative (soft-close)."]

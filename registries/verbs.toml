[[verb]]
name = "checkpoint"
summary = "Publish a recomputable accumulator state over the book's entry prefix and its TransparencyCheckpoint signed by the book's key."
writes = true
subcommands = ["create", "list", "witness", "witness-key"]
flags = ["--grant", "--key", "--state", "--previous", "--onto", "--out"]
switches = []
events = ["checkpoint_created", "checkpoints", "checkpoint_witnessed", "witness_key_created"]
exits = [0, 2, 4, 5, 6, 7, 8]
usage = ["checkpoint create --grant witness [--as <principal>]", "checkpoint list   (the journaled states, newest first; recomputes nothing: fa verify accumulator does)", "The state covers entries; its TransparencyCheckpoint is signed by the book's Ed25519 key (public_key) and is exported with `fa proof signed-checkpoint`. It is not an evidence bundle and covers no document receipts.", "checkpoint witness-key --out <new file>   (plan §13.5: a new Ed25519 witness key, its seed as 64 hex characters in a new 0600 file; the book is not opened, and the key is the witness's, never the book's)", "checkpoint witness --key <witness key file> [--state <oid>] [--previous <the cosigned checkpoint this key produced last>] [--onto <a checkpoint of the state other witnesses cosigned>] --out <new file> --grant witness   (plan §13.5, the witness's cosignature: the state's checkpoint signed by the book's key with the witness's Ed25519 signature added over the same body, an attestation that this root was observed and never a statement about the ledger's content. With --previous, the book must prove that its history extends the statement the witness signed last; a rollback or rewritten history is refused (FA-REF-124, exit 8) and nothing is signed. With --onto, the signature is added to a checkpoint other witnesses already cosigned, whose body must be exactly the one the book signed for that state, so one file can carry a quorum. The key file must be 0600 and owned by the caller. Nothing is written to the book: the cosigned checkpoint is the witness's to keep and distribute; `fa-verify checkpoint <file> --key <book key> --witness <witness key>... --quorum <n>` checks it offline. A cosignature is witnessed detection (a fork is detected when checkpoints meet), never prevention)"]
example = "fa checkpoint create --grant witness --book ./books/myco --json"

[[verb]]
name = "proof"
summary = "Export a recorded checkpoint (signed TransparencyCheckpoint or raw 80-byte statement) or a portable accounting proof for independent fa-verify verification."
writes = false
subcommands = ["signed-checkpoint", "checkpoint", "inclusion", "consistency", "prefix", "balance", "evidence-disclosure"]
flags = ["--state", "--next-state", "--entry", "--document", "--role", "--chunk", "--account", "--unit", "--as-of", "--out", "--grant"]
switches = ["--with-record"]
events = ["proof_exported", "evidence_disclosure_exported"]
exits = [0, 2, 3, 4, 5, 7, 8]
usage = ["proof signed-checkpoint [--state <64-hex-oid|latest>] [--out <new-file>]   (the TransparencyCheckpoint signed by the book's key; checkpoint_public_key names the key)", "proof checkpoint [--state <64-hex-oid|latest>] [--out <new-file>]", "proof inclusion --entry <vid|E:vid> [--with-record] [--state <oid|latest>] [--out <new-file>]", "proof consistency --state <old-oid> --next-state <new-oid> [--out <new-file>]", "proof prefix [--state <oid|latest>] [--out <new-file>]", "proof balance --account <code> --unit <CODE> [--as-of YYYY-MM-DD] [--state <oid|latest>] [--out <new-file>]", "proof evidence-disclosure --entry <vid|E:vid> --document <oid> [--role <name>] [--chunk <idx>]... [--state <oid|latest>] [--out <new-file>]", "Export never creates a checkpoint or changes the book. Missing --state selects the latest recorded state. --out writes a new raw binary file; otherwise bytes is complete hex. Checkpoints are exact 80-byte statements. Binary proofs are limited to 64 MiB; inline output has the smaller daemon frame bound.", "fa-verify <kind> --proof <file> --checkpoint <signed-checkpoint-file> --key <checkpoint_public_key> --json, or --checkpoint <raw-80-byte-file> --unsigned-checkpoint once that statement is trusted outside the proof; consistency also takes --next-checkpoint <claimed-file>. Prefix verifies all envelopes, inclusion optionally recomputes a payload, and balance recomputes exact posted debits/credits for one account/unit through an inclusive effective cutoff. No signatures, document receipts, FX or general statement replay are claimed."]
example = "fa proof balance --account 1000 --unit USD --state latest --book ./books/myco --json"

[[verb]]
name = "bundle"
summary = "Produce an evidence bundle (.fab) over a recorded checkpoint's prefix, one account's effective-day interval, or named entries, with recomputed balances and a production receipt signed by the book's key, for offline fa-verify bundle verification."
writes = false
subcommands = ["produce"]
flags = ["--certificate", "--state", "--account", "--from", "--to", "--entry", "--balance", "--out", "--receipt-out", "--grant"]
switches = ["--inline-documents"]
events = ["bundle_produced"]
exits = [0, 2, 3, 4, 5, 7, 8]
usage = ["bundle produce --certificate <C:oid|file|-> [--state <oid|latest>] [--out <new.fab> --receipt-out <new-file>]   (replays a sequence-selected native trial balance, then includes every authenticated checkpoint payload, its historical schema and migration bodies for independent fa-verify report recomputation. The checkpoint must cover the report known-at. Other scopes, balances, inline documents, instant-selected certificates and statement certificates are refused in this slice.)", "bundle produce [--state <64-hex-oid|latest>] [--out <new.fab> --receipt-out <new-file>]   (the complete prefix)", "bundle produce --account <code> --from YYYY-MM-DD --to YYYY-MM-DD ...   (one account's effective-day interval, proved complete by the signed scope index)", "bundle produce --entry <vid|E:vid>...   (named entries: membership only)", "--balance <code>:<UNIT>[:YYYY-MM-DD] (repeatable) adds a posted balance recomputed from the bundle's entries; --inline-documents includes each cited document's bytes (a capability that reads a document only as a redacted view is refused FA-REF-128).", "Production writes nothing to the book; read and produce are required. Missing --state selects the latest recorded state. --out and --receipt-out write new private files; otherwise bytes and receipt are complete hex, within the daemon frame bound.", "fa-verify bundle <file.fab> --key <checkpoint_public_key> --receipt <receipt-file> grades every predicate: format, signed checkpoint, entries exactly the scope's leaves, cited documents present and matching their commitments, balances refolded, receipt signature."]
example = "fa bundle produce --account 1000 --from 2026-03-01 --to 2026-03-31 --balance 1000:USD:2026-03-31 --out cash.fab --receipt-out cash.receipt --book ./books/myco --json"

[[verb]]
name = "production"
summary = "Litigation production profiles (plan §13.2, §0.4 decision 4): open a matter's profile (its Bates prefix and first number, journaled once by a ProductionControl record and never restarted), list the book's matters, show the ranges a matter has assigned, or list one document's ranges across matters."
writes = true
subcommands = ["open", "list", "show", "document"]
flags = ["--bates-prefix", "--start", "--load-file", "--protective-order", "--key", "--date", "--grant"]
switches = []

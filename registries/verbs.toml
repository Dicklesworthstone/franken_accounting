[[mcp.tool]]
cluster = "fa.orient"
name = "help"
verb = "help"
subcommands = []
positionals = ["verb?"]
required = []
dont = ["Don't call this for the tool contract — the tool descriptions and input schemas are the contract; this is the CLI's own usage text."]
mistakes = ["Passing a tool's wire name as `verb` (it takes the CLI verb, e.g. `tb`, or an alias such as `trial-balance`)."]

[[mcp.tool]]
cluster = "fa.orient"
name = "triage"
verb = "triage"
subcommands = []
positionals = []
required = []
dont = ["Don't guess what to do next: next_actions lists the commands this book's state calls for, most urgent first."]

[[mcp.tool]]
cluster = "fa.orient"
name = "explain"
verb = "explain"
subcommands = ["entry", "evidence", "refusal", "period", "register", "lineage"]
selector = "subject"
positionals = ["target"]
flags = ["--period", "--unit", "--as-known-at"]
switches = []
required = ["target"]
dont = ["Don't guess what a refusal code means or how to remediate it: `subject: \"refusal\"` with `target: \"FA-REF-nnn\"` prints its law citation, admissibility cells, SoD rules, and exact fix without needing an open book.", "Don't trust a materialized register without checking its fold: `subject: \"register\"` compares the refolded cell against the stored cache."]
mistakes = ["Calling `subject: \"register\"` without `period`.", "Passing an `entry_digest` instead of the 32-hex `vid` to `subject: \"entry\"`, `subject: \"lineage\"`, or `subject: \"evidence\"`."]


# ---- fa.book ----------------------------------------------------------------

[[mcp.tool]]
cluster = "fa.book"
name = "create"
verb = "book"
subcommands = ["create"]
positionals = []
required = ["--name"]
dont = ["The book path is fixed at launch; a call cannot select another directory. Agent and Preparer sessions cannot create books; ask the operator to prepare the book before launch.", "Don't lose the book's key file: keys are never regenerated."]
mistakes = ["Passing a book or key path as a tool argument: both are forbidden.", "Passing `base_unit` in lowercase (`usd`): unit codes are the registered spellings (USD, EUR, …)."]

[[mcp.tool]]
cluster = "fa.book"
name = "info"
verb = "book"
subcommands = ["info"]
positionals = []
required = []

selector = "action"
positionals = ["run?"]
flags = ["--period", "--key", "--intent", "--evidence", "--description", "--as-known-at", "--approval", "--action", "--package", "--chunk"]
switches = ["--dry-run"]
stdin_property = "intent"
stdin_kind = "object"
stdin_via = "--intent"
required = []
dont = ["Don't expect staged migration entries to appear in trial balances or statements before finalize: staged entries stay unpublished until finalize verifies every independently declared trial balance and commits with two independent Human approvals. Non-sole FullDetail retains earlier history for drilldown while counting only opening stock and detail at or after its opening boundary; sole-source FullDetail counts all its historical detail.", "Don't pass host filesystem paths in intent_file, plan_file or plan_out: supply migration input inline as intent. Existing native stage/finalize/abandon support dry_run proposal inspection; import preparation retains a Workpaper and does not accept dry_run.", "For a retained legacy package, use action import, import_action show and package D:<oid>; omit run. This read requires current read authority and full original source access. A governed source may require Privileged, which MCP launch ceilings cannot hold.", "Import prepare and stage require an independently authorized Human operator with read, post and migrate. Existing Agent and Preparer launch profiles cannot perform them. The operator prepares from retained source Documents and explicit mappings, stages exact package chunks with separate Human approvals, then independently finalizes the run. Tool arguments cannot add grants or change the session's authority."]
mistakes = ["Staging into a period the run does not cover: FullDetail additionally admits historical Opening, Adjustment and Closing periods inside its complete declared span; a sole-source run forbids its own Opening period. Import entry_periods must explicitly distinguish ambiguous source dates (FA-REF-132).", "Finalizing before the staged chunks fold to the run's declared trial balance (FA-REF-131).", "Confusing action import with import_action: the latter selects prepare, show or stage inside the import workflow. Import show and stage take a retained package OID, never a host package path.", "Regenerating proposal bytes after collecting approvals: resume the first retained package and its exact chunk indices and digests."]


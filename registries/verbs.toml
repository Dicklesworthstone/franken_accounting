dont = ["Don't expect a proposal to post: it is a draft correcting entry journaled in the engagement; the client books it with its own posting, and booking then names that committed entry.", "Don't decide a proposal twice: booked or passed is final (FA-REF-181); propose a new adjustment if the correction must change.", "Don't present passed adjustments as immaterial by themselves: the reason records the stated basis; the evaluation against materiality is the auditor's."]
mistakes = ["Booking with an entry whose legs differ from the proposal's (FA-REF-182): book exactly the correction that was proposed, or pass it.", "Proposing outside the engagement's scope periods (FA-REF-183).", "Passing a reason name over MCP: reason is the adjustment_pass code (1 ClearlyTrivial, 2 BelowPerformanceMateriality, 3 ManagementDeclined, 4 Other)."]

# Intrinsic fiscal-year closing (fa-4o0).
[[event]]
name = "closing_routes_recorded"
book = true
doc = "A complete effective-dated nominal-to-equity route map recorded as an immutable SchemaChange control in one witnessed transaction. already_recorded returns the original control on an exact semantic retry."
fields = ["effective_from:date","routes:int","control_entry:hex","recorded_at:seq","digest:hex","already_recorded:bool"]

[[event]]
name = "closing_routes"
book = true
doc = "The latest applicable complete routing map at the selected effective date and recorded prefix, under current whole-book read authority. found=false means no map applies; every optional header is then null and routes is empty."
fields = ["as_of:date","known_at:seq","found:bool","effective_from:date?","control_entry:hex?","recorded_at:seq?","digest:hex?","routes:[closing_route]"]

[[event]]
name = "closing_reviewed"
book = true
doc = "An unexecuted exact year-end Closing proposal encoded as the existing canonical PostIntent. Its intrinsic basis binds the complete selected source contributions and journaled routing map. Review bytes preserve sealed fields across approval commits; approvals bind proposal_digest, while review_digest authenticates the complete retained artifact to its reviewer. Revalidation recomputes the native source; this event is neither a PostPlan nor a certification or posting permit."
fields = ["fiscal_year:int","period:string","closing_date:date","known_at:seq","routes_entry:hex","routes_digest:hex","source_digest:hex","base_unit:string","valuation_basis:string","latest_close:hex?","residuals:[closing_residual]","legs:[closing_leg]","review_digest:hex","proposal_digest:hex","bytes:hex","file:string?","scope:string"]

[[event]]
name = "closing_noop"
book = true
doc = "The selected nominal balances, including previous Closing legs, have no residual. No entry, review file, approval, certificate or metadata was published; latest_close may be null when no first close exists."
fields = ["fiscal_year:int","period:string","known_at:seq","latest_close:hex?","reason:string"]

[[event]]
name = "close_verified"
book = true
doc = "Verification refolded native and retained functional nominal balances at the latest Closing and at the selected prefix. Success requires nominal_zero_at_close=true in both bases and needs_reclose=false. Missing closing evidence, invalid closing balances or later native or functional residuals instead produce an exit-8 verification error carrying the same detail."
fields = ["fiscal_year:int","known_at:seq","base_unit:string","valuation_basis:string","latest_close:hex?","last_closed_at:seq?","nominal_zero_at_close:bool?","needs_reclose:bool","residuals:[closing_residual]"]

[[shape]]
name = "closing_route"
doc = "One nominal posting account's explicitly journaled Equity destination."
fields = ["account:string","account_vid:hex","closes_to:string","equity_vid:hex"]

[[shape]]
name = "closing_residual"
doc = "Exact debit-minus-credit nominal balances before close, preserving native unit, retained functional amount and optional legal entity. closes_to is the destination Equity account VID. Native net and base_net can have different signs or one can be zero; the source-derived closing legs preserve both balances without choosing a new rate."
fields = ["account:string","account_vid:hex","closes_to:hex","entity:hex?","unit_id:int","net:amount","base_net:amount"]

[[shape]]
name = "closing_leg"
doc = "One exact proposed closing leg, with its native amount and retained functional amount. base_amount is null for legacy native-only closing; the native base currency then folds at par. Multiple source carrying buckets can require opposite sides on the same account even when its aggregate native residual is zero."
fields = ["ordinal:int","account:string","account_vid:hex","side:string","amount:amount","base_amount:amount?"]

[[shape]]
name = "bank_import_predecessor"
doc = "The immediate predecessor verified from its retained original statement, canonical manifest and native ImportRun receipt. This records structural statement continuity, not a reconciliation confirmation."
fields = ["manifest_oid:hex","manifest_commit:hex","statement_oid:hex","statement_commit:hex","import_run:hex","receipt_hash:hex","recorded_at:seq","sequence_number:int","statement_date:date","closing_balance:amount"]

[[event]]
name = "production_opened"
book = true
doc = "A matter's production profile was journaled by a ProductionControl Open record (or the identical profile was already open: then nothing was written). Its Bates numbering starts at first_bates and is never restarted."
fields = ["production:production_summary", "control_entry:hex", "recorded_at:seq", "already_recorded:bool"]

[[event]]
name = "productions"
book = true
doc = "Every matter's production profile, by opening sequence."
fields = ["productions:[production_summary]"]

[[event]]
name = "production_detail"
book = true
doc = "One matter's production profile and every Bates range its Produce records assigned, ascending."
fields = ["production:production_summary", "ranges:[bates_range]"]

[[event]]
name = "document_bates_ranges"
book = true
doc = "One document's Bates range in every matter that produced it, by matter (plan §13.2); empty when no matter has."
fields = ["document:hex", "ranges:[matter_bates_range]"]

[[event]]
name = "production_recorded"
book = true
doc = "A production: every named document's range in argument order (assigned is false for a document the matter produced before), the Produce record that numbered the new ones (null when nothing new was numbered: then nothing was written), and the files written into the new volume directory."
fields = ["matter:string", "record:hex?", "recorded_at:seq?", "already_recorded:bool", "next_bates:string", "volume:string", "out:string", "ranges:[produced_range]", "privilege_log:[privilege_row]", "bundle:production_bundle?", "files:[production_file]"]

[[shape]]
name = "production_summary"
doc = "A matter's production profile as its ProductionControl records state it (plan §13.2, Appendix A ProductionProfile)."
fields = ["matter:string", "profile:hex", "bates_prefix:string", "first_bates:int", "next_bates:int", "load_file:string", "protective_order:hex?", "state:string", "opened_at:seq", "opened_by:hex", "documents:int"]

[[shape]]
name = "bates_range"
doc = "One document's Bates range in a matter and the Produce record that assigned it. doc_commit is the document's unchanged public commitment."
fields = ["document:hex", "doc_commit:hex", "beg_bates:string", "end_bates:string", "pages:int", "designation:string", "record:hex", "recorded_at:seq", "produced_by:hex"]

[[shape]]
name = "matter_bates_range"
doc = "One matter's Bates range for a document."
fields = ["matter:string", "document:hex", "doc_commit:hex", "beg_bates:string", "end_bates:string", "pages:int", "designation:string", "record:hex", "recorded_at:seq", "produced_by:hex"]

[[shape]]
name = "produced_range"
doc = "One document of a production volume: its range, whether this production numbered it, whether it ships only as a redacted listing, and its native path in the volume (null when redacted)."
fields = ["document:hex", "beg_bates:string", "end_bates:string", "pages:int", "designation:string", "assigned:bool", "redacted:bool", "native:string?"]

[[shape]]
name = "privilege_row"
doc = "One privilege-log row (plan §13.2): a produced document delivered only redacted (bates is its range) or a document withheld in full (bates is null), with the producer's claim; date is null when no claim states it. treatment is WITHHELD_IN_FULL or REDACTED_IN_PART(contract=…, withheld_chunks=…/…)."
fields = ["document:hex", "doc_commit:hex", "bates:string?", "date:date?", "author:string", "recipients:[string]", "description:string", "basis:string", "treatment:string"]

[[shape]]
name = "production_bundle"
doc = "A bundle-scoped production's evidence bundle: its digest, the recorded checkpoint it was produced against, the book's checkpoint signing key (fa-verify's --key) and the exact offline verification command for the volume's .fab and .receipt."
fields = ["digest:hex", "checkpoint:hex", "checkpoint_public_key:hex", "verify:string"]

[[shape]]
name = "checkpoint_state"
doc = "One journaled accumulator state: its oid, the commit that recorded it, the entry prefix it covers (through_seq), its leaf count, its evidence boundary (null: entries alone), root and predecessor."
fields = ["oid:hex", "recorded_at:seq", "through_seq:seq", "leaf_count:int", "evidence_after_seq:seq?", "root:hex", "prev_state_oid:hex?"]

[[shape]]
name = "calendar_period"
doc = "A period the calendar generates: code, ordinal in its fiscal year, kind, civil bounds and whether the book has recorded it."
fields = ["code:string", "ordinal:int", "kind:string", "start:date", "end:date", "created:bool"]

[[shape]]
name = "verify_target"
doc = "One target of fa verify book: its name, its verdict (pass, fail, error or skipped) and the failure or skip reason (empty on pass)."
fields = ["target:string", "verdict:string", "detail:string"]

[[shape]]
name = "law_row"
doc = "A registered law: its family (rounding, allocation, conversion, fx, lot, tracing), id, name, optional version, and every other registry field as key/value text, in key order."
fields = ["family:string", "id:int", "name:string", "version:int?", "attributes:[law_attribute]"]

[[shape]]
name = "law_attribute"
doc = "One field of a law's registry row, rendered as text (arrays joined with commas)."
fields = ["key:string", "value:string"]

[[shape]]
name = "unit_row"
doc = "A unit version: id, code, version, immutable scale, kind, ISO 4217 number (null when none) and the name of its default rounding law."
fields = ["id:int", "code:string", "version:int", "scale:int", "kind:string", "iso4217:int?", "rounding_default:string?"]

[[shape]]
name = "restatement_case"
doc = "A restatement case (plan §8.3): its number and vertex, kind, state, the periods it affects, its optional narrative document, its determination (day and authority document), its rehearsal, its approved manifest, the entries it posted, its disclosure and every journaled transition in commit order."
fields = ["case:int", "vid:hex", "kind:string", "state:string", "periods:[string]", "narrative:hex?", "determination:case_determination?", "rehearsal:case_rehearsal?", "approval:case_approval?", "posted:[case_posted_entry]", "disclosure:case_disclosure?", "transitions:[case_transition]"]

[[shape]]
name = "case_manifest_entry"
doc = "One entry a case will post: the scenario's Plan record, the digest of its intent and the principal who planned it."
fields = ["plan:hex", "intent:hex", "planner:hex"]

[[shape]]
name = "case_disclosure"
doc = "A case's disclosure: the Disclosure document and the Reviewed attestation over it."
fields = ["document:hex", "attestation:hex"]

[[shape]]
name = "case_posted_entry"
doc = "One entry a case posted: the scenario's Plan record it derives from, the entry and its digest."
fields = ["plan:hex", "entry:hex", "entry_digest:hex"]

[[shape]]
name = "case_approval"
doc = "A case's approved effect manifest: its digest, its entries and the Approval vertices the Approve record cites."
fields = ["digest:hex?", "entries:[case_manifest_entry]", "approvals:[hex]"]

[[shape]]
name = "case_rehearsal"
doc = "A case's rehearsal: the scenario the correction ran on, the digest of its diff certificate (retained in the book), the trunk sequence the scenario forked at, the periods the diff covers and the scenario's Plan records it covers, in planning order (the entries the case will post)."
fields = ["scenario:string", "certificate:hex", "fork_at:seq", "periods:[string]", "intents:[hex]"]

[[shape]]
name = "case_determination"
doc = "When a case's determination was made and the document recording its authority."
fields = ["day:date", "authority:hex"]

[[shape]]
name = "case_transition"
doc = "One journaled CaseControl transition: from (null for the Open record), to, its record, sequence and principal."
fields = ["from:string?", "to:string", "control_entry:hex", "recorded_at:seq", "principal:hex"]

[[shape]]
name = "statement_issuance"
doc = "One statement issuance: its vertex, period and ordinal, the statement definition, the retained certificate it issued with that certificate's known-at (certified_at), the audience and the optional transmittal document. control_entry, recorded_at, principal and approvals are those of its IssuanceControl record, null in a plan."
fields = ["issuance:hex", "period:string", "ordinal:int", "definition:string", "definition_version:int", "definition_digest:hex", "certificate:hex", "certified_at:seq", "issued_to:string", "document:hex?", "control_entry:hex?", "recorded_at:seq?", "principal:hex?", "approvals:int?"]

[[shape]]
name = "access_event"
doc = "One recorded read: vid and digest of the record, the sequence it was recorded at and the head it observed, the principal (vid and name), capability commitment and ops, the command and the digest of its arguments."
fields = ["vid:hex", "recorded_at:seq", "observed_at:seq", "principal:hex", "principal_name:string", "capability:hex", "ops:[string]", "command:string", "request_digest:hex", "digest:hex"]

[[shape]]
name = "presented_unit"
doc = "One unit of a presented statement: the divisor applied to exact mantissas, the presented statement's digest, and its lines in definition order with residual lines inserted."
fields = ["unit:string", "divisor:int", "digest:hex", "lines:[presented_line]"]

[[shape]]
name = "presented_line"
doc = "A presented statement line: presented integers per column, the exact rounding error per column, and whether it is an explicit presentation-rounding residual line."
fields = ["code:string", "label:string", "presented:[int]", "rounding_error:[amount]", "residual:bool"]

[[shape]]
name = "refusal_object"
doc = "Plan Appendix D refusal object: the instance id, catalog code, exit, what failed, where, why, the structured fix, alternative commands and the docs command."
fields = ["id:string", "code:string", "exit:int", "what_failed:string", "where:object", "why:object", "fix:refusal_fix", "alternatives:[string]", "docs:string"]

[[shape]]
name = "refusal_fix"
doc = "A refusal's fix: the prose, the first parseable `fa` command it names (whole line and argv after `fa`), the field change that satisfies the law, and the arguments that, added to the same command, make it admissible (`--yes`, `--grant <op>`; null when none do or in a launch-bound session)."
fields = ["text:string", "command:string?", "argv:[string]?", "or_field_change:refusal_field_change?", "rerun_with:[string]?"]

[[shape]]
name = "refusal_field_change"
doc = "The field to change and the values it admits, best match first."
fields = ["field:string", "one_of:[string]"]

[[shape]]
name = "statement_lint_overlap"
doc = "A covered leaf two or more definition lines map, with those lines."
fields = ["account:string", "lines:[string]"]

[[shape]]
name = "statement_lint_mapping"
doc = "A covered leaf and the one definition line that maps it."
fields = ["account:string", "line:string"]

[[shape]]
name = "fx_conversion_drift"
doc = "One FX-valued entry whose recorded valuation does not recompute: its vid, recording sequence, the FX law its base totals name and why."
fields = ["entry:hex", "recorded_at:seq", "law:string", "problem:string"]

[[shape]]
name = "production_file"
doc = "One file written into the production volume directory: its path inside the volume, size and BLAKE3 digest under fa:production-file:v1."
fields = ["name:string", "bytes:int", "digest:hex"]

# ---------------------------------------------------------------------------
# Launch-bound command authority (plan §14.2–§14.4, §15.1; bead fa-mg2j).
# ---------------------------------------------------------------------------
# The capability operations a launch-bound session (MCP, `fa --token`, fad
# tokens) must hold to run a command, as one ordered rule list read by
# `fa_cli::cli::bound_command_ops` on every bound route. The first rule whose
# conditions all hold decides; a command no rule decides is not admitted on
# the bound route (host-only: book create, chart import, period births and
# transitions, capability issue, party identifiers, bank unmatch, demo init,
# recover projections, ...).
#
# A rule names `verbs` and may narrow them by `subcommands`, `args` (the
# second positional), `when_all` (every flag or switch present), `when_any`
# (at least one present), `unless_any` (none present) and `flag`/`values` (a
# value flag's value). `ops` are capability op names from
# registries/capability_caveats.toml; an empty list reads nothing from a
# book. fa-verbs validates every verb, subcommand, flag and op a rule names;
# fa-cli tests/write_authority.rs pins every writing command's ops.
#
# Scope caveats (accounts, periods, effective, known_at, branch; plan §14.2)
# are judged before the book is opened (doctrine 8, fa-0x0). A rule with
# `reach = "judged"` names commands that judge them against exactly what they
# reach (Book::read_scope, before any query). Every other command that reads
# a book reaches all of it at the head, so a token carrying any scope caveat
# is refused on the bound route, never answered with a filtered result.

# Plans and dry runs of period transitions publish nothing.
[[bound]]
verbs = ["period"]
subcommands = ["open", "soft-close", "close", "lock", "reopen"]
when_any = ["--plan-out", "--dry-run"]
unless_any = ["--plan", "--approval"]
ops = ["read"]


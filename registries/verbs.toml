fields = ["entry:hex", "entry_digest:hex", "qty_ordinal:int", "cost_ordinal:int", "side:string", "effective_date:date", "recorded_at:seq", "original_quantity:amount", "relieved_quantity:amount", "open_quantity:amount", "original_cost:amount", "relieved_cost:amount", "open_cost:amount", "relieves:[lot_relief]"]

[[shape]]
name = "lot_relief"
doc = "One disposal application (`RELIEVES {quantity, cost}`) against a lot; `live` is false when a reversal (`UNSETTLES`) undid the relief."
fields = ["disposal_entry:hex", "qty_ordinal:int", "cost_ordinal:int?", "quantity:amount", "cost:amount", "recorded_at:seq", "live:bool"]

[[shape]]
name = "lot_disposal_plan"
doc = "A deterministic lot disposal relief plan under `FIFO`, `LIFO`, `SpecificId`, or `WeightedAverage` (`lot_laws.toml`, plan §6.5), with exact per-lot slices and `wac_residual_numerator`."
fields = ["law:string", "regime:string", "rounding_law:string", "total_quantity:amount", "total_cost:amount", "wac_residual_numerator:int", "slices:[lot_disposal_slice]"]

[[shape]]
name = "lot_disposal_slice"
doc = "One lot slice relieved by a planned disposal, with before/after open quantities and costs."
fields = ["entry:hex", "entry_digest:hex", "qty_ordinal:int", "cost_ordinal:int", "effective_date:date", "recorded_at:seq", "quantity_relieved:amount", "cost_relieved:amount", "open_quantity_before:amount", "open_quantity_after:amount", "open_cost_before:amount", "open_cost_after:amount"]

[[shape]]
name = "lineage_step"
doc = "One entry in a `SUPERSEDES` lineage component, with its liveness and supersession links and registered netting laws. reverses_reversal flags an entry that reverses a Reversal, reviving what that reversal negated (plan §8.2)."
fields = ["entry:hex", "entry_digest:hex", "class:string", "effective_date:date", "recorded_at:seq", "live:bool", "reverses_reversal:bool", "supersedes:[lineage_edge]"]

[[shape]]
name = "lineage_edge"
doc = "One `SUPERSEDES` edge with its registered `netting_law` (`supersession_kinds.toml`)."
fields = ["target:hex", "kind:string", "netting_law:string", "reason_code:int", "reason:string?"]

[[shape]]
name = "lineage_net_cell"
doc = "Net economic effect `(debit - credit)` of a `SUPERSEDES` lineage component on one `(account, unit)` cell."
fields = ["account:string", "account_vid:hex", "account_name:string", "unit:string", "debits:amount", "credits:amount", "net:amount"]

# ---------------------------------------------------------------------------
# MCP (plan §15.4, bead fa-xex): this registry as tool clusters.
# ---------------------------------------------------------------------------
# fa-mcp exposes every [[verb]] (and every subcommand) above as a tool in
# exactly one cluster of at most `max_tools_per_cluster` tools, or lists it
# under [[mcp.excluded]] with the reason — host-only or interactive verbs only.
# The fa-mcp parity test fails on a verb or subcommand that is neither, on one
# that is both, on one covered by two tools, on a cluster over the limit, and
# on a tool naming a verb or subcommand this registry lacks. Only verbs that
# exist today are mapped; the plan's remaining clusters appear with their verbs.
#
# A tool's wire name is its cluster with `.` → `_`, then `_`, then its name
# (`fa.read` + `trial_balance` = `fa_read_trial_balance`): hosts restrict tool
# names to [A-Za-z0-9_-]. A tool's arguments are the verb's value flags without
# the dashes (`--as-known-at` → `as_known_at`), its switches as booleans, the
# positionals named in `positionals` (a trailing `?` marks an optional one),
# `selector` (which subcommand, when the tool covers several). Authority and
# book selection are fixed at trusted launch: `as`, `grant`, `yes`, `keys`,
# `book`, `principal`, `profile` and `via` are forbidden call properties.
# `stdin_property` is a
# JSON property the server forwards on stdin as the `-` argument of
# `stdin_via` (a flag, or a positional's name); the flag or positional keeps
# its string (path) form beside it. `required` names flags and positionals the
# host must supply. `flags`/`switches`, when present, narrow the verb's lists
# to what the covered subcommands read. `dont` and `mistakes` are the tool's
# own lines of the generated Do / Don't / Discovery / Examples / Common
# mistakes documentation; the rest is derived from the verb row, the
# [[dangerous]] rows, the [[next_action]] rows and the detectors. Amounts
# cross the boundary only as strings with their unit (plan §15.4); the server's
# mistake detectors refuse a JSON number in an amount field, an instant where
# a civil date is required, a placeholder, a posting leg on a summary account,
# a re-dated intent after a period-law refusal, and a self-approval, before
# anything is dispatched.

[mcp]
server = "fa-mcp"
max_tools_per_cluster = 7
# The server fixes authority and book selection once; it never forwards caller grants.
hidden_flags = ["--json", "--format", "--via", "--no-color", "--help", "--version", "--as", "--grant", "--yes", "--keys", "--book", "--token"]
# Flags that may repeat: the property is an array of strings (one string is accepted too).
repeat_flags = ["--evidence", "--approval", "--period", "--param", "--entry", "--balance", "--root", "--bucket", "--income-period", "--chunk", "--subject", "--against", "--target", "--participant", "--resource", "--external-id", "--entity", "--line", "--applies", "--route", "--band", "--issuance", "--distribution", "--definition", "--claim", "--turned-around", "--corrected"]
# Flags whose values are integers: the property accepts a JSON integer or its decimal string.
integer_flags = ["--start", "--fiscal-year", "--year-start-month", "--adjustment-periods", "--reason", "--balancing", "--timeout-ns", "--before", "--after", "--max-publications", "--chunk", "--seed", "--size", "--confidence", "--date-window", "--page-size", "--line-ordinal", "--source-known-at", "--max-depth", "--budget"]

[[mcp.cluster]]
name = "fa.orient"
doc = "Where to start: what this build can do, the in-tool documentation, one verb's usage."

[[mcp.cluster]]
name = "fa.book"
doc = "A book as a whole: create or describe it, publish a checkpoint, verify derived state against the journal, rebuild registers."

[[mcp.cluster]]
name = "fa.chart"
doc = "The chart of accounts: install it as one journaled schema effect, or list it."

[[mcp.cluster]]
name = "fa.draft"
on_demand = true
doc = "Drafts (plan §15.2): an Agent opens an intent log, plans intents into it (each rehearsed under every posting law), inspects or discards it. Promotion to trunk is a Human approver's host-side act."

[[mcp.cluster]]
name = "fa.scenario"
on_demand = true
doc = "Scenarios (plan §15.2, §15.6.5): fork a counterfactual over a fixed trunk prefix, run intents in it (each rehearsed on its scratch materialization), and diff it against trunk per account and unit. A scenario never posts to trunk."

[[mcp.cluster]]
name = "fa.post"
doc = "Posting under the accounting laws: entries, two-phase holds and their resolutions, with explicit dry-run plans and exact plan commits. Every amount is a string with its unit; nothing is auto-balanced."

[[mcp.cluster]]
name = "fa.read"
doc = "Certified reads over the journal: trial balance, financial statements, an explained balance, open items, one entry."

[[mcp.cluster]]
name = "fa.time"
doc = "Period law: create a fiscal year's periods, list them, move one along the state machine, approve a planned transition."

[[mcp.cluster]]
name = "fa.evidence"
on_demand = true
doc = "Evidence: record a source document, content-addressed, so an entry can cite it."

[[mcp.cluster]]
name = "fa.fx"
on_demand = true
doc = "Retained FX evidence, effective revaluation routes, and source-derived period-end adjustments. Rates retain the authenticated uploader's grade. Functional stock and activity are read through fa_read_trial_balance; revaluation review preserves exact PostIntent bytes for native admission."

[[mcp.cluster]]
name = "fa.rea"
on_demand = true
doc = "REA parties and instruments (plan §4.1, §4.5): record them, relate parties by a registered basis, and list them, so events can name participants and resources and the related-party procedures have a graph."
[[mcp.cluster]]
name = "fa.io"
on_demand = true
doc = "Interop exports (plan §8.6, §15.9): the committed journal at one coordinate as the AICPA ADS GL package, OECD SAF-T, a CSV GL extract, Beancount, hledger or an NDJSON GL stream, returned inline with its export coordinate certificate."
[[mcp.cluster]]
name = "fa.billing"
on_demand = true
doc = "Customer invoices, vendor bills, receipts and payments (plan §15.3, Appendix B): typed sugar over fa.post's entry intent. The caller names every account; no posting rule or tax is inferred; dry_run returns the plan."
[[mcp.cluster]]
name = "fa.adjust"
on_demand = true
doc = "Accruals, deferrals and atomic batches (plan §15.3, Appendix B): typed sugar over fa.post's entry and batch intents. An accrual or deferral is an Adjusting entry with an optional scheduled reversal; a batch commits every member or none. On demand (fa-mcp --cluster fa.adjust): the default surface is at its 40-tool limit."
[[mcp.cluster]]
name = "fa.proof"
on_demand = true
doc = "General-ledger views at one coordinate (detail, roll-forward, aging, cash flow, lots) that reconcile to the journal fold."
[[mcp.cluster]]
name = "fa.findings"
on_demand = true
doc = "Discover recorded forensic runs with bounded cursor pages, then inspect retained certified findings, independent append-only human decisions, and deterministic numbered workpapers. Finding lists select an explicit certified run; replay can bind an independently requested source and review cutoff."

[[mcp.cluster]]
name = "fa.bank"
on_demand = true
doc = "Bank source intake, exact matches and corrections, immutable decision history, and statement-close metadata with later drift. History and reconciliation require Read and Reconcile and verify native facts without opening bank files. Source replay requires full disclosure authority that current MCP launch templates cannot hold. Human host operators perform releases and attest exact closes; those closes protect the cash account through the statement date."

[[mcp.cluster]]
name = "fa.close"
on_demand = true
doc = "Rehearse an existing draft atomically and retain its exact balance comparison, inspect journaled closing routes, and verify the last mechanical close. Actual routing changes, year-end close publication and draft promotion remain independently authorized host operations."

[[mcp.cluster]]
name = "fa.notary"
on_demand = true
doc = "Portable accounting proofs from recorded checkpoints (signed by the book's key, or raw statements) and evidence bundles, checked independently without book keys (plan §15.4: discoverable on demand)."


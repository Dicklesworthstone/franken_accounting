[[mcp.tool]]
cluster = "fa.proof"
name = "gl"
verb = "gl"
subcommands = ["detail", "roll-forward", "aging", "cash-flow", "lots"]
selector = "view"
positionals = []
flags = ["--account", "--unit", "--from", "--to", "--label", "--as-of", "--bucket", "--policy", "--income-period", "--relieve", "--law", "--regime", "--rounding-law", "--target", "--as-known-at", "--branch"]
switches = ["--reconcile", "--indirect", "--certify"]
stdin_property = "policy"
stdin_kind = "object"
stdin_via = "--policy"
required = []
dont = ["Don't treat running balances as balances known on each movement's recorded day: they are effective-date running balances at the selected known-at snapshot.","Don't invent a balancing plug in a cash-flow policy: every selected cash leg (or indirect non-cash adjustment) must be explicitly classified and tie out to the native fold.","Use certify: true on detail, roll-forward, aging (including reconcile) or cash-flow (including indirect) to retain the complete source artifact and receive its digest and complete bytes inline. This requires read and produce; fa_read_replay accepts the digest after restart. Detail uses the complete roll-forward source certificate.","Uncertified RFC3339 as_known_at queries resolve retained TimeEvidence ticks and disclose their original resolution and brackets. With certify: true, as_known_at must be HEAD or a commit sequence: the GL certificate format cannot retain an instant-resolution witness. Run the instant query without certification first, then use its resolved_seq to certify that journal prefix.","For detailed ledger lines, the replay_command includes view detail and all explicit original request selections. Supply those independently reviewed expectations to fa_read_replay; the certificate remains the original complete roll-forward source.", "An inline policy with splits partitions original cash legs into portions. Every portion amount must be an exact unit-tagged string in the cited leg's actual currency; portions total that leg exactly and each split records a reason. Splits cannot combine with assignments, account_rules or indirect. Certify and replay use the complete split-cash-flow expectation with an independently fixed numeric known_at; both paths check currency against the original native leg."]
mistakes = ["Passing policy_file: MCP refuses host filesystem paths; supply the policy object inline as policy.", "Running view aging with reconcile: true without an explicit account code.", "Certifying lots is unsupported. Cash-flow and aging reconciliation replay requires the original independently selected request in the expect JSON string."]


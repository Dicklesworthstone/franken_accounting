[[verb]]
name = "finding"
summary = "Discover recorded forensic runs, record a certified run, inspect its immutable findings, append independent human reviews, and export or replay numbered workpapers."
writes = true
subcommands = ["record", "runs", "list", "show", "review", "export", "replay"]
flags = ["--certificate", "--param", "--account", "--source", "--effective-through", "--known-at", "--as-known-at", "--page-size", "--cursor", "--action", "--note", "--dismissal-reason", "--previous", "--evidence", "--export-format", "--out"]
switches = ["--include-reviews"]
events = ["findings_recorded", "finding_runs", "finding_list", "finding_shown", "finding_reviewed", "finding_exported", "finding_replayed"]
exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["finding record <procedure-id> [--param <name=integer>]... [--account <code>] [--source E:<vid>] [--known-at HEAD|<seq>] [--effective-through YYYY-MM-DD]", "finding record --certificate C:<digest>   (the exact idempotent retry; a new run at HEAD may select a later source prefix)", "finding runs [--page-size 1..32] [--cursor <192-hex>] [--known-at HEAD|<seq>]   (discover recorded runs; default page size 16)", "finding list --certificate C:<digest> [--known-at HEAD|<seq>]   (every finding in this certified run, not a global inventory)", "finding show F:<vid> [--known-at HEAD|<seq>]", "finding review F:<vid> --action acknowledge|dismiss|reopen --note <text> [--previous R:<latest-review>] [--dismissal-reason explained|duplicate|data-quality|outside-scope|other] [--evidence D:<oid>]...", "finding export --certificate C:<digest> [--export-format md|jsonl|canonical] [--include-reviews [--known-at HEAD|<seq>]] [--out <new-file>]", "finding replay <canonical-workpaper|-> [--certificate C:<expected-digest> --known-at <exact-seq>]", "Recording and exporting require read and produce; discovering runs, listing, showing and replaying require read. Review requires a Human with read and approve who is independent of the run producer. Dismissal also requires a registered reason and retained evidence. Supply the current --previous after the first decision; stale decisions refuse instead of overwriting history.", "Run discovery has scope recorded-runs: total_recorded_runs counts the structurally checked inventory at known_at; only summaries in the returned page also undergo full certificate and computation replay. It establishes neither current review status nor complete detector coverage. Pass next_cursor unchanged to continue the same book and inventory: omitted known_at or HEAD inherits the cursor cutoff; an explicit sequence must equal it. Current authority is always rechecked, and checked_through names the current validation frontier.", "The original numbered workpaper remains unchanged when later reviews are appended. --include-reviews adds a separate review appendix with its own fixed cutoff. Canonical exports replay against retained native evidence; Markdown and JSONL are presentations. Recipient-bound replay requires both the independently expected certificate and exact review cutoff; replay without them states its as-supplied historical scope. Complete responses refuse if they exceed transport limits, never truncate."]
example = "fa finding record jet.round_amounts --book ./books/myco --json"

[[verb]]
name = "bank"
summary = "Retain bank statements, replay exact cash-leg proposals, explicitly confirm reviewed selections, and inspect immutable confirmation history."
writes = true
subcommands = ["import", "match", "confirm", "status"]
flags = ["--previous-import", "--bank-format", "--account", "--import", "--date-window", "--as-known-at", "--grant", "--line-ordinal", "--proposal-digest", "--source-known-at", "--proposer"]
switches = []
events = ["bank_imported", "bank_matches_proposed", "bank_match_confirmed", "bank_confirmation_status"]
exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["bank import <statement|-> --bank-format camt053|camt052|bai2|ofx|mt940|csv --account <cash-account-code> [--previous-import <manifest_oid> --grant privileged]", "bank match --import <manifest_oid> [--date-window <days>] [--as-known-at HEAD|<seq>|<RFC3339>]", "bank confirm --import <manifest_oid> --line-ordinal <ordinal> --proposal-digest <hex64> --source-known-at <exact-seq> --proposer <hex32> [--date-window <days>] --grant privileged", "bank status --import <manifest_oid> --grant privileged [--as-known-at HEAD|<seq>|<RFC3339>]", "Import requires read, post and reconcile and one debit-normal Asset leaf in the statement currency. Original bytes, canonical lines and the parser/account manifest are retained atomically with the native import receipt; an exact repeat returns the existing receipt.", "Match requires read and reconcile. It reopens and verifies the retained source closure, then proposes exact amount, date and reference matches against cash-leg memos; the default date window is 3 days. Complete decision cards and stable leg identities explain every proposal. eligible_candidate_count and competing_bank_lines expose ties before consumption; ambiguous proposals and unmatched lines competing for one cash leg require review. Proposals remain unconfirmed and create no monetary entry or match confirmation.", "Matching replays the complete original BankStatement and requires authority to disclose its full source; a redacted view is insufficient. An embedded-owner operator explicitly opts in with fa bank match --import <manifest_oid> --grant privileged. Reading the original source similarly uses fa document read <statement_oid> --grant privileged. Current MCP launch templates cannot hold privileged: fa_bank_match refuses governed BankStatement sources, so an independently authorized operator must perform those matches.", "The response names its inclusive candidate window. Outstanding means unmatched cash legs in that window, never a complete reconciliation inventory; an empty statement has no candidate window. The closing difference separately compares the statement balance with the journal's closing balance. Wire formats accept the bounded profiles documented by fa-formats and refuse ambiguous sources; unlinked imports remain explicitly unlinked.", "An explicit previous import replays its complete retained chain before publication. The bank/instrument identity, mapped cash account, currency, checked next sequence, opening-to-prior-closing balance and statement date order must agree. Cross-uploader exact repeats return the original receipt; a competing predecessor for the same statement/account refuses atomically. The bounded chain ends at an explicitly unlinked retained statement. continuity=verified_predecessor is structural evidence, never a confirmed match or reconciliation.", "An unambiguous match row includes proposer and confirmation_command. Confirmation reconstructs the complete selected proposal at source_known_at, verifies its digest and source closure, then atomically records the exact original cash-leg ordinal and an exclusive line/leg claim. Current Human read, reconcile and full-source authority are required. The recorded confirmer is distinct from the proposer preserved in the proposal bytes; those bytes are not a separate signed preparation event. An exact retry returns the original immutable receipt even under a different authorized reviewer. Conflicting or ambiguous selections refuse; no amount, fee or residual is posted.", "Status replays the retained source and inventories native confirmation births at the selected prefix. It reports original confirming principals, exact source coordinates and remaining lines. Removed or edited records fail verification. Later reversals do not erase a recorded confirmation; scope remains recorded_confirmations and reconciled_through remains null. A complete live reconciliation, closing-balance attestation, supersession and posting soft lock require their own native operations.", "Confirm and status also need complete governed BankStatement replay. An embedded owner must explicitly opt into --grant privileged. Current MCP launch ceilings cannot hold privileged, so the on-demand tools refuse these governed sources; per-call arguments cannot widen launch authority."]
example = "fa bank import statement.xml --bank-format camt053 --account 1000 --book ./books/myco --json"

[[verb]]
name = "export"
summary = "Export the committed journal at one coordinate in an interop format (plan §8.6, §15.9): the AICPA ADS GL package, OECD SAF-T, a CSV GL extract, Beancount or hledger, each with its export coordinate certificate."
writes = false
subcommands = ["ads", "saft", "csv-gl", "beancount", "hledger", "ndjson"]
flags = ["--period", "--as-of", "--as-known-at", "--out", "--grant"]
switches = []
events = ["journal_exported"]
exits = [0, 2, 3, 4, 5, 7]
usage = ["export ads|saft|csv-gl|beancount|hledger|ndjson (--period <code> | --as-of YYYY-MM-DD) [--as-known-at HEAD|<seq>|<RFC3339>] [--out <new path>]", "The export selects what the trial balance folds: every entry visible at the known-at prefix whose effective date is on or before --as-of (or the period's last day), with legs and not a pending hold. Refolding the exported legs gives the stock trial balance at that coordinate. Every format writes the same selection. ndjson is the streaming GL detail: a gl_stream_header coordinate row, one gl_detail_row per leg, and a gl_stream_footer with the row count and refold digest.", "ads writes four tables (Chart_of_Accounts, GL_Detail, Trial_Balance, ADS_Coordinate_Certificate.toml); its --out names a new directory. The other formats write one file. Without --out the content is returned inline; an export too large for the inline transport is refused, never truncated.", "Descriptions, leg memos and migration source ids are opened with the book's key; an erased field exports empty. Requires read and produce: an export discloses the journal."]
example = "fa export ads --period FY2026-P03 --out ./ads-2026-03 --book ./books/myco --json"

[[verb]]
name = "verify"
summary = "Verify derived state against the journal: leg projections, refolded registers, cumulative daily usage, open-item applied mirrors, limited accounts' availability cells, scheduled reversals, complete native period history, accumulator states, or a replay of the whole history (exit 8 on drift)."
writes = false
subcommands = ["registers", "open-items", "availability", "usage", "accumulator", "projections", "schedules", "periods", "replay", "close"]
flags = ["--period", "--fiscal-year", "--as-known-at"]
switches = []
events = ["registers_verified", "open_items_verified", "availability_verified", "usage_verified", "accumulator_verified", "projections_verified", "schedules_verified", "periods_verified", "replay_verified", "close_verified"]
exits = [0, 2, 3, 4, 5, 6, 7, 8]
usage = ["verify close FY2026 [--as-known-at <sequence>] (check nominal-zero at the last Closing and later deltas at that recorded prefix; exit 8 when a close or reclose is needed)", "verify registers ((--period <code>)... | --fiscal-year N)   (also verifies cumulative daily usage at current head before checking the selected period folds)", "verify usage [--as-known-at HEAD|<seq>|<RFC3339>]   (refold every native daily charge and UsageCell from retained history at the selected prefix, including original issuance, gross-debit source entries and committed time witnesses; requires current whole-book read and verify authority; no period filter, no writes or implicit repair; FA-REF-167, exit 8 on drift)", "verify replay   (replays every accounting commit's recorded rows into a fresh scratch book and checks it against the source pair by pair: the same entries with the same digests, and the same period folds. It proves the retained history reproduces the book's accounting state, not that the posting laws hold: rows are copied, not re-posted, and both sides fold with the same code. No period filter; exit 8 on any difference; history the scratch replay cannot reproduce, a divergence included, is FA-REF-134, exit 5)", "verify open-items", "verify availability", "verify accumulator (every recorded checkpoint; no period filter)", "verify projections (all entry payloads and leg topology at current head; no period filter)", "verify schedules (every Schedule vertex and SCHEDULED_BY mirror; no period filter)", "verify periods [--as-known-at HEAD|<seq>|<RFC3339>] (loads the complete native journal history through one selected prefix, verifies immutable Entry births, then checks every Period against its birth baseline and PeriodControl transitions; current read and verify authority required; no period filter; missing history or deleted declarations never produce a successful verification)"]
example = "fa verify registers --period FY2026-P03 --book ./books/myco"


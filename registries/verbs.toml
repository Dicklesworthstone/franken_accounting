fields = ["attestation_vid:hex", "asserter:hex", "reason_code:int", "reason:string?", "recorded_at:seq"]

[[shape]]
name = "provenance_closure"
doc = "An entry's provenance closure (plan §9.2, bead fa-ge0y): its members in canonical order and two fa:closure:v1 digests over (entry vid, entry digest, recorded_at, members): original_digest over the members recorded no later than the entry and not supplementary, digest over every member."
fields = ["digest:hex", "original_digest:hex", "members:[closure_member]"]

[[shape]]
name = "closure_member"
doc = "One provenance-closure member: its kind, its vertex (null for a reference such as an intent oid), its content digest (a document oid, an approval's, event's or superseded entry's digest, an origin's oid or digest), the citation role for a document, and the sequence that recorded it (null for a bare reference: the principal, the session, an origin without a vertex)."
fields = ["kind:string", "vid:hex?", "digest:hex?", "role:string?", "recorded_at:seq?"]

[[shape]]
name = "explained_admissibility_cell"

# verbs.toml — the single verb registry (plan §15.2–§15.3, Appendix D).
#
# One source for the `fa` CLI's verbs, subcommands, aliases, per-verb flags,
# help text, exit codes, and the robot-mode event schemas that
# `fa robot-docs schema` prints. The daemon (fa-i8j) and fa-mcp (fa-xex) are
# driven by and checked against this file.
#
# Consumer: fa-cli (dispatch, flag parsing and correction, `--help`,
# `fa capabilities`, `fa robot-docs schema`). Gate: the fa-cli parity tests
# fail when a registered verb or subcommand has no handler, a handler has no
# row, an emitted `--json` line does not match its event schema, or a
# declared event is never emitted by the binary tests. Retire: never (it is
# the contract); rows are additive, a removal is a breaking change.
#
# Field types: string · text (free-form, may span lines) · int · seq (a
# CommitSeq, ≥ 0) · bool · amount ("1500.00 USD": exact decimal, a space, the
# unit code) · date (YYYY-MM-DD) · hex (lowercase hexadecimal) · object (a map
# with data-dependent keys) · any · <shape> (an object with exactly the
# shape's fields) · [T] (an array of T) · T? (T or null). Every field is
# always present; absence is spelled null.
#
# Envelope (plan Appendix D, bead fa-12x): every robot-mode line carries the
# `[envelope]` fields beside its event's own fields, except the daemon's wire
# frames. An event marked `book = true` is always about one book, so its
# `coordinate` is never null; the robot-schema fixture pin
# (registries/robot_schema/<version>.jsonl) holds `fa robot-docs schema --json`
# byte for byte.

schema_version = 1

[envelope]
discriminator = "event"
version = 1
payload = "data"
fields = ["v:int", "book:hex?", "coordinate:coordinate?", "certificate:hex?", "authority:authority", "warnings:[string]", "next_actions:[next_action]"]
frames = ["fad_request", "fad_response"]
description = "Robot mode (--json), plan Appendix D: stdout carries one JSON object per line, {v, event, book, coordinate, data, certificate, authority, warnings, next_actions}. `event` names the schema of `data`; `v` is the envelope version. `book` and `coordinate` (branch, known_at, effective) are non-null on book events and may be null before a book opens. `certificate` is the replay certificate oid for certified reports and replay, otherwise null. Post plans identify their canonical artifact and authenticated certificate with data.plan_digest and data.certificate_digest; these are public digests, not native object-store OIDs. `authority` declares embedded-owner, mcp-launch-config or issued-token; MCP names its fixed principal, bounded launch template and exact ops; issued-token names a holder's journaled capability (fa --token, fa-mcp --token) and its exact ops, which the kernel admits only against its journaled issuance; owner ops are null because they are self-issued per command. Launch configuration does not authenticate the operator. `warnings` records non-refusal diagnostics. `next_actions` names follow-up commands and why; owner CLI calls use the same book, while MCP keeps its launch-bound book. Keys are sorted; amounts are exact strings with units, sequences are integers and dates are YYYY-MM-DD. Daemon wire frames are flat protocol objects without this envelope. stderr carries diagnostics; every nonzero command exit emits one error event containing class, exit and refusal_id."

[global]
flags = ["--book", "--keys", "--as", "--via", "--format", "--token"]
switches = ["--json", "--help", "--version", "--no-color", "--yes"]
events = ["version", "triage", "help", "error"]
# A mistyped verb, subcommand or flag within this edit distance gets a
# "did you mean"; correction only ever suggests, it never runs the guess.
correction_distance = 1
usage = "--book <dir> (or FA_BOOK) · --keys <file> (default <dir>/book.keys) · --json · --format json|toon|text · --as <principal> (default operator) · --token <file> (act as the holder of an issued capability token instead of --as/--grant: the session is bound to its journaled capability, directly or through the book's fad) · --via fad|direct (default: through the book's fad when one holds its writer lease) · --yes (confirm an operation that cannot be undone; `fa capabilities --json` lists them) · --no-color (also NO_COLOR, CI, TERM=dumb, or stdout not a terminal) · --help (also `fa <verb> --help`)"

# The fad daemon (plan §15.3, Appendix D, bead fa-i8j). One fad per book
# directory holds the book's writer lease (an OS lock on <dir>/<lease>, so a
# crashed daemon releases it) and serves `fa` over <dir>/<socket>. A frame is
# a 4-byte big-endian length then that many bytes of canonical JSON (sorted
# keys, integers only); the first frame on a connection is a fad_request, and
# every request gets exactly one fad_response. Every `fa` command that opens
# the book directly holds the same lease for its duration, so there is one
# writer per book at a time.

[daemon]
binary = "fad"
protocol = 1
socket = "fad.sock"
lease = "fad.lease"
max_frame_bytes = 67108864
idle_timeout_ms = 30000
tick_ns = 1000000000
sweep_batch = 64
clock_drift_ns = 250000000
verbs = ["serve", "status", "stop"]
flags = ["--book", "--keys", "--files-root", "--register-period"]
switches = ["--json", "--help", "--bootstrap-system"]
events = ["fad_request", "fad_response", "fad_serving", "fad_status", "fad_stopped"]
usage = ["fad serve --book <dir> [--keys <file>] [--files-root <dir>] [--bootstrap-system] [--register-period <code> ...] [--json]   (holds the writer lease and serves until `fad stop`)", "--files-root <dir> confines host file-reading and file-writing requests served over the daemon socket to an existing non-symlink directory; without it, file-reading and file-writing requests over fad are refused.", "--bootstrap-system opts the local book-key holder into daemon TimeEvidence and one bounded expiry batch plus one reversal batch per cycle. This is trusted local bootstrap authority, not journaled capability issuance. First/restart and uncorroborated clock observations never sweep. Batch sizes bound effects; candidate discovery still scans the book.", "--register-period selects 1..=64 distinct exact period codes at local launch and does not require --bootstrap-system. Derived-cache maintenance gets no System authority by itself; it attempts one period per cycle in round-robin order through the native maintainer. Adding --bootstrap-system separately enables TimeEvidence plus bounded expiry/reversal effects. Maintenance does not silently repair drift, change report semantics or certify a checkpoint. Unknown periods remain visible as per-period errors.", "fad status --book <dir> [--json]", "fad stop --book <dir> [--json]"]

# ---------------------------------------------------------------------------
# Verbs
# ---------------------------------------------------------------------------

[[verb]]
name = "book"
summary = "Create a book directory (store + key file), or describe one."
writes = true
subcommands = ["create", "info"]
flags = ["--name", "--base-unit", "--calendar", "--year-start-month", "--adjustment-periods", "--time-zone", "--opening-date", "--entity"]
switches = []
events = ["book_created", "book"]
exits = [0, 2, 3, 4, 5]
usage = ["book create --name \"My Co\" [--base-unit USD] [--calendar monthly|4-4-5|4-5-4|5-4-4|52-53[:last|nearest:<weekday>[:<month>]]] [--year-start-month 1] [--adjustment-periods 1] [--time-zone UTC] [--opening-date YYYY-MM-DD] [--entity <code>[:<name>][:<functional_unit>]]...", "--time-zone UTC records the explicit civil-day policy required by scheduled reversals. Omitting it leaves the policy unset; the machine's local zone is never assumed.", "book info"]
example = "fa book create --book ./books/myco --name \"My Co\" --json"

[[verb]]
name = "chart"
summary = "Install a chart of accounts as one journaled schema effect (from a file or an embedded template), list it, or list the templates."
writes = true
subcommands = ["import", "list", "templates", "open", "close", "promote"]
flags = ["--date", "--key", "--template", "--opened", "--closed", "--on"]
switches = []
events = ["chart_installed", "accounts", "chart_templates", "account_lifecycle"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["chart import (<chart.json> | --template <name>) [--date YYYY-MM-DD] [--key K]   (an account may carry lower_bound/upper_bound: \"0.00\" in its unit and normal-balance sign; \"unit\": \"base\" is the book's base unit)", "chart list", "chart templates   (us-gaap-smb, ifrs-sme, us-bank-call-report: starting points, not GAAP, IFRS or regulatory advice)", "chart open <account.json|-> --opened YYYY-MM-DD [--closed YYYY-MM-DD] [--key K]   (one account object in the chart format, e.g. {\"code\":\"6100\",\"name\":\"Office supplies\",\"type\":\"Expense\",\"unit\":\"USD\"}; it accepts legs dated in [opened, closed))", "chart close <code> --on YYYY-MM-DD [--key K]   (the account must have a zero balance in every unit; nothing posts to it on or after that day, and its history stays)", "chart promote <code> --on YYYY-MM-DD [--key K]   (the leaf becomes a summary account from that day; new legs go to its children)", "open, close and promote are journaled SchemaChange controls under schema_change authority; no date defaults to today. The default key is account-open:<code>, or account-<action>:<code>:<day>, so an exact retry returns the recorded control."]
example = "fa chart import chart.json --book ./books/myco --json"

[[verb]]
name = "period"
summary = "Create a fiscal year's periods, list them, or move one along the period state machine (journaled)."
writes = true
subcommands = ["create", "list", "open", "soft-close", "close", "lock", "reopen"]
flags = ["--fiscal-year", "--to", "--reason", "--key", "--date", "--plan-out", "--plan", "--approval"]
switches = ["--dry-run"]
events = ["periods_created", "periods", "period_transitioned", "recorded", "period_planned", "period_plan"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["period create --fiscal-year N", "period list", "period open|soft-close|close|lock|reopen <code> [--to open|soft-closed] [--reason N] [--key K] [--date YYYY-MM-DD]", "period <transition> <code> --dry-run   (returns the sealed proposal, its proposal_digest and canonical bytes as hex; writes no file or book data; commit authority and approvals are checked separately)", "period lock|reopen <code> --plan-out <file>   (owner CLI only: writes the planned proposal and prints its proposal_digest; commits nothing)", "period lock|reopen <code> --plan <file|-> --approval <vid>...   (owner CLI commits exactly the planned proposal, citing approvals of its digest; stdin accepts binary or complete bytes hex)"]
example = "fa period open FY2026-P03 --book ./books/myco --json"

[[verb]]
name = "close"
summary = "Journal nominal-to-equity routes, prepare an exact year-end close or delta reclose, and preserve its sealed proposal for independent approvals and native posting plans."
writes = true
subcommands = ["map","routes","year-end"]
flags = ["--route","--effective-from","--as-of","--as-known-at","--fiscal-year","--period","--key","--description","--evidence","--approval","--review","--review-out","--digest","--plan-out","--grant"]
switches = ["--dry-run","--review-only"]
events = ["closing_routes_recorded","closing_routes","closing_reviewed","closing_noop","posted","recorded","plan"]
exits = [0,2,3,4,5,6,7]
usage = ["close map --route <nominal-code>:<equity-code>... --effective-from YYYY-MM-DD --key K [--description TEXT]   (journal a complete routing version; Revenue and Expense posting leaves route to Equity posting leaves)","close routes --as-of YYYY-MM-DD [--as-known-at <sequence>]","close year-end --fiscal-year N --period FY<N>-CLOSE --key K [--description TEXT] [--evidence <oid>]... [--review-only | --review-out <new-file> | --dry-run [--plan-out <new-file>] | --yes]","close year-end --review <file|-|hex> --digest <review_digest> [--approval <vid>]... [--dry-run [--plan-out <new-file>] | --yes]","A review preserves the exact sealed PostIntent and intrinsic source basis; approve its proposal_digest with fa approve --proposal <digest> --as <independent-approver>. Then restore the review and cite that approval. Relevant journal or routing changes require a new review; approval publications alone do not.","A native --dry-run plan writes nothing. Commit its exact bytes with fa commit --plan <file|-> --grant read --grant close and the same --as/--grant. A first close zeros current fiscal-year nominal balances; a reclose includes prior Closing legs and transfers only the residual; a zero residual publishes no entry.","This intrinsic close supports the native base unit and undimensioned or legal-entity-only balances. Unsupported FX or general dimensions refuse. Closed periods retain their independent approval requirement; Locked case-bound reclose and the full CloseTask DAG remain unavailable."]
example = "fa close year-end --fiscal-year 2026 --period FY2026-CLOSE --key close-2026 --review-only --book ./books/myco --json"

[[verb]]
name = "approve"
summary = "Record an approval of a planned proposal's digest or a reviewed allocation/settlement review artifact under the caller's capability (journaled; bound to the current security policy epoch)."
writes = true
subcommands = []
flags = ["--proposal", "--review", "--digest", "--grant"]
switches = []
events = ["approved"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["approve --proposal <proposal_digest> [--as <principal>] [--grant <op>]...   (the digest is printed by `fa period <t> <code> --plan-out <file>`; a second approver is a second invocation as another principal)", "approve --review <file|-|hex> --digest <review_digest> [--as <principal>] [--grant <op>]...   (verifies the review artifact's digest and records an approval of its sealed proposal_digest)"]
example = "fa approve --proposal <proposal_digest> --as controller --book ./books/myco --json"

[[verb]]
name = "capability"
summary = "Steward capability controls: issue a holder-bound capability, list or show the book's issued capabilities, and journal an irreversible revocation by commitment (plan §14.2)."
writes = true
subcommands = ["revoke", "issue", "list", "show"]
flags = ["--commitment", "--date", "--key", "--description", "--grant", "--holder", "--profile", "--op", "--ceiling", "--daily-total", "--expires-at", "--issuer-token", "--out"]
switches = []
events = ["capability_revoked", "capability_issued", "capabilities_issued", "capability_issued_detail"]
exits = [0, 2, 4, 5, 6, 7]
usage = ["capability revoke --commitment <64-hex> [--date YYYY-MM-DD] [--key K] [--description <text>] --as <principal> [--grant issue_capability] --yes", "capability issue --holder <principal> --profile agent|human --op <op>... [--ceiling \"1000.00 USD\"]... [--daily-total \"1000.00 USD\"]... [--expires-at <seq>] --out <new-file> [--date YYYY-MM-DD] [--key K] --as <issuer> --grant issue_capability   (journals the holder-bound capability, then writes the holder's 0600 token: principal, capability and secret; the issued ops, units, per-leg ceilings, daily totals and expiry never widen the issuer's)", "capability issue --issuer-token <existing-token-file> --holder <principal> --profile agent|human --op <op>... [--ceiling \"1000.00 USD\"]... [--daily-total \"1000.00 USD\"]... [--expires-at <seq>] --out <new-file>   (uses the issued Human token holder and exact authority, with current Read and IssueCapability admission; descendants inherit the original shared daily root and cannot widen its limits. --as, --grant and launch-bound sessions cannot be combined with --issuer-token; the token must be an explicit file, never stdin)", "--daily-total bounds cumulative gross debits per native unit and committed UTC day across the original issuance and its descendants. Repeated limits tighten by minimum; descendants retain the original quota root. Posting requires an explicit UTC book calendar and corroborated retained TimeEvidence. A retry does not charge twice, and a reversal or release does not refund capacity. FA-REF-166 refuses a daily limit breach; FA-REF-167 refuses inconsistent usage history.", "capability list   (every capability this book issued, from the journal, with its revocation state, per-leg ceilings and daily quota lineage)", "capability show --commitment <64-hex>", "An issued token is admitted only against its journaled issuance (FA-REF-156 otherwise); launch fa-mcp with --token <file> to bind a session to it. Issuance and delegation remain operator acts; a launch-bound session cannot grant itself issue_capability."]
example = "fa capability revoke --commitment 0101010101010101010101010101010101010101010101010101010101010101 --as controller --grant issue_capability --yes --book ./books/myco --json"

[[verb]]
name = "draft"
summary = "Drafts (plan §15.2): an intent log an Agent can work in. Open a draft, plan intents into it (each rehearsed under every posting law), inspect it, discard it, or promote it: every planned intent posts to trunk in one batch, re-admitted against current trunk, when a principal holding approve who is not its owner promotes it."
writes = true
subcommands = ["new", "plan", "list", "show", "promote", "discard"]
flags = ["--intent", "--evidence", "--event", "--date", "--description", "--reason", "--grant"]
switches = []
events = ["draft_opened", "draft_planned", "drafts", "draft_detail", "draft_promoted", "draft_discarded"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["draft new <name> [--description <text>] [--as <principal>]   (opens an intent log owned by --as; nothing in it is a trunk entry)", "draft plan <name> --intent <file.json|-> [--evidence <oid>]...   (rehearses the intent under every posting law and journals it into the draft; also: the same post, reverse, reserve or resolve command with --draft <name>)", "draft list", "draft show <name>   (the planned intents in promotion order, and the entries a promotion created)", "draft promote <name> --as <approver> [--grant approve] --yes   (a principal holding approve who is not the draft's owner: every planned intent posts in one batch, admitted again against current trunk; any refusal promotes nothing)", "draft discard <name> [--reason <text>]   (the owner, or a principal holding approve, closes the draft; nothing is deleted)"]
example = "fa draft new close-03 --as agent-7 --book ./books/myco --json"

[[verb]]
name = "scenario"
summary = "Scenarios (plan §15.2, §15.6.5): counterfactual intent logs over a fixed trunk prefix. Fork one at a trunk sequence (HEAD by default) with an optional counterfactual start date and assumption documents, run intents in it (each rehearsed on the scenario's materialization: a scratch replay of the trunk prefix plus its earlier intents, under every posting law), inspect it, diff it against trunk as known at the fork, or discard it. A scenario never posts to trunk and is never promoted."
writes = true
subcommands = ["fork", "run", "list", "show", "diff", "discard"]
flags = ["--at", "--from", "--evidence", "--event", "--intent", "--period", "--date", "--description", "--reason", "--grant", "--certificate-out"]
switches = ["--activity", "--certify"]
events = ["scenario_forked", "scenario_run", "scenarios", "scenario_detail", "scenario_diff", "scenario_discarded", "report_certificate"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["scenario fork <name> [--at HEAD|<seq>] [--from YYYY-MM-DD] [--evidence <assumption-document-oid>]... [--description <text>] [--date YYYY-MM-DD]   (forks at a trunk sequence, HEAD by default; --from is where the counterfactual starts: every intent run in the scenario is effective on or after it; trunk history is never filtered)", "scenario run <name> --intent <file.json|-> [--evidence <oid>]...   (rehearses the intent on the scenario's materialization and journals it into the scenario; the planner's authority over the intent (its ops, ceilings and scope caveats) is admitted on trunk first, as for a dry run, and nothing is rehearsed for a refused intent; an identical retry returns its record even after a discard; also: fa post, invoice, bill, receipt or payment with --scenario <name>)", "scenario list", "scenario show <name>   (its fork, assumptions and intents in run order)", "scenario diff <name> --period <code>... [--activity] [--certify | --certificate-out <new-file>]   (per account and unit, exact: trunk as known at the fork sequence against the scenario's materialization; only changed rows, posted and pending columns apart; stock balances, or period movement with --activity. --certify retains a replayable certificate (read and produce): a native trial-balance certificate of trunk at the fork, plus the scenario body and exactly the intents it holds now; fa replay C:<oid> re-materializes those intents and reproduces the diff byte for byte, even after later intents run)", "scenario discard <name> [--reason <text>] [--date YYYY-MM-DD]   (the owner, or a principal holding approve, closes it; nothing is deleted)", "A scenario is materialized on every run and diff (plan §15.2 interim posture until substrate branches): the trunk prefix's accounting objects are replayed into a scratch book and every intent is posted again under every posting law. The diff binds the scenario body, its intent records, the fork sequence and the replay's SeqMap digest; --certify retains it as a replayable certificate. Reads select a scenario with --branch scenario:<name> (tb, statement, explain, open-items, gl), uncertified. Every check is on trunk and the replay is fixed at the fork: a document, period reopening or authority issued on trunk after the fork reaches only a scenario forked after it. The replay posts each intent under a Human embedded capability of its planner, so an Agent preparer's extra Human approver (a trunk SoD rule) is not re-applied there."]
example = "fa scenario fork but-for-breach --from 2025-07-01 --book ./books/myco --json"

[[verb]]
name = "post"
summary = "Post one entry intent under the accounting laws (balance, period law, idempotency)."
writes = true
subcommands = []
flags = ["--intent", "--grant", "--evidence", "--event", "--balancing", "--plan-out", "--timeout-ns", "--reverse-on", "--draft", "--scenario"]
switches = ["--dry-run"]
events = ["posted", "recorded", "plan", "batch_posted", "draft_planned", "scenario_run"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["A leg may name its legal entity (\"entity\": code; in a multi-entity book every leg names one) and its counterparty (\"party\": code from fa party list); the kernel refuses an undeclared entity or an unknown party.", "post --intent <file.json|-> [--grant <op>]... [--evidence <oid>]... [--event <code|vid>] [--balancing 0|1] [--as <principal>]   (--balancing: that leg moves at most what its account's limit admits; the event says what was requested and what moved)", "post --intent <file.json|-> --dry-run [--plan-out <new-file>]   (runs the actual admission pipeline and aborts its staged transaction; emits the exact sealed PostEntry plan, commits nothing)", "Commit the reviewed plan with fa commit --plan <file|-> using the same --as and --grant. Any intervening book publication requires a new dry run; this first slice does not assemble new approvals or rehearse --balancing. --plan-out requires --dry-run and never overwrites a file.", "Pending accepts timeout_ns as an unsigned JSON integer, or --timeout-ns N. Its deadline is anchored to committed TimeEvidence. Adjusting accepts reverse_on as YYYY-MM-DD, or --reverse-on YYYY-MM-DD; the book must declare --time-zone UTC at creation. Supply each value once. Only the daemon records production clock observations and runs timed effects.", "A Reversal intent names reverses and a registered reason (for example, \"reason\": \"WrongAccount\"); its legs come from the target.", "A PostBatch intent {\"idempotency_key\": K, \"intents\": [<entry intent>, ...]} commits every member atomically, in order, in one transaction: all or none, each member seeing the earlier members' effects (an application may settle an invoice earlier in the same batch by its derived vid). Members are Original, Adjusting, Reversal, Pending or Resolution entries of one principal with distinct keys. The batch key names its IntentOutcome: an identical retry returns the recorded outcome; the same key with different members is refused (exit 6). Batch plans, --plan-out and per-batch flags are not available; a member refusal names its index and nothing is posted.", "post --intent <file.json|-> --draft <name>   (plan §15.2: rehearses the intent under every posting law and journals it into the open draft; nothing reaches trunk until a principal holding approve who is not the draft's owner runs fa draft promote <name>)", "post --intent <file.json|-> --scenario <name>   (fa-k07b: rehearses the intent on the scenario's materialization under every posting law and journals it into the open scenario; trunk never moves; fa scenario diff shows the effect)"]
example = "fa post --intent entry.json --book ./books/myco --json"

[[verb]]
name = "invoice"
summary = "Post a customer invoice (plan §15.3, Appendix B): typed sugar over fa post that builds the Original entry from its lines, debiting the receivable for the party and crediting each line's revenue account. No posting rule or tax is inferred."
writes = true
subcommands = []
flags = ["--party", "--number", "--date", "--receivable", "--revenue", "--line", "--entity", "--key", "--description", "--evidence", "--event", "--grant", "--plan-out", "--draft", "--scenario"]
switches = ["--dry-run"]
events = ["posted", "recorded", "plan", "draft_planned", "scenario_run"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["invoice --party <code> --number <invoice number> --date YYYY-MM-DD --receivable <code> [--revenue <code>] --line 'qty=10 unit_price=\"125.00 USD\" item=SKU-9 product=Widgets' [--line ...] [--evidence <oid>]... [--entity <code>] [--key K] [--dry-run [--plan-out <new-file>] | --draft <name> | --scenario <name>]", "A line is qty with unit_price (multiplied exactly) or amount, with an optional account (default --revenue) and item, product or description words for its memo. Lines share one unit and may name different decimal places; a zero line or an empty value is refused. The receivable leg names the party. The key is invoice:[<entity>:]<number> unless --key is given (the book numbers its invoices), so a retry by the same principal returns the recorded entry. There is no implicit tax: a line with tax is refused until the tax law exists (fa-c34). --dry-run, --plan-out, --draft and --scenario behave as for fa post; a --grant post_closed needs --yes."]
example = "fa invoice --party ACME-CUST-17 --number 10442 --date 2026-03-14 --receivable 1200 --revenue 4000 --line 'qty=10 unit_price=\"125.00 USD\" item=SKU-9' --evidence <oid> --dry-run --book ./books/myco --json"


[[verb]]
name = "bill"
summary = "Post a vendor bill (plan §15.3, Appendix B): typed sugar over fa post that builds the Original entry from its lines, crediting the payable for the party and debiting each line's expense account. No posting rule or tax is inferred."
writes = true
subcommands = []
flags = ["--party", "--number", "--date", "--payable", "--expense", "--line", "--entity", "--key", "--description", "--evidence", "--event", "--grant", "--plan-out", "--draft", "--scenario"]
switches = ["--dry-run"]
events = ["posted", "recorded", "plan", "draft_planned", "scenario_run"]
exits = [0, 2, 3, 4, 5, 6, 7]
usage = ["bill --party <code> --number <bill number> --date YYYY-MM-DD --payable <code> [--expense <code>] --line 'amount=\"300.00 USD\" account=6000 item=hosting' [--line ...] [--evidence <oid>]... [--entity <code>] [--key K] [--dry-run [--plan-out <new-file>] | --draft <name> | --scenario <name>]", "Lines as for fa invoice; the payable leg names the party. The key is bill:[<entity>:]<party>:<number> unless --key is given: a vendor numbers its own bills, so two vendors' B-77 are two documents. No implicit tax."]
example = "fa bill --party V-17 --number B-77 --date 2026-03-20 --payable 2000 --expense 6000 --line 'amount=\"300.00 USD\" item=hosting' --evidence <oid> --book ./books/myco --json"


[[verb]]
name = "receipt"
summary = "Post a customer receipt (plan §15.3, Appendix B): cash debited, the receivable credited for the party, the credit applied to the open invoices --applies names. Typed sugar over fa post."
writes = true
subcommands = []
flags = ["--party", "--number", "--date", "--cash", "--receivable", "--amount", "--applies", "--entity", "--key", "--description", "--evidence", "--event", "--grant", "--plan-out", "--draft", "--scenario"]
switches = ["--dry-run"]
events = ["posted", "recorded", "plan", "draft_planned", "scenario_run"]
exits = [0, 2, 3, 4, 5, 6, 7]

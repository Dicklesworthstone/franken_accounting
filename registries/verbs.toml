mistakes = ["Passing `period` or `fiscal_year` with a target other than `registers` (the other targets take no period filter).", "Reading `status: \"no_checkpoints\"` as verified: it makes no verification claim."]

[[mcp.tool]]
cluster = "fa.book"
name = "materialize_registers"
verb = "registers"
subcommands = ["materialize"]
positionals = []
required = []
dont = ["Don't rematerialize a period that already has cells to \"fix\" a drift; verify first (`fa_book_verify`, target `registers`) and keep the finding."]

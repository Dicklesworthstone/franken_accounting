example = "fa batch --intent batch.json --book ./books/myco --json"

[[verb]]
name = "post-reserve"
summary = "Post part or all of a two-leg hold (plan §15.3, Appendix B PostReserve): a Resolution posting --amount on both legs and releasing the rest. Typed sugar over fa resolve."
writes = true

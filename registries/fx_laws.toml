# Foreign-Exchange (FX) Conversion, Valuation, Revaluation, and Settlement
# Difference Registry (plan §5.2, §5.3, §5.7, §6.4; FA-INV-01 `base`,
# `base-residual`, `realized-fx`, FA-INV-04 `functional-fold`; bead fa-s3c).
#
# Every FX valuation names a registered law in this file. Quote-based laws
# cite the exact content-addressed `Rate` documents (`kind = 11`, `role = 3`)
# that supply their rational rates. A carrying-transfer law instead binds its
# retained source balances and introduces no quote. Ad-hoc caller-typed rates
# without a committed `Rate` document are unconditionally forbidden.

schema_version = 1
ad_hoc_rate_admission = "forbidden"
residual_bound_law = "strictly_less_than_one_base_minor_unit_times_foreign_leg_count"
realized_fx_mode = "paired_conversion_account"

[[law]]
id = 1
version = 1
code = "spot_close"
name = "SpotClose"
rate_purpose = "SpotClose"
date_selector = "entry_effective_date"
rounding_law = "HalfEven"
residual_mode = "designated_leg"
admitted_classes = ["Original", "Adjusting", "Reversal", "Pending", "Resolution", "Migration"]
status = "live"
standard_ref = "ASC 830-20-30-1 / IAS 21.21"
meaning = "Initial recognition of a foreign-currency transaction at the spot close rate on the entry's effective date, with any multi-leg rounding residual absorbed on the designated non-monetary leg inside the same legal entity."

[[law]]
id = 2
version = 1
code = "period_end_revaluation"
name = "PeriodEndRevaluation"
rate_purpose = "PeriodClose"
date_selector = "period_end_date"
rounding_law = "HalfEven"
residual_mode = "none"
admitted_classes = ["Revaluation", "Reversal"]
status = "live"
standard_ref = "ASC 830-20-35-1 / IAS 21.23(a)"
meaning = "Period-end monetary-item revaluation adjusting functional-currency carrying value to the closing rate without inventing native foreign-currency units."

[[law]]
id = 3
version = 1
code = "period_average"
name = "PeriodAverage"
rate_purpose = "PeriodAverage"
date_selector = "period_end_date"
rounding_law = "HalfEven"
residual_mode = "designated_leg"
admitted_classes = ["Original", "Adjusting", "Reversal"]
status = "live"
standard_ref = "ASC 830-30-45-3 / IAS 21.39(b)"
meaning = "Flow-account valuation at the period's weighted/arithmetic average rate document, with designated-leg residual absorption within the legal entity."

[[law]]
id = 4
version = 1
code = "settlement_carrying_basis"
name = "SettlementCarryingBasis"
rate_purpose = "Settlement"
date_selector = "settlement_and_settled_item_dates"
rounding_law = "HalfEven"
residual_mode = "designated_leg"
admitted_classes = ["Original", "Adjusting", "Reversal", "Resolution"]
status = "live"
standard_ref = "ASC 830-20-35-2 / IAS 21.28"
meaning = "Settlement of a foreign-currency open item through a paired conversion account. RemainingCarryingValue relieves HalfEven(open_base * applied_native / open_native), with the final application relieving all remaining base. A fully applied single-target leg records that relief in base_amount; reversals restore its recorded relief exactly. Aggregate valuation adjustments without an item-allocation law and ambiguous multi-target relief are refused."

[[law]]
id = 5
version = 1
code = "translation_current_rate"
name = "TranslationCurrentRate"
rate_purpose = "PeriodClose"
date_selector = "period_end_date"
rounding_law = "HalfEven"
residual_mode = "none"
admitted_classes = ["Revaluation", "Adjusting", "Elimination", "Reversal"]
status = "live"
standard_ref = "ASC 830-30-45 / IAS 21.39"
meaning = "Current-rate translation from functional currency into reporting currency: assets and liabilities at closing rate, equity at historical spot rate, income statement at period average rate, retained earnings rolled forward cumulatively, and delta-cumulative balancing adjustment in AOCI Cumulative Translation Adjustment (CTA) with recycling to P&L on deconsolidation."

[[law]]
id = 6
version = 1
code = "remeasurement_temporal"
name = "RemeasurementTemporal"
rate_purpose = "PeriodClose"
date_selector = "period_end_date"
rounding_law = "HalfEven"
residual_mode = "none"
admitted_classes = ["Revaluation", "Adjusting", "Reversal"]
status = "live"
standard_ref = "ASC 830-10-45-17 / IAS 21.23(b)-(c)"
meaning = "Temporal-method remeasurement from currency of record into functional currency: monetary items at closing rate, non-monetary balance-sheet items and related expenses (COGS, depreciation, amortization) at historical spot rates, other income-statement flows at period average rate, and delta-cumulative remeasurement gain or loss in P&L."

[[law]]
id = 7
version = 1
code = "remeasurement_ias29_hyperinflation"
name = "RemeasurementIas29Hyperinflation"
rate_purpose = "PeriodClose"
date_selector = "period_end_date"
rounding_law = "HalfEven"
residual_mode = "none"
admitted_classes = ["Revaluation", "Restatement", "Reversal"]
status = "reserved"
standard_ref = "ASC 830-10-45-11 / IAS 29"
meaning = "Hyperinflationary-economy restatement and remeasurement rule (IAS 29 general price-index restatement followed by closing-rate translation, or ASC 830-10-45-11 reporting-currency functional remeasurement)."

[[law]]
id = 8
version = 1
code = "year_end_close_carrying"
name = "YearEndCloseCarrying"
rate_purpose = "None"
date_selector = "fiscal_year_source_prefix"
rounding_law = "None"
residual_mode = "none"
admitted_classes = ["Closing", "Reversal"]
status = "live"
standard_ref = "plan §5.2, §7.5; FA-INV-01.base, FA-INV-04.functional-fold"
meaning = "Year-end closing transfers each nominal account's exact recorded native and functional carrying balances to its declared equity destination, reproducing its saved source prefix and precommit balances. It applies no new rate or rounding, cites no Rate documents of its own, and carries no conversion residual. Any inherited reversal valuation must preserve those amounts; separate target-class and period laws remain authoritative, and Closing corrections use incremental reclose."

[[law]]
id = 9
version = 1
code = "period_end_item_revaluation"
name = "PeriodEndItemRevaluation"
rate_purpose = "PeriodClose"
date_selector = "period_end_date"
rounding_law = "HalfEven"
residual_mode = "none"
admitted_classes = ["Revaluation"]
status = "live"
standard_ref = "plan §5.2, §5.7, §6.3, §6.4; FA-INV-01.base"
meaning = "Explicit open-item revaluation of a complete homogeneous-side foreign source population. LargestRemainder v1 allocates the HalfEven-rounded aggregate closing value in proportion to open native amounts, with ties ordered by immutable target VID and leg ordinal. Each item's target less its remaining historical cost and previous allocated valuation posts as its own signed valuation/unrealized pair, including offsetting zero-net redistributions. The retained version-2 source basis binds every item and the complete source prefix; unknown exposure, legacy unallocated adjustments and retroactive changes to recorded application schedules refuse."

[[law]]
id = 10
version = 1
code = "settlement_allocated_carrying"
name = "SettlementAllocatedCarrying"
rate_purpose = "Settlement"
date_selector = "settlement_and_settled_item_dates"
rounding_law = "HalfEven"
residual_mode = "none"
admitted_classes = ["Original", "Adjusting", "Reversal"]
status = "live"
standard_ref = "plan §5.2, §5.7; FA-INV-01.realized-fx"
meaning = "Settlement following a retained PeriodEndItemRevaluation. RemainingCarryingValue independently relieves historical cost and total carrying value with HalfEven, and a final application takes every remaining unit of each. Their signed difference is released from the original dedicated valuation account and reclassified against unrealized FX. Foreign source and conversion legs retain historical-cost relief; cash less that historical relief is realized FX, so the current-period net equals cash less total carrying relief. Extension 37 binds the journal-derived item state, exact historical/total/valuation relief and immutable routes. Exact reversals restore recorded amounts, including zero relief; no current quote recomputes an undo and no legacy aggregate adjustment is implicitly allocated."

[[application_difference_kind]]
tag = 1
name = "Discount"

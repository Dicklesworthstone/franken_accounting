# Foreign-Exchange (FX) Conversion, Valuation, Revaluation, and Settlement
# Difference Registry (plan §5.2, §5.3, §5.7, §6.4; FA-INV-01 `base`,
# `base-residual`, `realized-fx`, FA-INV-04 `functional-fold`; bead fa-s3c).
#
# Every FX valuation names a registered law in this file and cites the exact
# content-addressed `Rate` document(s) (`kind = 3` in `evidence_policy.toml`)
# that supply the rational rate(s). Ad-hoc caller-typed rates without a
# committed `Rate` document are unconditionally forbidden.

schema_version = 1
ad_hoc_rate_admission = "forbidden"
residual_bound_law = "strictly_less_than_one_base_minor_unit_times_foreign_leg_count"
realized_fx_mode = "paired_conversion_account"

[[law]]
id = 1
version = 1
code = "spot_close"
name = "SpotClose"
rate_purpose = "SpotClose"
date_selector = "entry_effective_date"
rounding_law = "HalfEven"
residual_mode = "designated_leg"
admitted_classes = ["Original", "Adjusting", "Reversal", "Pending", "Resolution", "Migration"]
status = "live"
standard_ref = "ASC 830-20-30-1 / IAS 21.21"
meaning = "Initial recognition of a foreign-currency transaction at the spot close rate on the entry's effective date, with any multi-leg rounding residual absorbed on the designated non-monetary leg inside the same legal entity."

[[law]]
id = 2
version = 1
code = "period_end_revaluation"
name = "PeriodEndRevaluation"
rate_purpose = "PeriodClose"
date_selector = "period_end_date"
rounding_law = "HalfEven"
residual_mode = "none"
admitted_classes = ["Revaluation", "Reversal"]
status = "live"
standard_ref = "ASC 830-20-35-1 / IAS 21.23(a)"
meaning = "Period-end monetary-item revaluation adjusting functional-currency carrying value to the closing rate without inventing native foreign-currency units."

[[law]]
id = 3
version = 1
code = "period_average"
name = "PeriodAverage"
rate_purpose = "PeriodAverage"
date_selector = "period_end_date"
rounding_law = "HalfEven"
residual_mode = "designated_leg"
admitted_classes = ["Original", "Adjusting", "Reversal"]
status = "live"
standard_ref = "ASC 830-30-45-3 / IAS 21.39(b)"
meaning = "Flow-account valuation at the period's weighted/arithmetic average rate document, with designated-leg residual absorption within the legal entity."

[[law]]
id = 4
version = 1
code = "settlement_carrying_basis"
name = "SettlementCarryingBasis"
rate_purpose = "Settlement"
date_selector = "settlement_and_settled_item_dates"
rounding_law = "HalfEven"
residual_mode = "designated_leg"
admitted_classes = ["Original", "Adjusting", "Reversal", "Resolution"]
status = "live"
standard_ref = "ASC 830-20-35-2 / IAS 21.28"
meaning = "Settlement of a foreign-currency open item: native legs balance in each currency through a paired conversion account while functional-currency base amounts clear the settled item's historical carrying basis and recognize realized FX gain or loss."

[[application_difference_kind]]
tag = 1
name = "Discount"
requires_conversion_account = false
status = "live"
meaning = "Early-payment or trade discount absorbed on a named discount account at settlement."

[[application_difference_kind]]
tag = 2
name = "ShortPay"
requires_conversion_account = false
status = "live"
meaning = "Partial or short payment leaving residual open balance or disputed difference."

[[application_difference_kind]]
tag = 3
name = "Writeoff"
requires_conversion_account = false
status = "live"
meaning = "Authorized write-off of uncollectible or immaterial open-item balance."

[[application_difference_kind]]
tag = 4
name = "BankCharge"
requires_conversion_account = false
status = "live"
meaning = "Intermediary or settlement bank fee deducted from remittance proceeds."

[[application_difference_kind]]
tag = 5
name = "RealizedFx"
requires_conversion_account = true
status = "live"
meaning = "Realized foreign-exchange settlement difference between the settled open item's carrying base value and the settlement's spot base value, routed through a paired conversion account (plan §5.2, FA-INV-01.realized-fx)."

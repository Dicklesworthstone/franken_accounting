# conversion_laws.toml — Exact unit and scale conversion laws (plan §6.5; bead fa-2ly).
#
# Unit conversion (ounces to grams, hours to days, share splits, or precision-epoch
# scale migrations) is never implicit: a ConversionLaw row with exact rational
# factors and an explicit RoundingLaw exists and is named by the caller, or the
# conversion is refused naming ConversionLaw.
#
# Consumer: fa-registry (ConversionLaws), fa-money (convert_with_law),
# fa-reference (ref_convert_with_law).

schema_version = 1
implicit_conversion = "forbidden"

[[conversion_law]]
id = 1
version = 1
name = "HoursToDays8h"
kind = "unit_conversion"
from_code = "HOUR"
from_scale = 2
to_code = "DAY"
to_scale = 4
numerator = "1"
denominator = "8"
rounding_law = "HalfEven"


# Physical projection of plan §11.8 over an ALREADY retained full procedure
# certificate. A run and every finding/CITES edge publish atomically. The source
# certificate was retained separately; no certificate-plus-findings atomicity claim.
schema_version = 1
label = "Finding"
properties = ["fa_payload", "fa_digest", "book_id"]
run_format = "fa:finding-run:v1"
finding_format = "fa:finding-record:v1"
run_identity_domain = "fa:vid:finding-run:v1"
finding_identity_domain = "fa:vid:finding:v1"
record_digest_domain = "fa:finding-record-digest:v1"
value_digest_domain = "fa:finding-value:v1"
max_findings = 4096
max_citations = 65536
# Run: fixed format + 16-byte book + 32-byte certificate digest + LE u32 count
# + 32-byte ordered findings digest. Finding: fixed format + book + certificate
# + zero-based LE u32 ordinal + 32-byte canonical finding value digest.
# Identities take low 16 hash bytes as LE u128; the ordinal is domain-separated
# from the run identity. Hashes supply integrity, never reader/writer authority.
# All immutable records use one native birth. Reads recompute expected contents
# from full historical replay, reject predecessor versions and require all edges.
# DERIVED_FROM: run -> certificate, finding -> run. CITES: finding -> unique
# target VIds. Exact citation order and multiplicity remain in the certificate;
# CITES is only a distinct-target membership projection, not a tracing schedule.
# This version records Open observations only. It does not encode human reviews,
# escalation decisions, accusations, or an offline outsider completeness proof.

# Deterministic complete-package export over a checked original publication.
# id = FA-<book hex>-WP-<native run birth>; no mutable counter or new publication.
# Length-prefixed format/id/certificate/JSONL/Markdown, LE u64 publication, then
# domain-separated 32-byte body digest. Decode is integrity, not source replay.
[workpaper]
format = "fa:finding-workpaper:v1"
digest_domain = "fa:finding-workpaper-digest:v1"
max_bytes = 67108864
numbering = "original_native_run_publication"
presentations = ["complete_jsonl", "escaped_markdown"]
proof_class = "retained_history_replay"

# Review decisions are separate immutable Finding-family control records, never
# edits to the observation or postings. Their native history is checked from
# genesis so a retired/relabeled final decision cannot masquerade as Open.
[review]
format = "fa:finding-review:v1"
identity_domain = "fa:vid:finding-review:v1"
digest_domain = "fa:finding-review-record:v1"
max_reviews_per_finding = 256
max_note_bytes = 2048
max_evidence = 16
max_record_bytes = 4096
max_native_finding_records = 100000
required_ops = ["read", "approve"]
required_profile = "Human"
excluded_principal = "original_procedure_certificate_producer"
actions = ["1:Acknowledge", "2:Dismiss", "3:Reopen"]
dismissal_reasons = ["1:Explained", "2:Duplicate", "3:DataQuality", "4:OutsideScope", "5:Other"]
# Dismissal needs >=1 retained Document, and every action needs a nonblank note.
# Acknowledgement of a dismissal is refused until an explicit Reopen decision.
# Reopen is admissible only after dismissal. Dismissal may be revised with a new
# decision/reason/evidence. Escalation awaits the native case lifecycle.
# Each body binds book, source certificate, finding, slot, actor, capability,
# expected predecessor, action, note and ordered evidence. Identity binds the
# book/finding/ordinal slot, independently of content: competing successor
# proposals conflict. Exact actor/body/capability retries reuse original birth,
# even after further decisions; renewal of authority does not rewrite binding.
# RESOLVES: review -> finding. SUPERSEDES: review -> previous review.
# CITES: review -> evidence. All edges share the review's original native birth.
# Workpaper v1 continues to show the original observation, not current status.
# Capability binding is not an external signature or a proof of economic truth.

# Whole-run review reads preserve every certified occurrence in source order,
# including never-reviewed findings and explicitly empty recorded runs. They
# enforce the single-occurrence checks and scan native Finding births once.
[review_run]
max_decisions = 8192
max_note_bytes = 8388608
required_ops = ["read"]
scope = "one_complete_recorded_procedure_run"
# Bounds count every selected finding's decisions through the current frontier,
# before historical filtering. Exhaustion refuses the entire result.

# Plan §6.3 / fa-joq. Executable arithmetic laws, not posting authorization.
# IDs follow the plan's catalog order and identify distinct executable laws.
# Target order is part of the basis: never sort a caller's waterfall or ties.
schema_version = 1
max_targets = 4096

[[law]]
id = 1
version = 1
name = "LargestRemainder"
basis = "weights"
ordering = "input-order; remainder-descending; ties-lowest-index"
rounding = "floor-magnitude; distribute-one-unit"
signed = "magnitude-then-restore-sign"

[[law]]
id = 2
version = 1
name = "ProRataResidualToNamed"
basis = "weights"
ordering = "input-order; explicit-recipient-id"
rounding = "explicit-registered-rounding-law"
signed = "signed-rounding; signed-residual-to-recipient"

[[law]]
id = 3
version = 1
name = "Waterfall"
basis = "native-mantissa-caps"
ordering = "input-order; fill-earlier-cap-first"
rounding = "none"
signed = "magnitude-then-restore-sign"

[[law]]
id = 4
# Each cumulative band redistributes its occupied amount over all targets.
# Bounds/weights, including unused bands, are retained in the law-4 request.
# 64 brackets / 4096 weight cells; no implicit final bracket or tax policy.
version = 1
name = "Tiered"
basis = "cumulative-native-bounds; per-bracket-weights; target-basis-one"
ordering = "ascending-brackets; input-order; remainder-descending; ties-lowest-index"
rounding = "floor-band-magnitude; distribute-one-unit-per-bracket"
signed = "magnitude-then-restore-sign"

[[law]]
id = 5
version = 1
name = "EqualSplitResidualFirst"
basis = "one-per-target"
ordering = "input-order; entire-residual-to-first"
rounding = "truncate-magnitude"
signed = "magnitude-then-restore-sign"

[[law]]
id = 6
# Quantities determine every exact floor and fractional remainder. The
# secondary value only orders equal fractional remainders; equal values use
# declared target order. It is never a price or a replacement quantity.
# All-zero quantities refuse; a zero-quantity target always receives zero.
# Both ordered keys are retained in the request and its driver commitment.
version = 1
name = "ByUnitsThenValue"
basis = "unit-quantities; secondary-values"
ordering = "remainder-descending; equal-remainder-value-descending; ties-lowest-index"
rounding = "floor-quantity-share; distribute-one-unit"
signed = "magnitude-then-restore-sign"

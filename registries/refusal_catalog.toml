# 144 (CobaltGull 3599, bead fa-ffo):
# automatic effects take time only from a corroborated committed tick. The
# expiry and scheduled-reversal sweeps refuse under a latest tick whose
# TimeTick payload records monotonic_ok false, and an Open's scheduled
# reversals reach no date under it. One kernel rule for every caller (the
# library, fad, a period transition); it claims committed-tick semantics
# only, nothing about an observed instant against true UTC (3602, 3604).
[[refusal]]
code = "FA-REF-144"
name = "TICK_UNCORROBORATED"
owners = ["fa-journal"]
exit = "refusal"
cite = "plan §5.4, §7.1a, §7.6 (automatic effects take time only from a corroborated committed tick)"
fix = "journal a newer TimeEvidence tick that its source's monotonic clock corroborates (Book::record_tick or AsyncBook::record_tick with monotonic_ok true, by the caller that holds the clock), then rerun the sweep under it (Book::sweep or AsyncBook::sweep)"


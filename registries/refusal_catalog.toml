# refusal_catalog.toml — every typed refusal the system can issue (plan
# §15.3, Appendix D "every refusal names what failed, where, the law or
# policy row, and the exact command to run instead"; one exit per refusal).
#
# One row per FA-REF code: the constant's `name` (the same name in every
# crate that declares the code), the crates that declare it (`owners`;
# fa-reference's oracle mirrors are not owners), the single exit class
# (a name from exit_codes.toml), the law or policy row the refusal cites, and
# the fix template the refusal's text follows ({...} are runtime values).
#
# Consumer: fa-registry `refusal_catalog` (parser), its workspace gate test.
# Gate (three ways + exits): every FA-REF constant declared in crates/*/src
# has a row with its code and name, and every owner declares it; every row is
# declared by exactly its owners; each code is declared under exactly one
# name across the workspace (a collision fails, e.g. two meanings for 018);
# every literal `code::NAME, exit::CLASS` call site uses the row's exit.
# A `[[reserved]]` code is held for a named owner and must not be declared
# until its row replaces the reservation.
#
# Additive: a released code is never renumbered or reused for a new meaning.


# Tamper Matrix (INT-10: TV-01 .. TV-10)
# ---------------------------------------------------------------------------

[[tamper_vector]]
id = "TV-01"
artifact = "entry_payload"
tamper_action = "Flip a byte in a committed EntryPayload or alter a leg amount without recomputing digests"
detected_by = "fa_model::Entry::decode / fa_verify::envelope"
refusal_or_grade = "EntryError::DigestMismatch / Grade::Fail(record)"
test_refs = ["fa-model::lib::entry::tests::tampered_bytes_are_refused", "fa-verify::tests/golden.rs::every_pinned_vector_refuses_every_flipped_bit"]

[[tamper_vector]]
id = "TV-02"
artifact = "register_cell"
tamper_action = "Mutate a materialized register cell balance, insert a phantom zero cell, or corrupt the register watermark"
detected_by = "fa_registers::verify_registers"
refusal_or_grade = "RegisterDrift (FA-INV-04.core)"
test_refs = ["fa-registers::tests/registers.rs::materialize_then_verify_is_green_and_a_tampered_register_is_drift", "fa-registers::tests/registers.rs::register_metadata_and_watermark_corruption_cannot_verify"]

[[tamper_vector]]

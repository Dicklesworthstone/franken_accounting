[[procedure]]
id = "trace.network_libr"
version = 1
claim = "statistical"
evidence = "FA-EVID-L21"
tie_break = "entry_vid"
complexity = "O(input_legs log input_legs + max_steps log max_transfers + max_fragments * max_hops)"
calibration = "uncalibrated"
summary = "Follow a source deposit through a time-expanded network of commingled asset accounts under the Lowest Intermediate Balance Rule (Restatement (Third) of Restitution §59): clean money is presumed dissipated before tainted money, so only the part of a withdrawal exceeding the clean balance carries source value, and a later clean deposit does not replenish dissipated source value unless replenishment is OnEvidence. Final positions partition the source into held, spent, and overdraft-repaid amounts with no duplicated path totals. Every work or path bound refuses the entire run on exhaustion and never returns partial findings."

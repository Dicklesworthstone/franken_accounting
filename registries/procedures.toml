default = 2
meaning = "Minimum accounts in a reported community."

[[parameter]]
procedure = "graph.communities"
name = "min_internal_share_bps"
default = 7000
meaning = "Minimum share of community total volume that stays inside the community, in basis points (7000 = 70.00%)."

[[procedure]]

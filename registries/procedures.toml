[[procedure]]
id = "damages.attested_baseline"
version = 2
claim = "statistical"
evidence = "FA-EVID-L59"
tie_break = "account_vid"
complexity = "O(legs log legs + attestations × legs)"
calibration = "uncalibrated"
summary = "Per-claim absolute deltas from each RegisterEquals baseline to gross posted activity in its exact (account, period, unit, declared legal entity, as-of day) cell. Every attestation is preserved, including different cutoffs and evaluated prefixes for the same cell; no entity's claim overwrites another's. Reversals contribute in their own period, the legal-entity dimension alone selects an entity, untagged legs belong to the sole declared balancing entity, and an absent claim entity is the unassigned cell. Unknown claim entities refuse. The effective cutoff selects eligible claims without changing their own days. A separately labeled original_lineage fallback compares live and pre-supersession original folds at the report cutoff, per entity, only for cells with no applicable attestation. Every comparison cites its participating entries and any baseline attestation; citation overflow refuses rather than omit evidence. Historical claims remain fixed at their evaluated prefixes, which this procedure does not re-execute. These observations do not establish recoverable damages; plan §11.6's damages.but_for is the certified delta between a counterfactual scenario and trunk via fa scenario diff --certify. Version 1 collapsed entities and cutoffs and compared gross claims to a live net. Registered as damages.but_for before fa-kxc4."
effective_through = "optional"



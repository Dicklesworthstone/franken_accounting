# procedures.toml — the Lantern procedure registry (plan §11.1; bead fa-nlu).
#
# Every analytic is registered here before it can run: its id and version,
# the claim class of its output (`statistical` for every score and threshold
# test; `invariant` only for an exact reconciliation), its declared inputs,
# its parameters with pinned deterministic defaults (the decision card's
# fallback, plan §11.1), its CGSE tie-break policy for rankings, its
# complexity bound (checked by a work counter in the tests), its FA-EVID
# evidence row, and its calibration status. A procedure runs over a pinned
# snapshot `(book, known_at)` under no clock, entropy, network or filesystem
# capability; the same inputs produce the same findings bit-for-bit.
#
# A finding is a reproducible observation with a score and typed citations.
# It is never an accusation or a legal conclusion (AGENTS.md doctrine).
#
# Consumer: fa-lantern (a procedure binds to its row at construction and
# refuses to run unregistered or at another version), fa-cli `fa lantern
# run`, fa-mcp tool docs, fa-vpk (independent statistical oracles), fa-fk5
# (graph procedures). Gate: a duplicate id, an unknown claim class or
# calibration, a parameter or input without a procedure, a duplicate
# parameter name, or an evidence row outside FA-EVID-L01..L99 fails at load.

schema_version = 1

# ---- Journal-entry testing (plan §11.2; AS 2401 ¶61, ISA 240 ¶A41) --------

[[procedure]]
id = "jet.round_amounts"
version = 1
claim = "statistical"
evidence = "FA-EVID-L01"
tie_break = "entry_vid"
complexity = "O(legs)"
calibration = "planted"
summary = "Entries with a leg whose magnitude is a multiple of 10^round_power whole units: round-number postings."

[[parameter]]
procedure = "jet.round_amounts"
name = "round_power"
default = 3
meaning = "A leg is round when its magnitude is a whole multiple of 10^round_power units (3 = a multiple of 1,000.00)."

[[procedure]]
id = "jet.period_end_timing"
version = 1
claim = "statistical"
evidence = "FA-EVID-L02"
tie_break = "entry_vid"
complexity = "O(entries)"
calibration = "planted"
summary = "Entries effective in the last window_days days of their period."

[[parameter]]
procedure = "jet.period_end_timing"
name = "window_days"
default = 3
meaning = "An entry effective within this many days of its period's last day (inclusive of the last day) is late-period."

[[procedure]]
id = "jet.post_closing"
version = 1
claim = "statistical"
evidence = "FA-EVID-L03"
tie_break = "entry_vid"
complexity = "O(entries + transitions)"
calibration = "planted"
summary = "Entries recorded after their period's first SoftClose, Close or Lock transition: the post-closing population (bitemporal)."

[[procedure]]
id = "jet.weekend"
version = 1
claim = "statistical"
evidence = "FA-EVID-L04"
tie_break = "entry_vid"
complexity = "O(entries)"
calibration = "planted"
summary = "Entries whose effective date (or document date when present) falls on a Saturday or Sunday. Holiday tables are data and land with the business-day calendar."

[[procedure]]
id = "jet.self_approved"
version = 1
claim = "statistical"
evidence = "FA-EVID-L05"
tie_break = "entry_vid"
complexity = "O(entries + approvals)"
calibration = "planted"
summary = "Entries one of whose recorded approvals was made by the preparing principal, or migrated entries whose legacy source_approved_by matches source_entered_by. For a class sod_policy.toml covers a native hit proves a capability misconfiguration; for imported history or an uncovered class it is a control finding."

[[procedure]]
id = "jet.thin_descriptions"
version = 1
claim = "statistical"
evidence = "FA-EVID-L06"
tie_break = "entry_vid"
complexity = "O(entries)"
calibration = "planted"
summary = "Entries whose description opens to fewer than min_chars characters. A description that cannot be opened under the book's seal key is counted as unreadable, never as thin."

[[parameter]]
procedure = "jet.thin_descriptions"
name = "min_chars"
default = 4
meaning = "A description with fewer characters than this is thin."

# ---- Duplicates and numbers (plan §11.3) -----------------------------------


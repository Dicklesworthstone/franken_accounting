summary = "Madoff net-equity Ponzi schedule (In re Bernard L. Madoff Investment Securities LLC, 654 F.3d 229): computes per-investor cash_in minus cash_out, investor cohort by first-inflow date, net-loser equity claims, and net-winner fictitious profits subject to clawback."


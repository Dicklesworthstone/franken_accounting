[[parameter]]
procedure = "graph.party_layering"
name = "window_days"
default = 10
meaning = "Maximum civil days from the first hop to the last hop of the chain."

[[parameter]]
procedure = "graph.party_layering"
name = "min_passthrough_bps"
default = 8500
meaning = "Minimum basis points of the incoming transfer an intermediary party forwards at each hop (8500 = 85.00%)."

[[procedure]]
id = "graph.communities"

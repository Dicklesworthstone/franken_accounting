evidence = "FA-EVID-L57"
tie_break = "entry_vid"
complexity = "O(legs log legs)"
calibration = "planted"
summary = "Rising-tide receivership distribution (SEC v. Huber, 702 F.3d 903): equalizes cumulative recovery rates (pre-receivership withdrawals plus receivership distribution divided by principal invested) across net-loser investors up to the exact rational water level supported by the distributable pool under LargestRemainder."

[[parameter]]
procedure = "distribution.rising_tide"
name = "distributable_pool"
default = 0
meaning = "Explicit distributable cash pool in unit mantissa (0 = use the book's ending positive cash/asset balance in that unit)."


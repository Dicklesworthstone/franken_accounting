# ---- Reconciliation, completeness, and audit procedures (plan §11.4, §11.7; bead fa-g6rj) --

[[procedure]]
id = "recon.intercompany"
version = 2
claim = "statistical"
evidence = "FA-EVID-L41"
tie_break = "account_vid"
complexity = "O(legs log legs)"
calibration = "uncalibrated"
summary = "Exact intercompany reciprocal balance reconciliation over the accounts holding the `intercompany` account role (registries/account_roles.toml, assigned with fa chart role), per period and unit: a non-zero net reciprocal balance is a finding. Statistical until the kernel pairs intercompany legs at commit (FA-INV-13). Refused when no account holds the role. Version 1 guessed the accounts from code and name tokens."

[[procedure]]
id = "recon.lapping"
version = 4
claim = "statistical"
evidence = "FA-EVID-L42"
tie_break = "entry_vid"
complexity = "O((legs + parties) log (legs + parties) + legs^2 log legs)"
calibration = "uncalibrated"
summary = "Receivables/payables lapping detector over the accounts holding the `receivable` account role or the `payable` account role (registries/account_roles.toml, assigned with fa chart role): sequential settlements where party B's cash receipt is recorded within window_days of party A's open item while party A's settlement is delayed or applied after subsequent receipts. Refused when no account holds either role. Version 1 guessed the accounts from code and name tokens. Version 3 preserves the full u32 window and widens day subtraction; version 2 retains its signed window arithmetic. Version 4 indexes matching settlements and meters candidate searches; versions 2 and 3 retain their historical work transcripts."

[[parameter]]
procedure = "recon.lapping"
name = "window_days"
default = 10
meaning = "Maximum civil days between overlapping counterparty receipts/applications in a lapping sequence."

[[procedure]]
id = "recon.attested_register_compare"
version = 2
claim = "invariant"
evidence = "FA-EVID-L43"
tie_break = "account_vid"
complexity = "O(legs log legs + (attestations + instruments) × legs)"
calibration = "uncalibrated"
summary = "Exact comparison of every RegisterEquals claim with gross posted activity in its own (account, period, unit, declared legal entity, as-of day) cell. Distinct attestations remain distinct baselines; reversals contribute in their own period and never erase an earlier posting. Only the legal-entity dimension selects the declared entity, an untagged leg belongs to the sole declared balancing entity, and an absent claim entity denotes the unassigned cell rather than all entities. Unknown claim entities refuse. Findings cite the attestation and every contributing entry; citation overflow refuses the complete run. A claim remains a historical fact at its evaluated prefix, which this comparison does not re-execute. The effective cutoff selects eligible claims without changing their individual as-of days and also bounds the separate live-posting Instrument unit-consistency check. Plan §12.2's recon.book_to_book is a distinct multi-book procedure. Version 1 used live supersession and informational entity metadata, which could misstate an attested cell. Registered as recon.book_to_book before fa-kxc4."
effective_through = "optional"

[[procedure]]
id = "recon.bank_statement_drift"
version = 1
claim = "invariant"
evidence = "FA-EVID-L60"
tie_break = "account_vid"
complexity = "O((reconciliations + references) log (reconciliations + references))"
calibration = "uncalibrated"
summary = "Exact drift of native Reconciled statement closes at one recorded prefix: changed cumulative cash, net-zero cash contribution changes, and changed active confirmation references are separate observations. Every original claim remains fixed at its evaluated prefix. An effective cutoff selects statement closing dates and never changes their cash cutoff. Requires complete native reconciliation states after admitted retained-history verification; the stated complexity covers the pure finding adapter, while native source verification retains its full-history cost. Every observation cites its original attestation, account and retained source documents; cash observations include every changed or durably citing Entry. More than 4096 citations in one observation, 100000 observations, or 16 MiB of finding bytes refuses the complete run."
effective_through = "optional"

[[procedure]]
id = "recon.assertion_drift"
version = 2
claim = "invariant"
evidence = "FA-EVID-L61"
tie_break = "account_vid"
complexity = "O(legs log legs + attestations × legs)"
calibration = "uncalibrated"
summary = "Exact drift of every RegisterEquals attestation at the snapshot coordinate (plan §9.4, BalanceAssertionDrift): the attested cell (account, unit, entity, period, as-of day) refolded over gross posted activity and compared with the attested amount. A reversal posts in its own period and never erases the original from an earlier period or effective cutoff; pending reservations do not contribute. Untagged legs belong to the sole declared balancing entity; an absent claim entity selects only the unassigned cell, never all entities. Version 1 instead netted supersession across the snapshot and could report false drift across periods. The attestation stays a fact at its evaluated prefix; a finding cites the Attestation, the account, the period and every entry recorded after that prefix whose legs move the cell, with the drift as the statistic. The original evaluated prefix is not re-executed by this procedure. Entries in other cells never contribute. More than 4096 citations in one finding refuses the complete run."

[[procedure]]
id = "completeness.unrecorded_liabilities"
version = 2
claim = "statistical"
evidence = "FA-EVID-L44"
tie_break = "entry_vid"
complexity = "O(legs log legs)"
calibration = "uncalibrated"
summary = "Search for unrecorded liabilities (AU-C 500 / ISA 500): cash disbursements or payable entries effective after the document's period end within window_days. The first day outside the period is day one, including for fiscal and custom calendars and periods not yet materialized in the book. Version 1 measured document age and missed older invoices posted just after period end."

[[parameter]]
procedure = "completeness.unrecorded_liabilities"
name = "window_days"
default = 45
meaning = "Post-period lookahead window in civil days for subsequent disbursements or invoices."

[[procedure]]
id = "events.subsequent"
version = 3
claim = "statistical"
evidence = "FA-EVID-L45"
tie_break = "entry_vid"
complexity = "O(entries log entries + legs + periods log periods + entries × periods)"
calibration = "uncalibrated"
summary = "Subsequent events review (AS 2801 / IAS 10): material adjustments, reversals, or restatements effective within window_days after a closed period boundary, or superseding an entry of an earlier period within that period-end window. A closed boundary's latest recorded transition is SoftClosed, Closed or Locked. Version 3 counts the exclusive period end as day one, including for supersessions; version 2 omitted that first day and used the original entry's date for supersessions. Version 1 also counted periods that were only opened."

[[parameter]]
procedure = "events.subsequent"
name = "window_days"
default = 30
meaning = "Window in civil days after a period end to scan for subsequent events."

[[parameter]]
procedure = "events.subsequent"
name = "min_amount"
default = 100000
meaning = "Minimum leg magnitude in unit mantissa scale (100,000 = 1,000.00 at scale 2) for a post-period event to be flagged."

[[procedure]]
id = "party.master_changes"
version = 1
claim = "statistical"
evidence = "FA-EVID-L46"
tie_break = "entry_vid"
complexity = "O(legs log legs)"
calibration = "uncalibrated"
summary = "Vendor/party master-data changes (`UpdatePartyIdentifiers` schema controls) followed by disbursements or postings to that party within window_commits commits or window_days civil days."

[[parameter]]
procedure = "party.master_changes"
name = "window_commits"
default = 25
meaning = "Maximum CommitSeq distance between a party identifier update and a subsequent posting to that party."

[[procedure]]
id = "payroll.ghost"
version = 2
claim = "statistical"
evidence = "FA-EVID-L47"
tie_break = "entry_vid"
complexity = "O(legs log legs)"
calibration = "uncalibrated"
summary = "Ghost-employee and anomalous payroll detector: payroll postings (an entry with a leg on an account holding the `payroll` account role (registries/account_roles.toml, assigned with fa chart role)) citing parties with shared bank/tax identifiers, missing employee master records, or duplicate payroll disbursements to the same party in one period. Refused when no account holds the role. Version 1 guessed payroll from account codes and names and from `payroll` in an external id's system name."

[[procedure]]
id = "expense.capitalization"
version = 2
claim = "statistical"
evidence = "FA-EVID-L48"
tie_break = "entry_vid"
complexity = "O(legs log legs)"
calibration = "uncalibrated"
summary = "Improper expense capitalization detector (WorldCom motif): entries that debit an account holding the `fixed_asset` account role and credit an Expense account or a liability holding the `accrued_expense` account role (registries/account_roles.toml, assigned with fa chart role). Refused when no account holds the fixed_asset role. Version 1 guessed the accounts from code and name tokens."

[[procedure]]
id = "aging.inventory"
version = 3
claim = "statistical"
evidence = "FA-EVID-L49"
tie_break = "account_vid"
complexity = "O(legs log legs)"
calibration = "uncalibrated"
summary = "Slow-moving and obsolete inventory aging (ASC 330 / IAS 2): accounts holding the `inventory` account role (registries/account_roles.toml, assigned with fa chart role) whose net debit balance has had no credit relief (cost-of-sales or relief movement) for more than stale_days civil days through the coordinate's effective date. Refused when no account holds the role. Version 1 guessed the accounts from code and name tokens. Version 3 nets supersession within the as-of window, so a reversal or replacement dated after the effective date does not erase a position that was stale on it; version 2 netted over the whole snapshot."
effective_through = "optional"

[[parameter]]
procedure = "aging.inventory"
name = "stale_days"
default = 90
meaning = "Civil days without inventory relief movement after which an inventory balance is flagged as slow-moving."

[[procedure]]
id = "reversal.patterns"
version = 2
claim = "statistical"
evidence = "FA-EVID-L50"
tie_break = "entry_vid"
complexity = "O(legs log legs)"
calibration = "uncalibrated"
summary = "Systematic reversal and re-aging patterns: chains of Reversal or Replacement entries, cross-period reversals of manual adjustments, or accounts with repeated post-and-reverse cycles."

[[procedure]]
id = "confirm.coverage"
version = 2
claim = "statistical"
evidence = "FA-EVID-L51"
tie_break = "account_vid"
complexity = "O(legs log legs)"
calibration = "uncalibrated"
summary = "External confirmation and attestation coverage (AS 2310 / ISA 505): measures the share of the balances of the accounts holding the `cash` account role or the `receivable` account role (registries/account_roles.toml, assigned with fa chart role) covered by a journaled RegisterEquals or Reviewed attestation, flagging accounts whose corroborated share in basis points falls below min_coverage_bps. Refused when no account holds either role. Version 1 guessed the accounts from code and name tokens."

[[parameter]]
procedure = "confirm.coverage"
name = "min_coverage_bps"
default = 8000
meaning = "Minimum corroborated balance coverage in basis points (8000 = 80.00%) before an uncorroborated receivable or cash balance is flagged."

# ---- Solvency, lookback, Ponzi, distribution, and damages (plan §11.5–11.6; bead fa-y4v) --

[[procedure]]
id = "solvency.balance_sheet_test"
version = 3
claim = "statistical"
evidence = "FA-EVID-L52"
tie_break = "account_vid"
complexity = "O(legs log legs)"
calibration = "uncalibrated"
summary = "Signed native balance-sheet screen: net assets include credit contra-assets and net liabilities include debit contra-liabilities; apply the declared haircut once to each unit's positive net asset basis, preserving negative bases. RegisterEquals assertions never override balances. Reports an exact deficit with complete citations; documented fair-value adjustments and legal conclusions are unsupported. Version 3 reads inline valuation inputs only from entries posted on or before the effective date, netted within that window; version 2 read every live entry, so a valuation dated after the effective date refused the run."
effective_through = "optional"

[[parameter]]
procedure = "solvency.balance_sheet_test"
name = "fair_value_haircut_bps"
default = 0
meaning = "Haircut in basis points applied after contra-account netting to each unit's positive net asset basis (0..=10000), truncated toward zero in exact wide arithmetic. Zero preserves the signed book basis; negative net assets are never clamped or improved. This explicit input is not an attested fair value."

[[procedure]]
id = "solvency.cash_flow_test"
version = 6
claim = "statistical"
evidence = "FA-EVID-L53"
tie_break = "account_vid"
complexity = "O(legs log legs)"
calibration = "uncalibrated"
summary = "Equitable cash-flow solvency test (ability to pay debts as they come due): compares the balances of the accounts holding the `cash` account role (registries/account_roles.toml, assigned with fa chart role) against open payable items and short-term obligations maturing within horizon_days of the coordinate's effective date. Refused when no account holds the role. Version 5 judges both cash and liabilities at the coordinate's effective date in the unscheduled book-wide screen. Future payments, reversals and new liabilities cannot change that earlier position. Without authenticated maturity terms the fallback reports only an as-of liquidity shortfall against book liabilities, not a contractual maturity or insolvency conclusion. Version 4 introduced netting overdrawn and positive cash accounts per unit before flooring liquidity at zero, using the authenticated schedule's net-before-floor rule; version 3 discarded each overdraft. Authenticated schedules additionally partition by legal entity. Version 3 judges a scheduled obligation open as of the effective date, netting supersession within that window, so a payment or reversal dated later neither relieves it nor erases it; versions 3 and 4 used different cash and liability cutoffs in the unscheduled screen and could let a future payment relieve debt without spending its cash. Version 2 netted the whole snapshot and let settlements through the horizon relieve obligations without spending the cash that paid them. Version 1 guessed the accounts from code and name tokens. Version 6 also partitions the unscheduled screen by legal entity using the scheduled evaluator's normalization: unnamed legs share an unassigned scope when no entity is named, inherit the sole named entity, and are refused when multiple named entities make them ambiguous. Cash accounts net and floor at zero within each unit/entity; liability balances remain account-scoped and findings cite only their entity's contributing entries. Version 5's whole-book screen remains available for replay."
effective_through = "optional"

[[parameter]]
procedure = "solvency.cash_flow_test"
name = "horizon_days"
default = 30
meaning = "Forward liquidity horizon in civil days for maturing payables and obligations (must be >= 1)."

[[procedure]]
id = "lookback.preferences"
version = 4
claim = "statistical"
evidence = "FA-EVID-L54"
tie_break = "entry_vid"
complexity = "O(legs log legs)"
calibration = "uncalibrated"
summary = "Avoidable preference lookback (11 U.S.C. 547(b)-(c)): identifies transfers (credits to accounts holding the `cash` account role (registries/account_roles.toml, assigned with fa chart role)) to creditors within 90 days (or 365 days for insiders under 11 U.S.C. 101(31) via RELATED_TO/OWNS/CONTROLS) and computes 547(c)(1) contemporaneous-exchange, 547(c)(2) ordinary-course, and 547(c)(4) subsequent-new-value defenses to report net preference exposure per creditor. Refused when no account holds the role. Version 1 guessed the accounts from code and name tokens. Version 3 (fa-6l8g) pays each creditor only through its own obligation legs within each (unit, legal entity) partition of an entry (or the one party the cash legs name when no obligation leg names one), dates each settlement target by its own invoice, and reports a transfer no one creditor's legs account for as an unresolved_attribution finding that marks the exposure of each creditor it names attribution=incomplete; version 2 gave every party an entry named the entry's whole cash. Window arithmetic preserves the full u32 domain; older versions narrowed civil-day windows to signed i32."
effective_through = "optional"

[[parameter]]
procedure = "lookback.preferences"
name = "window_days"
default = 90
meaning = "Non-insider preference lookback window in civil days under 11 U.S.C. 547(b)(4)(A)."

[[parameter]]
procedure = "lookback.preferences"
name = "insider_window_days"
default = 365
meaning = "Insider preference lookback window in civil days under 11 U.S.C. 547(b)(4)(B) for parties related via OWNS/CONTROLS/RELATED_TO."

[[parameter]]
procedure = "lookback.preferences"
name = "baseline_days"
default = 180
meaning = "Pre-preference baseline window in civil days for ordinary-course days-to-pay statistics under 11 U.S.C. 547(c)(2)."

[[parameter]]
procedure = "lookback.preferences"
name = "ordinary_course_tolerance_days"
default = 15
meaning = "Maximum civil-day deviation from the creditor's baseline average days-to-pay for the 11 U.S.C. 547(c)(2) ordinary-course defense."

[[parameter]]
procedure = "lookback.preferences"
name = "contemporaneous_days"
default = 5
meaning = "Maximum civil days between obligation creation and settlement for the 11 U.S.C. 547(c)(1) contemporaneous-exchange defense."

[[procedure]]
id = "lookback.fraudulent_transfer"
version = 2
claim = "statistical"
evidence = "FA-EVID-L55"
tie_break = "entry_vid"
complexity = "O(legs log legs)"
calibration = "uncalibrated"
summary = "Constructive and actual fraudulent transfer lookback (11 U.S.C. 548 two-year window and UVTA section 9 four-year window): scans asset outflows for badges of fraud (insider transferee via RELATED_TO, transfer while balance-sheet insolvent, absence of corroborated reasonably-equivalent-value evidence, and manual/round-amount concealment). Window arithmetic preserves the full u32 domain; older versions narrowed civil-day windows to signed i32."
effective_through = "optional"

[[parameter]]
procedure = "lookback.fraudulent_transfer"
name = "section_548_days"
default = 730
meaning = "Bankruptcy Code 11 U.S.C. 548 fraudulent-transfer lookback window in civil days (default 730 = 2 years)."

[[parameter]]
procedure = "lookback.fraudulent_transfer"
name = "uvta_days"
default = 1460
meaning = "UVTA section 9 fraudulent-transfer lookback window in civil days (default 1460 = 4 years)."

[[procedure]]
id = "ponzi.net_investment"
version = 5
claim = "statistical"
evidence = "FA-EVID-L56"
tie_break = "entry_vid"
complexity = "O(legs log legs)"
calibration = "uncalibrated"
summary = "Madoff net-equity Ponzi schedule (In re Bernard L. Madoff Investment Securities LLC, 654 F.3d 229): computes per-investor principal in minus principal out, funding cohort, net-loser equity claims, and net-winner fictitious profits subject to clawback. Cash is the accounts holding the `cash` account role; investor capital is Equity or an account holding the `investor_capital` account role. Refused when no account holds the cash role. Version 5 adds the named posted_principal_transfer_v1 rule: within each exact (unit, legal entity) partition, a cash-free entry transfers the posted principal of one explicitly named investor leg against only unnamed clearing legs on accounts holding the `investor_transfer` account role, or balanced investor-capital legs naming exactly two parties. Credits increase and debits reduce principal; cash_in/cash_out remain actual cash and transfer_in/transfer_out are separate. A transfer-in starts the recipient's funding cohort. Named, mixed, missing-party or unbalanced transfer shapes refuse; an unmarked fee or other contra never implies transfer. No originating-principal cap or legal transfer credit is inferred, so trustee-credited amounts remain named inputs. Version 1 guessed roles from code/name/description; version 2 gave every party the entry's whole cash. Version 3 (fa-6l8g) attributes cash only through each party's own legs, reports unresolved_attribution and marks affected investors incomplete. Version 4 (fa-yugf.83) retains only parties with an investor movement; their other attributed cash still counts. Version 4 distribution procedures remain cash-only."
effective_through = "optional"

[[parameter]]
procedure = "ponzi.net_investment"
name = "cohort_window_days"
default = 90
meaning = "Investor cohort bucket width in civil days from the earliest investor inflow."

[[procedure]]
id = "graph.ponzi_motif"
version = 1
claim = "statistical"
evidence = "FA-EVID-L65"
tie_break = "entry_vid"
complexity = "O(legs log legs)"
calibration = "uncalibrated"
summary = "Windows in which new investors' money funds payouts to earlier investors (plan §11.4). Cash is the accounts holding the `cash` account role; a subscription is cash in against an Equity account or one holding the `investor_capital` account role, in an entry naming exactly one party, and an investor's cohort is the window_days window of its first subscription, counted from the unit's first. Per window and unit: new money is what investors in that window's cohort subscribed in it, and redemptions are the cash paid in it to investors of earlier cohorts, whatever the contra account. A window is flagged when new money is at least min_coverage_bps of its redemptions: High when the window's operating cash in (cash in that is not a capital movement) is less than the redemptions, otherwise Medium. The statistic is new money over redemptions in basis points, and the finding cites the redemption entries, then the new-money entries. Refused when no account holds the cash role."
effective_through = "optional"

[[parameter]]
procedure = "graph.ponzi_motif"
name = "window_days"
default = 90
meaning = "The cohort and comparison window in civil days, counted from the unit's first subscription; at least 1."

[[parameter]]
procedure = "graph.ponzi_motif"
name = "min_coverage_bps"
default = 10000
meaning = "The least new money, as basis points of the window's redemptions to earlier investors, that flags it (10000 = new money covers every redemption); at least 1."

[[procedure]]
id = "distribution.rising_tide"
version = 4
claim = "statistical"
evidence = "FA-EVID-L57"
tie_break = "entry_vid"
complexity = "O(legs log legs)"
calibration = "uncalibrated"
summary = "Rising-tide receivership distribution (SEC v. Huber, 702 F.3d 903): equalizes cumulative recovery rates (pre-receivership withdrawals plus receivership distribution divided by principal invested) across net-loser investors up to the exact rational water level supported by the distributable pool under LargestRemainder. Cash is the accounts holding the `cash` account role; an investor movement's contra leg is on an Equity account or one holding the `investor_capital` account role (registries/account_roles.toml, assigned with fa chart role). Refused when no account holds the cash role. Version 1 guessed both from code and name tokens and from words in entry descriptions. Version 3 (fa-6l8g) attributes each entry's cash, within each (unit, legal entity) partition, only to the investors whose own legs fund or receive it (or the one party the cash legs name when no contra leg names one); a unit holding cash no one investor's legs account for reports an unresolved_attribution finding and no schedule; version 2 gave every party an entry named the entry's whole cash. Version 4 (fa-yugf.83) keeps in the population only parties with an investor movement, so a vendor's refund or a customer's payment makes no one an investor; a member's other attributed cash still counts. Version 3 kept every party with attributed cash in."
effective_through = "optional"

[[parameter]]
procedure = "distribution.rising_tide"
name = "distributable_pool"
default = 0
meaning = "Explicit distributable cash pool in unit mantissa (0 = use the book's ending positive cash/asset balance in that unit)."

[[procedure]]
id = "distribution.pro_rata"
version = 4
claim = "statistical"
evidence = "FA-EVID-L58"
tie_break = "entry_vid"
complexity = "O(legs log legs)"
calibration = "uncalibrated"
summary = "Cunningham v. Brown pro-rata receivership distribution: allocates the distributable cash pool across net-loser investors in exact proportion to their net unrecovered principal (cash_in minus cash_out) under LargestRemainder. Cash is the accounts holding the `cash` account role; an investor movement's contra leg is on an Equity account or one holding the `investor_capital` account role (registries/account_roles.toml, assigned with fa chart role). Refused when no account holds the cash role. Version 1 guessed both from code and name tokens and from words in entry descriptions. Version 3 (fa-6l8g) attributes each entry's cash, within each (unit, legal entity) partition, only to the investors whose own legs fund or receive it (or the one party the cash legs name when no contra leg names one); a unit holding cash no one investor's legs account for reports an unresolved_attribution finding and no schedule; version 2 gave every party an entry named the entry's whole cash. Version 4 (fa-yugf.83) keeps in the population only parties with an investor movement, so a vendor's refund or a customer's payment makes no one an investor; a member's other attributed cash still counts. Version 3 kept every party with attributed cash in."
effective_through = "optional"


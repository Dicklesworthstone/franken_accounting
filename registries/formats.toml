# Interop & Conformance Formats Registry (`registries/formats.toml`, plan §9.5 / §16.3 / §18.1, bead `fa-npi`).
#
# Every external journal, audit data standard, regulatory filing, semantic
# corpus, and bank statement format supported by `fa-formats` has a closed row
# here. No float parsing is permitted in any format reader or writer; amounts
# are exact fixed-scale `fa_money::Amount` integers at the unit's registered
# scale.

schema_version = 1

[[format]]
id = 1
name = "beancount_v3"
kind = "plain_text_journal"
direction = "both"
mime = "text/x-beancount"
extension = "beancount"
oracle_tool = "bean-check"
round_trip_identity = false
certified_coordinate = true
plan_ref = "§16.3"
summary = "Beancount v3 plain-text double-entry journal (open directives, dated transactions, multi-unit postings, balance assertions) used for external balance differential oracles."


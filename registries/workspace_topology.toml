# workspace_topology.toml — plan §18.1 as data (bead fa-37f).
#
# `layers` is the legal dependency order, lowest first. A crate may depend
# only on its own or a lower layer through a normal or build edge; a dev
# (test-only) edge may also reach the verification layer, where the oracles
# live. `allowlist`, when present, is the complete set of first-party crates
# the crate may depend on through any edge (plan §18.1: fa-reference depends
# on no engine crate, fa-verify on nothing but std).
#
# Every §18.1 crate has a row. `planned = true` marks one that does not exist
# yet; the row flips in the change that creates the crate. scripts/check.sh
# step `topology` fails when a crate under crates/ has no present row, when a
# present row names no crate, or when a cargo metadata edge breaks the order
# or an allowlist. fa-registry pins the rows to the plan's §18.1 table.

schema_version = 1
layers = ["foundation", "model", "laws", "kernel", "evidence", "analytics", "governance", "interop", "surface", "verification", "tooling"]


# symbols.toml — the frozen symbol table for the substrate's host-interned
# ids (plan §4.1 "Symbols", Appendix H R-SYM). Additive-only: a released id is
# never renumbered or reused. The same table is journaled into every book at
# creation and `fa doctor` fails when the binary's table and the book's differ.
#
# Consumer: fa-model (constants + GraphSymbolResolver), fa-journal writes,
# every GQL statement fa-query emits. Gate: duplicate ids or names fail.

schema_version = 1


# =============================================================================
# registries/slo.toml — Section 17 Performance Targets and Capacity SLOs
# (plan §1.12, §17, §18.2, §20, Appendix G; beads fa-tu58, fa-i5s)
# =============================================================================
#
# Constitutional rules enforced by `fa-registry` and `tools/registry-check`:
# 1. Claim typing: every row in `slo.toml` must have `claim_class` in
#    `["slo", "benchmark"]` (ranks 5 and 6 of `constitution.toml`). Any row
#    claiming `invariant`, `proof`, `bounded_model`, or `statistical` is a
#    constitutional violation and fails `registry-check`.
# 2. Derivability from `operation_costs.toml`: every row names a valid
#    `operation_class` in `operation_costs.toml` and satisfies
#    `target_p50_us >= barrier_count * pinned_fsync_p50_us`.
# 3. Balance-read disclosure law (§17): every balance-read or trial-balance
#    row must set `requires_watermark_disclosure = true` so `fa-bench` reports
#    whether the read was served at the watermark or with a tail fold and the
#    exact `tail_length`.
# 4. Activation needs a measurement (fa-e75k): `activated = true` is legal only
#    when the row's manifest carries a [baseline] produced by running the named
#    workload; fa-bench refuses an activated row whose manifest has none.
#
# Status (2026-10-20, fa-e75k): every row is a provisional target, none is
# measured. Earlier revisions marked all 20 rows activated over hand-entered
# baselines (e.g. a 10M-leg register rebuild at "2.8 ms") whose benchmarks did
# not execute the named workloads; that evidence was withdrawn
# (docs/NEGATIVE_EVIDENCE.md). Real measurement is fa-ykbp.

schema_version = 1

[reference_machine]
id = "ref-nvme-pcie4-32c"
cpu = "32-core/64-thread reference server"
ram_gb = 256
storage = "PCIe-4 NVMe single node"
pinned_fsync_p50_us = 1000

[[slo]]
id = "FA-BENCH-01"
name = "single_entry_post"
domain = "Single-entry post (one publication, two ordered syncs, with projections, 2–6 legs)"
operation_class = "single_entry_post"
claim_class = "benchmark"
counting_unit = "entry"
pinned_fsync_p50_us = 1000
target_p50_us = 2000
target_p99_us = 15000
requires_watermark_disclosure = false
activated = false
provisional_gate = "p50 <= 2 * pinned fsync p50; p99 < 15 ms warm; unbatched rate bounded by 1 / (2 * fsync p50) reported until R-GC"
derivation = "single_entry_post has barrier_count = 2 (capsule sync + marker sync); target_p50_us (2000) >= 2 * pinned_fsync_p50_us (1000)"
measurement_command = "cargo run -p fa-bench --bin fa-bench -- --bench single_entry_post"
manifest = "bench/manifests/single_entry_post.toml"


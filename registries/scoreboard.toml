# =============================================================================
# registries/scoreboard.toml — Vision Workflows (§15.6 + README Quick Example)
# and Convergence Gate Criteria (§19 G0, Genesis, G1–G4) (beads fa-e9z, fa-7s6d)
#
# Consumed by:
#   - crates/fa-registry/src/scoreboard.rs (schema & foreign-key validation)
#   - tools/registry-check/src/main.rs
#   - crates/fa-cli/tests/scoreboard.rs (executable E2E measurement against
#     the real `fa` binary; fails if any step's actual status/exit/event drifts
#     from its declared expectation in EITHER direction)
#   - tools/xtask (`cargo run -p xtask -- scoreboard`)
# =============================================================================


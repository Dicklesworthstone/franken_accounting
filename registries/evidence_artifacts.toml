# Work-Witness Evidence Schema and Claim-Artifact Ledger (fa-vtzt).
#
# Every activated SLO, live formal proof or model lane, external-oracle claim,
# lab-campaign model checker, or corpus/planted calibration claim in the
# registries or repository prose must cite a registered `FA-ART-*` artifact row
# whose content-addressed witness manifest under `evidence/<kind>/<id>.toml`
# hashes to `manifest_blake3` and carries work-witnesses that only the real
# computation can produce.
#
# Six artifact kinds are recognized:
#   - `benchmark`:       scale_witness, iterations, warmup, quantile_samples_ns,
#                        flamegraph_svg_sha256, host_cpu_model, host_kernel,
#                        runner = "rch-worker" | "local-pinned".
#   - `external-oracle`: tool_binary_path, tool_version_stdout, tool_binary_sha256,
#                        input_fixture_sha256, tool_stdout_sha256, tool_exit_code,
#                        compared_cells (>= 1).
#   - `lean`:            lean_version, lake_manifest_sha256, olean_tar_sha256,
#                        theorem_inventory (every theorem with sorry_count = 0
#                        and forbidden axioms absent).
#   - `tlc`:             tlc_version, spec_sha256, cfg_sha256, distinct_states (>= 1),
#                        states_generated (>= distinct_states), depth (>= 1),
#                        result = "pass".
#   - `lab-campaign`:    seed_manifest_sha256, schedule_count (>= 1),
#                        explored_interleavings (>= 1),
#                        certificate_hashes_blake3 (non-empty).
#   - `calibration`:     corpus_manifest_sha256, case_count (>= 1),
#                        per_procedure_confusion (true_positives, false_positives,
#                        false_negatives, true_negatives; TP + FN >= 1).


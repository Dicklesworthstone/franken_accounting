# limits.toml — the per-kind maximum sizes every decoder enforces before it
# allocates (plan Appendix A encoding laws; §4.2 `max_entry_bytes`). Raising a
# limit is an additive-minor change; lowering one is breaking-major.
#
# Consumer: fa-model decoders (compiled constants cross-checked by the
# `code_limits_match_registry` test), fa-journal refusals that cite the bound.
# Gate: a name here with no constant in fa-model, or vice versa, fails CI.

schema_version = 1

[[limit]]
name = "max_entry_bytes"
value = 8388608
[[limit]]
name = "max_legs_per_entry"
value = 4096

# =============================================================================
# registries/mutants.toml — Named Source Mutations of Kernel Laws (bead fa-9km9)
# =============================================================================
#
# Each [[mutant]] row names:
# - id:         dense identifier MUT-001 .. MUT-NNN
# - file:       workspace-relative source file path
# - find:       exact substring in `file` (must occur exactly once)
# - replace:    mutated replacement text (applied in a scratch copy, never in tree)
# - law:        invariant clause (FA-INV-*) or refusal code (FA-REF-*) broken
# - killed_by:  one or more `crate::target::path` test entrypoints that must fail
# - description: why this mutation breaks the accounting/verification law
#
# Validated statically by `fa-registry::mutants` and `tools/registry-check`,
# and executed against scratch copies by `xtask mutants`.
# =============================================================================

schema_version = 1


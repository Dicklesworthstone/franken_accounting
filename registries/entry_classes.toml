# TimeEvidence ticks (plan §7.1a): ControlPayload::TimeTick, book-scoped,
# strictly increasing; authority row `time-tick` in sod_policy.toml.
[[class]]
tag = 19
name = "TimeControl"
kind = "control"
supersession = "none"

# Expiry-sweep progress (plan §5.4): ControlPayload::SweepCursor, book-scoped,
# one per sweep batch; authority row `expiry-sweep` in sod_policy.toml.
[[class]]
tag = 20
name = "SweepControl"
kind = "control"
supersession = "none"

# Scheduled-reversal lineage (plan §7.6, FA-INV-08): ControlPayload::
# ScheduleCancelled, book-scoped, journaled by the kernel in the commit of a
# manual Reversal of a scheduled target; authority row `schedule-cancel`.
[[class]]
tag = 21
name = "ScheduleControl"
kind = "control"
supersession = "none"

# A MigrationRun's lifecycle (plan §8.6): Open, Finalize, Abandon. Book-scoped;
# Finalize is the one record that makes a run's staged entries visible.
[[class]]
tag = 22
name = "MigrationControl"
kind = "control"
supersession = "none"

# An import run's receipt (plan §9.3; fa-txf): book-scoped and undated, like
# PolicyControl; its payload is ControlPayload::ImportRun.
[[class]]
tag = 23
name = "ImportControl"
kind = "control"
supersession = "none"

# A legal hold's placement or release (plan §8.5; fa-txf): book-scoped and
# undated; ControlPayload::HoldEvent, its scope in extension 4
# `fa:legal-hold-scope:v1`.
[[class]]
tag = 24
name = "HoldControl"
kind = "control"
supersession = "none"

# A DraftSet's lifecycle (plan §15.2, Appendix A `DraftSet`; fa-s7x): book-scoped
# and undated; ControlPayload::LifecycleTransition on the draft — Open (its body
# in extension 8 `fa:draft-body:v1`), Plan (one intent in extension 9
# `fa:draft-intent:v1`), Promote, Discard. Nothing in a draft is a trunk entry.
[[class]]
tag = 25
name = "DraftControl"
kind = "control"
supersession = "none"

# A Scenario's lifecycle (plan §15.2, Appendix B `ForkScenario`; fa-k07b):
# book-scoped and undated; ControlPayload::LifecycleTransition on the scenario —
# Open (its body in extension 10 `fa:scenario-body:v1`: fork sequence and the
# optional counterfactual start date; assumption documents as proof refs), Plan
# (one counterfactual intent in extension 11 `fa:scenario-intent:v1`), Discard.
# A scenario is never promoted: its intents post only into scratch replays.
[[class]]
tag = 26
name = "ScenarioControl"
kind = "control"
supersession = "none"

# A matter's litigation production (plan §13.2, Appendix A `ProductionProfile`;
# fa-6l9): book-scoped and undated; ControlPayload::LifecycleTransition on the
# matter's ProductionProfile — Open (the profile in extension 13
# `fa:production-profile:v1`: Bates prefix, first number, load-file format and
# the optional protective order, which is also the record's proof ref), Produce
# (the Bates ranges it assigns in extension 14 `fa:production-bates:v1`; the
# produced documents are its proof refs). A Bates number is never reassigned:
# producing a document again in its matter returns its existing range.
[[class]]
tag = 27
name = "ProductionControl"
kind = "control"
supersession = "none"

# ---- Control kinds (fa-g23) ---------------------------------------------------
# `EntryOrigin::Control.control_kind`: the act that minted a control record. It
# is durable in every control record's origin, so it is registered here rather
# than chosen per module (two modules once both minted 4). Each kind names the
# one control class it mints and the code that mints it. An origin naming an
# unregistered kind is unencodable (fa-model decode), and the kernel's staging
# cross-check (fa-model `entry_mirrors`) refuses a record whose kind mints
# another class. Ids are unique and dense from 1 over rows and reservations
# together; a reservation holds an id for a class that has not landed, and its
# row replaces it. Consumers: fa-model `ControlKind` (gate
# `code_control_kinds_match_registry`), fa-registry `ControlKinds`, the
# fa-reference mirror.
# Additive-only: an id is never renumbered or reused.

[[control_kind]]
id = 1
name = "chart_install"
class = "SchemaControl"
minted_by = "fa-journal genesis::install_chart"


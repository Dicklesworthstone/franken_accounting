# entry_classes.toml — the closed registry of entry classes (plan §8.1).
# Every entry carries exactly one class; the class decides admissibility
# (admissibility.toml), whether legs are required (posting classes) or
# forbidden (control classes), and the supersession it must declare.
#
# Consumer: fa-journal (laws step), fa-registry admissibility check, fa-cli.
# Gate: an entry whose class tag is not here is unencodable.
#
# The `[[control_kind]]` table at the end registers
# `EntryOrigin::Control.control_kind` (fa-g23).

schema_version = 1

[[class]]
tag = 1
name = "Original"
kind = "posting"
supersession = "none"
carries_open_items = true


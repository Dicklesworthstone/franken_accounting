# ---- Evidence minimum per class (FA-INV-05 `evidence-minimum`) -----------
# Original, Adjusting, Reclassification: named by plan §9.2.
[[minimum]]
class = "Original"
requirement = "documents"
min_documents = 1
kinds = "any"
manual_assertion = true

# A hold is the economic claim its Resolution(Posts) later posts; the
# resolution inherits this closure, so the hold carries the document.
[[minimum]]
class = "Pending"
requirement = "documents"
min_documents = 1
kinds = "any"

[[minimum]]
class = "Resolution"
requirement = "target"
min_documents = 0
kinds = "any"

[[minimum]]
class = "Reversal"
requirement = "target"
min_documents = 0
kinds = "any"

# A replacement's legs are new assertions: they need their own why.
[[minimum]]
class = "Replacement"
requirement = "documents"
min_documents = 1
kinds = "any"

[[minimum]]
class = "Reclassification"
requirement = "documents"
min_documents = 1
kinds = "any"
manual_assertion = true

[[minimum]]
class = "Adjusting"
requirement = "documents"
min_documents = 1
kinds = "any"
manual_assertion = true

[[minimum]]
class = "Closing"
requirement = "documents"
min_documents = 1
kinds = ["Workpaper", "Memo"]

[[minimum]]
class = "Allocation"
requirement = "documents"
min_documents = 1
kinds = ["Workpaper", "Spreadsheet", "Memo", "Contract"]

# Rates are documents (AGENTS.md accounting doctrine); a revaluation cites one.

# ---- Provenance grades (plan §9.3) ---------------------------------------
# `self_sourced`: an entry whose only evidence carries such a grade is
# self-sourced (Agent profile: drafts only; promotion needs a reviewer's
# attestation). The grade is recorded at intake; the draft/attestation
# enforcement lands with drafts and attestations.
# `intake`: whether `fa document add` may record this grade today. The others
# are derived from a receipt chain (signature, connector transcript, rule run)
# this slice cannot verify, so claiming them is refused.
[[grade]]
tag = 1
name = "ThirdPartySigned"
self_sourced = false
intake = false
[[grade]]
tag = 2
name = "Connector"
self_sourced = false
intake = false
[[grade]]
tag = 3
name = "HumanUpload"
self_sourced = false
intake = true
[[grade]]
tag = 4
name = "AgentUpload"
self_sourced = true
intake = true
[[grade]]
tag = 5
name = "Generated"
self_sourced = true
intake = false


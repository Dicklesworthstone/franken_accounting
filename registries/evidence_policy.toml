requirement = "control_record"
min_documents = 0
kinds = "any"

# A MigrationRun's Open record names the legacy trial balance in its body and
# cites it: the migration module resolves that document inside the opening
# transaction (plan §8.6), so the class itself rests on its control record.
[[minimum]]
class = "MigrationControl"
requirement = "control_record"
min_documents = 0
kinds = "any"

# An import run is its own control record: the documents it brings in are
# its subject, not its evidence (fa-txf).
[[minimum]]
class = "ImportControl"
requirement = "control_record"
min_documents = 0
kinds = "any"

# A hold names its authority document in its payload; the control record is
# its evidence (fa-txf).
[[minimum]]
class = "HoldControl"
requirement = "control_record"
min_documents = 0
kinds = "any"

# A draft's records are its intent log (fa-s7x); each planned intent carries its
# own evidence, which its promotion re-checks against the class minimum.
[[minimum]]
class = "DraftControl"
requirement = "control_record"
min_documents = 0
kinds = "any"

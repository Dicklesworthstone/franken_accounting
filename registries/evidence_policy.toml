# evidence_policy.toml — what an entry must rest on (plan §9.1–§9.3,
# FA-INV-05 clause `evidence-minimum`): the closed Document kinds, the
# provenance grades a document carries, the EVIDENCED_BY roles, and one
# evidence-minimum row per entry class.
#
# Consumer: fa-registry (`evidence_policy` module), fa-journal (`evidence.rs`:
# Document vertices at intake; every cited document resolved and the class's
# minimum checked inside the posting transaction), fa-cli (`fa document add`).
# Gate: every class in entry_classes.toml has exactly one [[minimum]] row; tags
# and names are unique per table; a `kinds` list names only registered kinds;
# a `documents` row requires at least one document.
#
# Requirements:
#   documents       at least `min_documents` cited documents whose kind is in
#                   `kinds` ("any" = every registered kind). Where the row
#                   says `manual_assertion = true` (the classes plan §9.2
#                   names), a preparer's ManualAssertion attestation over the
#                   entry's proposal digest, with a reason code from
#                   reason_codes.toml, satisfies the minimum instead.
#   target          the closure is the superseded / resolved target's
#                   (§9.2: "for a resolution, reversal, or restatement — the
#                   target entries"); cited documents are optional and are
#                   still resolved and linked.
#   control_record  control classes rest on their control record and nothing
#                   else (§9.2); they never pass through `post`.
#
# Additive-only: a released tag is never renumbered or reused.

schema_version = 1

# The largest Document payload carried in one piece (inline in an evidence
# bundle; fa-verify bundle MAX_DOCUMENT_BYTES mirrors it). A book row holds
# at most fa-journal MAX_INLINE_DOCUMENT_BYTES (12 KiB) of it inline: the
# substrate refuses a row above 16384 encoded bytes, so a larger document's
# bytes live in the book's blob store behind its inline commitment.
max_document_bytes = 16777216
max_mime_bytes = 128


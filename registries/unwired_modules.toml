# =============================================================================
# registries/unwired_modules.toml — library code no surface reaches
# (beads fa-2ioe module granularity, fa-0hs4.14 item granularity)
# =============================================================================
#
# `xtask reachability` follows references from every non-test source file of
# the surfaces (fa-cli, fad, fa-mcp, fa-verify) and the gate tools (xtask,
# registry-check) into the library crates, both at module granularity and
# transitively across top-level public functions, structs, and enums.
# Library code without a surface is unverified by e2e tests and invisible
# to agents.
#
# [[unwired]] / [[unwired_item]]: wiring debt.
# - path:       module (`crate_ident::seg`) or item (`crate_ident::…::item`)
# - owner_bead: the open/in_progress bead whose work wires it from a surface
# - reason:     what is missing
# - expires:    YYYY-MM-DD; fails on the day after unless wired or renewed
# [[verification]] / [[verification_item]]: test-harness-only by design.
# - path, reason as above
# - consumer:   workspace-relative test/verification .rs file referencing it
#
# Every row fails when stale (surface now reaches it) or dangling.
# =============================================================================


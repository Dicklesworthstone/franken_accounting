# =============================================================================
# registries/object_schemas/control_payload.toml — Closed Union ControlPayload
# Discriminants (plan Appendix A `ControlPayload`, bead fa-szi)
# =============================================================================

schema_version = 1
name = "ControlPayload"
owner = "fa-model::entry::ControlPayload"
major = 1
minor = 1
externally_verifiable = true

variant_tags = ["0:PeriodTransition", "1:SchemaChange", "2:PolicyActivation", "3:LifecycleTransition", "4:TimeTick", "5:SweepCursor", "6:ScheduleCancelled", "7:CapabilityEvent", "8:HoldEvent", "9:ErasureCut", "10:MigrationControl", "11:ReservationRelease", "13:ImportRun"]

[[decision]]
field = "ImportRun"
appendix_a = "ImportReceipt vertex (Appendix A)"
code_type = "ControlPayload::ImportRun (tag 13, crates/fa-model/src/entry.rs:890)"
rationale = "Tag 12 is reserved unused; ImportRun journals book-scoped intake receipts at tag 13 under EntryClass::IMPORT_CONTROL (class 23)."
tracking_bead = "fa-txf"

[[decision]]
field = "SchemaChange.kind=13"
appendix_a = "Period creation is a Book-scoped schema control (plan §7.3)"
code_type = "fa-journal::period_creation::PeriodCreation; ControlKind::PERIOD_CREATION=13"
rationale = "Canonical fa:period-creation:v1 bytes encode the calendar id, fiscal year and ordered PeriodDef/born-state list using length-prefixed UTF-8 and fixed little-endian integers. The existing Entry v1 container reserves effective_date=0 as an uninterpreted wire placeholder for this new control; effective_period and its effective-day mirror are absent. Definitions, control and period limit cells publish atomically. Reads reconstruct births from the retained declaration, validate them against the immutable book calendar, and compare projection birth sequences and fields. SchemaChange subkind 13 is additive; existing payload tags and registered subkinds are unchanged."
tracking_bead = "fa-ehd"

[[decision]]
field = "Book.version=2"
appendix_a = "Book genesis and Period birth authority (plan §7.3, FA-INV-02)"
code_type = "fa-journal::genesis::BookSpec"
rationale = "New Book payloads use u16 version 2 with the version-1 field layout, requiring a retained CreatePeriods declaration for every Period birth. Version-1 payloads remain decodable. Their periods created before the earliest retained CreatePeriods control use the original calendar-derived baseline, reported as legacy_periods without claiming recorded creator provenance. No old declaration is synthesized and no old payload is rewritten. This baseline cannot discover an entirely absent legacy year or prove a removed sole cutover control; version-2 books have no such fallback."
tracking_bead = "fa-ehd"

[[decision]]
field = "SchemaChange.kind=12"
appendix_a = "Effective-dated Account closes_to routes (plan §7.5)"
code_type = "fa-journal::chart::closing::ClosingRoutes; SchemaChange subkind 12"
rationale = "One canonical SchemaChange entry retains the complete sorted Revenue/Expense-to-Equity route map, effective date and digest. Chart replay validates the complete map at its recorded point; historical selection uses both effective date and recorded prefix. The write witnesses account definitions, schema controls and current policy/capability authority in its own native transaction. It never rewrites Account canonical fields or a shared mutable routing head. SchemaChange subkind 12 is distinct from the existing scenario ControlKind 12 and period-creation SchemaChange subkind 13."
tracking_bead = "fa-4o0"

[[decision]]
field = "SchemaChange.kind=14"
appendix_a = "Registered Valuation and unrealized FX routes (plan §5.2, §12.4)"
code_type = "fa-journal::chart::FxRevaluationRoutes; SchemaChange subkind 14"
rationale = "Canonical version-1 FA-FX-ROUTES bytes retain effective date, the book base-unit id and a complete sorted source/valuation/unrealized map. Foreign Single-unit Asset/Liability sources have distinct same-type Single-base valuation leaves and Single-base Revenue/Expense destinations; leaves have no balance limits. Updates may add sources but cannot remove or reassign an established triple. A valuation leaf is exclusive to one source and must have no earlier posting history when first assigned. Current whole-book Read plus SchemaChange authority and a complete-frontier commit guard protect the configuration. Fixed-prefix chart replay checks declaration order and historical selection."
tracking_bead = "fa-3ock"


[[decision]]
field = "SchemaChange.kind=15"
appendix_a = "Native receivable/payable subledgers (plan §5.6)"
code_type = "fa-journal::subledger::NativeSubledgerSpec; SchemaChange subkind 15"
rationale = "One immutable canonical version-1 definition designates a party-qualified Asset or Liability control leaf. Its Subledger identity is derived from the book and control account; code and control assignments are unique. The declaration, root, CONTROLS edge and account control pointer publish atomically. Every historical control leg, including staged migration history, must already name a valid party. New control postings witness the designation and require party attribution. Recorded-prefix chart replay advances the account projection version without turning the leaf into a summary. Party detail and control balances are independently folded at the same recorded/effective coordinate; no second posting or mutable subledger balance is introduced. External summary-feed digest attestation remains separate."
tracking_bead = "fa-03s"

[[decision]]
field = "SchemaChange.kind=16"
appendix_a = "Account roles: what an account is for (plan §11.9, bead fa-kxc4)"
code_type = "fa-journal::account_role::AccountRoleSpec; SchemaChange subkind 16"
rationale = "One immutable canonical version-1 body (fa:account-role:v1) names an account, a role registered in registries/account_roles.toml and whether the control assigns or removes it. The control changes no account row and no chart projection; chart replay decodes and skips it. The roles held at a recorded prefix are the fold of these controls in recorded order, the latest control for an (account, role) deciding, so no mutable role table exists. Assignment requires current whole-book SchemaChange authority, a posting leaf and an account type the role admits. Lantern selects procedure populations from this fold."
tracking_bead = "fa-kxc4"

[[decision]]
field = "SchemaChange.kind=17"
appendix_a = "Dimension / DimensionValue (plan §4.1, bead fa-ficc)"
code_type = "fa-journal::dimension::DimensionValueSpec; SchemaChange subkind 17"
rationale = "One immutable canonical version-1 body (fa:dimension-value:v1) declares a value of a registered dimension kind (fa_model::DIMENSION_KINDS, fixed dimension ids 2..=9): kind, code, name, optional parent within the same dimension and valid time [valid_from, valid_to). The same transaction materializes its DimensionValue vertex carrying that body (and the kind's Dimension vertex on its first value) with a CHILD_OF edge to its parent, as party values are materialized. It changes no account row; chart replay decodes and skips it, and fa-verify's fold skips it. The posting kernel judges a tagged value by one witnessed point read of its vertex."
tracking_bead = "fa-ficc"

[[decision]]
field = "SchemaChange.kind=18"
appendix_a = "Account.dimension_requirements (plan §4.3, bead fa-ficc)"
code_type = "fa-journal::dimension::DimensionRequirementSpec; SchemaChange subkind 18"
rationale = "One immutable canonical version-1 body (fa:dimension-requirement:v1) names a registered dimension, a posting leaf and whether the leaf now requires a value of it. The same transaction compare-and-sets the dimension's Dimension vertex payload (fa:dimension-required-accounts:v1, strictly ascending account ids), a projection rebuildable from these controls in recorded order. It changes no account row; chart replay decodes and skips it. Posting reads each registered dimension's vertex once per entry; requirements and value windows bind only legs a preparer chooses."
tracking_bead = "fa-ficc"

[[decision]]
field = "SchemaChange.kind=19"
appendix_a = "DimensionValue valid-time effectivity (plan §4.1, bead fa-ficc)"
code_type = "fa-journal::dimension::DimensionCloseSpec; SchemaChange subkind 19"
rationale = "One immutable canonical version-1 body (fa:dimension-close:v1) names a registered dimension, a value code and the date from which the value tags no leg. The same transaction compare-and-sets the value's DimensionValue vertex payload to its declaration with that valid_to, a projection rebuildable from the creation and close controls in recorded order. A close only shortens a window, never empties it, and is refused while any leg it tags (read through FOR edges and effective-day mirrors in the transaction) is effective on or after the date. Chart replay decodes and skips it; fa-verify's fold skips it."
tracking_bead = "fa-ficc"

[[decision]]
field = "SchemaChange.kind=20"
appendix_a = "RuleVersion (plan §10.3, §10.6, bead fa-c34)"
code_type = "fa-journal::rule::RuleVersionSpec; SchemaChange subkind 20"
rationale = "One immutable canonical version-1 body (fa:rule-version:v1) carries a Canon rule's source and the canonical fa:canon-ir:v1 IR the kernel compiled it to against the book's units at proposal; the kernel compiles the source itself, so the stored IR is the compiler's output. The same transaction materializes the RuleVersion vertex carrying that body at the address derived from the IR digest, so a version is its content: proposing the same IR again writes nothing. A reader decodes the IR through Canon's structural validation and balance proof and refuses one that digests to another address. It activates nothing and changes no account; chart replay decodes and skips it, and fa-verify's fold skips it."
tracking_bead = "fa-c34"

# =============================================================================
# registries/object_schemas/deposit_profile.toml — Deposit participant profile
# (plan §15.6 workflow 3, FDIC 12 CFR Part 370; bead `fa-p370`)
# =============================================================================
#
# RecordDepositProfile journals one Deposit instrument's complete Part 370
# profile from valid_from. The control entry is the whole record: it changes
# no account and no balance, and replay re-checks that the instrument is a
# recorded Deposit and every participant a recorded Party. A later profile
# takes over from its own valid_from; at one valid_from the profile recorded
# last corrects the earlier one (selection by valid_from, then recorded
# sequence).
#
# Canonical bytes (fa-model::deposit::DepositProfileSpec):
#   u128 instrument, u8 product, u8 capacity, u128 primary_party,
#   option<u128> interest_account, list<participant>, i32 valid_from
#   participant: u128 party, u8 role, u32 ownership_bps, u32 beneficiary_count
# Participants are strictly ascending by (party, role). Decode refuses an
# incomplete set: no owner; an owner share outside 1..=10000; owner shares
# not summing to exactly 10000; a share on a non-owner; a beneficiary count
# except on a REV or IRR owner (where it is required); a primary party that
# is not an owner; unknown tags; trailing bytes.

schema_version = 1
name = "DepositProfile"
owner = "fa-model::deposit::DepositProfileSpec"
major = 1
minor = 0
schema_change_kind = 23
externally_verifiable = false

fields = ["instrument:u128", "product:u8", "capacity:u8", "primary_party:u128", "interest_account:option<u128>", "participants:list<deposit_participant>", "valid_from:i32"]
participant_fields = ["party:u128", "role:u8", "ownership_bps:u32", "beneficiary_count:u32"]


# Governed reusable cash-flow classifications (plan §12.1, fa-nzix).
schema_version = 1
name = "CashFlowPolicyDefinition"
owner = "fa::cash_flow_policy_activation"
major = 1
minor = 0
externally_verifiable = false
format = "fa:cash-flow-policy-definition:v1"
plan_format = "fa:cash-flow-policy-plan:v1"
definition_digest_domain = "fa:cash-flow-policy-definition-digest:v1"
chart_basis_domain = "fa:statement-chart-basis:v1"
entry_extension = 43
minimum_entry_minor = 11
max_definition_bytes = 65536

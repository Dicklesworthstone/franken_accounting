# Transaction-local canonical payload storage (fa-nd7g).
# First consumers: PostPlan, ReplacementPlan, BatchPlan and IntentOutcome. Other object families
# have not migrated; this format does not claim their capacity acceptance.
schema_version = 1
manifest_format = "fa:object:v1"
content_domain = "fa:object-content:v1"
fragment_domain = "fa:object-fragment:v1"
chunk_bytes = 4096
inline_bytes = 4096
post_plan_kind = 1
replacement_plan_kind = 2
batch_plan_kind = 3
intent_outcome_kind = 4
registry_epoch_kind = 5
register_checkpoint_kind = 6
statement_definition_kind = 7
period_plan_kind = 8
migration_run_kind = 9
migration_source_kind = 10
entry_kind = 11

# At/below one document Merkle leaf, preserve raw canonical bytes.
# Above it, the root payload is fixed(manifest_format) || u16 kind ||
# u64 length || digest[32] || chunk_root[32], little-endian integers.
# digest = H(content_domain || u16 kind || canonical_bytes).
# chunk_root uses precisely the document commitment tree in plan §9.1.
# A fragment contains at most one 4096-byte leaf and exactly three properties:
# FA_PAYLOAD (raw bytes), FA_DIGEST (full object digest), BOOK_ID (16 bytes).
# At the b323bd17 substrate pin, a full fragment's encoded row is 4794 bytes:
# 10 patch header + 40 identity/birth/time + 16 label/property counts and label
# + 36 property-key/length framing + 4618 payload + 46 digest + 28 book.
# The three byte scalars include their tag and memcomparable terminator.
# Thus one document leaf fits the native 16384-byte ceiling without splitting.
# Fragment VId = low128(H(fragment_domain || book[16] || root_vid[16] ||
# digest[32] || u64 ordinal)). Root and every fragment publish in one WriteTxn.
# No fragment may predate the root, be rewritten, or have a different birth.
# The caller's format bound admits the length before allocation or lookup.
# Reassembly checks exact lengths, full content digest and Merkle root.
# Corruption is a KernelError (exit 5), never a partial successful read.
# Historical raw plan payloads remain readable under their original codec.
# BatchPlan uses one root for the complete ordered batch, with CITES from
# every member and its IntentOutcome. Its own format bound is registered in
# batch_plan.toml. IntentOutcome kind 4 uses the IntentOutcome label for root
# and fragments, preserving their accounting-object scratch replay together.
# intent_outcome.toml defines its body bound and historical raw-root compatibility.
# Successful EntryClaim/coverage/key-tree/replay-witness rows share the label,
# but use small independent inline codecs in posting_outcomes.toml, not kind 4.
# RegistryEpoch kind 5 archives the exact registry texts bound by a native
# report certificate. Root and fragments share the Certificate maintenance
# label, like plan objects, and publish with the report in one transaction.
# The distinct kind, body format and identity domain keep them separate from
# report artifacts. Certificate storage is excluded from accounting scratch replay.
# RegisterCheckpoint kind 6 stores complete native-period or functional-period
# fold snapshots. Each profile has a distinct body, identity and pointer format
# (register_checkpoint.toml and functional_register_checkpoint.toml). Root and
# fragments use RegisterCheckpoint, share immutable birth, and publish atomically
# with their RegisterState/cells or complete-state discovery pointer.
# They are rebuildable maintenance data, not authenticated opening-balance proof.
# StatementDefinition kind 7 stores a canonical custom definition under its
# own authoritative label. Root/fragments publish with the approving PolicyControl
# activation and retain their original birth; scratch replay preserves them.
# PeriodPlan kind 8 retains the authenticated opening manifest atomically
# with its PeriodControl. The exact record proves the original minted and
# blocked outcomes on retry without reconstructing them from today's state.
# MigrationRun kind 9 retains the canonical v1 run body without changing its
# digest or control transcript. Its fragments use MigrationRunFragment, an
# authoritative label preserved by scratch replay. The root's state may later
# transition; reassembly pins its original immutable birth and authenticates
# every fragment at the requested known-at, never at an invented current time.
# MigrationSource kind 10 retains the bounded canonical source population.
# Its immutable MigrationSource root and MigrationSourceFragment children
# publish with BindSource in one transaction; the root names that control.
# Scratch replay preserves both labels. Unlike a run, this root never changes.
# Entry kind 11 stores unchanged fa:entry:v1 bytes above the inline threshold.
# The root retains Entry and every original non-payload mirror; fragments use
# EntryFragment=66, never Entry, in the same posting transaction. Canonical
# proposal/entry/semantic digests and notary leaf bytes remain unchanged.
# The complete object is bounded by max_entry_bytes before allocation; the
# posting template separately enforces its complete transaction byte ceiling.
# Snapshot, transaction-overlay, history, export and proof readers reassemble
# only exact original fragment births matching the root's publication.
# Historical inline Entries remain valid even above the new 4096-byte threshold.
# Scratch replay preserves root and fragments together as accounting objects.

# Immutable reviewed close graph and its derived task projections (plan §7.5).
schema_version = 1
name = "CloseRun"
owner = "fa_model::close_run::CloseRunBody"
major = 1
minor = 0
externally_verifiable = false
body_digest_domain = "fa:close-run:v1"
task_digest_domain = "fa:close-task:v1"
identity_domain = "fa:vid:close-run:v1"
task_identity_domain = "fa:vid:close-task:v1"
entry_class = "CloseControl"
control_kind = "close_transition"
extension_tag = 40
entry_schema_minor = 8
max_tasks = 16
max_text_bytes = 128
max_body_bytes = 12288
run_fields = ["version:u16=1", "book_id:bytes16", "name:string", "period:string", "owner:u128", "tasks:list<CloseTask>"]
task_fields = ["version:u16=1", "id:string", "depends_on:list<string>", "action:u8", "action_fields"]
action_tags = ["0:PromoteDraft", "1:PeriodTransition", "2:VerifyYearEndClose", "3:VerifyBankReconciliation", "4:VerifyBankInstrumentCoverage", "5:RequireCurrentStatementIssuance"]
draft_fields = ["draft:u128", "name:string", "owner:u128", "source_known_at:u64", "source_digest:bytes32", "certificate_digest:bytes32", "entries_digest:bytes32", "entry_count:u32"]
period_fields = ["to:u8=2|3|4"]
year_end_fields = ["fiscal_year:i32"]
bank_reconciliation_fields = ["manifest_oid:bytes32"]
bank_instrument_coverage_fields = ["manifest_oids:list<bytes32>"]
statement_issuance_fields = ["ordinal:u32>0"]
rehearsal_outcome_tags = ["0:AlreadyCompleted", "1:Rehearsed", "2:AwaitingNativeTransitionReview", "3:VerifiedYearEndClose", "4:VerifiedBankReconciliation", "5:VerifiedBankInstrumentCoverage", "6:CurrentStatementIssuance"]
statement_issuance_rehearsal_fields = ["ordinal:u32", "checked_at:u64", "issuance:u128", "certificate_digest:bytes32", "certified_at:u64", "source_digest:bytes32"]

# Integers use fixed little-endian widths. Strings and lists use u32 lengths;
# tasks are encoded inline. Tasks and dependency ids are strictly ascending.
# Ids are nonempty and unique, prerequisites exist in the same run, and the
# graph is acyclic. The run and every task body reject unknown versions,
# unknown actions, empty drafts, excess sizes, truncation and trailing bytes.
# The period action only targets SoftClosed, Closed or Locked. The kernel
# limits it to one terminal task depending transitively on every other task.
#
# The run body and each task body have separate domain-separated commitments.
# Identity uses the book+run name; a task adds its local id with length framing.
# CloseTask -> prerequisite edges use DEPENDS_ON. Immutable lifecycle controls
# are authoritative; state and graph vertices are replayable projections.
# Open and execution require current whole-book Read and Close authority;
# status requires Read. The underlying native operation retains ordinary
# posting/period laws and approval requirements. Completion records publish
# atomically with their exact effects, and retries recheck current authority.
# A selected combined review is a CloseRun 1->1 self-transition whose one
# Object proof names the retained certificate digest. Its first task shares
# that publication and principal. Reviewed task completions preserve the
# original Vertex(effect) proof followed by Object(review_digest); historical
# completions with only Vertex(effect) remain valid before the first selection.
# A new selection appends history and cannot relabel completed tasks. Once a
# selection exists, unfinished tasks cannot drop it or restore a superseded
# selection. Selection is authorized inside the native CompleteTask path;
# no separate attachment-only publication or new approval is permitted.
#
# The recorded draft certificate is actually retained and replayed by the
# facade; the kernel binds its immutable digest and native reviewed effects.
# The same division applies to the complete combined review: the facade reads
# its original retained bytes, replays them, and compares current effects;
# the kernel checks its bounded family/book/run/body identity and exact native
# frontier, witnesses retention, and atomically binds the review to the effect.
# The identity token alone does not establish the review's accounting result.
# An issued-statement prerequisite selects an existing native issuance in the
# run's period and depends transitively on every monetary task. Its retained
# statement bytes and native issuance must agree on book, trunk, primary period,
# definition and certified prefix. The facade fully replays the statement;
# the kernel authenticates retention and rejects later accounting input changes,
# including offsetting entries. Its receipt binds Vertex(issuance control entry)
# and Object(source digest), followed by the selected combined review digest.
# The first execution of an issuance-gated run requires a retained combined
# review. Terminal planning and publication recheck the current source. Original
# receipts authenticate their historical prefix even after later activity.
# This prerequisite neither generates nor issues a replacement statement.
# This schema does not attest that arbitrary Canon/procedure tasks executed,
# that a draft certificate is a signature, or that portable monetary reports
# independently establish the close workflow's admission predicates.

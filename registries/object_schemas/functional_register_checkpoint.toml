# Complete unfiltered functional period activity (plan §5.3).
schema_version = 1
name = "FunctionalRegisterCheckpoint"
owner = "fa_registers::functional_maintainer"
major = 1
minor = 0
externally_verifiable = false
format = "fa:register-functional-period-checkpoint:v1"
identity_domain = "fa:vid:register-functional-period-checkpoint:v1"
head_identity_domain = "fa:vid:register-functional-period-head:v1"
pointer_format = "fa:register-functional-period-pointer:v1"
book_definition_domain = "fa:register-functional-period-book:v1"
body_domain = "fa:register-functional-period-body:v1"
fold_digest_domain = "fa:register-functional-fold:v1"

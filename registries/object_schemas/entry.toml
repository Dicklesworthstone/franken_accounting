[[decision]]
field = "extensions.12"
appendix_a = "Intrinsic YearEndClose source provenance (plan §7.5)"
code_type = "fa-model::closing::YearEndCloseBasis; YEAR_END_CLOSE_EXTENSION=12"
rationale = "The versioned FA-YEAR-CLOSE framing retains fiscal_year, closing_period, closing_date, observed_at, routes_entry, routes_digest and source_digest. Every field is covered by the ordinary proposal digest. The native kernel requires this basis for every new Closing admission and independently reproduces the exact complete fiscal-year contributions, nominal residuals and equity routes. A PostIntent preserves the sealed proposal across independent approval records; a PostPlan retains the new publication frontier guard. This intrinsic computation makes no claim that the generic Canon rule VM executed."
tracking_bead = "fa-4o0"

[[decision]]
field = "extensions.16"
appendix_a = "Source-bound cumulative PeriodEndRevaluation (plan §5.2, §12.4)"
code_type = "fa-model::revaluation::FxRevaluationBasis; FX_REVALUATION_EXTENSION=16"
rationale = "Versioned FA-FX-REVALUE bytes bind period and its last included date, original observation prefix, foreign source account and selected entity, immutable route control and digest, retained closing Rate OID and commitment, and complete cumulative source digest. Version 1 remains byte-identical for aggregate revaluation. Version 2 at entry minor 4 adds a complete LargestRemainder v1 item allocation ordered by target VID and ordinal, with exact open native amount, historical base, prior signed valuation and allocated target base per item. Each nonzero item delta has an explicit valuation/unrealized pair, so zero-net reallocations still post. Fresh native admissions reproduce original and current populations and exact derived legs; publication guards the full preparation frontier. Caller-provided exposure or carrying balances are not authority. Legacy aggregate allocations are never inferred. No generic Canon execution, reverse-revaluation workflow, batch or draft-promotion support is claimed."
tracking_bead = "fa-3ock"

[[decision]]
field = "extensions.37"
appendix_a = "Allocated carrying relief and exact restoration (plan §5.2, §5.7)"
code_type = "fa-model::revaluation::FxSettlementValuationBasis; FX_SETTLEMENT_VALUATION_EXTENSION=37"
rationale = "Entry minor 4 admits version-1 FA-FX-RELIEF bytes containing ordered unique applying-leg ordinals, source digests, exact historical/total/signed valuation relief, and original route identity, digest and destination accounts. Historical plus valuation relief must equal total relief in one functional unit. The native kernel derives every value from the complete item history and emits the explicit valuation/unrealized reversal pair; exact settlement reversals restore the recorded effects. The existing max_extension_bytes frame bound and entry-derived item count bounds apply before decoding. This is a checked computation basis, not a signature or an independently verified report profile; portable functional export of these laws requires a separate verifier implementation."
tracking_bead = "fa-pvt7"

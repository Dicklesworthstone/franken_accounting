[[decision]]
field = "extensions.25"
appendix_a = "Restatement disclosure and its complete supported statement comparison set (plan §8.3)"
code_type = "fa-journal::Disclosure; CASE_DISCLOSURE_EXTENSION=25; wire versions 1 and 2; v2 minimum schema minor 7"
rationale = "Version 1 retains its original document and attestation bytes and never acquires invented comparison evidence. Fresh version 2 appends the actual committed Post VID and CommitSeq, then a nonempty strictly ascending list of at most max_proof_refs minus two distinct nonzero comparison digests. The full encoded Entry, including its proof refs and sealed description, must fit 12288 bytes before opening the publication transaction, leaving byte-scalar expansion and mirror headroom within the pinned substrate's 16384-byte row. A bounded pure kernel validator hashes the complete existing comparison container, requires consistent native v4 or functional v5 sources with the same book, trunk and statement question, and binds their after frontier to the exact Post. Only its opaque tokens reach disclosure admission, which witnesses that Post and the immutable retained Certificate roots. The facade additionally checks the complete independently selected original-report-to-Post questions and replays both sources; wrong, missing, duplicate and extra questions refuse. Certificate retention already requires complete source replay. This does not claim independent kernel statement arithmetic or case-question completeness, all active custom/cash-flow/equity layouts, or an offline proof of case-disclosure admission; each cited comparison retains its existing portable verification contract."
tracking_bead = "fa-0hs4.7"

[[decision]]
field = "extensions.33"
appendix_a = "Contractual maturity for obligations and receivable due-date aging (plan §11.6–11.7)"
code_type = "fa-model::obligation::InlineObligationTerms; OBLIGATION_MATURITY_EXTENSION=33; wire versions 1 and 2"
rationale = "The original version-1 bytes retain their credit-only meaning. Version 2 admits either debit receivables or credit obligations with ordered unique leg ordinals, explicit contractual/disputed/missing status, and positive date-ordered installments totaling each named leg exactly. Credit-only encoders retain v1 bytes; debit declarations select v2, and the proposal digest authenticates the version and terms. Historical aging selects the authenticated prefix before reading terms, relieves earliest installments by exact recorded applications, and preserves missing or disputed terms as unscheduled. The independent verifier decodes both versions and refuses downgraded v1 debit terms, incomplete schedules and unknown versions. The liability-only cash-flow solvency schedule filters out debit terms without inferring cash inflows."
tracking_bead = "fa-0hs4.13"

[[decision]]
field = "extensions.39"
appendix_a = "Source-bound finite Depreciate/Amortize schedules (plan §10.2, Appendix B)"
code_type = "fa-model::asset_cost::AssetChargeBasis; ASSET_CHARGE_EXTENSION=39; minimum schema minor 6"
rationale = "Canonical fa:asset-charge:v1 bytes bind an immutable schedule EntryRef, a bounded through-period reference and a nonzero observed prefix. No caller amount, remaining cost or cumulative balance is accepted. The native kernel reproduces cost from the acquisition EntryRef and leg ordinal, applies the recorded named rounding to the cumulative straight-line target, subtracts prior recognized effects and checks the resulting Adjusting legs before publication. Exact Reversals retain the basis. Ordinary portable reports refold the admitted monetary legs without claiming independent asset-law admission."
tracking_bead = "fa-c34"

[[decision]]
field = "extensions.38"
appendix_a = "Law-bound quantity and carrying-cost relief (plan §6.5)"
code_type = "fa-model::lot_disposal::LotDisposalBasis; LOT_DISPOSAL_EXTENSION=38; minimum schema minor 5"
rationale = "Versioned fa:lot-disposal:v1 bytes bind the inventory account, exact quantity/unit, distinct quantity and cost offset accounts, ordered SpecificId EntryRefs/ordinals, observed prefix, policy EntryRef and versioned lot/regime/rounding laws. SpecificId selections are unique and bounded by max_settles_per_leg; other laws carry no explicit targets. The kernel reconstructs original and current open lots, derives quantity and cost settlement vectors under the recorded policy, and guards publication against population changes. The normal native balance and settlement laws remain mandatory. Original/Adjusting disposal proposals and exact Reversals retain the basis; historical bytes without it remain unchanged. Portable ordinary reports can refold admitted amounts without claiming independent lot-admission verification."
tracking_bead = "fa-0hs4.9"

[[decision]]
field = "extensions.36"
appendix_a = "PriorPeriodAdjustment relates_to historical PeriodRef (plan §7.5, §8.1)"
code_type = "fa-model::entry::PriorPeriodAdjustment; PRIOR_PERIOD_ADJUSTMENT_EXTENSION=36; minimum schema minor 3"
rationale = "Version 1 bytes are u16 version followed by the canonical bounded PeriodRef calendar and code strings. The proposal digest binds both names. Original/Adjusting templates carry the marker only in scenario rehearsal; fresh trunk admission requires the approved case's derived PriorPeriodAdjustment member. The source period must already exist, end no later than the current posting period starts, and belong to the case's affected periods. Every equity leg must hold the journaled retained_earnings role; income and expense leaves are refused. Role history is a complete-prefix dependency guarded through the atomic case batch. Legacy encodings remain readable without inventing a source period."
tracking_bead = "fa-0hs4.8"

[[decision]]
field = "extensions.35"
appendix_a = "ProportionalPost named native sub-vector (plan §5.4)"
code_type = "fa-model::proportional::ProportionalPostBasis; PROPORTIONAL_POST_EXTENSION=35; minimum schema minor 2"
rationale = "Version 1 bytes are u16 version, u16 law id, u16 law version, and length-prefixed canonical FAR1 exact rate bytes bounded to 8192 bytes. Only Resolution(Posts) may carry the basis. Its authenticated pending EntryRef and source-ordinal map remain in the ordinary pending block. Admission decodes the reduced rate under an arithmetic budget and replays BalancedLargestRemainder against the actual held legs, normalizing the book's sole legal entity. HalfEven rounds one common debit/credit target per native unit and entity; largest remainder allocates each side with ties to the lowest original ordinal. Zero posted legs are omitted; an empty vector refuses with VoidReserve. The resolution releases every original reserved leg in full, including the unused remainder. Native/base, dimension, period, expiry and single-resolution laws still apply. This native-only factory refuses base-valued holds and single-sided statistical units. Legacy minor-0/1 encodings remain unchanged."
tracking_bead = "fa-0hs4.10"


[[invariant]]
id = "FA-INV-01"
name = "Balance law"
statement = "**Balance law.** For every committed entry and every unit among its legs, debit and credit totals are exactly equal in that unit (`per-unit`); native balancing dimensions enforce equality per `(unit, legal_entity)` (`per-entity`); when base totals are present, base debits equal base credits under the named FX law, separately per legal entity in multi-entity books (`base`), with each representable valuation adjustment recorded and absorbed within its entity (`base-residual`); realized FX uses the paired postings of §5.2 (`realized-fx`); memo and statistical units balance separately (`memo`); every leg posts to a `Leaf` account effective at the entry's date whose unit policy admits the leg's unit (`leaf-only`, `unit-policy`); required dimensions are present (`dimensions`)."
enforcement = "Kernel check at step 5 from the payload alone; Canon compiler proof per rule; reference-engine differential; Lean lane for reversal/replacement/reclassification preservation; fuzzed payload decoder."

[[invariant]]
id = "FA-INV-02"
name = "Append-only"
statement = "**Append-only.** Every payload object is immutable after commit in every field (`payload-immutable`); every lifecycle object's authoritative history is its sequence of `LifecycleTransition` control entries and its `status` is a rebuildable projection (`lifecycle-by-transition`); correction is a new object with lineage; no path updates or deletes a committed object; schema and registry changes are journaled control entries with empty legs and a typed control payload (`control-record`); unit versions are immutable and historical mantissas are never reinterpreted (`unit-version`)."
enforcement = "Substrate immutability (FG-INV-13) plus FrankenAccounting's secure-view facade as the only writer; mutation-attempt negatives; recovery rebuilds derived state only."

[[invariant]]
id = "FA-INV-03"
name = "Period law"
statement = "**Period law.** A period-scoped entry's effective date and special-period discriminator resolve to exactly one permitted period; book-scoped controls follow their registered authority/SoD row without a posting period; the entry's class is admissible for that period's state under the registered matrix and the principal's capability; period transitions occur only through journaled `PeriodControl` entries with the required approvals; `Locked` admits only case-bound restatement classes, case-bound recloses, and reservation releases; the period-state read is a retained point-read witness validated by the substrate's commit-time certifier (first-committer-wins today, SSI when `fgdb-txn` lands) so a transition and a post cannot both commit against stale state; after the latest `Closing` entry of a fiscal year the nominal accounts fold to zero at that known-at (`nominal-zero`)."
enforcement = "Generated exhaustive matrix test; conflict oracle over post-vs-close interleavings in both orders under DPOR; reference differential; `fa verify close`; Lean lane for the state machine's reachability."

[[invariant]]
id = "FA-INV-04"
name = "Registers are folds"
statement = "**Registers are folds.** Every native or functional-value register cell, checkpoint, statement row, roll-forward, aging bucket, open-amount cell, lot, and reconciliation state equals the deterministic fold of the visible legs at its coordinate and watermark; a statement definition's mappings partition the leaf accounts it covers (`mapping-partition`); derived structures are never authoritative (inherits FG-INV-18); recomputation from the journal reproduces `fold_digest` bit-for-bit; a mismatch is a correctness defect that discards the derived structure."
enforcement = "`fa verify registers` in CI on every fixture; maintainer crash matrix between delta consumption and watermark publication; reference fold differential; metamorphic suite (rebuild equals maintained)."

[[invariant]]
id = "FA-INV-05"
name = "Evidence closure"
statement = "**Evidence closure.** Every committed entry has a registered origin and satisfies the class's registered evidence minimum (`evidence-minimum`); external evidence retains bytes unless an attested by-reference policy downgrades dependent certificates (`external-retained`); supplemental evidence is a new object (`supplemental`); its provenance closure (documents by digest, event, rule version with inputs digest, principal/session, approvals, rate and basis documents, supersession targets) is enumerable and strongly retained for the retention floor; an entry whose origin or evidence references an unknown object is unencodable."
enforcement = "Generated reference checker over Appendix A field rows; retention/GC oracle; `fa explain evidence` conformance; bundle round-trip."

[[invariant]]
id = "FA-INV-06"
name = "Exactness"
statement = "**Exactness.** Every amount is an exact fixed-scale integer in a registered unit; every rounding, allocation, FX conversion, and presentation rounding names a registered law; allocations conserve totals exactly; overflow is refused; no float enters any amount path."
enforcement = "Type-level (no float type in `fa-money`); Lean lanes for rounding bounds and allocation conservation; cross-platform determinism harness; property suites."

[[invariant]]
id = "FA-INV-07"
name = "Bitemporal visibility"
statement = "**Bitemporal visibility.** For period-scoped entry selection at `(known_at, effective)`, the creating sequence must lie in the selected known-at prefix and the posting date must satisfy the effective selector, together with the registered branch, lifecycle and migration predicates. Book-scoped controls follow §7.1's known-at control-history and class-applicability rules without a posting date; extract-row selection is distinct from retaining required control/metadata closure; `recorded_at` is only ever the commit stream's assignment; distinct known-at or effective selectors never alias; a known-at view is immutable once its sequence has passed; `AS ORIGINALLY REPORTED` resolves to the first `StatementIssuance` (else the first `Lock`) and `AS REPORTED IN` to a certificate's closure; imported history never double counts with opening balances (`migration-disjoint`)."
enforcement = "Reference visibility differential covering Period/Book scopes, control applicability and closure versus extract selection; Lean lane; selector golden corpus; negative fixture for any user-supplied recorded time; migration provenance oracle."

[[invariant]]
id = "FA-INV-08"
name = "Supersession lineage"
statement = "**Supersession lineage.** `SUPERSEDES`/`RESOLVES` edges form a DAG over existing targets; every kind has a registered netting law (`net-law`: negation, paired replacement, partial reclassification, or delta); a `Reversal` is the exact side-swap of its target, reverses the target's application effects through an authenticated derived `UNSETTLES` projection (`unsettle`), subject to the exhaustive target-class admissibility table, and an entry is fully reversed at most once by identity (`reversed-once`); a `Replacement` is paired with its reversal in one batch; a pending entry is resolved at most once; a scheduled reversal is cancelled by lineage when its target is superseded; net effects are computable and the originally-posted and currently-stated views agree with the lineage."
enforcement = "Generated reference checker; Lean lane for negation and netting; two-phase resolution model; metamorphic (reverse+replace = replace)."

[[invariant]]
id = "FA-INV-09"
name = "Idempotent intents"
statement = "**Idempotent intents.** Within one book and principal scope, an idempotency key maps to at most one immutable outcome; retries with identical canonical semantic request bytes return it; differing semantic request bytes are refused; transport-only execution controls are excluded under Appendix B; outcomes are durable before acknowledgement (inherits FG-INV-01). The key-derived immutable `IntentOutcome` is the scoped retry namespace; target-derived Entry identities separately enforce reversal/resolution uniqueness (§4.9). A duplicate outcome is a point conflict, with semantic request equality checked before disclosure."
enforcement = "Retry-storm and lost-response tests under lab; key-conflict negatives; `AlreadyLive`/`IdentitySpent` conformance; outcome-durability crash points."

[[invariant]]
id = "FA-INV-10"
name = "Authorization before observation; duties segregated"
statement = "**Authorization before observation; duties segregated.** Capability caveats are enforced before any storage observation (inherits FG-INV-20) or, in the interim posture, by refusal before query construction — never as a result filter; authority is re-evaluated against current policy at commit (`current-policy`), rule-generated effects are authorized after evaluation (`post-evaluation`), ceilings are debited serially (`ceiling`), whole-entry visibility governs scoped reads (`whole-entry`); SoD policy is evaluated at commit for every dangerous class; an approval binds the proposal digest, effects digest, coordinate, and policy epoch of what it approves (`approval-binds-proposal`); a principal cannot approve its own draft's promotion or a case containing its own entries; every external-profile read is logged."
enforcement = "Capability type matrices; SoD negatives for every policy row; approval-digest mismatch negatives; access-log completeness oracle."

[[invariant]]
id = "FA-INV-11"
name = "Determinism and replay"
statement = "**Determinism and replay.** Every report, finding, plan, and bundle carries a certificate naming its closure; the same closure reproduces byte-identical canonical output; nondeterministic procedures are seeded and declared; missing or erased closure elements downgrade the completeness grade attributably (inherits FG-INV-19)."
enforcement = "Replay CI over every certified artifact; cross-platform digest comparison; erasure-downgrade tests."

[[invariant]]
id = "FA-INV-12"
name = "Subledger–control reconciliation"
statement = "**Subledger–control reconciliation.** At every committed coordinate the fold of a subledger's detail legs equals its control account's register; external summary feeds must name the detail batch digest they summarize and are refused if the detail does not fold to the summary."
enforcement = "Synchronous kernel check; reference differential; external-feed negatives."

[[invariant]]
id = "FA-INV-13"
name = "Cross-book and consolidation conservation"
statement = "**Cross-book and consolidation conservation.** Declared intercompany pairs match under the FX law or carry an explicit difference leg; elimination entries are derived deterministically from matched pairs and the ownership graph; consolidated equity reconciles to the entities' equity plus eliminations and non-controlling interest; book-to-book bridges explain every difference by rule version."
enforcement = "Pair-matching oracle; consolidation replay; bridge completeness test."

[[invariant]]
id = "FA-INV-14"
name = "Tamper evidence and accumulator continuity"
statement = "**Tamper evidence and accumulator continuity.** Each `AccumulatorState` extends the previous (consistency); leaf envelopes bind record kind, coordinate, commit sequence, and within-commit ordinal (`leaf-envelope`); every checkpoint binds a root and a scope-index root the verifier recomputes from the journal prefix; inclusion proofs verify against checkpoints and scope-completeness proofs are sound for their labeled scope (`scope-complete`); public document commitments are recomputable from bytes alone (`public-commitment`); erasure leaves a typed tombstone whose digest the prior proofs still bind; amounts, dates, accounts, and lineage are never in erasure scope."
enforcement = "`fa-verify` as independent oracle; consistency-proof CI across checkpoints; erasure negatives; rollback-detection tests with witnessed checkpoints."

[[invariant]]
id = "FA-INV-15"
name = "Two-phase and limits"
statement = "**Two-phase and limits.** Pending legs are reserved and the full original pending amounts are removed exactly once at resolution. Posts has one positive balanced sub-vector in Entry.legs with source-ordinal mapping; Voids/Expires has no posting legs and uses the registered ReservationRelease control. Resolution is unique by identity (`sub-vector`, `resolve-once`); reserved availability obeys the §5.4 equations (`availability`); expiry is journaled by sweep under time evidence, never by ambient clock; balance limits are enforced through escrow rights (or, interim, the `LimitCell` reservation of §5.5) and never silently exceeded; `Balancing` legs record the amount actually moved."
enforcement = "Two-phase model under lab with concurrent manual and sweep resolution; escrow conservation inherited from FG-INV-02; limit-breach negatives."

[[invariant]]
id = "FA-INV-16"
name = "Projections equal payloads"
statement = "**Projections equal payloads.** The derived `Leg` vertices and `HAS_LEG`/`POSTS_TO`/`FOR`/`IN_UNIT` edges of an entry equal its inline legs exactly, are written in the same transaction, and are rebuilt from payloads on recovery; no reader treats a projection as more authoritative than the payload."
enforcement = "Post-commit oracle in sim; recovery rebuild test; projection-drift negatives."


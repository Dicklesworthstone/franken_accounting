# invariants.toml — the sixteen FA-INV ids of plan Appendix F and their
# clauses (bead fa-37f).
#
# `[[invariant]]` rows copy Appendix F verbatim (`statement` is the table's
# Invariant cell, `enforcement` its Enforcement cell); fa-registry's tests
# fail when the plan's table and this file disagree, so a plan edit to
# Appendix F must be reconciled here in the same change.
#
# `[[clause]]` rows are the stable subordinate records. A `live` clause names
# its checker and negative-test entrypoints as `crate::target::path`, where
# target is `lib` or `tests/<file>.rs` and path is the libtest name; the
# `invariants` step of scripts/check.sh requires each to have run and passed
# in the same gate run, and fa-registry statically resolves each to its fn. A
# `dormant` clause names the beads whose landing activates it. Every clause
# carries `waiver = "forbidden"`: an invariant checker is never waived.
#
# No-claim boundary: a green cross-check proves each checker exists, is
# referenced and passed in that run — not that it is sufficient for the
# clause.
#
# Consumers: scripts/check.sh (`invariants`), the G1 gate review, and
# `fa capabilities --json` (live clause ids, via fa-registry).

schema_version = 1

# The clauses gate G1 ("The Journal Lives", plan §19) requires live: exactly
# the clauses whose first_gate is G1, covering the plan's Genesis clause set
# (fa-registry pins both). A dormant clause here is not refused; it blocks
# G1 and is reported as blocking it. Today that is FA-INV-11.core: no plan
# certificate or replay code exists until fa-we7 and fa-9ae land.
[gate_g1]
clauses = ["FA-INV-01.per-unit", "FA-INV-01.leaf-only", "FA-INV-01.unit-policy", "FA-INV-02.payload-immutable", "FA-INV-02.control-record", "FA-INV-03.core", "FA-INV-03.transition-journaled", "FA-INV-04.core", "FA-INV-05.evidence-minimum", "FA-INV-06.core", "FA-INV-07.core", "FA-INV-09.core", "FA-INV-10.core", "FA-INV-11.core", "FA-INV-14.leaf-envelope", "FA-INV-14.consistency", "FA-INV-15.core", "FA-INV-16.core"]

# Every shipped capability in verbs.toml and the invariant clauses it depends on
# (bead fa-j6ue). A shipped capability whose clause is dormant fails the gate.
[shipped_capabilities]

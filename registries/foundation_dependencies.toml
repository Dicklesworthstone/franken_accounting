# foundation_dependencies.toml — plan Appendix H as data (bead fa-37f).
#
# One `[[capability]]` per Appendix H row. `row`, `capability`, `status`,
# `posture` and `switch_over` copy the table's cells verbatim; fa-registry's
# tests fail when the plan's table and this file disagree, so an Appendix H
# edit is reconciled here in the same change. The classification is ours:
#
#   foundation  the franken-stack.lock foundation that ships the capability
#   upstream    live | partial | planned | absent (the Status cell, classified)
#   fa_status   live (consumed as-is) | interim (the registered interim posture
#               holds until the switch-over rule fires) | unconsumed (upstream
#               usable, no FA caller yet; tracking required)
#   tracking    the bead that owns the switch-over or first use, when one exists
#   consumed_apis / unconsumed_apis
#               per-API symbol lists checked against first-party call sites
#
# Laws enforced by fa-registry: a capability that is planned or absent
# upstream is interim here; an interim row names a switch-over rule; an
# unconsumed row is live or partial upstream and names a tracking bead; every
# foundation is a franken-stack.lock entry, and every lock revision equals the
# workspace Cargo.toml pin of each crate it ships (the drift check).
#
# Never assume a planned capability is live: check its row first (AGENTS.md).


# units.toml — unit versions with immutable scale (plan §4.4). A precision
# change is a NEW row (same code, version + 1) with a scale-conversion law;
# an existing row never changes. Mantissas are stored at `scale` forever.
#
# Consumer: fa-money UnitRegistry (loaded by fa-registry), fa-cli amount
# parsing and rendering. IDs are explicit, dense and append-only. The
# original thirteen definitions are pinned by an independent registry test.
# Default rounding is an immutable part of each unit version; calculations
# still name their law explicitly rather than silently applying this default.

schema_version = 1

[[unit]]
id = 0
code = "USD"
version = 0
scale = 2
kind = "currency"
iso4217 = 840
rounding_default = 3


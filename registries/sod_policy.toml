approver_profiles = ["Human"]
agent_prepared_human_approvers = 0
exclusions = ["preparer", "duplicate"]
cite = "plan §15.2 (promotion replays the intents in one batch with full revalidation); §14.4 (agent work reaches trunk only through a Human's promotion)"


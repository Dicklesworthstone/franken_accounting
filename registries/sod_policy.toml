[[rule]]
name = "legal-hold-place"
class = "HoldControl"
transition = "Place"
preparer_op = "hold"
approvers = 0
approver_op = "approve"
approver_profiles = ["Human"]
agent_prepared_human_approvers = 0
exclusions = ["preparer", "duplicate"]
cite = "plan §8.5 (a LegalHold pins every object in scope against erasure, GC and retention expiry)"


# ---- Policy activation (book-scoped) ---------------------------------------
[[rule]]
name = "policy-activate"
class = "PolicyControl"
transition = "Activate"
preparer_op = "rule_change"
approvers = 2
approver_op = "approve"
approver_profiles = ["Human"]
agent_prepared_human_approvers = 2
exclusions = ["preparer", "duplicate"]
cite = "Appendix C PolicyControl: W(rule_change, 2 for activations)"

# ---- Time evidence and the expiry sweep (book-scoped) ----------------------
# A tick journals an observed instant (plan §7.1a); the preparer holds
# `witness`. Ticks are strictly increasing; the kernel refuses any other.
[[rule]]
name = "time-tick"
class = "TimeControl"
transition = "Tick"
preparer_op = "witness"
approvers = 0
approver_op = "approve"
approver_profiles = ["Human"]
agent_prepared_human_approvers = 0
exclusions = ["preparer", "duplicate"]
cite = "plan §7.1a, §8.1 (time controls need their own authority row)"

# One expiry-sweep batch (plan §5.4): Resolution(Expires) entries plus the
# SweepCursor that journals the batch's progress. The preparer holds `post`;
# the kernel also requires the System profile (the sweep is the book's
# intrinsic actor, whose post_closed covers Expires only).
[[rule]]
name = "expiry-sweep"
class = "SweepControl"
transition = "Expire"
preparer_op = "post"
approvers = 0
approver_op = "approve"
approver_profiles = ["Human"]
agent_prepared_human_approvers = 0
exclusions = ["preparer", "duplicate"]
cite = "plan §5.4, §8.1 (sweep-cursor controls need their own authority row)"

# One scheduled-reversal sweep batch (plan §7.6 with §5.4's cursor
# discipline): the reversals it mints plus its SweepCursor (kind 2). System
# profile, `post`, as for the expiry sweep.
[[rule]]
name = "reversal-sweep"
class = "SweepControl"
transition = "Reverse"
preparer_op = "post"
approvers = 0
approver_op = "approve"
approver_profiles = ["Human"]
agent_prepared_human_approvers = 0
exclusions = ["preparer", "duplicate"]
cite = "plan §7.6, §5.4 (scheduled reversals use the sweep's cursor discipline), §8.1"

# A scheduled reversal's cancellation by lineage (plan §7.6, FA-INV-08): the
# kernel journals it inside the commit of a manual Reversal of a scheduled
# target, under that Reversal's capability (which holds `post`).
[[rule]]
name = "schedule-cancel"
class = "ScheduleControl"
transition = "Cancel"
preparer_op = "post"
approvers = 0
approver_op = "approve"
approver_profiles = ["Human"]
agent_prepared_human_approvers = 0
exclusions = ["preparer", "duplicate"]
cite = "plan §7.6, §8.1 (schedule-cancellation controls need their own authority row)"

# ---- Import runs (book-scoped; fa-txf) --------------------------------------
[[rule]]
name = "import-run"
class = "ImportControl"
transition = "Import"
preparer_op = "post"
approvers = 0
approver_op = "approve"
approver_profiles = ["Human"]
agent_prepared_human_approvers = 0
exclusions = ["preparer", "duplicate"]
cite = "plan §9.3 (an ImportReceipt for every document the book ingests); fa-txf"

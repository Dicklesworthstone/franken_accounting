# lot_laws.toml — Lot cost-flow laws and IFRS regime admissibility (plan §6.5, §0.4 decision 5; bead fa-2ly).
#
# A Lot is a derived open item `(acquiring leg, open quantity, open cost)` on
# an AnyUnit or non-base-unit account. Relief creates `RELIEVES {quantity, cost}`
# edges and updates the acquiring legs' `applied` mirrors via compare-and-set;
# over-relief is refused with the open quantity.
#
# Consumer: fa-registry (LotLaws), fa-money (LotLaw), fa-registers (lots fold
# and relief planner), fa-reference (naive lot oracle), fa-cli `fa lots`.

schema_version = 1

[[law]]
id = 1
version = 1
name = "FIFO"
ordering = "effective_date-asc; recorded_at-asc; entry-asc; ordinal-asc"
cost_method = "lot_proportional"
rounding_law = "HalfEven"
admitted_regimes = ["US-GAAP", "US-TAX", "IFRS"]
refused_regimes = []
citation = "ASC 330-10-30 / IAS 2.25"

[[law]]
id = 2
version = 1
name = "LIFO"
ordering = "effective_date-desc; recorded_at-desc; entry-desc; ordinal-desc"
cost_method = "lot_proportional"
rounding_law = "HalfEven"
admitted_regimes = ["US-GAAP", "US-TAX"]
refused_regimes = ["IFRS"]
refusal_citation = "IAS 2.25 (IFRS prohibits the LIFO cost formula for inventories and fungible lots; use FIFO, WeightedAverage, or SpecificId)"
citation = "ASC 330-10-30 / IRC §472"

[[law]]
id = 3
version = 1
name = "SpecificId"
ordering = "explicit-target-order"
cost_method = "lot_proportional"
rounding_law = "HalfEven"
admitted_regimes = ["US-GAAP", "US-TAX", "IFRS"]
refused_regimes = []
citation = "ASC 330-10-30 / IAS 2.23"

[[law]]
id = 4
version = 1
name = "WeightedAverage"
ordering = "effective_date-asc; recorded_at-asc; entry-asc; ordinal-asc"

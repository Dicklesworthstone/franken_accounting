# ---- IFRS regime rules cited by plan §0.4 decision 5 ---------------------

[[ifrs_rule]]
id = "IAS-2.25"
domain = "lot_cost_formula"
rule = "LIFO is prohibited under IFRS; only FIFO, WeightedAverage, and SpecificId are admitted."
status = "enforced"

[[ifrs_rule]]
id = "IAS-29"
domain = "hyperinflationary_remeasurement"
rule = "Non-monetary historical-cost and lot items in a hyperinflationary functional currency are remeasured by the general price index from acquisition date before translation."
status = "registered"

[[ifrs_rule]]
id = "IAS-1.40A"
domain = "restatement_third_balance_sheet"
rule = "A retrospective application, restatement, or reclassification requires a third statement of financial position as at the beginning of the preceding comparative period."
status = "registered"

[[ifrs_rule]]
id = "IAS-21"
domain = "fx_translation"
rule = "Foreign-operation assets and liabilities are translated at the closing rate, income and expenses at transaction or average rates, and resulting exchange differences are recognized in OCI."
status = "registered"

name: Lantern temporal-cycle kernel

on:
  push:
    branches: [main]
    paths:
      - 'crates/fa-lantern/**'
      - 'crates/fa-cli/tests/network.rs'
      - 'crates/fa/src/procedure_certificate.rs'
      - 'crates/fa/src/procedure_certificate/**'
      - 'crates/fa/src/lib.rs'
      - 'crates/fa/src/book.rs'
      - 'crates/fa/src/bank.rs'
      - 'crates/fa-cli/src/bank.rs'
      - 'crates/fa-cli/src/finding.rs'
      - 'crates/fa-cli/src/lib.rs'
      - 'crates/fa-cli/tests/bank.rs'
      - 'crates/fa-cli/tests/findings.rs'
      - 'crates/fa-formats/src/bank.rs'
      - 'crates/fa-registers/src/reconciliation.rs'
      - 'crates/fa/src/findings.rs'
      - 'crates/fa/src/findings/**'
      - 'registries/finding_storage.toml'
      - 'crates/fa/src/report_artifact.rs'
      - 'crates/fa/src/report_artifact/**'
      - 'crates/fa/src/certificate_store.rs'
      - 'crates/fa/src/certificate_store/**'
      - 'crates/fa-cli/src/notary.rs'
      - 'crates/fa-cli/src/notary/**'
      - 'crates/fa-cli/tests/procedure_replay.rs'
      - 'crates/fa-cli/tests/statements.rs'
      - 'crates/fa-cli/tests/gl_certificates.rs'
      - 'crates/fa-cli/tests/authority_cli.rs'
      - 'crates/fa-cli/src/cli.rs'
      - 'crates/fa-cli/tests/retained_report_storage.rs'
      - 'crates/fa-mcp/src/registry.rs'
      - 'crates/fa-mcp/src/server.rs'
      - 'crates/fa-registry/src/g0.rs'
      - 'registries/operation_costs.toml'
      - 'registries/verbs.toml'
      - 'registries/robot_schema/1.jsonl'
      - 'crates/fa-journal/src/post.rs'
      - 'crates/fa-journal/src/rows.rs'
      - 'crates/fa-journal/src/fx.rs'
      - 'crates/fa-journal/src/rea.rs'
      - 'crates/fa-journal/tests/genesis.rs'
      - 'crates/fa-registers/tests/registers.rs'
      - 'registries/procedures.toml'
      - '.github/workflows/lantern-graph-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

# A single worker keeps one exact checkout and dependency build for all feedback.
# Let a running checkout finish so frequent main commits cannot starve tests.
# The newest pending checkout follows it; official RCH gates remain unchanged.
concurrency:
  group: lantern-journal-feedback
  cancel-in-progress: false

jobs:
  exact-source-and-journal:
    concurrency:
      group: lantern-procedure-certificates
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch the exact public commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git archive --format=tar.gz --output="$RUNNER_TEMP/lantern-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lantern-source-${{ github.sha }}
          path: ${{ runner.temp }}/lantern-source.tar.gz
          retention-days: 1
          if-no-files-found: error
      - name: Install the pinned compiler and formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt --component clippy
      - name: Prepare an isolated formatting proposal without changing tested source
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/format-proposal"
          files=(crates/fa/src/findings/workpaper.rs crates/fa/src/findings/tests/workpaper.rs crates/fa/src/findings.rs crates/fa/src/findings/tests.rs crates/fa/src/procedure_certificate.rs crates/fa/src/procedure_certificate/tests.rs crates/fa/src/report_artifact.rs crates/fa/src/report_artifact/retention.rs crates/fa/src/report_artifact/tests.rs crates/fa/src/report_artifact/tests/retention.rs crates/fa/src/report_artifact/tests/cash_flow.rs crates/fa/src/certificate_store.rs crates/fa-cli/src/notary.rs crates/fa-cli/src/notary/procedure.rs crates/fa-cli/tests/procedure_replay.rs crates/fa-cli/tests/network.rs)
          for file in "${files[@]}"; do
            mkdir -p "$target/$(dirname "$file")"
            cp "$file" "$target/$file"
            rustup run nightly-2026-08-31 rustfmt --edition 2024 --config skip_children=true "$target/$file"
          done
          tar -czf "$RUNNER_TEMP/lantern-formatted.tar.gz" -C "$target" .
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lantern-format-proposal-${{ github.sha }}
          path: ${{ runner.temp }}/lantern-formatted.tar.gz
          retention-days: 1
          if-no-files-found: error
      - name: Test the independent cycle and entity production modules
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          rustup run nightly-2026-08-31 rustc --edition=2024 --test crates/fa-lantern/src/graph/cycles.rs -o "$RUNNER_TEMP/lantern-cycles"
          "$RUNNER_TEMP/lantern-cycles" --nocapture
          rustup run nightly-2026-08-31 rustc --edition=2024 --test crates/fa-lantern/src/projection/entity.rs -o "$RUNNER_TEMP/lantern-entities"
          "$RUNNER_TEMP/lantern-entities" --nocapture
      - name: Test native analytic certificates and malicious artifact refusal
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa --lib procedure_certificate --jobs 2 -- --nocapture
      - name: Test atomic replay-backed finding records and adversarial citations
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa --lib findings --jobs 2 -- --nocapture
      - name: Regress all existing report-artifact families
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa --lib report_artifact --jobs 2
      - name: Regress native certificate storage and fragment corruption refusal
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa --lib certificate_store --jobs 2
      - name: Regress exact FX arithmetic and journal posting semantics
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-registers --test registers --jobs 2
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-journal --test genesis --jobs 2
      - name: Test bank statement parsers, retained intake and exact matching
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-formats --lib bank --jobs 2
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-registers --lib reconciliation --jobs 2
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa --lib bank --jobs 2
      - name: Test network engine, real journal and complete Lantern corpus
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          # The network engine now depends on exact arithmetic/runtime crates.
          # Its same unit/oracle tests run here, not with a standalone rustc.
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-lantern --lib --test network --test lantern --no-fail-fast --jobs 2
      - name: Test persisted analytic replay and ordinary tracing through the CLI
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-cli --test procedure_replay --test statements --test gl_certificates --test bank --test findings --test retained_report_storage --test robot_schema --test network --test authority_cli --no-fail-fast --jobs 2
      - name: Regress MCP report schemas and capability refusal parity
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-registry --lib operation_cost --jobs 2
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-mcp --lib --test parity --test deny_rows --no-fail-fast --jobs 2
      - name: Regress existing native certificate replay through the CLI
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-cli --test cli certified_ --jobs 2
      - name: Lint selected facade and CLI crates independently of dependency warnings
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          # Scoped feedback, not a substitute for the dependency-inclusive gate below.
          cargo +nightly-2026-08-31 clippy --locked -Z bindeps -Z git=shallow-deps -p fa -p fa-cli --lib --jobs 2 -- --no-deps -D warnings
      - name: Check facade and CLI lints including dependencies without weakening warnings
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 clippy --locked -Z bindeps -Z git=shallow-deps -p fa -p fa-cli --lib --jobs 2 -- -D warnings

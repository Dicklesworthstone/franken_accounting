name: Tier 0 (format and type-check every target)

# Tier 0 (fa-1qk0): every push and pull request, whatever paths it touches,
# is formatted and type-checks every target of the workspace. It proves the
# tree compiles and is formatted, nothing about test results. On 2026-10-20
# main went red four times from pushes no toolchain had compiled; each break
# (a private field, a spliced test file, a non-exhaustive match, rustfmt
# drift) is what this job reports within minutes of the push.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tier0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier0:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch the exact commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install the pinned compiler and formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt
      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 fmt --all --check
      - name: Type-check every target
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 check --locked -Z bindeps -Z git=shallow-deps --workspace --all-targets --jobs 2

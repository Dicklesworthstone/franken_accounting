name: Tier 0 (format and type-check every target)

# Tier 0 (fa-1qk0): the tree is formatted and every target of the workspace
# type-checks; it proves nothing about test results. This is the hosted
# recipe of scripts/tier0.sh, for manual dispatch only (AGENTS.md: the
# project does not use GitHub Actions as a gate). An agent without a Rust
# toolchain dispatches it on its train branch and lands only on success. On
# 2026-10-20 main went red four times from pushes no toolchain had compiled:
# a private field, a spliced test file, a non-exhaustive match, rustfmt drift.

on:
  workflow_dispatch:
    inputs:
      focused_accounting_tests:
        description: Run focused proportional posting and due-date aging behavior tests (not Tier 1)
        type: boolean
        required: false
        default: false
      g1_acceptance_tests:
        description: Run G1 crash recovery, fixed 50-seed differential and negative controls (not a full release proof)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: tier0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier0:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.g1_acceptance_tests && 120 || 45 }}
    steps:
      - name: Fetch the exact commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install the pinned compiler and formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt
      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 fmt --all --check
      - name: Type-check every target
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 check --locked -Z bindeps -Z git=shallow-deps --workspace --all-targets --jobs 2
      # These named feature regressions supplement Tier 0; they do not replace
      # the complete Tier 1 workspace verification chain.
      - name: G1 crash recovery and independent reference
        if: ${{ inputs.g1_acceptance_tests }}
        env:
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess

          cargo = ["cargo", "+nightly-2026-08-31", "test", "--locked",
                   "-Z", "bindeps", "-Z", "git=shallow-deps"]

          def checked_test(package, target, name=None):
              command = cargo + ["-p", package] + target + ([name] if name else [])
              command += ["--jobs", "2", "--", "--show-output", "--format", "pretty"]
              if name:
                  command.append("--exact")
              print("+ " + " ".join(command), flush=True)
              lines = []
              with subprocess.Popen(command, stdout=subprocess.PIPE,
                                    stderr=subprocess.STDOUT, text=True) as child:
                  for line in child.stdout:
                      print(line, end="", flush=True)
                      lines.append(line.rstrip("\n"))
                  if child.wait() != 0:
                      raise SystemExit("G1 test command failed")
              summaries = [match.groups() for line in lines if (match := re.fullmatch(
                  r"test result: ok\. (\d+) passed; 0 failed; (\d+) ignored; .*", line))]
              if len(summaries) != 1 or int(summaries[0][0]) == 0:
                  raise SystemExit("G1 requires a completed, nonempty test run")
              if name:
                  # --show-output prints captured test output after successes:.
                  # Only the harness's preceding result records count here.
                  records = lines[:lines.index("successes:")] if "successes:" in lines else lines
                  if summaries[0] != ("1", "0") or records.count(f"test {name} ... ok") != 1:
                      raise SystemExit(f"G1 expected exactly one executed passing test: {name}")

          for name in (
              "a_post_crashed_at_every_commit_point_is_whole_or_absent_after_reopen",
              "a_batch_crashed_at_every_commit_point_is_all_or_none_after_reopen",
              "every_barrier_crashed_at_every_commit_point_recovers_as_fa_art_lab_02",
          ):
              checked_test("fa", ["--lib"], "book::tests::" + name)
          checked_test("fa-reference", ["--lib"])
          for name in (
              "multi_seed_campaign_tier1",
              "differential_seed_shards_preserve_exact_nonoverlapping_ranges",
              "differential_seed_configuration_rejects_empty_invalid_and_overflowing_shards",
              "planted_mutation_found_and_shrunk",
              "serial_replay_refuses_a_history_the_reference_would_not_admit",
              "shared_outcome_keys::shared_outcome_keys_cover_entry_and_batch_collisions",
              "shared_outcome_keys::shared_outcome_keys_preserve_authorization_and_atomic_refusals",
          ):
              checked_test("fa-registers", ["--test", "differential"], name)
          PY
      - name: Focused proportional posting laws and journal admission
        if: ${{ inputs.focused_accounting_tests }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-money --lib proportional_post --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-model --lib proportional::tests:: --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-journal --test genesis proportional_tests:: --jobs 1 -- --test-threads=1
      - name: Focused due-date certificates and offline verification
        if: ${{ inputs.focused_accounting_tests }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa --lib aging::due_date::tests --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa --test statements due_date_aging --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-cli --test proofs due_date_aging_bundle_verifies_offline --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-cli --test cli due_date_aging_reads_journaled_maturity_through_the_binary --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-verify --lib --jobs 1 -- --test-threads=1
      - name: Focused proportional posting CLI and MCP behavior
        if: ${{ inputs.focused_accounting_tests }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-cli --test cli proportional_post --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-mcp --lib post_reserve_proportion --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-cli --test robot_schema --jobs 1 -- --test-threads=1
      - name: Focused migration availability invariants
        if: ${{ inputs.focused_accounting_tests }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-journal --test genesis migration_limit_tests:: --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-registers --test migration migration_limits:: --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-registers --test migration kernel_and_oracle_agree_on_migration_runs --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-reference --lib --jobs 1 -- --test-threads=1

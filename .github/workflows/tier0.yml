name: Tier 0 (format and type-check every target)

# Tier 0 (fa-1qk0): the tree is formatted and every target of the workspace
# type-checks; it proves nothing about test results. This is the hosted
# recipe of scripts/tier0.sh, for manual dispatch only (AGENTS.md: the
# project does not use GitHub Actions as a gate). An agent without a Rust
# toolchain dispatches it on its train branch and lands only on success. On
# 2026-10-20 main went red four times from pushes no toolchain had compiled:
# a private field, a spliced test file, a non-exhaustive match, rustfmt drift.

on:
  workflow_dispatch:
    inputs:
      focused_accounting_tests:
        description: Run focused proportional posting and due-date aging behavior tests (not Tier 1)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: tier0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier0:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch the exact commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install the pinned compiler and formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt
      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 fmt --all --check
      - name: Type-check every target
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 check --locked -Z bindeps -Z git=shallow-deps --workspace --all-targets --jobs 2
      # These named feature regressions supplement Tier 0; they do not replace
      # the complete Tier 1 workspace verification chain.
      - name: Focused proportional posting laws and journal admission
        if: ${{ inputs.focused_accounting_tests }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-money --lib proportional_post --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-model --lib proportional::tests:: --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-journal --test genesis proportional_tests:: --jobs 1 -- --test-threads=1
      - name: Focused due-date certificates and offline verification
        if: ${{ inputs.focused_accounting_tests }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa --lib aging::due_date::tests --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa --test statements due_date_aging --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-cli --test proofs due_date_aging_bundle_verifies_offline --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-cli --test cli due_date_aging_reads_journaled_maturity_through_the_binary --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-verify --lib --jobs 1 -- --test-threads=1
      - name: Focused proportional posting CLI and MCP behavior
        if: ${{ inputs.focused_accounting_tests }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-cli --test cli proportional_post --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-mcp --lib post_reserve_proportion --jobs 1 -- --test-threads=1
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-cli --test robot_schema --jobs 1 -- --test-threads=1

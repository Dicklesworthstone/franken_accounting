name: Public ledger native replay

on:
  push:
    branches: [main]
    paths:
      - 'scripts/public_ledger*.py'
      - 'scripts/tests/test_public_ledger*.py'
      - 'scripts/blmis*.py'
      - 'scripts/tests/test_blmis*.py'
      - 'tools/public-data/**'
      - 'crates/**'
      - 'registries/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/public-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ledger-native-replay
  cancel-in-progress: false

jobs:
  authentic-agency-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Fetch the exact public commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          mkdir -p artifacts/public-ledger

      - name: Record runner resources and source revision
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            python3 --version
            free -h
            df -h .
          } | tee artifacts/public-ledger/environment.log

      - name: Verify authentic source fixtures and negative controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_public_ledger*.py' -v 2>&1 | tee artifacts/public-ledger/python-tests.log

      - name: Install the real bankruptcy PDF extractor
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          pdftotext -v 2>&1 | tee artifacts/public-ledger/pdf-extractor.log

      - name: Verify published bankruptcy transactions and comparison controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/blmis_source.py fetch --output artifacts/public-ledger/glantz-source.pdf
          FA_BLMIS_GLANTZ_PDF="$PWD/artifacts/public-ledger/glantz-source.pdf" python3 -B -m unittest discover -s scripts/tests -p 'test_blmis*.py' -v 2>&1 | tee artifacts/public-ledger/blmis-python-tests.log

      - name: Install the pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-08-31 --profile minimal

      - name: Build the native accounting CLI and independent verifier
        id: native-build
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 build --locked -Z bindeps -Z git=shallow-deps -p fa-cli --bin fa -p fa-verify --bin fa-verify --jobs 1 2>&1 | tee artifacts/public-ledger/native-build.log

      - name: Bind reusable native binaries to their exact source
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > artifacts/public-ledger/native-source.txt
          git rev-parse HEAD:Cargo.lock > artifacts/public-ledger/native-lock.txt
          sha256sum target/debug/fa target/debug/fa-verify > artifacts/public-ledger/native-binaries.sha256

      - name: Retain native executables for source-bound replay diagnosis
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-ledger-native-${{ github.sha }}
          path: |
            target/debug/fa
            target/debug/fa-verify
            artifacts/public-ledger/native-source.txt
            artifacts/public-ledger/native-lock.txt
            artifacts/public-ledger/native-binaries.sha256
          retention-days: 1
          if-no-files-found: error

      - name: Regress CSV preservation and ambiguous-input refusal
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-formats --lib legacy::tests:: --jobs 1 -- --nocapture 2>&1 | tee artifacts/public-ledger/legacy-tests.log

      - name: Regress canonical CSV evidence and historical compatibility
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-formats --test formats_conformance canonical_csv --jobs 1 -- --nocapture 2>&1 | tee artifacts/public-ledger/canonical-csv-tests.log

      - name: Replay the complete finance-authority selection through native migration
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-cli --test legacy_migration oklahoma:: --jobs 1 -- --nocapture 2>&1 | tee artifacts/public-ledger/finance-authority-tests.log

      - name: Regress native department migration and source mapping integrity
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-cli --test legacy_migration generic_csv_departments --jobs 1 -- --nocapture 2>&1 | tee artifacts/public-ledger/department-migration-tests.log

      - name: Regress party and legal-entity source attribution
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-31 test --locked -Z bindeps -Z git=shallow-deps -p fa-cli --test legacy_migration party_entity:: --jobs 1 -- --nocapture 2>&1 | tee artifacts/public-ledger/party-entity-migration-tests.log

      - name: Replay the complete firefighters pension selection
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/public_ledger.py run --agency 31500 --out artifacts/public-ledger/pension 2>&1 | tee artifacts/public-ledger/pension.log

      - name: Replay the complete university selection
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/public_ledger.py run --agency 66000 --out artifacts/public-ledger/university 2>&1 | tee artifacts/public-ledger/university.log

      - name: Replay the complete museum selection
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/public_ledger.py run --agency 20400 --out artifacts/public-ledger/museum 2>&1 | tee artifacts/public-ledger/museum.log

      - name: Replay every published Glantz account transaction and printed balance
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/blmis_replay.py run --out artifacts/public-ledger/blmis-1za192 2>&1 | tee artifacts/public-ledger/blmis-native.log

      - name: Replay all six complete Glantz accounts and preserve source discrepancies
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/blmis_replay.py run --account all --pdf artifacts/public-ledger/glantz-source.pdf --out artifacts/public-ledger/blmis-six 2>&1 | tee artifacts/public-ledger/blmis-six-native.log

      - name: Retain replay reports and command transcripts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-ledger-replay-${{ github.sha }}
          path: |
            artifacts/public-ledger/*.log
            artifacts/public-ledger/*/report.json
            artifacts/public-ledger/*/failure.json
            artifacts/public-ledger/*/commands.jsonl
          retention-days: 14
          if-no-files-found: error

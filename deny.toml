[bans]
multiple-versions = "deny"
wildcards = "deny"
# Pinned foundations need both generations. Only the exact older release is
# exempt from duplicate counting; the newer release remains checked. This is
# not permission to introduce another version or a new first-party dependency.
skip = [
  { crate = "block-buffer@0.10.4", reason = "digest 0.10.7 via ed25519-dalek needs 0.10; asupersync crypto uses 0.12.1" },
  { crate = "const-oid@0.9.6", reason = "der 0.7.10 in the signing closure needs 0.9; digest 0.11.3 uses 0.10.2" },
  { crate = "cpufeatures@0.2.17", reason = "curve25519-dalek and sha2 0.10.9 need 0.2; current asupersync crypto uses 0.3.1" },
  { crate = "crypto-common@0.1.7", reason = "digest 0.10.7 needs 0.1; asupersync crypto uses 0.2.2" },
  { crate = "digest@0.10.7", reason = "curve25519-dalek, signature and sha2 0.10.9 need 0.10; asupersync crypto uses 0.11.3" },
  { crate = "getrandom@0.2.17", reason = "nkeys and rand_core 0.6.4 need 0.2; asupersync and crypto-common use 0.4.3" },
  { crate = "rand_core@0.6.4", reason = "rand_chacha, signatory and signature need 0.6; fnx and asupersync crypto use 0.10.1" },
  { crate = "sha2@0.10.9", reason = "ed25519-dalek needs 0.10; pinned asupersync uses 0.11.0" },
  { crate = "syn@2.0.119", reason = "prost, pin-project and curve25519 derives need syn 2; serde and thiserror derives use 3.0.6" },
]
deny = [
  # Runtimes other than asupersync.
  # The complete graph includes wasm-bindgen-futures 0.4.79 -> tokio 1.53.2
  # under cfg(all(target_os="emscripten", wasm_bindgen_unstable_tokio)).
  # cargo-deny wrappers match immediate names, not versions or ancestors;
  # Cargo.lock pins these versions. All other immediate parents stay banned.
  { name = "tokio", wrappers = ["wasm-bindgen-futures"], reason = "pinned asupersync wasm closure only; not a first-party runtime" },
  { name = "async-std" },
  { name = "smol" },
  # Storage engines other than the substrate.
  { name = "rusqlite" },
  { name = "sqlx" },
  { name = "rocksdb" },
  { name = "fsqlite" },
  # Accounting code imports the pinned FrankenSymPy boundary, never num-*.
  # Wrappers name actual immediate parents; Cargo.lock pins their versions.
  { name = "chrono" },
  { name = "time" },
  { name = "rust_decimal" },
  { name = "bigdecimal" },
  { name = "num-bigint", wrappers = ["fsym-bigint"], reason = "FrankenSymPy bd1ad68 integer containment only; num-rational's optional bigint feature is disabled" },
  { name = "num-integer", wrappers = ["fsym-bigint", "num-bigint", "num-rational"], reason = "FrankenSymPy bd1ad68 exact arithmetic closure only" },
  { name = "num-rational", wrappers = ["fsym-rational"], reason = "FrankenSymPy bd1ad68 rational containment only" },
  # Columnar/dataframe/graph/search stacks banned by the substrate's closure.
  { name = "arrow" },
  { name = "polars" },
  { name = "petgraph" },
  { name = "tantivy" },
  { name = "hnsw" },
  # HTTP stacks other than asupersync's.
  { name = "hyper" },
  { name = "axum" },
  { name = "reqwest" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = [

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Pinned foundations need both generations. Only the exact older release is
# exempt from duplicate counting; the newer release remains checked. This is
# not permission to introduce another version or a new first-party dependency.
skip = [
  { crate = "block-buffer@0.10.4", reason = "digest 0.10.7 via ed25519-dalek needs 0.10; asupersync crypto uses 0.12.1" },
  { crate = "const-oid@0.9.6", reason = "der 0.7.10 in the signing closure needs 0.9; digest 0.11.3 uses 0.10.2" },
  { crate = "cpufeatures@0.2.17", reason = "curve25519-dalek and sha2 0.10.9 need 0.2; current asupersync crypto uses 0.3.1" },
  { crate = "crypto-common@0.1.7", reason = "digest 0.10.7 needs 0.1; asupersync crypto uses 0.2.2" },
  { crate = "digest@0.10.7", reason = "curve25519-dalek, signature and sha2 0.10.9 need 0.10; asupersync crypto uses 0.11.3" },
  { crate = "getrandom@0.2.17", reason = "nkeys and rand_core 0.6.4 need 0.2; asupersync and crypto-common use 0.4.3" },
  { crate = "rand_core@0.6.4", reason = "rand_chacha, signatory and signature need 0.6; fnx and asupersync crypto use 0.10.1" },
  { crate = "sha2@0.10.9", reason = "ed25519-dalek needs 0.10; pinned asupersync uses 0.11.0" },
  { crate = "syn@2.0.119", reason = "prost, pin-project and curve25519 derives need syn 2; serde and thiserror derives use 3.0.6" },
  # The fa-mcp posture (fastmcp-rust 0.12.0, plan §2.4) — exact older releases
  # its pinned closure needs beside the workspace's current ones.
  { crate = "io-lifetimes@2.0.4", reason = "fs-set-times 0.20.3 (cap-primitives, fastmcp-server) needs 2; cap-std 4.0.3 uses 3.0.1" },
  { crate = "signal-hook@0.3.18", reason = "crossterm 0.29 and signal-hook-mio (rich_rust, fastmcp-console) need 0.3; asupersync uses 0.4.5" },
  { crate = "synstructure@0.13.2", reason = "asn1-rs-derive 0.6 (x509-parser, asupersync tls) needs 0.13; yoke/zerofrom derives use 0.14.0" },
  { crate = "windows-sys@0.52.0", reason = "ring 0.17.14 (fastmcp-protocol jose, rustls) needs 0.52; the workspace uses 0.61.2" },
  { crate = "windows-sys@0.59.0", reason = "fs-set-times 0.20.3 and winx 0.36.4 (cap-primitives, fastmcp-server) need 0.59; the workspace uses 0.61.2" },
  { crate = "windows-sys@0.60.2", reason = "io-extras 0.19 (cap-std, fastmcp-server) needs 0.60; the workspace uses 0.61.2" },
  { crate = "windows-targets@0.52.6", reason = "windows-sys 0.52.0/0.59.0 above need 0.52; windows-sys 0.60.2 uses 0.53.5" },
  { crate = "windows_aarch64_gnullvm@0.52.6", reason = "windows-targets 0.52.6 above" },
  { crate = "windows_aarch64_msvc@0.52.6", reason = "windows-targets 0.52.6 above" },
  { crate = "windows_i686_gnu@0.52.6", reason = "windows-targets 0.52.6 above" },
  { crate = "windows_i686_gnullvm@0.52.6", reason = "windows-targets 0.52.6 above" },
  { crate = "windows_i686_msvc@0.52.6", reason = "windows-targets 0.52.6 above" },
  { crate = "windows_x86_64_gnu@0.52.6", reason = "windows-targets 0.52.6 above" },
  { crate = "windows_x86_64_gnullvm@0.52.6", reason = "windows-targets 0.52.6 above" },
  { crate = "windows_x86_64_msvc@0.52.6", reason = "windows-targets 0.52.6 above" },
]
deny = [
  # Runtimes other than asupersync.
  # The complete graph includes wasm-bindgen-futures 0.4.79 -> tokio 1.53.2
  # under cfg(all(target_os="emscripten", wasm_bindgen_unstable_tokio)).
  # cargo-deny wrappers match immediate names, not versions or ancestors;
  # Cargo.lock pins these versions. All other immediate parents stay banned.
  { name = "tokio", wrappers = ["wasm-bindgen-futures"], reason = "pinned asupersync wasm closure only; not a first-party runtime" },
  { name = "async-std" },
  { name = "smol" },
  # Storage engines other than the substrate.
  { name = "rusqlite" },
  { name = "sqlx" },
  { name = "rocksdb" },
  { name = "fsqlite" },
  # Accounting code imports the pinned FrankenSymPy boundary, never num-*,
  # and no first-party crate imports chrono or time: civil dates are fa-time's
  # and recorded time is the journal's. Wrappers name actual immediate parents
  # (never a first-party crate); Cargo.lock pins their versions. The chrono and
  # time wrappers are the fa-mcp posture (fastmcp-rust 0.12.0, plan §2.4,
  # §18.4): fastmcp-server imports chrono; fastmcp-console and its rich_rust
  # import time; asupersync's `tls` feature (enabled by fastmcp-transport)
  # reaches time through x509-parser and asn1-rs. A direct first-party use of
  # either stays banned (crates/fa-mcp/tests/deny_rows.rs pins these lists).
  { name = "chrono", wrappers = ["fastmcp-server"], reason = "fa-mcp posture: fastmcp-server 0.12.0 only" },
  { name = "time", wrappers = ["fastmcp-console", "rich_rust", "x509-parser", "asn1-rs"], reason = "fa-mcp posture: fastmcp-console 0.12.0 → rich_rust, and asupersync tls → x509-parser/asn1-rs only" },
  { name = "rust_decimal" },
  { name = "bigdecimal" },
  { name = "num-bigint", wrappers = ["fsym-bigint", "num-rational", "der-parser"], reason = "FrankenSymPy bd1ad68 integer containment; and the fa-mcp posture: rich_rust enables num-rational's bigint feature, der-parser (x509-parser, asupersync tls) needs it" },
  { name = "num-integer", wrappers = ["fsym-bigint", "num-bigint", "num-rational"], reason = "FrankenSymPy bd1ad68 exact arithmetic closure only" },
  { name = "num-rational", wrappers = ["fsym-rational", "rich_rust"], reason = "FrankenSymPy bd1ad68 rational containment; and the fa-mcp posture: rich_rust (fastmcp-console)" },
  # Columnar/dataframe/graph/search stacks banned by the substrate's closure.
  { name = "arrow" },
  { name = "polars" },
  { name = "petgraph" },
  { name = "tantivy" },
  { name = "hnsw" },
  # HTTP stacks other than asupersync's.
  { name = "hyper" },
  { name = "axum" },
  { name = "reqwest" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = [
  "https://github.com/Dicklesworthstone/asupersync",
  "https://github.com/Dicklesworthstone/frankengraphdb",
  "https://github.com/Dicklesworthstone/franken_networkx",
  "https://github.com/Dicklesworthstone/frankensympy",
]

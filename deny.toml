  { crate = "fastmcp-server@0.12.0", allow = ["LicenseRef-MIT-OpenAI-Anthropic-Rider"] },
  { crate = "fastmcp-client@0.12.0", allow = ["LicenseRef-MIT-OpenAI-Anthropic-Rider"] },
  { crate = "fastmcp-derive@0.12.0", allow = ["LicenseRef-MIT-OpenAI-Anthropic-Rider"] },
  { crate = "fastmcp-console@0.12.0", allow = ["LicenseRef-MIT-OpenAI-Anthropic-Rider"] },
  # The fa-mcp posture's TLS closure (fastmcp-transport enables asupersync's
  # `tls`/`tls-webpki-roots`; fastmcp-protocol's `jose` needs ring): permissive
  # licenses this file does not allow globally, admitted for these exact
  # crates only. Not a first-party dependency path.
  { crate = "ring", allow = ["ISC"] },
  { crate = "rustls-webpki", allow = ["ISC"] },
  { crate = "untrusted", allow = ["ISC"] },
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
  # fastmcp-client → dirs → dirs-sys → option-ext (MPL-2.0, file-scoped
  # copyleft on an unmodified crate); fa-mcp posture only.
  { crate = "option-ext", allow = ["MPL-2.0"] },
]

